<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">MIG 变更：失败时停止扩大影响</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">MIG 变更：失败时停止扩大影响</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">变更需要维护窗口，不是日常只读查询。</tspan></text><rect x="360" y="125" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="162" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">保存现状与退出业务</tspan></text><text x="600.0" y="199" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">UUID、模式、布局、任务映射</tspan></text><rect x="360" y="310" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="347" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">查询支持与规划 placement</tspan></text><text x="600.0" y="384" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">型号、驱动、profile、可放置位置</tspan></text><rect x="360" y="495" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="532" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">受控创建或调整</tspan></text><text x="600.0" y="569" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">先 GI 后 CI，记录新标识</tspan></text><polygon points="600.0,680 840,747.5 600.0,815 360,747.5" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="735" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600"><tspan x="600.0" dy="0">验收通过？</tspan></text><text x="600.0" y="763" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">设备、任务、调度、监控</tspan></text><rect x="60" y="920" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="295.0" y="957" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="295.0" dy="0">通过后恢复业务</tspan></text><text x="295.0" y="994" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="295.0" dy="0">更新映射并继续观察</tspan></text><rect x="670" y="920" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="905.0" y="957" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="905.0" dy="0">失败则中止</tspan></text><text x="905.0" y="994" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="905.0" dy="0">按记录恢复布局，再验证</tspan></text><path d="M600.0 240 L600.0 310" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 425 L600.0 495" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 610 L600.0 680" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 815 L600.0 867.5 L295.0 867.5 L295.0 920" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="865" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="280" dy="0">是</tspan></text><path d="M600.0 815 L600.0 867.5 L905.0 867.5 L905.0 920" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="915" y="865" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="915" dy="0">否</tspan></text><text x="600" y="1055" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">销毁先 CI 后 GI；恢复不保证旧 UUID 或运行任务自动回来。</tspan></text></g></svg>