<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">GPU-CR：谁搬数据，谁处理控制状态？</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">GPU-CR：谁搬数据，谁处理控制状态？</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">NVIDIA 信号驱动路径；协调器编排，Worker 内执行资源拆除与重建。</tspan></text><rect x="45" y="130" width="310" height="780" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="200.0" y="162" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="200.0" dy="0">进程外：控制编排</tspan></text><rect x="405" y="130" width="750" height="780" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="780.0" y="162" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="780.0" dy="0">Worker 进程与所用 GPU</tspan></text><rect x="65" y="220" width="270" height="145" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="200.0" y="257" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="200.0" dy="0">协调器</tspan></text><text x="200.0" y="294" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="200.0" dy="0">cr_client /</tspan><tspan x="200.0" dy="30">multi_cr_client</tspan></text><rect x="65" y="655" width="270" height="150" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="200.0" y="692" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="200.0" dy="0">驱动 C/R 工具</tspan></text><text x="200.0" y="729" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="200.0" dy="0">cuda-checkpoint</tspan><tspan x="200.0" dy="30">管理剩余 CUDA 状态</tspan></text><rect x="640" y="220" width="430" height="125" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="855.0" y="257" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="855.0" dy="0">注入 Runtime</tspan></text><text x="855.0" y="294" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="855.0" dy="0">Hook / 账本 / IPC 管理</tspan></text><rect x="435" y="460" width="310" height="155" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="590.0" y="497" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="590.0" dy="0">GPU / VMM</tspan></text><text x="590.0" y="534" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="590.0" dy="0">原 VA → 物理分配</tspan><tspan x="590.0" dy="30">Unmap / Release / Remap</tspan></text><rect x="810" y="460" width="310" height="155" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="965.0" y="497" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="965.0" dy="0">Host staging</tspan></text><text x="965.0" y="534" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="965.0" dy="0">两个缓冲，每个 1 GiB</tspan><tspan x="965.0" dy="30">尝试 cudaHostRegister</tspan></text><rect x="810" y="705" width="310" height="155" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="965.0" y="742" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="965.0" dy="0">Host 快照映射</tspan></text><text x="965.0" y="779" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="965.0" dy="0">数据 + 地址/大小/偏移</tspan><tspan x="965.0" dy="30">默认主映射 25 GiB</tspan></text><path d="M335 275 L640 275" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="485" y="250" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="485" dy="0">共享控制消息 + 信号</tspan></text><path d="M200 365 L200 655" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="200" y="505" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="200" dy="0">数据阶段之后</tspan></text><path d="M745 345 L745 400 L590 400 L590 460" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M965 345 L965 460" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M745 535 L810 535" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="778" y="510" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="778" dy="0">数据拷贝</tspan></text><path d="M965.0 615 L965.0 705" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="1040" y="665" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="1040" dy="0">CPU memcpy</tspan></text><text x="600" y="995" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">前提：业务保持安全点；控制通道、staging 与快照映射不是同一块空间。</tspan></text></g></svg>