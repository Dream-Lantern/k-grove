<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FBFF"/></linearGradient>
 <filter id="sh" x="-20%" y="-40%" width="150%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#153F75" flood-opacity=".10"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5679BC"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#10B981"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#EF4444"/></marker>
 </defs>
<rect x="0" y="0" width="1600" height="940" rx="0" fill="url(#bg)"/>
<rect x="0" y="0" width="1600" height="11" rx="0" fill="#4F83ED"/>
<text x="65" y="78" font-family="Noto Sans CJK SC, sans-serif" font-size="44" font-weight="700" fill="#0F2350" text-anchor="start">21  ·  显存预算：权重只是其中一项</text>
<text x="68" y="123" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#58708D" text-anchor="start">低位宽减少权重存储，不能直接推导整套推理服务的显存占用</text>
<path d="M65 148 L1535 148" fill="none" stroke="#DDE7F3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="260" y="193" width="1080" height="112" rx="15" fill="#EEF6FF" stroke="#3B82F6" stroke-width="1.8"/>
<text x="282" y="231" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#1E40AF" text-anchor="start">设备可用显存</text>
<text x="282" y="265" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">物理容量还要考虑系统保留、其他进程及真实可分配空间。</text>
<path d="M800 306 V363" fill="none" stroke="#5679BC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M800 363 H402 V408" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M800 363 H1190 V408" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="416" width="638" height="260" rx="18" fill="#F4F0FF" stroke="#8B5CF6" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="126" cy="463" r="24" fill="#8B5CF6"/>
<text x="126" y="472" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
<text x="163" y="470" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#112A54" text-anchor="start">相对固定的常驻部分</text>
<text x="104" y="516" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">模型权重与量化元数据</text>
<text x="104" y="548" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">框架 / 运行时常驻内存</text>
<text x="104" y="580" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">部分固定的执行与缓存结构</text>
<rect x="875" y="416" width="642" height="260" rx="18" fill="#E9FBF4" stroke="#10B981" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="921" cy="463" r="24" fill="#10B981"/>
<text x="921" y="472" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
<text x="958" y="470" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#112A54" text-anchor="start">随负载变化的部分</text>
<text x="899" y="516" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">KV Cache、激活与临时工作区</text>
<text x="899" y="548" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">CUDA Graph / 通信缓冲</text>
<text x="899" y="580" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">并发、ISL / OSL 与调度策略</text>
<path d="M402 678 V726 H798 V744" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1190 678 V726 H802 V744" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrG)"/>
<rect x="240" y="749" width="1120" height="103" rx="15" fill="#FFF5E8" stroke="#F59E0B" stroke-width="1.8"/>
<text x="262" y="787" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#9A3412" text-anchor="start">实测峰值 + 安全余量</text>
<text x="262" y="821" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">按实际部署建立账本；共享与复用的分配不可重复相加。</text>
<path d="M65 867 L1535 867" fill="none" stroke="#DFE7F2" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="902" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#6B7E99" text-anchor="start">特别注意：reserved 与 allocated 统计口径不同，不能机械相加；不套用固定 GB 经验公式。</text>
</svg>