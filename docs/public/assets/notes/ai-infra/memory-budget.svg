<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">显存预算：权重只是其中一项</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">显存预算：权重只是其中一项</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">理想低位权重大小不是总部署显存。</tspan></text><rect x="360" y="130" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">设备可用显存</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">扣除系统和其他工作影响</tspan></text><rect x="65" y="365" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="305.0" y="402" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="305.0" dy="0">相对固定部分</tspan></text><text x="305.0" y="439" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="305.0" dy="0">权重、相关元数据、框架常驻</tspan></text><rect x="655" y="365" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="895.0" y="402" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="895.0" dy="0">负载相关部分</tspan></text><text x="895.0" y="439" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="895.0" dy="0">KV、激活、工作区、Graph、通信</tspan></text><rect x="360" y="625" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="662" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">测量峰值与安全余量</tspan></text><text x="600.0" y="699" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">避免 reserved / allocated 重复计数</tspan></text><path d="M600.0 245 L600.0 305.0 L305.0 305.0 L305.0 365" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="295" y="305" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="295" dy="0">驻留项</tspan></text><path d="M600.0 245 L600.0 305.0 L895.0 305.0 L895.0 365" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="900" y="305" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="900" dy="0">动态项</tspan></text><path d="M305.0 480 L305.0 552.5 L600.0 552.5 L600.0 625" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M895.0 480 L895.0 552.5 L600.0 552.5 L600.0 625" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="825" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">同一分配可能被复用；按目标实现建立账本，不硬套经验 GB 公式。</tspan></text></g></svg>