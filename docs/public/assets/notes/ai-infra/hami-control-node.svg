<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1370" viewBox="0 0 1200 1370" role="img" aria-labelledby="title desc">
<title id="title">HAMi：控制面与节点执行面</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">HAMi：控制面与节点执行面</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">职责模型参考 v2.10.0 协议；不是历史未知 commit 的精确函数时序。</tspan></text><rect x="50" y="135" width="530" height="1095" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="315.0" y="167" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="315.0" dy="0">调度控制面</tspan></text><rect x="620" y="135" width="530" height="1095" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="885.0" y="167" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="885.0" dy="0">节点执行面及元数据读取</tspan></text><rect x="85" y="220" width="460" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="315.0" y="257" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="315.0" dy="0">Pod / Admission</tspan></text><text x="315.0" y="294" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="315.0" dy="0">提交与配置变更</tspan></text><rect x="85" y="445" width="460" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="315.0" y="482" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="315.0" dy="0">选中调度器与扩展协作</tspan></text><text x="315.0" y="519" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="315.0" dy="0">匹配节点 / 设备与资源</tspan></text><rect x="85" y="690" width="460" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="315.0" y="727" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="315.0" dy="0">绑定目标节点</tspan></text><text x="315.0" y="764" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="315.0" dy="0">绑定成功仍不表示容器可运行</tspan></text><rect x="655" y="220" width="460" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="885.0" y="257" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="885.0" dy="0">Pod 分配元数据</tspan></text><text x="885.0" y="294" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="885.0" dy="0">API 中的 Pod 注解；节点按协议读取</tspan></text><rect x="655" y="600" width="460" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="885.0" y="637" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="885.0" dy="0">目标节点 kubelet</tspan></text><text x="885.0" y="674" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="885.0" dy="0">推进容器准备流程</tspan></text><rect x="655" y="820" width="460" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="885.0" y="857" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="885.0" dy="0">Device Plugin Allocate</tspan></text><text x="885.0" y="894" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="885.0" dy="0">读取配置，返回分配结果</tspan></text><rect x="655" y="1060" width="460" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="885.0" y="1097" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="885.0" dy="0">容器与用户态后端</tspan></text><text x="885.0" y="1134" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="885.0" dy="0">初始化、资源限制、业务验收</tspan></text><path d="M315.0 335 L315.0 445" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M315.0 560 L315.0 690" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M545 502 L600 502 L600 277 L655 277" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M545 747 L600 747 L600 657 L655 657" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M885.0 715 L885.0 820" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M885.0 935 L885.0 1060" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M1115 277 L1180 277 L1180 877 L1115 877" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="1020" y="455" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="1020" dy="0">按后端协议读取</tspan></text><text x="600" y="1295" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600" dy="0">实线：主要工作推进；虚线：元数据写入 / 读取关系。</tspan></text><text x="600" y="1345" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">Admission、Bind、Allocate 与业务成功分开验收；不把 hook 当作调度器直接调用。</tspan></text></g></svg>