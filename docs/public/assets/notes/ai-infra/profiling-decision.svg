<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FBFF"/></linearGradient>
 <filter id="sh" x="-20%" y="-40%" width="150%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#153F75" flood-opacity=".10"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5679BC"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#10B981"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#EF4444"/></marker>
 </defs>
<rect x="0" y="0" width="1600" height="970" rx="0" fill="url(#bg)"/>
<rect x="0" y="0" width="1600" height="11" rx="0" fill="#4F83ED"/>
<text x="65" y="78" font-family="Noto Sans CJK SC, sans-serif" font-size="44" font-weight="700" fill="#0F2350" text-anchor="start">29  ·  GPU 性能定位：先看时间线，再深入 Kernel</text>
<text x="68" y="123" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#58708D" text-anchor="start">先固定业务目标、正确性与无采集基线；采集工具本身也可能带来扰动</text>
<path d="M65 148 L1535 148" fill="none" stroke="#DDE7F3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="92" y="201" width="650" height="160" rx="18" fill="#EEF6FF" stroke="#3B82F6" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="138" cy="248" r="24" fill="#3B82F6"/>
<text x="138" y="257" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="175" y="255" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#112A54" text-anchor="start">系统级时间线</text>
<text x="116" y="301" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">CPU 提交、队列等待、Memcpy、GPU 执行</text>
<text x="116" y="333" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">先用 Nsight Systems 定位阶段</text>
<path d="M743 278 L850 278" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="860" y="201" width="653" height="160" rx="18" fill="#F4F0FF" stroke="#8B5CF6" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="906" cy="248" r="24" fill="#8B5CF6"/>
<text x="906" y="257" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="943" y="255" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#112A54" text-anchor="start">判断主要耗时</text>
<text x="884" y="301" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">GPU 空隙多？</text>
<text x="884" y="333" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">还是少数 Kernel 很慢？</text>
<path d="M1193 366 V420 H393 V465" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1193 420 H1199 V465" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="232" y="425" width="242" height="35" rx="17" fill="#FFF5E8" stroke="#F59E0B" stroke-width="1.2"/>
<text x="353.0" y="449" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#9A3412" text-anchor="middle">主机 / 设备间隙</text>
<rect x="1095" y="425" width="225" height="35" rx="17" fill="#F4F0FF" stroke="#8B5CF6" stroke-width="1.2"/>
<text x="1207.5" y="449" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#5B21B6" text-anchor="middle">设备热点</text>
<rect x="95" y="483" width="642" height="204" rx="18" fill="#FFF5E8" stroke="#F59E0B" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="141" cy="530" r="24" fill="#F59E0B"/>
<text x="141" y="539" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
<text x="178" y="537" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#112A54" text-anchor="start">排查提交与依赖</text>
<text x="119" y="583" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">CPU 预处理、同步阻塞、数据搬运</text>
<text x="119" y="615" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">Stream 依赖、调度与队列等待</text>
<rect x="857" y="483" width="648" height="204" rx="18" fill="#E9FBF4" stroke="#10B981" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="903" cy="530" r="24" fill="#10B981"/>
<text x="903" y="539" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
<text x="940" y="537" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#112A54" text-anchor="start">深入 Kernel</text>
<text x="881" y="583" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">Nsight Compute：访存与指令效率</text>
<text x="881" y="615" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">带宽 / 占用率 / 算力瓶颈</text>
<path d="M416 691 V741 H800 V757" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1180 691 V741 H800 V757" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="343" y="762" width="919" height="108" rx="15" fill="#EEF6FF" stroke="#3B82F6" stroke-width="1.8"/>
<text x="365" y="800" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#1E40AF" text-anchor="start">单因素修改 → 同条件复测</text>
<text x="365" y="834" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">同时看正确性、端到端延迟、尾延迟和对比环境一致性。</text>
<path d="M65 897 L1535 897" fill="none" stroke="#DFE7F2" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="932" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#6B7E99" text-anchor="start">Systems 擅长看阶段与全局时间线；Compute 适合缩小到特定 Kernel 进行微观分析。</text>
</svg>