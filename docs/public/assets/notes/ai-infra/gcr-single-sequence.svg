<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1390" viewBox="0 0 1200 1390" role="img" aria-labelledby="title desc">
<title id="title">单卡 C/R 时序：驱动解锁不等于业务可运行</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">单卡 C/R 时序：驱动解锁不等于业务可运行</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">源码主干 + 外部安全点条件；阶段间仍须检查错误，不能只看完成提示。</tspan></text><rect x="15" y="120" width="210" height="95" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="120.0" y="157" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="120.0" dy="0">协调器</tspan></text><text x="120.0" y="194" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="120.0" dy="0">cr_client</tspan></text><path d="M120 215 V1325" fill="none" stroke="#0369A1" stroke-dasharray="5 7" opacity="0.45"/><rect x="255" y="120" width="210" height="95" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="360.0" y="157" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="360.0" dy="0">Worker Runtime</tspan></text><text x="360.0" y="194" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="360.0" dy="0">Hook / 账本</tspan></text><path d="M360 215 V1325" fill="none" stroke="#0369A1" stroke-dasharray="5 7" opacity="0.45"/><rect x="495" y="120" width="210" height="95" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="157" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">GPU / VMM</tspan></text><text x="600.0" y="194" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">数据与映射</tspan></text><path d="M600 215 V1325" fill="none" stroke="#0369A1" stroke-dasharray="5 7" opacity="0.45"/><rect x="735" y="120" width="210" height="95" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="840.0" y="157" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="840.0" dy="0">Host</tspan></text><text x="840.0" y="194" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="840.0" dy="0">staging / 快照</tspan></text><path d="M840 215 V1325" fill="none" stroke="#0369A1" stroke-dasharray="5 7" opacity="0.45"/><rect x="975" y="120" width="210" height="95" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="1080.0" y="157" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="1080.0" dy="0">驱动工具</tspan></text><text x="1080.0" y="194" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="1080.0" dy="0">cuda-checkpoint</tspan></text><path d="M1080 215 V1325" fill="none" stroke="#0369A1" stroke-dasharray="5 7" opacity="0.45"/><rect x="45" y="228" width="1110" height="44" rx="6" fill="#EFF6FF" stroke="#0369A1" stroke-dasharray="5 4"/><text x="600" y="255" text-anchor="middle" fill="#0369A1" font-size="19" font-weight="600"><tspan x="600" dy="0">外部条件：业务已进入安全点，并一直阻止相关线程继续提交</tspan></text><rect x="45" y="773" width="1110" height="44" rx="6" fill="#EFF6FF" stroke="#0369A1" stroke-dasharray="5 4"/><text x="600" y="800" text-anchor="middle" fill="#0369A1" font-size="19" font-weight="600"><tspan x="600" dy="0">换出期间：Host 快照与进程仍需存活；不代表已获得掉电恢复镜像</tspan></text><path d="M120 330 L360 330" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="136.0" y="293" width="208.0" height="29" fill="#FFFFFF"/><text x="240.0" y="314" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="240.0" dy="0">CKPT_MSG + SIGUSR1</tspan></text><path d="M360 410 L600 410" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="369.5" y="373" width="221.0" height="29" fill="#FFFFFF"/><text x="480.0" y="394" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="480.0" dy="0">cudaDeviceSynchronize</tspan></text><path d="M600 490 L840 490" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="587.0" y="453" width="266.0" height="29" fill="#FFFFFF"/><text x="720.0" y="474" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="720.0" dy="0">分块：GPU → staging → 快照</tspan></text><path d="M360 570 L600 570" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="395.5" y="533" width="169.0" height="29" fill="#FFFFFF"/><text x="480.0" y="554" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="480.0" dy="0">Unmap + Release</tspan></text><path d="M360 650 L120 650" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="123.0" y="613" width="234.0" height="29" fill="#FFFFFF"/><text x="240.0" y="634" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="240.0" dy="0">FINISH_MSG（阶段通知）</tspan></text><path d="M120 730 L1080 730" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="485.5" y="693" width="229.0" height="29" fill="#FFFFFF"/><text x="600.0" y="714" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">驱动 checkpoint / toggle</tspan></text><path d="M120 880 L1080 880" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="513.5" y="843" width="173.0" height="29" fill="#FFFFFF"/><text x="600.0" y="864" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">驱动 restore / 解锁</tspan></text><path d="M120 960 L360 960" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="118.5078125" y="923" width="242.984375" height="29" fill="#FFFFFF"/><text x="240.0" y="944" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="240.0" dy="0">RESTORE_MSG + SIGUSR2</tspan></text><path d="M360 1040 L600 1040" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="353.0" y="1003" width="254.0" height="29" fill="#FFFFFF"/><text x="480.0" y="1024" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="480.0" dy="0">Create → Map → SetAccess</tspan></text><path d="M840 1120 L600 1120" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="614.0" y="1083" width="212.0" height="29" fill="#FFFFFF"/><text x="720.0" y="1104" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="720.0" dy="0">快照 → staging → GPU</tspan></text><path d="M360 1200 L120 1200" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="123.0" y="1163" width="234.0" height="29" fill="#FFFFFF"/><text x="240.0" y="1184" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="240.0" dy="0">FINISH_MSG（阶段通知）</tspan></text><rect x="45" y="1258" width="1110" height="44" rx="6" fill="#EFF6FF" stroke="#0369A1" stroke-dasharray="5 4"/><text x="600" y="1285" text-anchor="middle" fill="#0369A1" font-size="19" font-weight="600"><tspan x="600" dy="0">外部条件：检查结果、数据及业务状态，全部通过后才允许继续提交</tspan></text><text x="600" y="1365" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">实线为源码主干；虚线框为额外工程条件，不能误读为原型自带的全局屏障。</tspan></text></g></svg>