<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">逐节点抓取：不要把 Service 名当节点身份</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">逐节点抓取：不要把 Service 名当节点身份</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">实线是独立抓取目标；虚线表示共享入口可能选择的后端。</tspan></text><rect x="360" y="135" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="172" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">监控发现与抓取</tspan></text><text x="600.0" y="209" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">为每个 exporter 保留独立 target</tspan></text><rect x="65" y="395" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="305.0" y="432" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="305.0" dy="0">Node A：Exporter</tspan></text><text x="305.0" y="469" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="305.0" dy="0">返回 node / UUID / 实体标签</tspan></text><rect x="655" y="395" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="895.0" y="432" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="895.0" dy="0">Node B：Exporter</tspan></text><text x="895.0" y="469" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="895.0" dy="0">返回另一节点及设备身份</tspan></text><rect x="360" y="735" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="772" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">共享的多 Endpoint Service</tspan></text><text x="600.0" y="809" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">一次连接不承诺命中指定节点</tspan></text><path d="M600.0 250 L600.0 322.5 L305.0 322.5 L305.0 395" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="330" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="280" dy="0">target A</tspan></text><path d="M600.0 250 L600.0 322.5 L895.0 322.5 L895.0 395" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="920" y="330" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="920" dy="0">target B</tspan></text><path d="M480 735 L480 625 L305 625 L305 510" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M720 735 L720 625 L895 625 L895 510" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="600" y="675" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600" dy="0">共享入口：可能选中 A，也可能选中 B</tspan></text><text x="600" y="1015" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">监控发现和标签配置需自行确认；不要把来自不同节点的结果拼成一条设备曲线。</tspan></text></g></svg>