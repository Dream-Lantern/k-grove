<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1330" viewBox="0 0 1200 1330" role="img" aria-labelledby="title desc">
<title id="title">训练、验证、测试：数据职责与参数更新</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">训练、验证、测试：数据职责与参数更新</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">仅训练路径反向更新权重；验证做选择，测试作最终独立评估。</tspan></text><rect x="360" y="130" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">去重、按任务规则划分数据</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">先防泄漏，再固定数据版本</tspan></text><rect x="45" y="370" width="340" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="215.0" y="407" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="215.0" dy="0">训练集</tspan></text><text x="215.0" y="444" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="215.0" dy="0">前向、损失与反向</tspan></text><rect x="430" y="370" width="340" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="407" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">验证集</tspan></text><text x="600.0" y="444" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">用于评估与选择</tspan></text><rect x="815" y="370" width="340" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="985.0" y="407" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="985.0" dy="0">测试集</tspan></text><text x="985.0" y="444" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="985.0" dy="0">保留至最终评估</tspan></text><rect x="45" y="660" width="340" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="215.0" y="697" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="215.0" dy="0">训练得到候选权重</tspan></text><text x="215.0" y="734" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="215.0" dy="0">更新只来自训练目标</tspan></text><rect x="430" y="660" width="340" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="697" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">模型 / 超参数选择</tspan></text><text x="600.0" y="734" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">验证集不作训练梯度</tspan></text><rect x="815" y="930" width="340" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="985.0" y="967" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="985.0" dy="0">固定后最终测试</tspan></text><text x="985.0" y="1004" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="985.0" dy="0">不反复拿测试结果调参</tspan></text><rect x="430" y="1140" width="340" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="1177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">发布与线上观测</tspan></text><text x="600.0" y="1214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">反馈须治理后再用于训练</tspan></text><path d="M600.0 245 L600.0 307.5 L215.0 307.5 L215.0 370" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 245 L600.0 370" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 245 L600.0 307.5 L985.0 307.5 L985.0 370" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M215.0 485 L215.0 660" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 485 L600.0 660" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M385 717.5 L430 717.5" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="410" y="690" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="410" dy="0">候选</tspan></text><path d="M600.0 775 L600.0 852.5 L985.0 852.5 L985.0 930" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M985.0 485 L985.0 930" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M985.0 1045 L985.0 1092.5 L600.0 1092.5 L600.0 1140" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="1305" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">图省略训练与选择的反复；线上反馈不自动回写优化器。</tspan></text></g></svg>