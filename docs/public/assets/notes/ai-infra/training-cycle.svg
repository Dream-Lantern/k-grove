<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FBFF"/></linearGradient>
  <filter id="sh" x="-20%" y="-40%" width="150%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#153F75" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5679BC"/></marker>
  <marker id="arrG" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#10B981"/></marker>
  <marker id="arrR" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#EF4444"/></marker>
  <marker id="arrV" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8B5CF6"/></marker>
  </defs>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="url(#bg)"/>
<rect x="0" y="0" width="1600" height="11" rx="0" fill="#4F83ED"/>
<text x="65" y="78" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="700" fill="#0F2350" text-anchor="start">32  ·  训练 / 验证 / 测试：谁更新权重，谁负责选择？</text>
<text x="68" y="123" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#58708D" text-anchor="start">先去重、防泄漏、固定数据版本；训练数据更新参数，测试集只作独立最终评估</text>
<path d="M65 148 L1535 148" fill="none" stroke="#DDE7F3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="467" y="185" width="665" height="112" rx="18" fill="#EEF6FF" stroke="#60A5FA" stroke-width="2" filter="url(#sh)"/>
<text x="800" y="232" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#1D4ED8" text-anchor="middle">数据治理与划分</text>
<text x="800" y="269" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#465D7B" text-anchor="middle">去重、按任务规则划分，防止泄漏与时间穿越</text>
<path d="M800 299 V346 H300 V381" fill="none" stroke="#5679BC" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M800 346 V381" fill="none" stroke="#5679BC" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M800 346 H1300 V381" fill="none" stroke="#5679BC" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="65" y="392" width="443" height="320" rx="21" fill="#EEF6FF" stroke="#3B82F6" stroke-width="2.1" filter="url(#sh)"/>
<circle cx="109" cy="439" r="23" fill="#3B82F6"/>
<text x="109" y="447" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="white" text-anchor="middle">1</text>
<text x="146" y="446" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" fill="#10264D" text-anchor="start">训练集</text>
<text x="97" y="487" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#1E40AF" text-anchor="start">TRAIN</text>
<rect x="94" y="521" width="385" height="82" rx="13" fill="white" stroke="#3B82F6" stroke-width="1.25"/>
<text x="111" y="557" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#10264D" text-anchor="start">前向 → 损失 → 反向</text>
<text x="98" y="649" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#465D7B" text-anchor="start">优化器根据训练目标更新权重</text>
<text x="98" y="680" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#465D7B" text-anchor="start">可反复训练，产出候选权重</text>
<rect x="580" y="392" width="443" height="320" rx="21" fill="#F4F0FF" stroke="#8B5CF6" stroke-width="2.1" filter="url(#sh)"/>
<circle cx="624" cy="439" r="23" fill="#8B5CF6"/>
<text x="624" y="447" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="white" text-anchor="middle">2</text>
<text x="661" y="446" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" fill="#10264D" text-anchor="start">验证集</text>
<text x="612" y="487" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#5B21B6" text-anchor="start">VALIDATION</text>
<rect x="609" y="521" width="385" height="82" rx="13" fill="white" stroke="#8B5CF6" stroke-width="1.25"/>
<text x="626" y="557" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#10264D" text-anchor="start">评估候选权重 / 超参数</text>
<text x="613" y="649" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#465D7B" text-anchor="start">不对验证集反向更新模型参数</text>
<text x="613" y="680" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#465D7B" text-anchor="start">选择模型与超参数</text>
<rect x="1095" y="392" width="443" height="320" rx="21" fill="#FFF5E8" stroke="#F59E0B" stroke-width="2.1" filter="url(#sh)"/>
<circle cx="1139" cy="439" r="23" fill="#F59E0B"/>
<text x="1139" y="447" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="white" text-anchor="middle">3</text>
<text x="1176" y="446" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" fill="#10264D" text-anchor="start">测试集</text>
<text x="1127" y="487" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#9A3412" text-anchor="start">TEST</text>
<rect x="1124" y="521" width="385" height="82" rx="13" fill="white" stroke="#F59E0B" stroke-width="1.25"/>
<text x="1141" y="557" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#10264D" text-anchor="start">冻结模型后独立评估</text>
<text x="1128" y="649" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#465D7B" text-anchor="start">不反复利用测试结果调参</text>
<text x="1128" y="680" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#465D7B" text-anchor="start">留待最终评价，避免信息泄漏</text>
<path d="M287 714 L287 763" fill="none" stroke="#5679BC" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M801 714 L801 763" fill="none" stroke="#5679BC" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1316 714 L1316 763" fill="none" stroke="#5679BC" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80" y="777" width="414" height="78" rx="14" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.6"/>
<text x="287" y="824" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1D4ED8" text-anchor="middle">候选权重</text>
<rect x="597" y="777" width="414" height="78" rx="14" fill="#F4F0FF" stroke="#8B5CF6" stroke-width="1.6"/>
<text x="804" y="824" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#5B21B6" text-anchor="middle">选择模型 / 超参数</text>
<rect x="1110" y="777" width="414" height="78" rx="14" fill="#FFF5E8" stroke="#F59E0B" stroke-width="1.6"/>
<text x="1317" y="824" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#9A3412" text-anchor="middle">固定后进行最终测试</text>
<path d="M497 817 L572 817" fill="none" stroke="#5679BC" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1014 817 L1085 817" fill="none" stroke="#5679BC" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="155" y="871" width="1290" height="66" rx="14" fill="#E9FBF4" stroke="#6EE7B7" stroke-width="1.4"/>
<text x="800" y="900" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#047857" text-anchor="middle">发布与线上观测：反馈必须经过治理后，才能进入未来训练数据。</text>
<path d="M65 928 L1535 928" fill="none" stroke="#DFE7F2" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="966" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#6B7E99" text-anchor="start">示意图省略训练与模型选择的多次循环；线上反馈不会自动更新当前优化器。</text>
</svg>