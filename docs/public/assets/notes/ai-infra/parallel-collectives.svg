<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">多 GPU：集合通信的匹配契约</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">多 GPU：集合通信的匹配契约</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">图示为逻辑 AllReduce，不表示具体 ring/tree 算法。</tspan></text><rect x="50" y="145" width="320" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="210.0" y="182" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="210.0" dy="0">Rank 0</tspan></text><text x="210.0" y="219" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="210.0" dy="0">各有输入数组</tspan></text><rect x="440" y="145" width="320" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="182" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">Rank 1</tspan></text><text x="600.0" y="219" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">各有输入数组</tspan></text><rect x="830" y="145" width="320" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="990.0" y="182" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="990.0" dy="0">Rank 2</tspan></text><text x="990.0" y="219" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="990.0" dy="0">各有输入数组</tspan></text><rect x="360" y="415" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="452" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">同一个集合操作</tspan></text><text x="600.0" y="489" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">count、dtype、顺序等需匹配</tspan></text><rect x="360" y="680" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="717" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">各 Rank 得到归约结果</tspan></text><text x="600.0" y="754" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">并非只有一个 root 获得结果</tspan></text><path d="M210.0 260 L210.0 337.5 L600.0 337.5 L600.0 415" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 260 L600.0 415" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M990.0 260 L990.0 337.5 L600.0 337.5 L600.0 415" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 530 L600.0 680" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="875" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">Rank 是通信组编号，不保证等同物理设备索引。</tspan></text></g></svg>