<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FBFF"/></linearGradient>
 <filter id="sh" x="-20%" y="-40%" width="150%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#153F75" flood-opacity=".10"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5679BC"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#10B981"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#EF4444"/></marker>
 </defs>
<rect x="0" y="0" width="1600" height="940" rx="0" fill="url(#bg)"/>
<rect x="0" y="0" width="1600" height="11" rx="0" fill="#4F83ED"/>
<text x="65" y="78" font-family="Noto Sans CJK SC, sans-serif" font-size="44" font-weight="700" fill="#0F2350" text-anchor="start">28  ·  多 GPU：AllReduce 的匹配通信契约</text>
<text x="68" y="123" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#58708D" text-anchor="start">逻辑归约示例：各 Rank 都得到结果；不表示具体使用 ring、tree 或其他算法</text>
<path d="M65 148 L1535 148" fill="none" stroke="#DDE7F3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="85" y="216" width="403" height="178" rx="18" fill="#EEF6FF" stroke="#3B82F6" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="131" cy="263" r="24" fill="#3B82F6"/>
<text x="131" y="272" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">0</text>
<text x="168" y="270" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#112A54" text-anchor="start">Rank 0</text>
<text x="109" y="316" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">输入数组：[1, 2]</text>
<path d="M287 396 V471 H800 V492" fill="none" stroke="#5679BC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
