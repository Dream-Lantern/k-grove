<text x="651" y="272" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="688" y="270" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#112A54" text-anchor="start">Rank 1</text>
<text x="629" y="316" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">输入数组：[3, 4]</text>
<path d="M807 396 V471 H800 V492" fill="none" stroke="#5679BC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1125" y="216" width="403" height="178" rx="18" fill="#E9FBF4" stroke="#10B981" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="1171" cy="263" r="24" fill="#10B981"/>
<text x="1171" y="272" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="1208" y="270" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#112A54" text-anchor="start">Rank 2</text>
<text x="1149" y="316" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">输入数组：[5, 6]</text>
<path d="M1327 396 V471 H800 V492" fill="none" stroke="#5679BC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="384" y="512" width="830" height="112" rx="15" fill="#F4F0FF" stroke="#8B5CF6" stroke-width="1.8"/>
<text x="406" y="550" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#5B21B6" text-anchor="start">同一个 AllReduce（求和）</text>
<text x="406" y="584" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">各 Rank 按一致的 count、dtype、通信组和集体操作顺序参与。</text>
<path d="M800 628 V669 H285 V696" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M800 669 H805 V696" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M800 669 H1319 V696" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="85" y="700" width="403" height="110" rx="15" fill="#E9FBF4" stroke="#10B981" stroke-width="1.8"/>
<text x="107" y="738" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#047857" text-anchor="start">Rank 0：输出 [9, 12]</text>
<text x="107" y="772" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">每个参与的 Rank 都获得归约结果</text>
<rect x="605" y="700" width="403" height="110" rx="15" fill="#E9FBF4" stroke="#10B981" stroke-width="1.8"/>
<text x="627" y="738" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#047857" text-anchor="start">Rank 1：输出 [9, 12]</text>
<text x="627" y="772" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">每个参与的 Rank 都获得归约结果</text>
<rect x="1125" y="700" width="403" height="110" rx="15" fill="#E9FBF4" stroke="#10B981" stroke-width="1.8"/>
<text x="1147" y="738" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#047857" text-anchor="start">Rank 2：输出 [9, 12]</text>
<text x="1147" y="772" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">每个参与的 Rank 都获得归约结果</text>
<path d="M65 867 L1535 867" fill="none" stroke="#DFE7F2" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="902" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#6B7E99" text-anchor="start">Rank 是通信组内部的编号；不保证与物理 GPU ordinal 一致。任一 Rank 缺席或调用失配可导致挂起/错误。</text>
</svg>