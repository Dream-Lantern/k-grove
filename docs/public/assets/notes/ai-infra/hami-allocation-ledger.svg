<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1620" viewBox="0 0 1200 1620" role="img" aria-labelledby="title desc">
<title id="title">显存配额：并发记账的设计验收模型</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">显存配额：并发记账的设计验收模型</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">这是应核查的不变量，不宣称某个未知 HAMi-core 版本已按此实现。</tspan></text><rect x="360" y="130" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">新的分配请求</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">明确 requested 字节数与对象</tspan></text><polygon points="600.0,335 840,405.0 600.0,475 360,405.0" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="390" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600"><tspan x="600.0" dy="0">额度能容纳请求？</tspan></text><text x="600.0" y="418" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">used + reserved + requested</tspan></text><rect x="680" y="570" width="460" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="910.0" y="607" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="910.0" dy="0">超额：拒绝</tspan></text><text x="910.0" y="644" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="910.0" dy="0">返回错误，不留下活跃分配</tspan></text><rect x="60" y="570" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="295.0" y="607" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="295.0" dy="0">准入：并发一致地预留</tspan></text><text x="295.0" y="644" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="295.0" dy="0">检查与预留不能使用失效余额</tspan></text><rect x="60" y="795" width="470" height="115" rx="7" fill=