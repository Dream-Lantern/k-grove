ath d="M600.0 475 L600.0 522.5 L910.0 522.5 L910.0 570" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="920" y="535" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="920" dy="0">否</tspan></text><path d="M600.0 475 L600.0 522.5 L295.0 522.5 L295.0 570" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="270" y="535" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="270" dy="0">是</tspan></text><path d="M295.0 685 L295.0 795" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M295.0 910 L295.0 1000" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M295.0 1135 L295.0 1240" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="355" y="1190" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="355" dy="0">是</tspan></text><path d="M295.0 1135 L295.0 1187.5 L910.0 1187.5 L910.0 1240" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="900" y="1180" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="900" dy="0">否</tspan></text><path d="M295.0 1355 L295.0 1450" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="1595" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">还需核查异步 / VMM / Graph 路径、进程失效对账和计数溢出。</tspan></text></g></svg>