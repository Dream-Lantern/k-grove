<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">推理引擎评估：硬约束先于排名</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">推理引擎评估：硬约束先于排名</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">固定版本、模型、GPU、输入分布和质量门槛。</tspan></text><rect x="360" y="125" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="162" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">兼容性与功能</tspan></text><text x="600.0" y="199" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">架构、格式、后端、协议</tspan></text><polygon points="600.0,340 840,407.5 600.0,475 360,407.5" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="395" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600"><tspan x="600.0" dy="0">质量与功能通过？</tspan></text><text x="600.0" y="423" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">先做最小正确性验证</tspan></text><rect x="670" y="625" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="905.0" y="662" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="905.0" dy="0">未通过</tspan></text><text x="905.0" y="699" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="905.0" dy="0">记录限制，不进入性能排名</tspan></text><rect x="60" y="625" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="295.0" y="662" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="295.0" dy="0">通过后压测</tspan></text><text x="295.0" y="699" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="295.0" dy="0">TTFT、TPOT、吞吐、p99、OOM</tspan></text><rect x="60" y="855" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="295.0" y="892" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="295.0" dy="0">选型与回退</tspan></text><text x="295.0" y="929" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="295.0" dy="0">写清收益、条件和代价</tspan></text><path d="M600.0 240 L600.0 340" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 475 L600.0 550.0 L905.0 550.0 L905.0 625" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="920" y="550" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="920" dy="0">否</tspan></text><path d="M600.0 475 L600.0 550.0 L295.0 550.0 L295.0 625" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="285" y="550" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="285" dy="0">是</tspan></text><path d="M295.0 740 L295.0 855" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="1055" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">不使用没有同条件测量的毫秒数、倍数或星级作通用结论。</tspan></text></g></svg>