<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
<title id="title">Context：所有权与当前线程</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">Context：所有权与当前线程</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">cuCtxSetCurrent 设置宿主线程状态，不是全 GPU 开关。</tspan></text><rect x="55" y="325" width="1090" height="450" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="600.0" y="357" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="600.0" dy="0">同一 CUDA Context 中的对象示意</tspan></text><rect x="360" y="130" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">宿主线程</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">具有其当前 context</tspan></text><rect x="100" y="400" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="335.0" y="437" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="335.0" dy="0">Module / Function</tspan></text><text x="335.0" y="474" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="335.0" dy="0">加载代码与可启动函数</tspan></text><rect x="630" y="400" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="865.0" y="437" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="865.0" dy="0">Stream / Event</tspan></text><text x="865.0" y="474" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="865.0" dy="0">工作顺序与依赖</tspan></text><rect x="360" y="615" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="652" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">Memory Allocation</tspan></text><text x="600.0" y="689" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">可访问性与释放规则需明确</tspan></text><path d="M600.0 245 L600.0 322.5 L335.0 322.5 L335.0 400" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="295" y="290" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="295" dy="0">相关资源</tspan></text><path d="M600.0 245 L600.0 322.5 L865.0 322.5 L865.0 400" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="905" y="290" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="905" dy="0">相关资源</tspan></text><path d="M865.0 515 L865.0 565.0 L600.0 565.0 L600.0 615" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="850" y="590" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="850" dy="0">使用</tspan></text><text x="600" y="925" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">Green Context 可以约束特定 SM 资源；不等同于完整 MIG 硬件隔离。</tspan></text></g></svg>