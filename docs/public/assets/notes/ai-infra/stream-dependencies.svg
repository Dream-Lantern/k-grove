<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">两个 Stream：用 Event 建立依赖</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">两个 Stream：用 Event 建立依赖</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">同一队列中的依赖阶段不因 Async 名称而自动重叠。</tspan></text><rect x="55" y="145" width="515" height="575" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="312.5" y="177" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="312.5" dy="0">Stream A：生产者</tspan></text><rect x="630" y="145" width="515" height="575" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="887.5" y="177" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="887.5" dy="0">Stream B：消费者</tspan></text><rect x="90" y="225" width="445" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="312.5" y="262" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="312.5" dy="0">Produce</tspan></text><text x="312.5" y="299" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="312.5" dy="0">写入 buffer</tspan></text><rect x="90" y="490" width="445" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="312.5" y="527" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="312.5" dy="0">Record ready event</tspan></text><text x="312.5" y="564" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="312.5" dy="0">位于生产工作之后</tspan></text><rect x="665" y="225" width="445" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="887.5" y="262" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="887.5" dy="0">Wait ready event</tspan></text><text x="887.5" y="299" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="887.5" dy="0">设备队列等待依赖</tspan></text><rect x="665" y="490" width="445" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="887.5" y="527" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="887.5" dy="0">Consume</tspan></text><text x="887.5" y="564" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="887.5" dy="0">只在依赖完成后读取</tspan></text><path d="M312.5 340 L312.5 490" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M887.5 340 L887.5 490" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M535 548 L600 548 L600 282 L665 282" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="600" y="440" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">ready 依赖</tspan></text><text x="600" y="825" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">跨 Stream 可以并发，但有依赖的读写必须建立顺序。</tspan></text></g></svg>