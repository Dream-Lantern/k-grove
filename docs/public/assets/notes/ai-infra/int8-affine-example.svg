<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc">
<title id="title">INT8 算例：缩放、舍入、截断与还原</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">INT8 算例：缩放、舍入、截断与还原</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">教学示例；本例选择对称有效范围 [-127,127]，不是浮点位串截取。</tspan></text><rect x="180" y="130" width="840" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">原数值与量化参数</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">x = 3.14；scale = 0.1；zero_point = 0</tspan></text><rect x="180" y="350" width="840" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="387" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">量化：先缩放和舍入，再 clip</tspan></text><text x="600.0" y="424" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">round(3.14 / 0.1) = 31；clip 后仍为 31</tspan></text><path d="M600.0 245 L600.0 350" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="180" y="570" width="840" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="607" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">存储整数 31</tspan></text><text x="600.0" y="644" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">int8 位串：00011111</tspan></text><path d="M600.0 465 L600.0 570" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="180" y="790" width="840" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="827" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">还原近似值</tspan></text><text x="600.0" y="864" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">x_hat = 0.1 × (31 - 0) ≈ 3.1</tspan></text><path d="M600.0 685 L600.0 790" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="995" text-anchor="middle" fill="#0F172A" font-size="20" font-weight="400"><tspan x="600" dy="0">还原值 - 原值 ≈ -0.04；超出有效范围时会饱和截断。</tspan></text><text x="600" y="1085" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">int8 存储范围为 [-128,127]；半整数舍入规则与有效量化范围由方案明确。</tspan></text></g></svg>