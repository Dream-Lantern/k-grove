<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FBFF"/></linearGradient>
 <filter id="sh" x="-20%" y="-40%" width="150%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#153F75" flood-opacity=".10"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5679BC"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#10B981"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#EF4444"/></marker>
 </defs>
<rect x="0" y="0" width="1600" height="940" rx="0" fill="url(#bg)"/>
<rect x="0" y="0" width="1600" height="11" rx="0" fill="#4F83ED"/>
<text x="65" y="78" font-family="Noto Sans CJK SC, sans-serif" font-size="44" font-weight="700" fill="#0F2350" text-anchor="start">12  ·  GPU 资源：计算与数据供给</text>
<text x="68" y="123" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#58708D" text-anchor="start">GPU 性能取决于执行资源、数据通路与并行度的配合，并非只看算力峰值</text>
<path d="M65 148 L1535 148" fill="none" stroke="#DDE7F3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="465" y="193" width="670" height="108" rx="15" fill="#EEF6FF" stroke="#3B82F6" stroke-width="1.8"/>
<text x="487" y="231" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#1E40AF" text-anchor="start">GPU 工作负载</text>
<text x="487" y="265" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">需要指令、输入数据、足够并行度与正确的调度。</text>
<path d="M800 301 L800 339" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M800 339 H405 V363" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M800 339 H1195 V363" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="85" y="368" width="650" height="265" rx="18" fill="#F4F0FF" stroke="#8B5CF6" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="131" cy="415" r="24" fill="#8B5CF6"/>
<text x="131" y="424" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
<text x="168" y="422" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#112A54" text-anchor="start">SM 计算与执行资源</text>
<text x="109" y="468" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">Warp 调度器 / CUDA Core / Tensor Core</text>
<text x="109" y="500" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">执行指令、矩阵计算、线程切换</text>
<text x="109" y="532" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">受寄存器、占用率及并行度制约</text>
<rect x="865" y="368" width="650" height="265" rx="18" fill="#E9FBF4" stroke="#10B981" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="911" cy="415" r="24" fill="#10B981"/>
<text x="911" y="424" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
<text x="948" y="422" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#112A54" text-anchor="start">数据与搬运资源</text>
<text x="889" y="468" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">L2 Cache、HBM / GDDR 显存</text>
<text x="889" y="500" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">显存带宽、数据局部性与 Copy Engine</text>
<text x="889" y="532" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">数据送达速度可能限制计算吞吐</text>
<path d="M410 634 V689 H800 V716" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1190 634 V689 H800 V716" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="335" y="714" width="930" height="120" rx="15" fill="#FFF5E8" stroke="#F59E0B" stroke-width="1.8"/>
<text x="357" y="752" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#9A3412" text-anchor="start">性能观察：用时间线判断瓶颈</text>
<text x="357" y="786" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">结合 SM 活跃度、访存带宽、Kernel 与拷贝重叠分析；</text>
<text x="357" y="813" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">不要用单一利用率推断瓶颈。</text>
<path d="M65 867 L1535 867" fill="none" stroke="#DFE7F2" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="902" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#6B7E99" text-anchor="start">这是概念关系图，具体执行单元数量、缓存与拷贝引擎取决于 GPU 型号与 SKU。</text>
</svg>