<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc">
<title id="title">论文增量机制：计算写到哪里，而非重跑数值计算</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">论文增量机制：计算写到哪里，而非重跑数值计算</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">这是论文机制示意，不代表此公开提交已包含完整模板生成链路。</tspan></text><rect x="40" y="125" width="1120" height="260" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="600.0" y="157" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="600.0" dy="0">离线：构造可支持 Kernel 的 Dirty Template</tspan></text><rect x="70" y="200" width="460" height="125" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="300.0" y="237" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="300.0" dy="0">PTX 写指令与地址依赖</tspan></text><text x="300.0" y="274" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="300.0" dy="0">保留写入地址/长度的必要计算</tspan></text><rect x="670" y="200" width="460" height="125" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="900.0" y="237" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="900.0" dy="0">CPU 可执行模板</tspan></text><text x="900.0" y="274" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="900.0" dy="0">依赖参数及 launch 配置</tspan></text><path d="M530 262.5 L670 262.5" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="430" width="1120" height="460" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="600.0" y="462" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="600.0" dy="0">在线：同次 Kernel 启动的两条执行路径</tspan></text><rect x="360" y="500" width="480" height="125" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="537" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">采集启动参数与配置</tspan></text><text x="600.0" y="574" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">必要的 GPU 侧索引数据需处理</tspan></text><rect x="70" y="705" width="460" height="125" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="300.0" y="742" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="300.0" dy="0">GPU 执行原 Kernel</tspan></text><text x="300.0" y="779" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="300.0" dy="0">真实计算与实际写入</tspan></text><rect x="670" y="705" width="460" height="125" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="900.0" y="742" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="900.0" dy="0">CPU 执行模板</tspan></text><text x="900.0" y="779" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="900.0" dy="0">生成/合并 dirty ranges</tspan></text><path d="M600.0 625 L600.0 665.0 L300.0 665.0 L300.0 705" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 625 L600.0 665.0 L900.0 665.0 L900.0 705" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M1130 262 L1180 262 L1180 767 L1130 767" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="240" y="985" width="720" height="125" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="1022" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">一致性边界后保存变化范围</tspan></text><text x="600.0" y="1059" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">漏记不可接受；无法安全分析时保守回退</tspan></text><path d="M300.0 830 L300.0 907.5 L600.0 907.5 L600.0 985" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M900.0 830 L900.0 907.5 L600.0 907.5 L600.0 985" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="1195" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">论文还使用权重/KV 的应用知识；增量在保存时合入基线，不代表任意 Kernel 全透明。</tspan></text></g></svg>