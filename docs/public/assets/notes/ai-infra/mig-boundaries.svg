<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FBFF"/></linearGradient>
 <filter id="sh" x="-20%" y="-40%" width="150%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#153F75" flood-opacity=".10"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5679BC"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#10B981"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#EF4444"/></marker>
 </defs>
<rect x="0" y="0" width="1600" height="940" rx="0" fill="url(#bg)"/>
<rect x="0" y="0" width="1600" height="11" rx="0" fill="#4F83ED"/>
<text x="65" y="78" font-family="Noto Sans CJK SC, sans-serif" font-size="44" font-weight="700" fill="#0F2350" text-anchor="start">23  ·  MIG：GI 资源边界与 CI 共享关系</text>
<text x="68" y="123" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#58708D" text-anchor="start">概念示意：不以固定 1/7 或 1/8 等比例绘制真实物理切分</text>
<path d="M65 148 L1535 148" fill="none" stroke="#DDE7F3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="74" y="183" width="1450" height="618" rx="28" fill="#F7FBFF" stroke="#93C5FD" stroke-width="2"/>
<text x="115" y="238" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="700" fill="#1D4ED8" text-anchor="start">支持 MIG 的物理 GPU</text>
<rect x="1120" y="208" width="340" height="35" rx="17" fill="#FFF5E8" stroke="#F59E0B" stroke-width="1.2"/>
<text x="1290.0" y="232" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#9A3412" text-anchor="middle">整卡 / 驱动 / 主机仍是共同风险</text>
<rect x="111" y="266" width="857" height="450" rx="20" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2.5"/>
<text x="145" y="315" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#1D4ED8" text-anchor="start">GI A  ·  独立资源分区</text>
<rect x="151" y="350" width="778" height="96" rx="15" fill="#EEF6FF" stroke="#3B82F6" stroke-width="1.8"/>
<text x="173" y="388" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#1E40AF" text-anchor="start">GI A：显存与相关引擎</text>
<text x="173" y="422" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">两个 CI 使用其所属 GI 的相关资源，不会各复制一份 GI 显存。</text>
<rect x="146" y="494" width="358" height="160" rx="18" fill="#F4F0FF" stroke="#8B5CF6" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="192" cy="541" r="24" fill="#8B5CF6"/>
<text x="192" y="550" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="229" y="548" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#112A54" text-anchor="start">CI A1</text>
<text x="170" y="594" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">计算子集 1</text>
<rect x="556" y="494" width="365" height="160" rx="18" fill="#F4F0FF" stroke="#8B5CF6" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="602" cy="541" r="24" fill="#8B5CF6"/>
<text x="602" y="550" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="639" y="548" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#112A54" text-anchor="start">CI A2</text>
<text x="580" y="594" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">计算子集 2</text>
<path d="M326 449 L326 487" fill="none" stroke="#5679BC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M734 449 L734 487" fill="none" stroke="#5679BC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1016" y="266" width="463" height="450" rx="20" fill="#F0FDF4" stroke="#34D399" stroke-width="2.5"/>
<text x="1049" y="315" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#047857" text-anchor="start">GI B  ·  独立资源分区</text>
<rect x="1051" y="355" width="392" height="110" rx="15" fill="#E9FBF4" stroke="#10B981" stroke-width="1.8"/>
<text x="1073" y="393" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#047857" text-anchor="start">GI B：自己的显存 / 引擎</text>
<text x="1073" y="427" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">与 GI A 的分区边界不同。</text>
<rect x="1050" y="519" width="392" height="151" rx="18" fill="#E9FBF4" stroke="#10B981" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="1096" cy="566" r="24" fill="#10B981"/>
<text x="1096" y="575" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1133" y="573" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#112A54" text-anchor="start">CI B1</text>
<text x="1074" y="619" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">使用父 GI B 的资源</text>
<path d="M1243 466 L1243 509" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrG)"/>
<path d="M65 867 L1535 867" fill="none" stroke="#DFE7F2" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="902" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#6B7E99" text-anchor="start">GI = GPU Instance；CI = Compute Instance。可用配置、资源比例与隔离能力依 GPU 型号而异。</text>
</svg>