<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">MIG：GI 的资源边界与 CI 共享关系</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">MIG：GI 的资源边界与 CI 共享关系</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">概念布局；不按固定 1/7 或 1/8 比例绘制。</tspan></text><rect x="45" y="135" width="1110" height="760" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="600.0" dy="0">一张支持 MIG 的物理 GPU</tspan></text><rect x="75" y="220" width="510" height="615" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="330.0" y="252" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="330.0" dy="0">GI A：对应资源分区</tspan></text><rect x="615" y="220" width="510" height="615" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="870.0" y="252" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="870.0" dy="0">GI B：对应资源分区</tspan></text><rect x="110" y="320" width="440" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="330.0" y="357" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="330.0" dy="0">GI A 显存 / 相关引擎</tspan></text><text x="330.0" y="394" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="330.0" dy="0">本 GI 的 CI 共享父资源</tspan></text><rect x="650" y="320" width="440" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="870.0" y="357" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="870.0" dy="0">GI B 显存 / 相关引擎</tspan></text><text x="870.0" y="394" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="870.0" dy="0">与 GI A 的边界不同</tspan></text><rect x="100" y="610" width="215" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="207.5" y="647" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="207.5" dy="0">CI A1</tspan></text><text x="207.5" y="684" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="207.5" dy="0">计算子集 1</tspan></text><rect x="345" y="610" width="215" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="452.5" y="647" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="452.5" dy="0">CI A2</tspan></text><text x="452.5" y="684" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="452.5" dy="0">计算子集 2</tspan></text><rect x="650" y="610" width="440" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="870.0" y="647" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="870.0" dy="0">CI B1</tspan></text><text x="870.0" y="684" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="870.0" dy="0">使用其父 GI 对应资源</tspan></text><path d="M330.0 435 L330.0 522.5 L207.5 522.5 L207.5 610" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M330.0 435 L330.0 522.5 L452.5 522.5 L452.5 610" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M870.0 435 L870.0 610" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="1015" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">CI A1/A2 不各复制一份 GI 显存；整卡、驱动和主机仍构成共同风险。</tspan></text></g></svg>