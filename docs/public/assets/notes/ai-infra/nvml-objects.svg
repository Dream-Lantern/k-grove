<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FBFF"/></linearGradient>
 <filter id="sh" x="-20%" y="-40%" width="150%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#153F75" flood-opacity=".10"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5679BC"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#10B981"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#EF4444"/></marker>
 </defs>
<rect x="0" y="0" width="1600" height="1010" rx="0" fill="url(#bg)"/>
<rect x="0" y="0" width="1600" height="11" rx="0" fill="#4F83ED"/>
<text x="65" y="78" font-family="Noto Sans CJK SC, sans-serif" font-size="44" font-weight="700" fill="#0F2350" text-anchor="start">26  ·  NVML：管理对象与设备视图不能混用</text>
<text x="68" y="123" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#58708D" text-anchor="start">UUID 是相对稳定的设备身份；index 只表示当前枚举顺序</text>
<path d="M65 148 L1535 148" fill="none" stroke="#DDE7F3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="469" y="188" width="657" height="111" rx="15" fill="#EEF6FF" stroke="#3B82F6" stroke-width="1.8"/>
<text x="491" y="226" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#1E40AF" text-anchor="start">Physical GPU handle</text>
<text x="491" y="260" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">设备状态查询、MIG 模式与关联对象枚举</text>
<path d="M797 300 V351 H409 V392" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M797 351 H1206 V392" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="85" y="402" width="670" height="386" rx="21" fill="#EEF6FF" stroke="#60A5FA" stroke-width="2"/>
<text x="118" y="453" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#1D4ED8" text-anchor="start">管理对象（Management）</text>
<rect x="117" y="483" width="602" height="128" rx="18" fill="#F4F0FF" stroke="#8B5CF6" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="163" cy="530" r="24" fill="#8B5CF6"/>
<text x="163" y="539" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
<text x="200" y="537" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#112A54" text-anchor="start">GPU Instance handle</text>
<text x="141" y="583" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">GI 信息、所属 CI 查询及管理</text>
<path d="M414 613 L414 639" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="117" y="649" width="602" height="126" rx="18" fill="#EEF6FF" stroke="#3B82F6" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="163" cy="696" r="24" fill="#3B82F6"/>
<text x="163" y="705" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
<text x="200" y="703" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#112A54" text-anchor="start">Compute Instance</text>
<text x="141" y="749" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">通过所属 GI 管理和查询</text>
<rect x="849" y="402" width="650" height="386" rx="21" fill="#F0FDF4" stroke="#34D399" stroke-width="2"/>
<text x="884" y="453" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#047857" text-anchor="start">设备视图（Device View）</text>
<rect x="880" y="490" width="586" height="200" rx="18" fill="#E9FBF4" stroke="#10B981" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="926" cy="537" r="24" fill="#10B981"/>
<text x="926" y="546" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
<text x="963" y="544" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#112A54" text-anchor="start">MIG Device handle</text>
<text x="904" y="590" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">通过设备枚举取得的 MIG 视图</text>
<text x="904" y="622" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">用于相应设备查询，不等于 GI / CI 管理句柄</text>
<rect x="267" y="815" width="1064" height="78" rx="15" fill="#FFF5E8" stroke="#F59E0B" stroke-width="1.8"/>
<text x="289" y="853" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#9A3412" text-anchor="start">重要区分</text>
<text x="289" y="887" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">不同 NVML API 接受不同 handle 类型，必须按版本和对象核对。</text>
<path d="M65 937 L1535 937" fill="none" stroke="#DFE7F2" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="972" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#6B7E99" text-anchor="start">同名 MIG 实例的资源管理 API 与设备指标查询 API，可能要求完全不同的句柄。</text>
</svg>