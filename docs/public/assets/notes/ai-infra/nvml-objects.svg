<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">NVML：查询对象不能混用</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">NVML：查询对象不能混用</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">UUID 是身份；索引只是当前枚举编号。</tspan></text><rect x="360" y="130" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">Physical GPU handle</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">设备查询与 MIG 状态</tspan></text><rect x="65" y="365" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="305.0" y="402" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="305.0" dy="0">GPU Instance handle</tspan></text><text x="305.0" y="439" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="305.0" dy="0">GI 信息、CI 枚举与创建</tspan></text><rect x="655" y="365" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="895.0" y="402" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="895.0" dy="0">MIG Device handle</tspan></text><text x="895.0" y="439" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="895.0" dy="0">通过设备枚举取得的 MIG 视图</tspan></text><rect x="65" y="650" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="305.0" y="687" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="305.0" dy="0">Compute Instance</tspan></text><text x="305.0" y="724" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="305.0" dy="0">通过所属 GI 查询，不用 GPU handle 替代</tspan></text><path d="M600.0 245 L600.0 305.0 L305.0 305.0 L305.0 365" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="295" y="305" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="295" dy="0">管理对象</tspan></text><path d="M600.0 245 L600.0 305.0 L895.0 305.0 L895.0 365" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="900" y="305" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="900" dy="0">设备视图</tspan></text><path d="M305.0 480 L305.0 650" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="875" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">MIG device 查询句柄不等于 GI/CI 管理句柄；接口按版本核对。</tspan></text></g></svg>