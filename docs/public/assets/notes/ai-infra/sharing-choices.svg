<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">GPU 共享：需求与机制</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">GPU 共享：需求与机制</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">先明确隔离目标，再比较吞吐。</tspan></text><rect x="360" y="130" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">共享需求</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">并发、资源边界、租户信任</tspan></text><rect x="65" y="365" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="305.0" y="402" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="305.0" dy="0">协作并发</tspan></text><text x="305.0" y="439" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="305.0" dy="0">Stream / MPS：提升复用机会</tspan></text><rect x="655" y="365" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="895.0" y="402" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="895.0" dy="0">明确设备分区</tspan></text><text x="895.0" y="439" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="895.0" dy="0">MIG：受支持硬件的资源实例</tspan></text><rect x="360" y="625" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="662" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">负载与故障验收</tspan></text><text x="600.0" y="699" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">公平性、尾延迟、配额、影响范围</tspan></text><path d="M600.0 245 L600.0 305.0 L305.0 305.0 L305.0 365" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="295" y="305" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="295" dy="0">协作任务</tspan></text><path d="M600.0 245 L600.0 305.0 L895.0 305.0 L895.0 365" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="900" y="305" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="900" dy="0">资源边界</tspan></text><path d="M305.0 480 L305.0 552.5 L600.0 552.5 L600.0 625" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M895.0 480 L895.0 552.5 L600.0 552.5 L600.0 625" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="825" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">vGPU 是另一虚拟化体系；部分路径可以组合，不能简单按快慢排序。</tspan></text></g></svg>