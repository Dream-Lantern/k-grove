<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1170" viewBox="0 0 1200 1170" role="img" aria-labelledby="title desc">
<title id="title">DCGM Exporter：两种部署拓扑</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">DCGM Exporter：两种部署拓扑</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">概念部署图；选择一种 hostengine 管理方式，避免无协调重复采集。</tspan></text><rect x="40" y="130" width="540" height="925" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="310.0" y="162" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="310.0" dy="0">模式 A：嵌入式 hostengine</tspan></text><rect x="620" y="130" width="540" height="925" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="890.0" y="162" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="890.0" dy="0">模式 B：连接已有 hostengine</tspan></text><rect x="90" y="215" width="440" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="310.0" y="252" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="310.0" dy="0">GPU / MIG 实体</tspan></text><text x="310.0" y="289" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="310.0" dy="0">按支持范围采集字段</tspan></text><rect x="90" y="425" width="440" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="310.0" y="462" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="310.0" dy="0">嵌入式 hostengine</tspan></text><text x="310.0" y="499" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="310.0" dy="0">随 exporter 部署管理</tspan></text><path d="M310.0 330 L310.0 425" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="635" width="440" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="310.0" y="672" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="310.0" dy="0">Exporter /metrics</tspan></text><text x="310.0" y="709" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="310.0" dy="0">内部采集连接</tspan></text><path d="M310.0 540 L310.0 635" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="845" width="440" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="310.0" y="882" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="310.0" dy="0">监控抓取</tspan></text><text x="310.0" y="919" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="310.0" dy="0">保留目标和设备身份</tspan></text><path d="M310.0 750 L310.0 845" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="670" y="215" width="440" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="890.0" y="252" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="890.0" dy="0">GPU / MIG 实体</tspan></text><text x="890.0" y="289" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="890.0" dy="0">按支持范围采集字段</tspan></text><rect x="670" y="425" width="440" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="890.0" y="462" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="890.0" dy="0">已有 hostengine</tspan></text><text x="890.0" y="499" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="890.0" dy="0">独立服务，记录版本与地址</tspan></text><path d="M890.0 330 L890.0 425" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="670" y="635" width="440" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="890.0" y="672" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="890.0" dy="0">Exporter /metrics</tspan></text><text x="890.0" y="709" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="890.0" dy="0">-r Host:Port；核对客户端兼容</tspan></text><path d="M890.0 540 L890.0 635" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="670" y="845" width="440" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="890.0" y="882" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="890.0" dy="0">监控抓取</tspan></text><text x="890.0" y="919" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="890.0" dy="0">保留目标和设备身份</tspan></text><path d="M890.0 750 L890.0 845" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="1145" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">箭头表示采集数据路径；localhost 在不同网络 namespace 中含义不同。</tspan></text></g></svg>