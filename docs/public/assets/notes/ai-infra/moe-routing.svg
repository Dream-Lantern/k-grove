<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
<title id="title">MoE：按 Token 路由至部分专家</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">MoE：按 Token 路由至部分专家</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">专家输出为向量，不预设正面/负面等语义角色。</tspan></text><rect x="360" y="125" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="162" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">隐藏向量 h</tspan></text><text x="600.0" y="199" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">某一 token 的层内表示</tspan></text><rect x="360" y="315" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="352" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">Router：示意 Top-2</tspan></text><text x="600.0" y="389" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">选择专家及相应权重</tspan></text><rect x="50" y="560" width="340" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="220.0" y="597" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="220.0" dy="0">专家 1</tspan></text><text x="220.0" y="634" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="220.0" dy="0">本次选中</tspan></text><rect x="430" y="560" width="340" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="597" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">专家 2</tspan></text><text x="600.0" y="634" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">本次未选中</tspan></text><rect x="810" y="560" width="340" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="980.0" y="597" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="980.0" dy="0">专家 3</tspan></text><text x="980.0" y="634" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="980.0" dy="0">本次选中</tspan></text><rect x="360" y="835" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="872" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">按实现汇聚输出</tspan></text><text x="600.0" y="909" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">示意：0.7 E1(h) + 0.3 E3(h)</tspan></text><path d="M600.0 240 L600.0 315" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 430 L600.0 495.0 L220.0 495.0 L220.0 560" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="255" y="510" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="255" dy="0">选择</tspan></text><path d="M600.0 430 L600.0 495.0 L980.0 495.0 L980.0 560" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="950" y="510" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="950" dy="0">选择</tspan></text><path d="M220.0 675 L220.0 755.0 L600.0 755.0 L600.0 835" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M980.0 675 L980.0 755.0 L600.0 755.0 L600.0 835" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="1025" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">权重归一化方式是示例假设；总参数与每 token 激活参数应分开。</tspan></text></g></svg>