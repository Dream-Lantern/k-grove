<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FBFF"/></linearGradient>
 <filter id="sh" x="-20%" y="-40%" width="150%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#153F75" flood-opacity=".10"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5679BC"/></marker>
 <marker id="arrG" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#10B981"/></marker>
 <marker id="arrR" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#EF4444"/></marker>
 </defs>
<rect x="0" y="0" width="1600" height="940" rx="0" fill="url(#bg)"/>
<rect x="0" y="0" width="1600" height="11" rx="0" fill="#4F83ED"/>
<text x="65" y="78" font-family="Noto Sans CJK SC, sans-serif" font-size="44" font-weight="700" fill="#0F2350" text-anchor="start">14  ·  CUDA Graph：定义、实例化、回放与更新</text>
<text x="68" y="123" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#58708D" text-anchor="start">Graph 描述工作依赖；GraphExec 是可提交执行的实例，二者并非同一对象</text>
<path d="M65 148 L1535 148" fill="none" stroke="#DDE7F3" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="65" y="225" width="445" height="210" rx="18" fill="#EEF6FF" stroke="#3B82F6" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="111" cy="272" r="24" fill="#3B82F6"/>
<text x="111" y="281" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="148" y="279" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#112A54" text-anchor="start">定义 Graph</text>
<text x="89" y="325" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">显式建图，或合法 Stream Capture</text>
<text x="89" y="357" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">形成节点与依赖关系</text>
<path d="M518 330 L579 330" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="585" y="225" width="445" height="210" rx="18" fill="#F4F0FF" stroke="#8B5CF6" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="631" cy="272" r="24" fill="#8B5CF6"/>
<text x="631" y="281" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="668" y="279" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#112A54" text-anchor="start">实例化 GraphExec</text>
<text x="609" y="325" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">验证约束、资源与依赖</text>
<text x="609" y="357" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">获得执行实例</text>
<path d="M1038 330 L1099 330" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1105" y="225" width="445" height="210" rx="18" fill="#E9FBF4" stroke="#10B981" stroke-width="2.0" filter="url(#sh)"/>
<circle cx="1151" cy="272" r="24" fill="#10B981"/>
<text x="1151" y="281" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1188" y="279" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#112A54" text-anchor="start">回放 Launch</text>
<text x="1129" y="325" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">向 CUDA 提交 GraphExec</text>
<text x="1129" y="357" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#4B6081" text-anchor="start">设备上执行实际工作</text>
<path d="M800 436 L800 502" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="495" y="505" width="610" height="90" rx="15" fill="#FFF5E8" stroke="#F59E0B" stroke-width="1.8"/>
<text x="517" y="543" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#9A3412" text-anchor="start">执行需求发生变化？</text>
<text x="517" y="577" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">无需变化：直接继续回放；需要变化：先判断兼容性。</text>
<path d="M800 596 L800 627" fill="none" stroke="#5679BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M800 627 H410 V649" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrG)"/>
<path d="M800 627 H1190 V649" fill="none" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrR)"/>
<rect x="100" y="655" width="630" height="125" rx="15" fill="#E9FBF4" stroke="#10B981" stroke-width="1.8"/>
<text x="122" y="693" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#047857" text-anchor="start">兼容更新</text>
<text x="122" y="727" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">调用合法的 GraphExec 更新路径</text>
<text x="122" y="754" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">更新实例，再次 Launch</text>
<rect x="870" y="655" width="630" height="125" rx="15" fill="#FFF0F1" stroke="#EF4444" stroke-width="1.8"/>
<text x="892" y="693" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#B91C1C" text-anchor="start">不兼容：重建</text>
<text x="892" y="727" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">修改 Graph 并重新实例化</text>
<text x="892" y="754" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#475569" text-anchor="start">检查新的资源生命周期</text>
<rect x="324" y="618" width="156" height="35" rx="17" fill="#E9FBF4" stroke="#10B981" stroke-width="1.2"/>
<text x="402.0" y="642" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#047857" text-anchor="middle">可兼容</text>
<rect x="1104" y="618" width="174" height="35" rx="17" fill="#FFF0F1" stroke="#EF4444" stroke-width="1.2"/>
<text x="1191.0" y="642" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="600" fill="#B91C1C" text-anchor="middle">不兼容</text>
<path d="M65 867 L1535 867" fill="none" stroke="#DFE7F2" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="902" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#6B7E99" text-anchor="start">注意：修改原始 Graph 不会自动修改已经实例化的 GraphExec。</text>
</svg>