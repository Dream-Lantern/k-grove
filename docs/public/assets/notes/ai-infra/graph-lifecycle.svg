<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">CUDA Graphs：构建、回放与更新</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">CUDA Graphs：构建、回放与更新</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">Graph 与 GraphExec 是不同对象。</tspan></text><rect x="360" y="130" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">定义 Graph</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">显式建图或合法 stream capture</tspan></text><rect x="360" y="330" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="367" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">实例化 GraphExec</tspan></text><text x="600.0" y="404" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">检查错误与资源生命周期</tspan></text><rect x="360" y="530" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="567" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">回放执行</tspan></text><text x="600.0" y="604" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">工作实际发生于设备</tspan></text><polygon points="600.0,730 840,797.5 600.0,865 360,797.5" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="785" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600"><tspan x="600.0" dy="0">变更兼容更新？</tspan></text><text x="600.0" y="813" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">在需要变更时检查约束</tspan></text><rect x="60" y="940" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="295.0" y="977" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="295.0" dy="0">支持更新</tspan></text><text x="295.0" y="1014" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="295.0" dy="0">更新执行实例后继续回放</tspan></text><rect x="670" y="940" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="905.0" y="977" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="905.0" dy="0">不支持更新</tspan></text><text x="905.0" y="1014" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="905.0" dy="0">按条件重建 / 重新实例化</tspan></text><path d="M600.0 245 L600.0 330" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 445 L600.0 530" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 645 L600.0 730" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 865 L600.0 902.5 L295.0 902.5 L295.0 940" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="285" y="910" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="285" dy="0">兼容</tspan></text><path d="M600.0 865 L600.0 902.5 L905.0 902.5 L905.0 940" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="915" y="910" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="915" dy="0">不兼容</tspan></text><text x="600" y="1095" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">无需变更可继续回放；修改原图不会自动更新已有执行实例。</tspan></text></g></svg>