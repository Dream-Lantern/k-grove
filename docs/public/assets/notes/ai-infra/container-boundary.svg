<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">GPU 容器：宿主与镜像边界</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">GPU 容器：宿主与镜像边界</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">不把整个宿主 CUDA Toolkit 自动复制进容器。</tspan></text><rect x="55" y="140" width="1090" height="300" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="600.0" y="172" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="600.0" dy="0">容器内：应用用户态</tspan></text><rect x="100" y="235" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="335.0" y="272" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="335.0" dy="0">应用 / 框架</tspan></text><text x="335.0" y="309" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="335.0" dy="0">模型、Python 包、加速库</tspan></text><rect x="630" y="235" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="865.0" y="272" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="865.0" dy="0">CUDA 用户态运行库</tspan></text><text x="865.0" y="309" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="865.0" dy="0">镜像按 base/runtime/devel 选择</tspan></text><rect x="55" y="560" width="1090" height="330" rx="10" fill="#F0F9FF" stroke="#0369A1" stroke-dasharray="8 5"/><text x="600.0" y="592" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="600.0" dy="0">宿主与运行时暴露</tspan></text><rect x="100" y="655" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="335.0" y="692" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="335.0" dy="0">NVIDIA Container Toolkit</tspan></text><text x="335.0" y="729" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="335.0" dy="0">选择设备与驱动能力</tspan></text><rect x="630" y="655" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="865.0" y="692" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="865.0" dy="0">宿主驱动与 GPU</tspan></text><text x="865.0" y="729" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="865.0" dy="0">内核驱动及相应用户态能力</tspan></text><path d="M570 292.5 L630 292.5" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M865.0 350 L865.0 655" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="920" y="520" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="920" dy="0">驱动调用</tspan></text><path d="M570 712.5 L630 712.5" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="685" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">配置暴露</tspan></text><text x="600" y="975" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">设备可见、驱动能力、Toolkit 版本是三个独立核对项。</tspan></text></g></svg>