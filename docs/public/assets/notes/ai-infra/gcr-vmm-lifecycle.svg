<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc">
<title id="title">VMM：保留地址语义，替换物理分配</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">VMM：保留地址语义，替换物理分配</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">区分 VA 预留、映射、物理对象引用；不是 cudaFree 后碰运气重分配。</tspan></text><rect x="240" y="130" width="720" height="125" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">正常分配</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">Reserve → Create → Map → SetAccess</tspan></text><rect x="240" y="330" width="720" height="125" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="367" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">Checkpoint：先完成数据保存</tspan></text><text x="600.0" y="404" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">GPU → staging → Host 快照</tspan></text><rect x="240" y="530" width="720" height="125" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="567" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">解除映射与释放引用</tspan></text><text x="600.0" y="604" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">Unmap + Release；不主动 AddressFree</tspan></text><rect x="240" y="730" width="720" height="125" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="767" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">驱动 checkpoint / restore</tspan></text><text x="600.0" y="804" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">保存并恢复 CUDA 控制状态与地址语义</tspan></text><rect x="240" y="930" width="720" height="125" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="967" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">重建数据面</tspan></text><text x="600.0" y="1004" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">Create 新物理分配 → 原 VA Map → SetAccess → 拷回</tspan></text><path d="M600.0 255 L600.0 330" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 455 L600.0 530" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 655 L600.0 730" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 855 L600.0 930" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="1195" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">真正回收需所有映射和共享引用释放；最终正常 free 才释放 VA 预留。</tspan></text></g></svg>