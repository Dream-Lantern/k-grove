<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">一次请求：Prefill 与循环 Decode</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">一次请求：Prefill 与循环 Decode</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">排队、计算与输出共同决定响应时间。</tspan></text><rect x="360" y="125" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="162" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">请求与调度</tspan></text><text x="600.0" y="199" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">队列、分词、资源检查</tspan></text><rect x="360" y="310" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="347" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">Prefill</tspan></text><text x="600.0" y="384" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">处理输入，建立相应 KV 状态</tspan></text><rect x="360" y="495" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="532" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">Decode 一步</tspan></text><text x="600.0" y="569" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">产生 token，推进缓存状态</tspan></text><polygon points="600.0,680 840,747.5 600.0,815 360,747.5" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="735" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600"><tspan x="600.0" dy="0">满足结束条件？</tspan></text><text x="600.0" y="763" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">EOS、长度或中止</tspan></text><rect x="360" y="925" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="962" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">完成并释放请求资源</tspan></text><text x="600.0" y="999" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">返回结果，按策略处理缓存</tspan></text><path d="M600.0 240 L600.0 310" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 425 L600.0 495" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 610 L600.0 680" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600.0 815 L600.0 925" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="660" y="880" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="660" dy="0">是</tspan></text><path d="M840 747 L1090 747 L1090 552 L840 552" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="1000" y="670" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="1000" dy="0">否：下一步</tspan></text><text x="600" y="1055" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">连续批处理会插入或移除请求；实际调度可能交错多个阶段。</tspan></text></g></svg>