<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
<title id="title">CUDA：逻辑组织与硬件映射</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">CUDA：逻辑组织与硬件映射</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">左侧是程序层次；右侧是资源约束。</tspan></text><rect x="70" y="140" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="310.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="310.0" dy="0">Grid</tspan></text><text x="310.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="310.0" dy="0">一次 kernel launch 的工作</tspan></text><rect x="70" y="355" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="310.0" y="392" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="310.0" dy="0">Block</tspan></text><text x="310.0" y="429" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="310.0" dy="0">普通 block 整体分配到一个 SM</tspan></text><rect x="70" y="570" width="480" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="310.0" y="607" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="310.0" dy="0">Warp / Thread</tspan></text><text x="310.0" y="644" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="310.0" dy="0">warp 含 32 个 CUDA 线程</tspan></text><rect x="660" y="355" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="895.0" y="392" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="895.0" dy="0">SM</tspan></text><text x="895.0" y="429" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="895.0" dy="0">可以容纳多个常驻 block</tspan></text><rect x="660" y="570" width="470" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="895.0" y="607" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="895.0" dy="0">驻留约束</tspan></text><text x="895.0" y="644" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="895.0" dy="0">寄存器、shared memory、上限</tspan></text><path d="M310.0 255 L310.0 355" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="310" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="360" dy="0">包含</tspan></text><path d="M310.0 470 L310.0 570" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="525" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="360" dy="0">包含</tspan></text><path d="M550 412.5 L660 412.5" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="605" y="395" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="605" dy="0">分配</tspan></text><path d="M895.0 470 L895.0 570" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600" y="925" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">分配顺序不可假定；cluster 等扩展能力须单独核对。</tspan></text></g></svg>