<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#2563EB" height="8" rx="4" stroke="none" stroke-width="2" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="40" font-weight="bold" x="69" y="98">Service：控制规则更新与业务转发是两条路径</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">Linux iptables 模式示例；kube-proxy 配置转发规则，不逐个处理业务 HTTP 请求</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="88">33 / 38</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="166" y2="166" /><rect fill="#F2EFFF" height="40" rx="20.0" stroke="none" stroke-width="2" width="185" x="74" y="198" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="166.5" y="226.4">① 控制路径</text><rect fill="#FFFFFF" height="143" rx="20" stroke="#D8E4F2" stroke-width="2" width="419" x="73" y="251" /><rect fill="#2563EB" height="143" rx="4" stroke="none" stroke-width="2" width="7" x="73" y="251" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="103" y="301">API Server</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="103" y="341">保存 Service / EndpointSlice 等期望与端点</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="103" y="369">状态。</text><rect fill="#FFFFFF" height="143" rx="20" stroke="#D8E4F2" stroke-width="2" width="400" x="603" y="251" /><rect fill="#7654E8" height="143" rx="4" stroke="none" stroke-width="2" width="7" x="603" y="251" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="633" y="301">kube-proxy</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="633" y="341">观察对象变化，协调节点上的规则。</text><rect fill="#FFFFFF" height="143" rx="20" stroke="#D8E4F2" stroke-width="2" width="407" x="1115" y="251" /><rect fill="#12946B" height="143" rx="4" stroke="none" stroke-width="2" width="7" x="1115" y="251" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="1145" y="301">内核转发规则</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="1145" y="341">iptables 规则被更新；同步可存在延迟。</text><line stroke="#7654E8" stroke-width="3.5" x1="493" x2="595" y1="322" y2="322" /><polygon fill="#7654E8" points="595,322 585.3465918192059,327.2736809246462 585.3465918192059,316.7263190753538" /><line stroke="#12946B" stroke-width="3.5" x1="1006" x2="1107" y1="322" y2="322" /><polygon fill="#12946B" points="1107,322 1097.346591819206,327.2736809246462 1097.346591819206,316.7263190753538" /><rect fill="#EBF4FF" height="40" rx="20.0" stroke="none" stroke-width="2" width="185" x="74" y="452" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="166.5" y="480.4">② 数据路径</text><rect fill="#FFFFFF" height="147" rx="20" stroke="#D8E4F2" stroke-width="2" width="412" x="75" y="525" /><rect fill="#2563EB" height="147" rx="4" stroke="none" stroke-width="2" width="7" x="75" y="525" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="105" y="575">客户端</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="105" y="615">连接 Service IP : Port</text><rect fill="#FFFFFF" height="147" rx="20" stroke="#D8E4F2" stroke-width="2" width="410" x="600" y="525" /><rect fill="#12946B" height="147" rx="4" stroke="none" stroke-width="2" width="7" x="600" y="525" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="630" y="575">节点内核数据平面</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="630" y="615">利用规则选择后端 / 转换目标。</text><rect fill="#FFFFFF" height="147" rx="20" stroke="#D8E4F2" stroke-width="2" width="405" x="1119" y="525" /><rect fill="#D98419" height="147" rx="4" stroke="none" stroke-width="2" width="7" x="1119" y="525" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="1149" y="575">后端 Pod</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="1149" y="615">经 Pod 网络送到应用监听端口。</text><line stroke="#2563EB" stroke-width="3.5" x1="489" x2="592" y1="597" y2="597" /><polygon fill="#2563EB" points="592,597 582.3465918192059,602.2736809246462 582.3465918192059,591.7263190753538" /><line stroke="#12946B" stroke-width="3.5" x1="1012" x2="1111" y1="597" y2="597" /><polygon fill="#12946B" points="1111,597 1101.346591819206,602.2736809246462 1101.346591819206,591.7263190753538" /><path d="M 1323,395 V 477 H 803 V 516" fill="none" stroke="#7654E8" stroke-dasharray="9 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" /><rect fill="#F2EFFF" height="38" rx="19.0" stroke="none" stroke-width="2" width="335" x="975" y="444" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="1142.5" y="470.98">规则影响后续数据转发</text><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#EBF4FF" r="20" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">其他 Service 实现可能使用 IPVS、eBPF 等不同数据平面；已有连接和终止端点需独立分析。</text></svg>