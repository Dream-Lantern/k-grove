<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Pod 绑定之后：节点侧准备、运行与持续反馈</title>
  <desc id="desc">以已绑定 Node A 的 web-demo Pod 为例，kubelet 观察配置，协调卷与配置准备，通过 CRI 请求 Sandbox 和适用的 CNI 网络准备，再推进镜像和业务容器启动。探针、退出观察和 API 状态上报持续进行。箭头表示教学逻辑关联，准备、重试和状态上报可以交错，不是固定同步调用链。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#128365"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #183153; }
      .title { font-size: 25px; font-weight: 700; }
      .body { font-size: 20px; fill: #526780; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #128365; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#feedback); }
    </style>
  </defs>
  <rect width="1500" height="820" fill="#f8fafe"/>
  <rect x="20" y="24" width="1460" height="772" rx="24" fill="white" stroke="#d8e4f2" stroke-width="2"/>
  <text x="60" y="85" font-size="34" font-weight="700">Pod 已绑定，节点侧仍需准备、运行和持续观察</text>
  <text class="body" x="60" y="130">教学案例：web-demo 中的一个 Pod 已分配到 Node A；绑定成功不等于业务容器已启动</text>
  <path d="M60 155 H1440" stroke="#d8e4f2" stroke-width="2"/>

  <rect x="60" y="210" width="420" height="150" rx="16" fill="#edf4ff" stroke="#b7d3fa" stroke-width="2"/>
  <text class="title" x="86" y="253">1  kubelet 观察本节点 Pod</text>
  <text class="body" x="86" y="295">读取配置与当前状态</text>
  <text class="body" x="86" y="328">不是 API Server 同步下发启动脚本</text>
  <rect x="540" y="210" width="420" height="150" rx="16" fill="#edf4ff" stroke="#b7d3fa" stroke-width="2"/>
  <text class="title" x="566" y="253">2  卷、配置与运行前提</text>
  <text class="body" x="566" y="295">协调必要的准备与挂载</text>
  <text class="body" x="566" y="328">条件不满足时观察错误并重试</text>
  <rect x="1020" y="210" width="420" height="150" rx="16" fill="#f3efff" stroke="#d4c7f4" stroke-width="2"/>
  <text class="title" x="1046" y="253">3  CRI / Sandbox / 网络</text>
  <text class="body" x="1046" y="295">运行时准备 Pod 级运行环境</text>
  <text class="body" x="1046" y="328">适用集成通过 CNI 配置网络</text>

  <rect x="1020" y="470" width="420" height="150" rx="16" fill="#f3efff" stroke="#d4c7f4" stroke-width="2"/>
  <text class="title" x="1046" y="513">4  镜像与业务容器</text>
  <text class="body" x="1046" y="555">按策略准备镜像，创建并启动容器</text>
  <text class="body" x="1046" y="588">Sandbox 不是运行 Web 的业务容器</text>
  <rect x="540" y="470" width="420" height="150" rx="16" fill="#ebf8f2" stroke="#b9dfce" stroke-width="2"/>
  <text class="title" x="566" y="513">5  健康检查与退出观察</text>
  <text class="body" x="566" y="555">按配置执行探针、处理重启</text>
  <text class="body" x="566" y="588">Running 不等于 Ready</text>
  <rect x="60" y="470" width="420" height="150" rx="16" fill="#ebf8f2" stroke="#b9dfce" stroke-width="2"/>
  <text class="title" x="86" y="513">6  更新 API 中的 Pod 状态</text>
  <text class="body" x="86" y="555">用户与其他组件观察节点进展</text>
  <text class="body" x="86" y="588">准备失败与重试期间也可以上报</text>

  <path class="flow" d="M480 285 H540"/>
  <path class="flow" d="M960 285 H1020"/>
  <path class="flow" d="M1230 360 V470"/>
  <path class="flow" d="M1020 545 H960"/>
  <path class="flow" d="M540 545 H480"/>
  <path class="loop" d="M60 545 H36 V180 H270 V210"/>
  <text class="body" x="60" y="677">蓝线表示逻辑关联，绿线表示持续反馈；准备、状态上报与重试可以交错，编号不是完整源码时序。</text>
  <rect x="60" y="705" width="1380" height="54" rx="12" fill="#f3f6fb"/>
  <text class="body" x="82" y="739">镜像、卷和网络可能分别阻塞进展。CNI 用于创建期配置，业务流量之后沿已建立的数据路径传输。</text>
</svg>
