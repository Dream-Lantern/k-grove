<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">失败后的重新评估与退避</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">失败后的重新评估与退避</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">队列是概念示意，不承诺每个版本都采用相同字段或固定转移路线。</tspan></text><rect x="40" y="160" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="190.0" y="197" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="190.0" dy="0">Active</tspan></text><text x="190.0" y="234" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="190.0" dy="0">可被取出进行调度尝试</tspan></text><rect x="410" y="160" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="197" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">本轮调度</tspan></text><text x="560.0" y="234" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">筛选、评分及后续处理</tspan></text><rect x="780" y="160" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="930.0" y="197" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="930.0" dy="0">推进绑定</tspan></text><text x="930.0" y="234" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="930.0" dy="0">仍不等于应用就绪</tspan></text><rect x="410" y="440" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="477" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">Unschedulable</tspan></text><text x="560.0" y="514" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">暂存需要重新评估的对象</tspan></text><rect x="40" y="650" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="190.0" y="687" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="190.0" dy="0">Backoff</tspan></text><text x="190.0" y="724" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="190.0" dy="0">延后重试，避免高频空转</tspan></text><path d="M340 215 L410 215" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 215 L780 215" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 270 L560 440" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="345" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560" dy="0">条件不满足的示意分支</tspan></text><path d="M410 495 L190 495 L190 270" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="210" y="400" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="210" dy="0">重新评估且可尝试</tspan></text><path d="M560 550 L560 705 L340 705" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="665" y="625" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="665" dy="0">仍需退避</tspan></text><path d="M40 705 L15 705 L15 215 L40 215" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="770" y="710" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="770" dy="0">事件、计时及实现中的特殊插入路径</tspan><tspan x="770" dy="29">共同决定重新入队；不保证最终必然成功。</tspan></text><text x="560.0" y="812" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">有退避上限的示例不能继续无限翻倍；本文未声称某组数值是所有版本默认。</tspan></text></g></svg>