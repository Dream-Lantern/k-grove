<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600">
  <defs/>
  <rect fill="#F9FBFE" height="900" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1600" x="0" y="0"/>
  <rect fill="#FFFFFF" height="856" rx="24" ry="24" stroke="#CFDEEF" stroke-width="1.5" width="1540" x="30" y="22"/>
  <rect fill="#2F6FDB" height="7" rx="2" ry="2" stroke="none" stroke-width="1.5" width="1540" x="30" y="22"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="40" font-weight="bold" x="72" y="93">Scheduler：失败之后如何再次尝试</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="76" y="137">Unschedulable、Backoff、Active 是条件化的处理位置，而非固定单一路线</text>
  <polyline fill="none" points="72,165 1528,165" stroke="#CFDEEF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
  <rect fill="#FFFFFF" height="122" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="1120" x="240" y="211"/>
  <rect fill="#2F6FDB" height="122" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="240" y="211"/>
  <rect fill="#EEF5FF" height="45" rx="12" ry="12" stroke="none" stroke-width="1.5" width="52" x="262" y="231"/>
  <text fill="#2F6FDB" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" text-anchor="middle" x="288" y="262">1</text>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" x="328" y="255">Pod 暂未成功调度</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="328" y="292">根据失败原因、队列事件与退避状态决定后续动作</text>
  <polyline fill="none" points="800,333 800,390" stroke="#2F6FDB" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polyline fill="none" points="323.5,390 1285.5,390" stroke="#8996A8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/>
  <polyline fill="none" points="323.5,390 323.5,412" stroke="#118E6B" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polygon fill="#118E6B" points="323.5,412 328.5,401.0 318.5,401.0"/>
  <rect fill="#FFFFFF" height="252" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="467" x="90" y="418"/>
  <rect fill="#118E6B" height="252" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="90" y="418"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="114" y="462">相关事件激活</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="114" y="499">条件满足时可重新进入 Active</text>
  <polyline fill="none" points="804.5,390 804.5,412" stroke="#C88323" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polygon fill="#C88323" points="804.5,412 809.5,401.0 799.5,401.0"/>
  <rect fill="#FFFFFF" height="252" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="467" x="571" y="418"/>
  <rect fill="#C88323" height="252" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="571" y="418"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="595" y="462">退避尚未结束</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="595" y="499">可进入或停留 Backoff</text>
  <polyline fill="none" points="1285.5,390 1285.5,412" stroke="#CB4656" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polygon fill="#CB4656" points="1285.5,412 1290.5,401.0 1280.5,401.0"/>
  <rect fill="#FFFFFF" height="252" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="467" x="1052" y="418"/>
  <rect fill="#CB4656" height="252" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="1052" y="418"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="1076" y="462">条件仍不满足</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="1076" y="499">保持不可调度状态，等待再激活</text>
  <rect fill="#FFF5E7" height="121" rx="18" ry="18" stroke="none" stroke-width="1.5" width="1452" x="74" y="730"/>
  <text fill="#C88323" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" x="99" y="765">关键边界</text>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="99" y="801">这是一组可能的转移，不是 Unschedulable → Backoff → Active 的固定必经顺序。</text>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="99" y="831">调度队列行为与目标 Kubernetes 版本、启用插件及事件条件有关。</text>
</svg>
