<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">工作负载管理：Deployment → ReplicaSet → Pod</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">一个教学时刻：旧 ReplicaSet 目标 0，新 ReplicaSet 目标 3。</tspan></text><rect x="360" y="135" width="400" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="172" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">Deployment</tspan></text><text x="560.0" y="209" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">管理模板与发布</tspan></text><rect x="45" y="360" width="470" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="280.0" y="397" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="280.0" dy="0">旧 ReplicaSet</tspan></text><text x="280.0" y="434" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="280.0" dy="0">目标 0；历史对象可能仍保留</tspan></text><rect x="605" y="360" width="470" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="840.0" y="397" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="840.0" dy="0">新 ReplicaSet</tspan></text><text x="840.0" y="434" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="840.0" dy="0">目标 3；协调匹配 Pod 数量</tspan></text><path d="M460 245 L460 300 L280 300 L280 360" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M660 245 L660 300 L840 300 L840 360" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="610" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="190.0" y="647" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="190.0" dy="0">Pod 1</tspan></text><text x="190.0" y="684" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="190.0" dy="0">一个运行实例的规格</tspan></text><path d="M840 470 L840 540 L190 540 L190 610" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="410" y="610" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="647" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">Pod 2</tspan></text><text x="560.0" y="684" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">一个运行实例的规格</tspan></text><path d="M840 470 L840 540 L560 540 L560 610" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="780" y="610" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="930.0" y="647" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="930.0" dy="0">Pod 3</tspan></text><text x="930.0" y="684" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="930.0" dy="0">一个运行实例的规格</tspan></text><path d="M840 470 L840 540 L930 540 L930 610" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560.0" y="782" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">箭头为管理关系；Pod 数量、Ready 数量和更新过程中的可用性不是同一指标。</tspan></text></g></svg>