<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">etcd 的边界：API 状态不是业务文件</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">etcd 的边界：API 状态不是业务文件</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">按数据类别划分路径；只保留本章所需关系，不是完整网络拓扑。</tspan></text><rect x="40" y="190" width="290" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="185.0" y="227" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="185.0" dy="0">客户端 / 控制组件</tspan></text><text x="185.0" y="264" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="185.0" dy="0">按权限访问 API 状态</tspan></text><rect x="415" y="190" width="290" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="227" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">API Server</tspan></text><text x="560.0" y="264" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">处理对象访问</tspan></text><rect x="790" y="190" width="290" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="935.0" y="227" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="935.0" dy="0">etcd</tspan></text><text x="935.0" y="264" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="935.0" dy="0">保存集群对象状态</tspan></text><path d="M330 245 L415 245" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 245 L790 245" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="150" y="470" width="330" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="315.0" y="507" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="315.0" dy="0">应用 Pod</tspan></text><text x="315.0" y="544" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="315.0" dy="0">数据库、上传文件等业务数据</tspan></text><rect x="640" y="470" width="330" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="805.0" y="507" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="805.0" dy="0">卷 / 存储后端</tspan></text><text x="805.0" y="544" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="805.0" dy="0">由应用与存储方案管理</tspan></text><path d="M480 525 L640 525" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560.0" y="722" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">etcd 快照不自动包含业务卷；诊断和恢复工具的受控直连路径省略。</tspan></text></g></svg>