<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#2563EB" height="8" rx="4" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="45" font-weight="bold" x="70" y="96">etcd 保存集群对象状态，不保存应用业务文件</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">两条独立路径：Kubernetes API 对象 vs 应用存储的数据</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="88">18 / 20</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="166" y2="166" /><rect fill="#EBF4FF" height="44" rx="22.0" stroke="none" stroke-width="2" width="241" x="88" y="204" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="208.5" y="235.24">控制面：API 状态</text><rect fill="#FFFFFF" height="145" rx="20" stroke="#D8E4F2" stroke-width="2" width="392" x="100" y="284" /><rect fill="#2563EB" height="145" rx="4" stroke="none" stroke-width="2" width="7" x="100" y="284" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="130" y="334">客户端 / 控制器</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="130" y="374">通过 Kubernetes API 访问对象</text><rect fill="#FFFFFF" height="145" rx="20" stroke="#D8E4F2" stroke-width="2" width="392" x="595" y="284" /><rect fill="#7654E8" height="145" rx="4" stroke="none" stroke-width="2" width="7" x="595" y="284" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="625" y="334">API Server</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="625" y="374">权限、对象处理和访问边界</text><rect fill="#FFFFFF" height="145" rx="20" stroke="#D8E4F2" stroke-width="2" width="392" x="1110" y="284" /><rect fill="#12946B" height="145" rx="4" stroke="none" stroke-width="2" width="7" x="1110" y="284" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="1140" y="334">etcd</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="1140" y="374">持久保存集群对象状态</text><line stroke="#2563EB" stroke-width="4" x1="496" x2="590" y1="357" y2="357" /><polygon fill="#2563EB" points="590,357 580.3465918192059,362.2736809246462 580.3465918192059,351.7263190753538" /><line stroke="#12946B" stroke-width="4" x1="992" x2="1105" y1="357" y2="357" /><polygon fill="#12946B" points="1105,357 1095.346591819206,362.2736809246462 1095.346591819206,351.7263190753538" /><rect fill="#FFF5E7" height="44" rx="22.0" stroke="none" stroke-width="2" width="241" x="88" y="481" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="208.5" y="512.24">业务面：应用数据</text><rect fill="#FFFFFF" height="146" rx="20" stroke="#D8E4F2" stroke-width="2" width="623" x="100" y="556" /><rect fill="#D98419" height="146" rx="4" stroke="none" stroke-width="2" width="7" x="100" y="556" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="130" y="606">应用 Pod</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" x="130" y="646">数据库表、上传文件及业务负载的数据。</text><rect fill="#FFFFFF" height="146" rx="20" stroke="#D8E4F2" stroke-width="2" width="616" x="886" y="556" /><rect fill="#D98419" height="146" rx="4" stroke="none" stroke-width="2" width="7" x="886" y="556" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="916" y="606">卷 / 存储后端</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" x="916" y="646">数据路径与生命周期由应用和存储方案管理。</text><line stroke="#D98419" stroke-width="4" x1="726" x2="881" y1="627" y2="627" /><polygon fill="#D98419" points="881,627 871.3465918192059,632.2736809246462 871.3465918192059,621.7263190753538" /><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#EBF4FF" r="20" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">etcd 快照不自动备份业务卷；受控的管理员维护与恢复工具可能直连 etcd，不属于普通应用路径。</text></svg>