<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#2563EB" height="8" rx="4" stroke="none" stroke-width="2" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="40" font-weight="bold" x="69" y="98">持久卷：Pod → PVC → PV → 后端存储</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">PVC Bound 只代表卷绑定条件成立，不代表 Pod 已挂载成功或应用一定可写</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="88">36 / 38</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="166" y2="166" /><rect fill="#FFFFFF" height="190" rx="20" stroke="#D8E4F2" stroke-width="2" width="343" x="60" y="238" /><rect fill="#2563EB" height="190" rx="4" stroke="none" stroke-width="2" width="7" x="60" y="238" /><rect fill="#EBF4FF" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="82" y="261" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="107" y="295">1</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" x="150" y="288">Pod</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="150" y="328">通过 claimName 引用同</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="150" y="357">命名空间 PVC。</text><line stroke="#2563EB" stroke-width="3" x1="404" x2="438" y1="336" y2="336" /><polygon fill="#2563EB" points="438,336 428.3465918192059,341.2736809246462 428.3465918192059,330.7263190753538" /><rect fill="#FFFFFF" height="190" rx="20" stroke="#D8E4F2" stroke-width="2" width="343" x="440" y="238" /><rect fill="#7654E8" height="190" rx="4" stroke="none" stroke-width="2" width="7" x="440" y="238" /><rect fill="#F2EFFF" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="462" y="261" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="487" y="295">2</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" x="530" y="288">PVC</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="530" y="328">声明容量、访问模式和存</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="530" y="357">储类别。</text><line stroke="#2563EB" stroke-width="3" x1="784" x2="818" y1="336" y2="336" /><polygon fill="#2563EB" points="818,336 808.3465918192059,341.2736809246462 808.3465918192059,330.7263190753538" /><rect fill="#FFFFFF" height="190" rx="20" stroke="#D8E4F2" stroke-width="2" width="343" x="820" y="238" /><rect fill="#12946B" height="190" rx="4" stroke="none" stroke-width="2" width="7" x="820" y="238" /><rect fill="#E8F9F2" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="842" y="261" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="867" y="295">3</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" x="910" y="288">PV</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="910" y="328">集群级卷对象，指向实际</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="910" y="357">存储。</text><line stroke="#2563EB" stroke-width="3" x1="1164" x2="1198" y1="336" y2="336" /><polygon fill="#2563EB" points="1198,336 1188.346591819206,341.2736809246462 1188.346591819206,330.7263190753538" /><rect fill="#FFFFFF" height="190" rx="20" stroke="#D8E4F2" stroke-width="2" width="343" x="1200" y="238" /><rect fill="#D98419" height="190" rx="4" stroke="none" stroke-width="2" width="7" x="1200" y="238" /><rect fill="#FFF5E7" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="1222" y="261" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="1247" y="295">4</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" x="1290" y="288">后端存储</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="1290" y="328">CSI / NFS 等具体实现与权</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="1290" y="357">限。</text><rect fill="#FFFFFF" height="125" rx="20" stroke="#D8E4F2" stroke-width="2" width="700" x="450" y="514" /><rect fill="#2563EB" height="125" rx="4" stroke="none" stroke-width="2" width="7" x="450" y="514" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="480" y="564">StorageClass / Provisioner</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="480" y="604">动态供应策略；不是 StorageClass 自己创建磁盘。</text><path d="M 632,516 V 460 H 798 V 435" fill="none" stroke="#2563EB" stroke-dasharray="9 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><rect fill="#F2EFFF" height="86" rx="17" stroke="#DCD5F8" stroke-width="2" width="706" x="81" y="680" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="103" y="715">静态绑定 / 等待首个消费者</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="103" y="756">可使用静态 PV；WaitForFirstConsumer 还需要与调度协同。</text><rect fill="#FFF5E7" height="86" rx="17" stroke="#F5DEB9" stroke-width="2" width="704" x="814" y="680" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="836" y="715">删除与回收</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="836" y="756">Retain / Delete 影响后端数据，先验证备份与访问权限。</text><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#EBF4FF" r="20" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">StorageClass 只是供应和绑定策略配置；存储驱动不等同于 CRI 容器运行时接口。</text></svg>