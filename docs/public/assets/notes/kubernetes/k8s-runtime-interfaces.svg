<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">运行时接口：不要把 CRI、OCI 和 CNI 混为一谈</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">运行时接口：不要把 CRI、OCI 和 CNI 混为一谈</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">以 Linux 上 containerd 1.7 系列的常见集成为例；不是严格源码时序。</tspan></text><rect x="60" y="140" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="270.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="270.0" dy="0">kubelet</tspan></text><text x="270.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="270.0" dy="0">以 CRI 请求管理 Pod 与容器</tspan></text><rect x="640" y="140" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="850.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="850.0" dy="0">containerd CRI 插件</tspan></text><text x="850.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="850.0" dy="0">把 CRI 请求交给运行时内部机制</tspan></text><path d="M480 195 L640 195" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="640" y="390" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="850.0" y="427" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="850.0" dy="0">CNI 集成</tspan></text><text x="850.0" y="464" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="850.0" dy="0">配置 Pod 网络连接</tspan></text><rect x="60" y="390" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="270.0" y="427" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="270.0" dy="0">OCI 运行时与 shim</tspan></text><text x="270.0" y="464" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="270.0" dy="0">容器进程启动及运行管理的分工</tspan></text><path d="M850 250 L850 390" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 250 L700 320 L270 320 L270 390" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="640" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="270.0" y="677" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="270.0" dy="0">应用容器进程</tspan></text><text x="270.0" y="714" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="270.0" dy="0">共享主机内核；不是独立虚拟机</tspan></text><path d="M270 500 L270 640" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="640" y="640" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="850.0" y="677" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="850.0" dy="0">镜像与快照管理</tspan></text><text x="850.0" y="714" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="850.0" dy="0">获取内容，准备容器根文件系统</tspan></text><path d="M1060 195 L1090 195 L1090 695 L1060 695" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560.0" y="812" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">CRI 是调用接口，OCI 是相关规范，CNI 是网络集成接口；具体实现可不同。</tspan></text></g></svg>