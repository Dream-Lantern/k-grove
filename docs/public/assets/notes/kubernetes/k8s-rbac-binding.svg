<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#7654E8" height="8" rx="4" stroke="none" stroke-width="2" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="42" font-weight="bold" x="69" y="98">RBAC：主体、权限规则和绑定范围</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">身份认证解决“是谁”；RBAC 结合角色规则与绑定决定是否准许实际操作</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="87">27 / 38</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="165" y2="165" /><rect fill="#FFFFFF" height="146" rx="20" stroke="#D8E4F2" stroke-width="2" width="431" x="85" y="216" /><rect fill="#2563EB" height="146" rx="4" stroke="none" stroke-width="2" width="7" x="85" y="216" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" x="115" y="266">主体 Subjects</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="23" font-weight="normal" x="115" y="306">User / Group / ServiceAccount</text><rect fill="#FFFFFF" height="146" rx="20" stroke="#D8E4F2" stroke-width="2" width="428" x="585" y="216" /><rect fill="#7654E8" height="146" rx="4" stroke="none" stroke-width="2" width="7" x="585" y="216" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" x="615" y="266">绑定 Binding</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="615" y="306">RoleBinding 或 ClusterRoleBinding</text><rect fill="#FFFFFF" height="146" rx="20" stroke="#D8E4F2" stroke-width="2" width="438" x="1081" y="216" /><rect fill="#12946B" height="146" rx="4" stroke="none" stroke-width="2" width="7" x="1081" y="216" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="1111" y="266">规则 Role / ClusterRole</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="1111" y="306">API Group、资源、动作等权限</text><line stroke="#7654E8" stroke-width="4" x1="519" x2="579" y1="289" y2="289" /><polygon fill="#7654E8" points="579,289 569.3465918192059,294.2736809246462 569.3465918192059,283.7263190753538" /><line stroke="#7654E8" stroke-width="4" x1="1018" x2="1076" y1="289" y2="289" /><polygon fill="#7654E8" points="1076,289 1066.346591819206,294.2736809246462 1066.346591819206,283.7263190753538" /><rect fill="#EBF4FF" height="163" rx="17" stroke="#CFDFF5" stroke-width="2" width="669" x="101" y="435" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="122" y="469">RoleBinding：命名空间范围</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="122" y="504">可引用 Role 或 ClusterRole；引用 ClusterRole 不自动变成集群级授权。</text><rect fill="#E8F9F2" height="163" rx="17" stroke="#C1EADA" stroke-width="2" width="669" x="830" y="435" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="851" y="469">ClusterRoleBinding：集群范围</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="851" y="504">在适用资源范围授予 ClusterRole 规则；实际请求还需与规则匹配。</text><rect fill="#FFFFFF" height="100" rx="20" stroke="#D8E4F2" stroke-width="2" width="886" x="357" y="644" /><rect fill="#D98419" height="100" rx="4" stroke="none" stroke-width="2" width="7" x="357" y="644" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="387" y="694">请求判定</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="387" y="734">按照主体、动词、资源、命名空间、子资源等条件匹配。</text><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#F2EFFF" r="20" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">RBAC 规则以允许为主并可叠加；新增“空角色”不能抵消已经授予的管理员权限。</text></svg>