<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#2563EB" height="8" rx="4" stroke="none" stroke-width="2" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="42" font-weight="bold" x="69" y="98">Kubernetes：控制平面与工作节点职责地图</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">图中仅表示组件归属与主要协作，不代表节点数、HA 架构或固定请求调用顺序</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="87">24 / 38</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="165" y2="165" /><rect fill="#EBF4FF" height="506" rx="22" stroke="#C9DFFB" stroke-width="2" width="711" x="67" y="217" /><rect fill="#E8F9F2" height="506" rx="22" stroke="#C0E9D8" stroke-width="2" width="711" x="824" y="217" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="31" font-weight="bold" x="96" y="261">控制平面 · Control Plane</text><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="31" font-weight="bold" x="851" y="261">工作节点 · Worker Node</text><rect fill="#FFFFFF" height="88" rx="20" stroke="#D8E4F2" stroke-width="2" width="645" x="97" y="292" /><rect fill="#2563EB" height="88" rx="4" stroke="none" stroke-width="2" width="7" x="97" y="292" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" x="127" y="330">kube-apiserver</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" x="127" y="366">资源访问与集群状态入口</text><rect fill="#FFFFFF" height="115" rx="20" stroke="#D8E4F2" stroke-width="2" width="306" x="97" y="397" /><rect fill="#7654E8" height="115" rx="4" stroke="none" stroke-width="2" width="7" x="97" y="397" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" x="127" y="447">controller-manager</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" x="127" y="487">协调对象期望与实际状态</text><rect fill="#FFFFFF" height="115" rx="20" stroke="#D8E4F2" stroke-width="2" width="313" x="429" y="397" /><rect fill="#7654E8" height="115" rx="4" stroke="none" stroke-width="2" width="7" x="429" y="397" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="459" y="447">kube-scheduler</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" x="459" y="487">为待调度 Pod 选择节点</text><rect fill="#FFFFFF" height="116" rx="20" stroke="#D8E4F2" stroke-width="2" width="305" x="97" y="538" /><rect fill="#D98419" height="116" rx="4" stroke="none" stroke-width="2" width="7" x="97" y="538" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="127" y="588">etcd</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" x="127" y="628">持久化 API 对象状态</text><rect fill="#FFFFFF" height="116" rx="20" stroke="#D8E4F2" stroke-width="2" width="313" x="429" y="538" /><rect fill="#2563EB" height="116" rx="4" stroke="none" stroke-width="2" width="7" x="429" y="538" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="20" font-weight="bold" x="459" y="588">cloud-controller-manager</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="459" y="628">云集成，可选组件</text><rect fill="#FFFFFF" height="95" rx="20" stroke="#D8E4F2" stroke-width="2" width="645" x="855" y="292" /><rect fill="#12946B" height="95" rx="4" stroke="none" stroke-width="2" width="7" x="855" y="292" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="885" y="342">kubelet</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="885" y="382">本节点 Pod 运行与状态</text><rect fill="#FFFFFF" height="111" rx="20" stroke="#D8E4F2" stroke-width="2" width="311" x="855" y="405" /><rect fill="#2563EB" height="111" rx="4" stroke="none" stroke-width="2" width="7" x="855" y="405" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" x="885" y="455">容器运行时 / CRI</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" x="885" y="495">containerd、CRI-O 等</text><rect fill="#FFFFFF" height="111" rx="20" stroke="#D8E4F2" stroke-width="2" width="309" x="1191" y="405" /><rect fill="#2563EB" height="111" rx="4" stroke="none" stroke-width="2" width="7" x="1191" y="405" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" x="1221" y="455">网络数据平面</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" x="1221" y="495">kube-proxy 或其他实现</text><rect fill="#FFFFFF" height="108" rx="20" stroke="#D8E4F2" stroke-width="2" width="311" x="855" y="547" /><rect fill="#7654E8" height="108" rx="4" stroke="none" stroke-width="2" width="7" x="855" y="547" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" x="885" y="597">Pod A · 容器组</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" x="885" y="637">容器共享 Pod 网络</text><rect fill="#FFFFFF" height="108" rx="20" stroke="#D8E4F2" stroke-width="2" width="309" x="1191" y="547" /><rect fill="#7654E8" height="108" rx="4" stroke="none" stroke-width="2" width="7" x="1191" y="547" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" x="1221" y="597">Pod B · 容器组</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" x="1221" y="637">两个 Pod 仅作示意</text><path d="M 743,339 H 852" fill="none" stroke="#8B9AAD" stroke-dasharray="9 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#EBF4FF" r="20" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">CNI 是网络集成机制而非必然存在的同名进程；CoreDNS、CSI 等扩展未画出，云组件可选。</text></svg>