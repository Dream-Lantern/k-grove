<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">控制循环：不断协调期望与已观察状态</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">控制循环：不断协调期望与已观察状态</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">以副本协调为例；计入副本数不等于已经 Ready。</tspan></text><rect x="60" y="140" width="450" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="285.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="285.0" dy="0">期望状态 spec</tspan></text><text x="285.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="285.0" dy="0">目标：3 个匹配的 Pod</tspan></text><rect x="610" y="140" width="450" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="835.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="835.0" dy="0">已观察状态</tspan></text><text x="835.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="835.0" dy="0">当前：2 个计入副本数的 Pod</tspan></text><rect x="340" y="340" width="440" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="377" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">控制器协调</tspan></text><text x="560.0" y="414" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">比较差异，经 API 请求创建 Pod</tspan></text><rect x="300" y="520" width="520" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="557" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">相关组件继续推进</tspan></text><text x="560.0" y="594" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">调度、准备、运行及状态回报</tspan></text><path d="M285 250 L285 300 L440 300 L440 340" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M835 250 L835 300 L680 300 L680 340" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 450 L560 520" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 575 L1080 575 L1080 195 L1060 195" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="560" y="676" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560" dy="0">虚线：后续观察更新；条件不足时可能重试或停留，并非必然瞬间恢复。</tspan></text></g></svg>