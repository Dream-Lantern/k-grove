<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">Ingress Host/Path：同长 Exact 优先，较长路径优先</title><desc id="desc">Kubernetes 1.28 · 标准匹配教学示例，非 Controller 私有 Rewrite 配置</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">Ingress Host/Path：同长 Exact 优先，较长路径优先</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Kubernetes 1.28 · 标准匹配教学示例，非 Controller 私有 Rewrite 配置</text><rect x="65" y="180" width="1370" height="70" rx="16" fill="#F2EFFF" stroke="#D8E4F2"/><text x="90" y="225" font-size="25" font-weight="700" fill="#142D52">前提：Host = catalog.example.com，IngressClass = study-controller（需真实实现）</text><text x="85" y="300" font-size="25" font-weight="700" fill="#142D52">请求路径</text><text x="450" y="300" font-size="25" font-weight="700" fill="#142D52">命中的规则</text><text x="1100" y="300" font-size="25" font-weight="700" fill="#142D52">Service 后端</text><rect x="65" y="330" width="1370" height="55" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="85" y="366" font-size="24" font-weight="700" fill="#142D52">/api</text><text x="450" y="366" font-size="23" font-weight="400" fill="#142D52">Exact /api（同长优先）</text><text x="1100" y="366" font-size="23" font-weight="700" fill="#142D52">catalog-admin:80</text><rect x="65" y="400" width="1370" height="55" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="85" y="436" font-size="24" font-weight="700" fill="#142D52">/api/items</text><text x="450" y="436" font-size="23" font-weight="400" fill="#142D52">Prefix /api</text><text x="1100" y="436" font-size="23" font-weight="700" fill="#142D52">catalog:80</text><rect x="65" y="470" width="1370" height="55" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="85" y="506" font-size="24" font-weight="700" fill="#142D52">/api/admin</text><text x="450" y="506" font-size="23" font-weight="400" fill="#142D52">Prefix /api/admin（更长优先）</text><text x="1100" y="506" font-size="23" font-weight="700" fill="#142D52">catalog-admin:80</text><rect x="65" y="540" width="1370" height="55" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="85" y="576" font-size="24" font-weight="700" fill="#142D52">/apix</text><text x="450" y="576" font-size="23" font-weight="400" fill="#142D52">不匹配 /api 路径元素</text><text x="1100" y="576" font-size="23" font-weight="700" fill="#142D52">入口默认处理</text><rect x="65" y="610" width="1370" height="55" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="85" y="646" font-size="24" font-weight="700" fill="#142D52">/API/items</text><text x="450" y="646" font-size="23" font-weight="400" fill="#142D52">大小写不同，不匹配</text><text x="1100" y="646" font-size="23" font-weight="700" fill="#142D52">入口默认处理</text><text x="65" y="725" font-size="23" font-weight="400" fill="#142D52">Prefix 只决定匹配，不自动删除 /api 前缀；Rewrite 依赖具体 Controller 配置。</text><text x="65" y="765" font-size="23" font-weight="400" fill="#142D52">路径选择结果不等于后端一定成功；应用仍可能重定向或返回错误。</text><text x="65" y="805" font-size="22" font-weight="400" fill="#142D52">ImplementationSpecific 与私有注解按实现解释；本图不假定正则、TLS 或控制器已就绪。</text></g></svg>
