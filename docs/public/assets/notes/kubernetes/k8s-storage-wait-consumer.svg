<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">WaitForFirstConsumer：存储绑定与 Pod 调度协同</title><desc id="desc">Kubernetes 1.28 · 两区教学路径；Immediate 不必然选错区域，WFFC 也不保证必定有解</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">WaitForFirstConsumer：存储绑定与 Pod 调度协同</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Kubernetes 1.28 · 两区教学路径；Immediate 不必然选错区域，WFFC 也不保证必定有解</text><rect x="65" y="175" width="1370" height="75" rx="16" fill="#F2EFFF" stroke="#D8E4F2"/><text x="90" y="220" font-size="26" font-weight="700" fill="#142D52">前提：Pod 硬节点亲和性要求 zone-b；后端卷受可用区限制</text><rect x="65" y="280" width="1370" height="175" rx="16" fill="#FFF5E7" stroke="#D8E4F2"/><text x="90" y="320" font-size="26" font-weight="700" fill="#142D52">Immediate：先绑定/供应可能与后续 Pod 约束冲突</text><text x="90" y="370" font-size="24" font-weight="700" fill="#142D52">Zone A / Node A</text><text x="90" y="415" font-size="22" font-weight="400" fill="#142D52">PVC 提前绑定 zone-a PV</text><text x="580" y="370" font-size="24" font-weight="700" fill="#142D52">Pod 要求 Zone B</text><text x="580" y="415" font-size="22" font-weight="400" fill="#142D52">已有卷不能在此区使用</text><text x="1075" y="370" font-size="24" font-weight="700" fill="#142D52">结果：可能 Pending</text><text x="1075" y="415" font-size="22" font-weight="400" fill="#142D52">存储拓扑与 Pod 约束冲突</text><path d="M445 378L565 378" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M935 378L1060 378" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="65" y="495" width="1370" height="190" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="90" y="535" font-size="26" font-weight="700" fill="#142D52">WaitForFirstConsumer：消费 Pod 出现后，与调度及供应器协调</text><text x="90" y="590" font-size="24" font-weight="700" fill="#142D52">PVC + StorageClass</text><text x="90" y="640" font-size="22" font-weight="400" fill="#142D52">先等待消费者 / 拓扑输入</text><text x="580" y="590" font-size="24" font-weight="700" fill="#142D52">Scheduler / Provisioner</text><text x="580" y="640" font-size="22" font-weight="400" fill="#142D52">结合 Pod 约束及后端能力</text><text x="1075" y="590" font-size="24" font-weight="700" fill="#142D52">Zone B / Node B</text><text x="1075" y="640" font-size="22" font-weight="400" fill="#142D52">可选适用 zone-b 存储</text><path d="M445 598L565 598" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M975 598L1060 598" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="65" y="745" font-size="23" font-weight="400" fill="#142D52">Zone A、Zone B 是独立区域；WFFC 不自动复制数据，也不凭空创造后端容量。</text><text x="65" y="790" font-size="22" font-weight="400" fill="#142D52">需要驱动与拓扑支持；PVC Pending 可能是等待，spec.nodeName 绕过调度器可能破坏协作。</text></g></svg>
