<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#12946B" height="8" rx="4" stroke="none" stroke-width="2" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="42" font-weight="bold" x="69" y="98">Startup / Liveness / Readiness：三类探针的作用</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">同一种 HTTP / TCP / exec / gRPC 检查方式，可用于不同探针目的；按失败阈值行动</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="87">26 / 38</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="165" y2="165" /><rect fill="#EBF4FF" height="460" rx="22" stroke="#D8E4F2" stroke-width="2" width="467" x="73" y="217" /><rect fill="#EBF4FF" height="44" rx="22.0" stroke="none" stroke-width="2" width="190" x="101" y="245" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="196.0" y="276.24">Startup</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" x="104" y="326">启动是否完成？</text><rect fill="#FFFFFF" height="183" rx="16" stroke="#D8E4F2" stroke-width="2" width="410" x="101" y="450" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="121" y="492">达到相应失败条件后</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="121" y="536">失败达阈值：终止容器；依策略决定</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="121" y="566">重启</text><rect fill="#FFF5E7" height="460" rx="22" stroke="#D8E4F2" stroke-width="2" width="467" x="568" y="217" /><rect fill="#FFF5E7" height="44" rx="22.0" stroke="none" stroke-width="2" width="190" x="596" y="245" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="691.0" y="276.24">Liveness</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" x="599" y="326">应用是否需要终止处理？</text><rect fill="#FFFFFF" height="183" rx="16" stroke="#D8E4F2" stroke-width="2" width="410" x="596" y="450" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="616" y="492">达到相应失败条件后</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="616" y="536">失败到阈值：终止容器，按策略重启</text><rect fill="#E8F9F2" height="460" rx="22" stroke="#D8E4F2" stroke-width="2" width="467" x="1063" y="217" /><rect fill="#E8F9F2" height="44" rx="22.0" stroke="none" stroke-width="2" width="190" x="1091" y="245" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="1186.0" y="276.24">Readiness</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" x="1094" y="326">现在是否适合承接流量？</text><rect fill="#FFFFFF" height="183" rx="16" stroke="#D8E4F2" stroke-width="2" width="410" x="1091" y="450" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="1111" y="492">达到相应失败条件后</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="1111" y="536">失败：影响就绪与服务后端资格，不</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="1111" y="566">直接重启</text><rect fill="#F2EFFF" height="75" rx="17" stroke="#DBD5F9" stroke-width="2" width="1330" x="135" y="690" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="156" y="724">启动门控</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="156" y="759">配置了 Startup Probe 时，在它成功之前，Readiness 和 Liveness 不开始执行。</text><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#E8F9F2" r="20" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">探针成功不等于端到端业务正确；Startup 失败也会导致容器终止，重启行为仍遵循适用的策略。</text></svg>