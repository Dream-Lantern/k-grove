<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">三类探针：失败后采取的动作不同</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">三类探针：失败后采取的动作不同</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">针对普通应用容器的教学模型；阈值满足后才触发相应失败处理。</tspan></text><rect x="350" y="125" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="162" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">startupProbe</tspan></text><text x="560.0" y="199" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">配置时，先判断应用是否启动</tspan></text><rect x="70" y="380" width="440" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="290.0" y="417" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="290.0" dy="0">livenessProbe</tspan></text><text x="290.0" y="454" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="290.0" dy="0">达到失败阈值：终止容器</tspan></text><rect x="610" y="380" width="440" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="830.0" y="417" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="830.0" dy="0">readinessProbe</tspan></text><text x="830.0" y="454" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="830.0" dy="0">失败：影响就绪与后端资格</tspan></text><path d="M470 235 L470 300 L290 300 L290 380" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M650 235 L650 300 L830 300 L830 380" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="330" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560" dy="0">启动成功后，其他探针才开始工作</tspan></text><rect x="70" y="570" width="440" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="290.0" y="607" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="290.0" dy="0">是否重新启动</tspan></text><text x="290.0" y="644" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="290.0" dy="0">由适用的 restartPolicy 决定</tspan></text><rect x="610" y="570" width="440" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="830.0" y="607" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="830.0" dy="0">不是删除 Service</tspan></text><text x="830.0" y="644" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="830.0" dy="0">也不因 readiness 失败直接重启</tspan></text><path d="M290 490 L290 570" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 490 L830 570" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560.0" y="732" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">startup 达到失败阈值也会终止容器；上图省略这条异常分支。</tspan></text></g></svg>