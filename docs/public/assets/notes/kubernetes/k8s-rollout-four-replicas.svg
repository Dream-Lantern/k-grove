<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">四副本 RollingUpdate：从 Ready 到 Available</title><desc id="desc">Linux Kubernetes 1.28 · 数量为教学状态快照，终止中的 Pod 另计</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">四副本 RollingUpdate：从 Ready 到 Available</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Linux Kubernetes 1.28 · 数量为教学状态快照，终止中的 Pod 另计</text><text x="65" y="190" font-size="24" font-weight="700" fill="#142D52">catalog：replicas=4 · maxSurge=1 · maxUnavailable=0 · minReadySeconds=10</text><rect x="65" y="240" width="1370" height="62" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="85" y="280" font-size="24" font-weight="700" fill="#142D52">A 初始</text><circle cx="310" cy="271" r="18" fill="#2563EB"/><circle cx="365" cy="271" r="18" fill="#2563EB"/><circle cx="420" cy="271" r="18" fill="#2563EB"/><circle cx="475" cy="271" r="18" fill="#2563EB"/><text x="860" y="280" font-size="22" font-weight="400" fill="#142D52">4</text><rect x="65" y="315" width="1370" height="62" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="85" y="355" font-size="24" font-weight="700" fill="#142D52">B 新增</text><circle cx="310" cy="346" r="18" fill="#2563EB"/><circle cx="365" cy="346" r="18" fill="#2563EB"/><circle cx="420" cy="346" r="18" fill="#2563EB"/><circle cx="475" cy="346" r="18" fill="#2563EB"/><circle cx="590" cy="346" r="18" fill="#12946B"/><text x="860" y="355" font-size="22" font-weight="400" fill="#142D52">4；新 Pod 尚未可用</text><rect x="65" y="390" width="1370" height="62" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="85" y="430" font-size="24" font-weight="700" fill="#142D52">C Ready</text><circle cx="310" cy="421" r="18" fill="#2563EB"/><circle cx="365" cy="421" r="18" fill="#2563EB"/><circle cx="420" cy="421" r="18" fill="#2563EB"/><circle cx="475" cy="421" r="18" fill="#2563EB"/><circle cx="590" cy="421" r="18" fill="#12946B"/><text x="860" y="430" font-size="22" font-weight="400" fill="#142D52">4；新 Pod 仍需连续 Ready 满 10 秒</text><rect x="65" y="465" width="1370" height="62" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="85" y="505" font-size="24" font-weight="700" fill="#142D52">D 可用</text><circle cx="310" cy="496" r="18" fill="#2563EB"/><circle cx="365" cy="496" r="18" fill="#2563EB"/><circle cx="420" cy="496" r="18" fill="#2563EB"/><circle cx="590" cy="496" r="18" fill="#12946B"/><text x="860" y="505" font-size="22" font-weight="400" fill="#142D52">≥4；新 Pod 可用后，允许缩减旧副本</text><rect x="65" y="540" width="1370" height="62" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="85" y="580" font-size="24" font-weight="700" fill="#142D52">E 完成</text><circle cx="590" cy="571" r="18" fill="#12946B"/><circle cx="645" cy="571" r="18" fill="#12946B"/><circle cx="700" cy="571" r="18" fill="#12946B"/><circle cx="755" cy="571" r="18" fill="#12946B"/><text x="860" y="580" font-size="22" font-weight="400" fill="#142D52">4；后续按预算继续协调直至完成</text><text x="285" y="225" font-size="20" font-weight="400" fill="#142D52">旧 v1（蓝）</text><text x="570" y="225" font-size="20" font-weight="400" fill="#142D52">新 v2（绿）</text><text x="860" y="225" font-size="20" font-weight="400" fill="#142D52">可用数 / 解释</text><rect x="65" y="635" width="1370" height="80" rx="16" fill="#FFF5E7" stroke="#D8E4F2"/><text x="85" y="667" font-size="23" font-weight="700" fill="#142D52">失败分支：新增 v2 无法调度、启动或 Ready → 发布卡住，旧健康副本通常保留。</text><text x="85" y="700" font-size="22" font-weight="400" fill="#142D52">进度超时报告 ProgressDeadlineExceeded；Deployment 不因此自动回滚。</text><text x="65" y="758" font-size="22" font-weight="400" fill="#142D52">这是可能的数量快照，不保证固定增删节拍；终止中的 Pod 仍占资源，进程总数可能超过 5。</text><text x="65" y="795" font-size="22" font-weight="400" fill="#142D52">maxUnavailable=0 约束发布预算，不保证业务零故障。</text></g></svg>
