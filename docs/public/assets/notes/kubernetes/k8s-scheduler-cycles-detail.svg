<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830" role="img" aria-labelledby="title desc">
<title id="title">调度周期与绑定周期</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="700.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="700.0" dy="0">调度周期与绑定周期</tspan></text><text x="700.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="700.0" dy="0">筛选评分发生在调度周期；Permit 与等待 Permit 分开看。</tspan></text><rect x="20" y="125" width="1360" height="250" rx="8" fill="#F8FBFF" stroke="#CBDDEB" stroke-dasharray="7 5"/><rect x="20" y="485" width="1360" height="220" rx="8" fill="#F8FBFF" stroke="#CBDDEB" stroke-dasharray="7 5"/><text x="700" y="157" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="700" dy="0">调度周期（主要环节归并）</tspan></text><rect x="40" y="210" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="190.0" y="247" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="190.0" dy="0">PreFilter / Filter</tspan></text><text x="190.0" y="284" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="190.0" dy="0">检查条件，筛选可行节点</tspan></text><rect x="380" y="210" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="530.0" y="247" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="530.0" dy="0">PreScore / Score</tspan></text><text x="530.0" y="284" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="530.0" dy="0">评估候选，选择节点</tspan></text><path d="M340 265 L380 265" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="720" y="210" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="870.0" y="247" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="870.0" dy="0">Reserve</tspan></text><text x="870.0" y="284" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="870.0" dy="0">预留相关状态</tspan></text><path d="M680 265 L720 265" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="1060" y="210" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="1210.0" y="247" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="1210.0" dy="0">Permit</tspan></text><text x="1210.0" y="284" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="1210.0" dy="0">批准、拒绝或等待</tspan></text><path d="M1020 265 L1060 265" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="550" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="190.0" y="587" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="190.0" dy="0">等待 Permit</tspan></text><text x="190.0" y="624" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="190.0" dy="0">需要等待时阻塞后续绑定</tspan></text><rect x="380" y="550" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="530.0" y="587" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="530.0" dy="0">PreBind</tspan></text><text x="530.0" y="624" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="530.0" dy="0">绑定前的相关准备</tspan></text><path d="M340 605 L380 605" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="720" y="550" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="870.0" y="587" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="870.0" dy="0">Bind</tspan></text><text x="870.0" y="624" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="870.0" dy="0">推进 API 绑定</tspan></text><path d="M680 605 L720 605" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="1060" y="550" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="1210.0" y="587" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="1210.0" dy="0">PostBind</tspan></text><text x="1210.0" y="624" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="1210.0" dy="0">绑定后相应处理</tspan></text><path d="M1020 605 L1060 605" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M1360 265 L1385 265 L1385 440 L190 440 L190 550" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="518" text-anchor="middle" fill="#0369A1" font-size="21" font-weight="600"><tspan x="700" dy="0">绑定周期（独立 Pod 的后续处理可以交错推进）</tspan></text><text x="700.0" y="792" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="700.0" dy="0">省略 PreEnqueue、排序、PostFilter 与回退分支；各扩展点失败语义不能一概而论。</tspan></text></g></svg>