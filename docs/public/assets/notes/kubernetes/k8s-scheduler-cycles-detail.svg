JK SC" font-size="26" font-weight="bold" text-anchor="middle" x="1261" y="585">4</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="1304" y="578">PostBind</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="1304" y="618">绑定后的相应处理</text><path d="M 1354,405 V 446 H 456 V 517 H 246 V 524" fill="none" stroke="#7654E8" stroke-dasharray="9 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#F2EFFF" r="20" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">不同 Pod 的绑定可与后续调度交错推进；图省略队列、PreEnqueue、PostFilter 和各扩展点失败分支。</text></svg>