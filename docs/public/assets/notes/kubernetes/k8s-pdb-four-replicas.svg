<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">四副本 PDB：健康数与可驱逐预算</title><desc id="desc">Linux Kubernetes 1.28 · policy/v1 · 本图没有执行驱逐</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">四副本 PDB：健康数与可驱逐预算</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Linux Kubernetes 1.28 · policy/v1 · 本图没有执行驱逐</text><rect x="65" y="230" width="430" height="360" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="85" y="275" font-size="26" font-weight="700" fill="#142D52">A · 初始健康</text><circle cx="130" cy="340" r="30" fill="#12946B"/><text x="120" y="349" font-size="24" font-weight="700" fill="white">1</text><circle cx="225" cy="340" r="30" fill="#12946B"/><text x="215" y="349" font-size="24" font-weight="700" fill="white">2</text><circle cx="320" cy="340" r="30" fill="#12946B"/><text x="310" y="349" font-size="24" font-weight="700" fill="white">3</text><circle cx="415" cy="340" r="30" fill="#12946B"/><text x="405" y="349" font-size="24" font-weight="700" fill="white">4</text><text x="85" y="410" font-size="25" font-weight="700" fill="#142D52">currentHealthy = 4</text><text x="85" y="455" font-size="24" font-weight="400" fill="#142D52">desiredHealthy = 3</text><text x="85" y="500" font-size="24" font-weight="400" fill="#142D52">expectedPods = 4</text><text x="85" y="550" font-size="25" font-weight="700" fill="#142D52">disruptionsAllowed = 1</text><rect x="535" y="230" width="430" height="360" rx="16" fill="#FFF5E7" stroke="#D8E4F2"/><text x="555" y="275" font-size="26" font-weight="700" fill="#142D52">B · 替代已创建未 Ready</text><circle cx="600" cy="340" r="30" fill="#12946B"/><text x="590" y="349" font-size="24" font-weight="700" fill="white">1</text><circle cx="695" cy="340" r="30" fill="#12946B"/><text x="685" y="349" font-size="24" font-weight="700" fill="white">2</text><circle cx="790" cy="340" r="30" fill="#12946B"/><text x="780" y="349" font-size="24" font-weight="700" fill="white">3</text><circle cx="885" cy="340" r="30" fill="#BDC7D4"/><text x="875" y="349" font-size="24" font-weight="700" fill="white">4</text><text x="555" y="410" font-size="25" font-weight="700" fill="#142D52">currentHealthy = 3</text><text x="555" y="455" font-size="24" font-weight="400" fill="#142D52">desiredHealthy = 3</text><text x="555" y="500" font-size="24" font-weight="400" fill="#142D52">expectedPods = 4</text><text x="555" y="550" font-size="25" font-weight="700" fill="#142D52">disruptionsAllowed = 0</text><rect x="1005" y="230" width="430" height="360" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="1025" y="275" font-size="26" font-weight="700" fill="#142D52">C · 替代已 Ready</text><circle cx="1070" cy="340" r="30" fill="#12946B"/><text x="1060" y="349" font-size="24" font-weight="700" fill="white">1</text><circle cx="1165" cy="340" r="30" fill="#12946B"/><text x="1155" y="349" font-size="24" font-weight="700" fill="white">2</text><circle cx="1260" cy="340" r="30" fill="#12946B"/><text x="1250" y="349" font-size="24" font-weight="700" fill="white">3</text><circle cx="1355" cy="340" r="30" fill="#12946B"/><text x="1345" y="349" font-size="24" font-weight="700" fill="white">4</text><text x="1025" y="410" font-size="25" font-weight="700" fill="#142D52">currentHealthy = 4</text><text x="1025" y="455" font-size="24" font-weight="400" fill="#142D52">desiredHealthy = 3</text><text x="1025" y="500" font-size="24" font-weight="400" fill="#142D52">expectedPods = 4</text><text x="1025" y="550" font-size="25" font-weight="700" fill="#142D52">disruptionsAllowed = 1</text><path d="M498 410L530 410" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M968 410L1000 410" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="65" y="190" font-size="25" font-weight="700" fill="#142D52">catalog / study · app=catalog · 期望 4 副本 · PDB minAvailable=3</text><text x="65" y="640" font-size="23" font-weight="400" fill="#142D52">A → B：一次适用的受控驱逐；B → C：ReplicaSet 补副本，调度、启动并 Ready。</text><text x="65" y="690" font-size="23" font-weight="400" fill="#142D52">B 为旧 Pod 已删除、替代已创建的快照；本例 expectedPods 按匹配 Pod 数计算。</text><text x="65" y="740" font-size="23" font-weight="400" fill="#142D52">PDB 不创建替代 Pod，不阻止直接删除或节点断电，也不保证业务绝对高可用。</text><text x="65" y="785" font-size="22" font-weight="400" fill="#142D52">PDB 看 Ready；Deployment 的 minReadySeconds 是另一套可用性判断。</text></g></svg>
