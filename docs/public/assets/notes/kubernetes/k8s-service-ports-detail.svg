<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">Service 字段：配置关联与连接路径分开</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">Service 字段：配置关联与连接路径分开</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">上排表示声明与后端信息关系，下排表示一次业务连接。</tspan></text><rect x="40" y="150" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="190.0" y="187" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="190.0" dy="0">Service selector</tspan></text><text x="190.0" y="224" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="190.0" dy="0">匹配同命名空间 Pod 标签</tspan></text><rect x="410" y="150" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="187" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">Pod 标签与端口</tspan></text><text x="560.0" y="224" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">应用实际监听 TCP 8080</tspan></text><rect x="780" y="150" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="930.0" y="187" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="930.0" dy="0">EndpointSlice</tspan></text><text x="930.0" y="224" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="930.0" dy="0">端点地址、端口与条件</tspan></text><path d="M340 205 L410 205" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 205 L780 205" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="350" text-anchor="middle" fill="#0369A1" font-size="20" font-weight="600"><tspan x="560" dy="0">关联由适用控制器维护，不是每个请求去匹配标签。</tspan></text><rect x="40" y="480" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="190.0" y="517" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="190.0" dy="0">客户端</tspan></text><text x="190.0" y="554" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="190.0" dy="0">连接 Service TCP 80</tspan></text><rect x="410" y="480" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="517" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">服务数据平面</tspan></text><text x="560.0" y="554" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">根据可用信息选择后端</tspan></text><rect x="780" y="480" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="930.0" y="517" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="930.0" dy="0">后端 Pod</tspan></text><text x="930.0" y="554" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="930.0" dy="0">接收 TCP 8080 连接</tspan></text><path d="M340 535 L410 535" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 535 L780 535" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560.0" y="812" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">新增教学示例；port 与 targetPort 不同，containerPort 不负责启动监听。</tspan></text></g></svg>