<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#7654E8" height="8" rx="4" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="45" font-weight="bold" x="70" y="96">Helm：从 Chart 与 Values 到 Release</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">Chart 版本不等于 appVersion；渲染通过不代表目标集群已接受</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="88">19 / 20</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="166" y2="166" /><rect fill="#FFFFFF" height="140" rx="20" stroke="#D8E4F2" stroke-width="2" width="693" x="73" y="206" /><rect fill="#2563EB" height="140" rx="4" stroke="none" stroke-width="2" width="7" x="73" y="206" /><rect fill="#EBF4FF" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="95" y="229" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="120" y="263">1</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" x="163" y="256">Chart 与依赖</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" x="163" y="296">模板、Chart 元数据、版本和依赖。</text><rect fill="#FFFFFF" height="140" rx="20" stroke="#D8E4F2" stroke-width="2" width="693" x="837" y="206" /><rect fill="#7654E8" height="140" rx="4" stroke="none" stroke-width="2" width="7" x="837" y="206" /><rect fill="#F2EFFF" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="859" y="229" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="884" y="263">2</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" x="927" y="256">Values 输入</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" x="927" y="296">合并配置文件、命令行覆盖与敏感信息约束。</text><path d="M 419,346 V 403 H 797 V 445" fill="none" stroke="#8B9AAD" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><path d="M 1183,346 V 403 H 797" fill="none" stroke="#8B9AAD" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><line stroke="#8B9AAD" stroke-width="3" x1="797" x2="797" y1="403" y2="448" /><polygon fill="#8B9AAD" points="797,448 791.7263190753538,438.3465918192059 802.2736809246462,438.3465918192059" /><rect fill="#FFFFFF" height="118" rx="20" stroke="#D8E4F2" stroke-width="2" width="773" x="410" y="458" /><rect fill="#12946B" height="118" rx="4" stroke="none" stroke-width="2" width="7" x="410" y="458" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="440" y="508">03 渲染 Kubernetes 对象</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="440" y="548">生成清单仍需验证目标集群的 API、权限和准入。</text><line stroke="#12946B" stroke-width="3" x1="797" x2="797" y1="577" y2="611" /><polygon fill="#12946B" points="797,611 791.7263190753538,601.3465918192059 802.2736809246462,601.3465918192059" /><rect fill="#FFFFFF" height="116" rx="20" stroke="#D8E4F2" stroke-width="2" width="773" x="409" y="620" /><rect fill="#D98419" height="116" rx="4" stroke="none" stroke-width="2" width="7" x="409" y="620" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="439" y="670">04 创建 / 更新 Release</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="439" y="710">安装、升级、历史记录和有条件回滚。</text><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#F2EFFF" r="20" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">CRD、Hooks、保留资源及外部数据有独立生命周期；Helm rollback 不会自动还原数据库与所有副作用。</text></svg>