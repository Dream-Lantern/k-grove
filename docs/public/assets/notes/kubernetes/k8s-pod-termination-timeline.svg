<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">Pod 优雅终止：共享时间预算，并行传播</title><desc id="desc">Linux Kubernetes 1.28 · 纸面推演，不是严格的全局运行时序</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">Pod 优雅终止：共享时间预算，并行传播</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Linux Kubernetes 1.28 · 纸面推演，不是严格的全局运行时序</text><rect x="65" y="175" width="1370" height="75" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="90" y="220" font-size="25" font-weight="700" fill="#142D52">T0：API 接受删除请求，记录 deletionTimestamp；传播到各组件需要时间</text><path d="M700 250V295H250V300" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1415 250H1450V480H130V495" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="65" y="285" font-size="24" font-weight="700" fill="#142D52">节点终止分支：30 秒宽限预算，含 PreStop</text><rect x="65" y="305" width="330" height="150" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="85" y="345" font-size="24" font-weight="700" fill="#142D52">kubelet 观察到终止</text><text x="85" y="390" font-size="21" font-weight="400" fill="#142D52">开始本地处理</text><text x="85" y="422" font-size="21" font-weight="400" fill="#142D52">PreStop 执行约 8 秒</text><rect x="445" y="305" width="410" height="150" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="465" y="345" font-size="24" font-weight="700" fill="#142D52">PreStop 完成 → SIGTERM</text><text x="465" y="390" font-size="21" font-weight="400" fill="#142D52">信号通常发送到容器 PID 1</text><text x="465" y="422" font-size="21" font-weight="400" fill="#142D52">应用处理在途请求并主动退出</text><rect x="905" y="305" width="530" height="150" rx="16" fill="#FFF5E7" stroke="#D8E4F2"/><text x="925" y="345" font-size="24" font-weight="700" fill="#142D52">正常退出 / 预算耗尽强制终止</text><text x="925" y="390" font-size="21" font-weight="400" fill="#142D52">理想化剩余约 22 秒，非固定保证</text><text x="925" y="422" font-size="21" font-weight="400" fill="#142D52">PreStop 超时：1.28 可一次延长 2 秒</text><path d="M398 375L440 375" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M858 375L900 375" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="65" y="500" width="1370" height="170" rx="16" fill="#F2EFFF" stroke="#D8E4F2"/><text x="90" y="540" font-size="25" font-weight="700" fill="#142D52">并行分支：EndpointSlice 更新 → 数据平面传播 → 新请求与已有连接变化</text><text x="90" y="585" font-size="22" font-weight="400" fill="#142D52">终止端点通常 ready=false、terminating=true；serving 可表达终止期间是否仍能服务。</text><text x="90" y="625" font-size="23" font-weight="700" fill="#142D52">没有“所有代理确认、所有连接排空以后，才发送 SIGTERM”的全局屏障。</text><text x="65" y="725" font-size="23" font-weight="400" fill="#142D52">教学假设：8 秒属于 30 秒；T0、kubelet 观察与运行时执行并非同一时刻。</text><text x="65" y="770" font-size="23" font-weight="400" fill="#142D52">PreStop sleep 不保证零请求损失；信号处理、入口进程和连接排空必须另行验证。</text></g></svg>
