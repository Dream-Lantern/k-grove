<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#2563EB" height="8" rx="4" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="45" font-weight="bold" x="70" y="96">Deployment：滚动更新与回滚边界</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">修改 Pod 模板触发发布；单纯缩放 replicas 不会产生新的模板版本</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="88">12 / 20</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="166" y2="166" /><rect fill="#FFFFFF" height="118" rx="20" stroke="#D8E4F2" stroke-width="2" width="700" x="70" y="201" /><rect fill="#2563EB" height="118" rx="4" stroke="none" stroke-width="2" width="7" x="70" y="201" /><rect fill="#EBF4FF" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="92" y="224" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="117" y="258">1</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="160" y="251">01 修改 spec.template</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="160" y="291">形成对应新 ReplicaSet；不是手工逐个替换 Pod。</text><rect fill="#FFFFFF" height="118" rx="20" stroke="#D8E4F2" stroke-width="2" width="700" x="830" y="201" /><rect fill="#7654E8" height="118" rx="4" stroke="none" stroke-width="2" width="7" x="830" y="201" /><rect fill="#F2EFFF" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="852" y="224" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="877" y="258">2</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="920" y="251">02 更新预算</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="920" y="291">maxSurge 与 maxUnavailable 共同限制并行发布过程。</text><line stroke="#2563EB" stroke-width="4" x1="775" x2="824" y1="260" y2="260" /><polygon fill="#2563EB" points="824,260 814.3465918192059,265.2736809246462 814.3465918192059,254.72631907535376" /><rect fill="#FFFFFF" height="136" rx="20" stroke="#D8E4F2" stroke-width="2" width="700" x="70" y="415" /><rect fill="#12946B" height="136" rx="4" stroke="none" stroke-width="2" width="7" x="70" y="415" /><rect fill="#E8F9F2" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="92" y="438" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="117" y="472">3</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="160" y="465">03 调整新旧 ReplicaSet</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="160" y="505">新 Pod 就绪与可用性、容量和依赖影响推进。</text><rect fill="#FFFFFF" height="136" rx="20" stroke="#D8E4F2" stroke-width="2" width="700" x="830" y="415" /><rect fill="#D98419" height="136" rx="4" stroke="none" stroke-width="2" width="7" x="830" y="415" /><rect fill="#FFF5E7" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="852" y="438" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="877" y="472">4</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="920" y="465">04 观察、暂停或回滚</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="920" y="505">回滚模板不自动恢复数据库和外部副作用。</text><line stroke="#2563EB" stroke-width="4" x1="775" x2="824" y1="478" y2="478" /><polygon fill="#2563EB" points="824,478 814.3465918192059,483.2736809246462 814.3465918192059,472.7263190753538" /><path d="M 1160,319 V 365 H 410 V 414" fill="none" stroke="#8B9AAD" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><rect fill="#EBF4FF" height="34" rx="17.0" stroke="none" stroke-width="2" width="315" x="95" y="598" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="252.5" y="622.14">RollingUpdate：过程约束</text><rect fill="#E8F9F2" height="34" rx="17.0" stroke="none" stroke-width="2" width="363" x="433" y="598" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="614.5" y="622.14">readiness / minReadySeconds</text><rect fill="#F2EFFF" height="34" rx="17.0" stroke="none" stroke-width="2" width="326" x="821" y="598" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="984.0" y="622.14">调度资源 / 配额 / 镜像</text><rect fill="#FFF5E7" height="34" rx="17.0" stroke="none" stroke-width="2" width="320" x="1173" y="598" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="1333.0" y="622.14">依赖服务和数据</text><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#EBF4FF" r="20" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">这是多控制器持续协调的摘要，不保证固定“先新增一个、再删除一个”的单一顺序或零业务故障。</text></svg>