<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">EndpointSlice Conditions：Pod 状态与流量之间</title><desc id="desc">Kubernetes v1.28.0 · 标准控制器路径；Controller 不处理每一个业务数据包</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">EndpointSlice Conditions：Pod 状态与流量之间</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Kubernetes v1.28.0 · 标准控制器路径；Controller 不处理每一个业务数据包</text><rect x="65" y="180" width="600" height="90" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="90" y="215" font-size="26" font-weight="700" fill="#142D52">Pod 状态</text><text x="90" y="250" font-size="23" font-weight="400" fill="#142D52">Ready 条件、deletionTimestamp、地址</text><rect x="835" y="180" width="600" height="90" rx="16" fill="#F2EFFF" stroke="#D8E4F2"/><text x="860" y="215" font-size="26" font-weight="700" fill="#142D52">Service 控制输入</text><text x="860" y="250" font-size="23" font-weight="400" fill="#142D52">selector、publishNotReadyAddresses</text><path d="M365 270V290H750V305M1135 270V290H750" fill="none" stroke="#637993" stroke-width="2.5"/><rect x="450" y="310" width="600" height="65" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="480" y="352" font-size="25" font-weight="700" fill="#142D52">EndpointSlice Controller 维护端点条件</text><path d="M750 375L750 400" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="85" y="430" font-size="24" font-weight="700" fill="#142D52">Pod 状态</text><text x="640" y="430" font-size="24" font-weight="700" fill="#142D52">serving</text><text x="895" y="430" font-size="24" font-weight="700" fill="#142D52">terminating</text><text x="1180" y="430" font-size="24" font-weight="700" fill="#142D52">ready</text><rect x="65" y="450" width="1370" height="43" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="85" y="479" font-size="23" font-weight="400" fill="#142D52">正常 Ready</text><text x="650" y="479" font-size="23" font-weight="700" fill="#142D52">true</text><text x="925" y="479" font-size="23" font-weight="700" fill="#142D52">false</text><text x="1195" y="479" font-size="23" font-weight="700" fill="#142D52">true</text><rect x="65" y="500" width="1370" height="43" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="85" y="529" font-size="23" font-weight="400" fill="#142D52">未就绪</text><text x="650" y="529" font-size="23" font-weight="700" fill="#142D52">false</text><text x="925" y="529" font-size="23" font-weight="700" fill="#142D52">false</text><text x="1195" y="529" font-size="23" font-weight="700" fill="#142D52">false</text><rect x="65" y="550" width="1370" height="43" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="85" y="579" font-size="23" font-weight="400" fill="#142D52">终止中，仍 Ready</text><text x="650" y="579" font-size="23" font-weight="700" fill="#142D52">true</text><text x="925" y="579" font-size="23" font-weight="700" fill="#142D52">true</text><text x="1195" y="579" font-size="23" font-weight="700" fill="#142D52">false</text><rect x="65" y="600" width="1370" height="43" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="85" y="629" font-size="23" font-weight="400" fill="#142D52">终止中，已不 Ready</text><text x="650" y="629" font-size="23" font-weight="700" fill="#142D52">false</text><text x="925" y="629" font-size="23" font-weight="700" fill="#142D52">true</text><text x="1195" y="629" font-size="23" font-weight="700" fill="#142D52">false</text><path d="M750 645L750 665" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="65" y="670" width="1370" height="65" rx="16" fill="#FFF5E7" stroke="#D8E4F2"/><text x="90" y="712" font-size="23" font-weight="700" fill="#142D52">数据平面消费并传播：不是全局立即同步；新连接、已有连接及流量策略可能产生不同结果。</text><text x="65" y="775" font-size="22" font-weight="400" fill="#142D52">表格假设 publishNotReadyAddresses=false；设为 true 时，标准控制器可令 ready=true。</text><text x="65" y="810" font-size="22" font-weight="400" fill="#142D52">普通 Pod 后端的生成规则，不强制所有手工端点照此生成；ready=true 不保证所有请求成功。</text></g></svg>
