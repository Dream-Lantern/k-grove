<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">kubectl 安全变更：本地检查、在线验证、执行与验收</title><desc id="desc">Kubernetes 1.28 · 各阶段边界不同，授权依所在团队流程执行</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">kubectl 安全变更：本地检查、在线验证、执行与验收</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Kubernetes 1.28 · 各阶段边界不同，授权依所在团队流程执行</text><rect x="65" y="190" width="1370" height="140" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="90" y="230" font-size="28" font-weight="700" fill="#142D52">① 本地目标与声明检查</text><text x="90" y="272" font-size="22" font-weight="400" fill="#142D52">核验 Context、Cluster/User 与 Namespace；检查 kubeconfig 来源和认证插件。</text><text x="90" y="307" font-size="22" font-weight="400" fill="#142D52">审阅声明、当前影响范围和恢复路径；静态 YAML 检查不等于服务端校验。</text><path d="M750 333L750 363" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="65" y="370" width="1370" height="140" rx="16" fill="#F2EFFF" stroke="#D8E4F2"/><text x="90" y="410" font-size="28" font-weight="700" fill="#142D52">② 已授权环境中的在线验证</text><text x="90" y="452" font-size="22" font-weight="400" fill="#142D52">核对实际身份与权限、当前对象；Server Dry-run / Diff 会联系 API Server。</text><text x="90" y="487" font-size="22" font-weight="400" fill="#142D52">权限、准入可能拒绝请求；Diff 可能含敏感信息，成功也不证明业务可用。</text><path d="M750 513L750 543" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="65" y="550" width="1370" height="140" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="90" y="590" font-size="28" font-weight="700" fill="#142D52">③ 按团队流程授权后，执行与验收</text><text x="90" y="632" font-size="22" font-weight="400" fill="#142D52">实际 apply/patch 等改变在线状态；一次变更后检查对象、运行与业务结果。</text><text x="90" y="667" font-size="22" font-weight="400" fill="#142D52">若需恢复或回滚，继续验证恢复结果；对象回退不自动撤销外部数据副作用。</text><text x="65" y="745" font-size="23" font-weight="400" fill="#142D52">Diff 退出码：0 无差异；1 有差异；&gt;1 错误。exec、port-forward 不是纯状态查询。</text><text x="65" y="790" font-size="22" font-weight="400" fill="#142D52">教学流程，本次不连接集群或执行变更；不传播真实 kubeconfig、Secret、敏感日志和 Values。</text></g></svg>
