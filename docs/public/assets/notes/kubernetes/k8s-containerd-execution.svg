<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">containerd 1.7 的 CRI、shim、runc 与网络配置分支</title>
  <desc id="desc">kubelet 通过 CRI 访问 containerd CRI 插件，插件调用 containerd 内部镜像和任务管理能力。执行侧通过任务服务访问 shim，再由 runc 按 OCI 规范创建和管理 Linux 容器进程。网络准备时调用 CNI，地址管理由插件、网络方案或云平台实现。图不表示每个业务数据包经过 CNI，也不把任务服务通信称作 OCI 协议。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <marker id="net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#128365"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #183153; }
      .title { font-size: 25px; font-weight: 700; }
      .body { font-size: 20px; fill: #526780; }
      .label { font-size: 18px; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
      .network { fill: none; stroke: #128365; stroke-width: 3; marker-end: url(#net); }
    </style>
  </defs>
  <rect width="1500" height="1000" fill="#f8fafe"/>
  <rect x="20" y="24" width="1460" height="952" rx="24" fill="white" stroke="#d8e4f2" stroke-width="2"/>
  <text x="60" y="85" font-size="34" font-weight="700">containerd 1.7：接口、运行时实现与网络配置分支</text>
  <text class="body" x="60" y="130">常见 Linux / runc v2 路线；省略返回、事件与重试，不代表其他 CRI 实现必须具有相同组件结构</text>
  <rect x="515" y="175" width="450" height="410" rx="20" fill="#f7f4ff" stroke="#d4c7f4" stroke-width="2"/>
  <text class="label" x="540" y="203">containerd 主守护进程内</text>

  <rect x="60" y="225" width="360" height="130" rx="16" fill="#edf4ff" stroke="#b7d3fa" stroke-width="2"/>
  <text class="title" x="86" y="270">kubelet</text>
  <text class="body" x="86" y="310">请求镜像与容器生命周期能力</text>
  <rect x="540" y="225" width="400" height="130" rx="16" fill="white" stroke="#d4c7f4" stroke-width="2"/>
  <text class="title" x="566" y="270">containerd CRI 插件</text>
  <text class="body" x="566" y="310">承接 Runtime / Image Service</text>
  <path class="flow" d="M420 290 H540"/>
  <text class="label" x="448" y="272">CRI</text>

  <rect x="1080" y="225" width="360" height="130" rx="16" fill="#ebf8f2" stroke="#b9dfce" stroke-width="2"/>
  <text class="title" x="1106" y="270">CNI 插件 / 插件链</text>
  <text class="body" x="1106" y="310">配置接口、地址和路由等</text>
  <path class="network" d="M940 290 H1080"/>
  <text class="label" x="970" y="272">网络准备</text>
  <rect x="1080" y="435" width="360" height="130" rx="16" fill="#ebf8f2" stroke="#b9dfce" stroke-width="2"/>
  <text class="title" x="1106" y="480">IPAM / 地址管理能力</text>
  <text class="body" x="1106" y="520">插件、网络方案自身或云平台</text>
  <path class="network" d="M1260 355 V435"/>
  <text class="label" x="1280" y="400">按方案集成</text>

  <rect x="540" y="435" width="400" height="130" rx="16" fill="white" stroke="#d4c7f4" stroke-width="2"/>
  <text class="title" x="566" y="480">containerd 内部管理</text>
  <text class="body" x="566" y="520">镜像、内容、元数据、快照与任务</text>
  <path class="flow" d="M740 355 V435"/>
  <rect x="540" y="655" width="400" height="130" rx="16" fill="#edf4ff" stroke="#b7d3fa" stroke-width="2"/>
  <text class="title" x="566" y="700">containerd-shim-runc-v2</text>
  <text class="body" x="566" y="740">任务 I/O、等待退出、生命周期事件</text>
  <path class="flow" d="M740 565 V655"/>
  <text class="label" x="760" y="616">任务服务，常见 ttrpc</text>

  <rect x="1080" y="655" width="360" height="130" rx="16" fill="#edf4ff" stroke="#b7d3fa" stroke-width="2"/>
  <text class="title" x="1106" y="700">runc：OCI Runtime 实现</text>
  <text class="body" x="1106" y="740">按配置创建、启动或管理进程</text>
  <path class="flow" d="M940 720 H1080"/>
  <text class="label" x="964" y="701">运行时调用</text>
  <rect x="1080" y="845" width="360" height="70" rx="16" fill="#edf4ff" stroke="#b7d3fa" stroke-width="2"/>
  <text class="title" x="1106" y="890">Linux 容器进程</text>
  <path class="flow" d="M1260 785 V845"/>

  <rect x="60" y="435" width="360" height="150" rx="16" fill="#f3f6fb"/>
  <text class="title" x="86" y="477">规范与实现的边界</text>
  <text class="body" x="86" y="516">OCI 不是这段任务服务的 RPC</text>
  <text class="body" x="86" y="550">CSI 另有存储接入路径</text>
  <text class="body" x="60" y="835">绿线是创建期网络配置分支，</text>
  <text class="body" x="60" y="868">不是业务数据包传输路径。</text>
  <text class="label" x="60" y="947">shim 负责执行侧生命周期协作；主守护进程、shim、runc 和业务进程不是同一个对象，也不共享同一生命周期。</text>
</svg>
