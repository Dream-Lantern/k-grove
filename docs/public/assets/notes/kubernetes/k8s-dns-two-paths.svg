<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#2563EB" height="8" rx="4" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="45" font-weight="bold" x="70" y="96">DNS 查询与业务连接是两条不同路径</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">以普通 ClusterIP Service 为例：先解析 Service 名称，再由应用建立连接</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="88">15 / 20</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="166" y2="166" /><rect fill="#FFFFFF" height="184" rx="20" stroke="#D8E4F2" stroke-width="2" width="310" x="69" y="364" /><rect fill="#2563EB" height="184" rx="4" stroke="none" stroke-width="2" width="7" x="69" y="364" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" x="99" y="414">客户端 Pod</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="99" y="454">先查询 Service 名称，取得</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="99" y="484">目标地址。</text><rect fill="#FFFFFF" height="148" rx="20" stroke="#D8E4F2" stroke-width="2" width="390" x="517" y="210" /><rect fill="#7654E8" height="148" rx="4" stroke="none" stroke-width="2" width="7" x="517" y="210" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="547" y="260">CoreDNS / DNS 入口</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="547" y="300">根据 Service 记录回答名称查询。</text><rect fill="#FFFFFF" height="148" rx="20" stroke="#D8E4F2" stroke-width="2" width="390" x="515" y="532" /><rect fill="#12946B" height="148" rx="4" stroke="none" stroke-width="2" width="7" x="515" y="532" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="545" y="582">Service IP / 数据平面</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="545" y="622">将应用业务连接导向可用后端。</text><rect fill="#FFFFFF" height="148" rx="20" stroke="#D8E4F2" stroke-width="2" width="460" x="1045" y="532" /><rect fill="#D98419" height="148" rx="4" stroke="none" stroke-width="2" width="7" x="1045" y="532" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" x="1075" y="582">后端 Pod</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="1075" y="622">接收业务协议数据，而不是 DNS 查询。</text><path d="M 376,400 H 452 V 285 H 511" fill="none" stroke="#2563EB" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><line stroke="#2563EB" stroke-width="4" x1="506" x2="517" y1="285" y2="285" /><polygon fill="#2563EB" points="517,285 507.3465918192059,290.2736809246462 507.3465918192059,279.7263190753538" /><path d="M 517,333 H 450 V 448 H 379" fill="none" stroke="#7654E8" stroke-dasharray="9 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><line stroke="#7654E8" stroke-width="3" x1="390" x2="379" y1="448" y2="448" /><polygon fill="#7654E8" points="379,448 388.6534081807941,442.7263190753538 388.6534081807941,453.2736809246462" /><path d="M 379,493 H 452 V 606 H 509" fill="none" stroke="#12946B" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><line stroke="#12946B" stroke-width="4" x1="503" x2="515" y1="606" y2="606" /><polygon fill="#12946B" points="515,606 505.3465918192059,611.2736809246462 505.3465918192059,600.7263190753538" /><line stroke="#D98419" stroke-width="4" x1="906" x2="1043" y1="606" y2="606" /><polygon fill="#D98419" points="1043,606 1033.346591819206,611.2736809246462 1033.346591819206,600.7263190753538" /><rect fill="#EBF4FF" height="34" rx="17.0" stroke="none" stroke-width="2" width="150" x="425" y="211" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="500.0" y="235.14">① DNS 请求</text><rect fill="#E8F9F2" height="34" rx="17.0" stroke="none" stroke-width="2" width="167" x="395" y="510" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="478.5" y="534.14">② 业务连接</text><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#EBF4FF" r="20" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">CoreDNS 不代理应用 HTTP/TCP 业务流量；Headless Service 与缓存、NodeLocal DNS 的情形另行分析。</text></svg>