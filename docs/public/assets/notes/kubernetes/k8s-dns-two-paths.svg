<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
<title id="title">DNS 解析成功之后，应用才建立业务连接</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">DNS 解析成功之后，应用才建立业务连接</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">以普通 ClusterIP Service 为例；缓存、NodeLocal DNS 与返回路径省略。</tspan></text><rect x="350" y="120" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="157" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">客户端 Pod</tspan></text><text x="560.0" y="194" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">先解析服务名，再连接目标</tspan></text><rect x="40" y="380" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="250.0" y="417" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="250.0" dy="0">DNS 入口与 CoreDNS</tspan></text><text x="250.0" y="454" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="250.0" dy="0">解析服务名，返回 Service 地址</tspan></text><rect x="660" y="380" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="870.0" y="417" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="870.0" dy="0">Service 数据平面</tspan></text><text x="870.0" y="454" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="870.0" dy="0">处理发往 Service IP 的业务连接</tspan></text><path d="M430 230 L430 300 L250 300 L250 380" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 230 L690 300 L870 300 L870 380" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="250" y="345" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="250" dy="0">① 名称查询</tspan></text><text x="870" y="345" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="870" dy="0">② 应用业务连接</tspan></text><rect x="660" y="620" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="870.0" y="657" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="870.0" dy="0">后端 Pod</tspan></text><text x="870.0" y="694" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="870.0" dy="0">接收业务数据；不是 DNS 请求</tspan></text><path d="M870 490 L870 620" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560.0" y="782" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">CoreDNS 不替应用转发业务请求；Headless Service 的返回与连接路径另见正文。</tspan></text></g></svg>