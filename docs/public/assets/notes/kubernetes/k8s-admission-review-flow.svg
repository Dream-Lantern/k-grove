<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">AdmissionReview：API Server 发起两次独立调用</title><desc id="desc">Kubernetes 1.28 · 合成协议示例 · UID 001 / 002 为正文标识的缩写</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">AdmissionReview：API Server 发起两次独立调用</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Kubernetes 1.28 · 合成协议示例 · UID 001 / 002 为正文标识的缩写</text><rect x="65" y="190" width="340" height="310" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="90" y="235" font-size="26" font-weight="700" fill="#142D52">API Server（调用方）</text><text x="90" y="285" font-size="22" font-weight="400" fill="#142D52">请求 A：uid=001</text><text x="90" y="325" font-size="22" font-weight="400" fill="#142D52">Pod CREATE / dryRun</text><text x="90" y="390" font-size="22" font-weight="400" fill="#142D52">请求 B：uid=002</text><text x="90" y="430" font-size="22" font-weight="400" fill="#142D52">使用变更后的对象</text><rect x="660" y="190" width="775" height="140" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="685" y="230" font-size="26" font-weight="700" fill="#142D52">Mutating Webhook · 变更</text><text x="685" y="270" font-size="22" font-weight="400" fill="#142D52">响应 A：uid=001 / allowed=true</text><text x="685" y="308" font-size="22" font-weight="400" fill="#142D52">JSONPatch：补充 managed-by 标签</text><path d="M405 255L650 255" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="425" y="238" font-size="21" font-weight="400" fill="#142D52">AdmissionReview</text><path d="M660 310L415 310" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="430" y="345" font-size="20" font-weight="400" fill="#142D52">响应回到 API Server</text><rect x="660" y="380" width="775" height="140" rx="16" fill="#F2EFFF" stroke="#D8E4F2"/><text x="685" y="420" font-size="26" font-weight="700" fill="#142D52">Validating Webhook · 验证</text><text x="685" y="460" font-size="22" font-weight="400" fill="#142D52">响应 B：uid=002 / allowed=false</text><text x="685" y="498" font-size="22" font-weight="400" fill="#142D52">本例缺少 team → 拒绝，停止该写请求</text><path d="M405 415L650 415" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="430" y="398" font-size="20" font-weight="400" fill="#142D52">独立的下一次调用</text><path d="M660 485L415 485" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="430" y="518" font-size="20" font-weight="400" fill="#142D52">复制对应请求的 UID</text><rect x="65" y="570" width="1370" height="105" rx="16" fill="#FFF5E7" stroke="#D8E4F2"/><text x="90" y="610" font-size="25" font-weight="700" fill="#142D52">其他分支：所有适用准入允许 → 后续 API 校验与处理 → 成功或失败</text><text x="90" y="650" font-size="23" font-weight="400" fill="#142D52">普通写请求成功才持久化；本例 dryRun=true，即使全部允许也不持久化。</text><text x="65" y="725" font-size="23" font-weight="400" fill="#142D52">Webhook 之间没有直接调用箭头；配置对象也不是实际运行的 Webhook 服务。</text><text x="65" y="770" font-size="23" font-weight="400" fill="#142D52">仅展示主要职责，省略内置组件与其他校验；允许不代表 Pod 已经调度或运行。</text></g></svg>
