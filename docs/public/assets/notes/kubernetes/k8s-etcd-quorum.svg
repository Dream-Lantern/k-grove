<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#12946B" height="8" rx="4" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="45" font-weight="bold" x="70" y="96">etcd Raft：三投票成员的多数派</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">网络分区示例：A、B 互通，C 暂与左侧隔离</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="88">17 / 20</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="166" y2="166" /><rect fill="#E8F9F2" height="142" rx="20" stroke="#D8E4F2" stroke-width="2" width="930" x="72" y="207" /><rect fill="#12946B" height="142" rx="4" stroke="none" stroke-width="2" width="7" x="72" y="207" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" x="102" y="257">可形成多数的分区</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="102" y="297">A + B = 2 / 3（达到多数）；满足其他条件时可继续推进。</text><rect fill="#FFF0F1" height="142" rx="20" stroke="#D8E4F2" stroke-width="2" width="453" x="1069" y="207" /><rect fill="#D94D5C" height="142" rx="4" stroke="none" stroke-width="2" width="7" x="1069" y="207" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="1099" y="257">孤立分区</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="1099" y="297">C = 1 / 3（不够多数），不能单独确认可靠</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="1099" y="327">写入。</text><rect fill="#E8F9F2" height="140" rx="24" stroke="#B7DCCF" stroke-width="2" width="220" x="153" y="398" /><circle cx="263" cy="440" fill="#12946B" r="28" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" text-anchor="middle" x="263" y="450">A</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" text-anchor="middle" x="263" y="497">投票成员</text><rect fill="#E8F9F2" height="140" rx="24" stroke="#B7DCCF" stroke-width="2" width="220" x="563" y="398" /><circle cx="673" cy="440" fill="#12946B" r="28" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" text-anchor="middle" x="673" y="450">B</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" text-anchor="middle" x="673" y="497">投票成员</text><rect fill="#FFF0F1" height="140" rx="24" stroke="#F5C8CE" stroke-width="2" width="220" x="1186" y="398" /><circle cx="1296" cy="440" fill="#D94D5C" r="28" /><text fill="#FFFFFF" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" text-anchor="middle" x="1296" y="450">C</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" text-anchor="middle" x="1296" y="497">投票成员</text><line stroke="#12946B" stroke-width="5" x1="373" x2="563" y1="467" y2="467" /><path d="M 782,467 H 1163" fill="none" stroke="#D94D5C" stroke-dasharray="9 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#E8F9F2" height="34" rx="17.0" stroke="none" stroke-width="2" width="319" x="438" y="556" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="597.5" y="580.14">A ↔ B：通信正常</text><rect fill="#FFF0F1" height="34" rx="17.0" stroke="none" stroke-width="2" width="295" x="1072" y="556" /><text fill="#D94D5C" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="1219.5" y="580.14">C：暂时失联</text><rect fill="#EBF4FF" height="104" rx="19" stroke="#C8DEFC" stroke-width="2" width="1110" x="248" y="630" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="30" font-weight="bold" text-anchor="middle" x="800" y="677">多数 = floor(N / 2) + 1</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" text-anchor="middle" x="800" y="711">只计算投票成员；多数数量充足并不代表所有写入都能立即完成。</text><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#E8F9F2" r="20" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">是否可用仍受 Leader、通信延迟、日志复制和磁盘状态制约；2 投票成员无法容忍失去其中 1 个。</text></svg>