<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
<title id="title">三个投票成员：多数可用与孤立成员</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">三个投票成员：多数可用与孤立成员</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">示例假定左侧两成员互通、可工作；不承诺任意分区都可写。</tspan></text><rect x="30" y="135" width="690" height="455" rx="8" fill="#F8FBFF" stroke="#0369A1" stroke-dasharray="7 5"/><rect x="770" y="135" width="320" height="455" rx="8" fill="#F8FBFF" stroke="#94A3B8" stroke-dasharray="7 5"/><text x="375" y="185" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="375" dy="0">2 / 3：满足多数数量</tspan></text><text x="930" y="185" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="930" dy="0">1 / 3：不足多数</tspan></text><rect x="60" y="270" width="280" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="200.0" y="307" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="200.0" dy="0">成员 A</tspan></text><text x="200.0" y="344" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="200.0" dy="0">投票成员</tspan></text><rect x="410" y="270" width="280" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="550.0" y="307" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="550.0" dy="0">成员 B</tspan></text><text x="550.0" y="344" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="550.0" dy="0">投票成员</tspan></text><rect x="790" y="270" width="280" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="930.0" y="307" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="930.0" dy="0">成员 C</tspan></text><text x="930.0" y="344" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="930.0" dy="0">暂与左侧失联</tspan></text><path d="M340 310 L410 310" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M410 345 L340 345" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="375" y="470" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="375" dy="0">左侧可按协议继续推进</tspan><tspan x="375" dy="30">仍依赖选主、日志、磁盘与通信等条件</tspan></text><text x="930" y="470" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="930" dy="0">孤立成员不能单独</tspan><tspan x="930" dy="30">确认满足多数的更新</tspan></text><text x="560.0" y="652" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">投票多数 floor(N/2)+1；两个投票成员失去一个后无法维持多数。</tspan></text></g></svg>