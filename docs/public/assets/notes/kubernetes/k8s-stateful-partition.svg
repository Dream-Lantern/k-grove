<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">StatefulSet Partition：逐步放开更新范围</title><desc id="desc">Kubernetes 1.28 · 三成员教学推演 · 现有身份与 PVC 图保持原样</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">StatefulSet Partition：逐步放开更新范围</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Kubernetes 1.28 · 三成员教学推演 · 现有身份与 PVC 图保持原样</text><text x="65" y="190" font-size="25" font-weight="700" fill="#142D52">ledger / study · 默认序号 0、1、2 · 模板由 v1 改为 v2</text><text x="75" y="287" font-size="27" font-weight="700" fill="#142D52">partition=2</text><rect x="390" y="230" width="300" height="95" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="410" y="268" font-size="24" font-weight="700" fill="#142D52">ledger-0  ·  序号 0</text><text x="410" y="306" font-size="25" font-weight="700" fill="#142D52">v1</text><rect x="735" y="230" width="300" height="95" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="755" y="268" font-size="24" font-weight="700" fill="#142D52">ledger-1  ·  序号 1</text><text x="755" y="306" font-size="25" font-weight="700" fill="#142D52">v1</text><rect x="1080" y="230" width="300" height="95" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="1100" y="268" font-size="24" font-weight="700" fill="#142D52">ledger-2  ·  序号 2</text><text x="1100" y="306" font-size="25" font-weight="700" fill="#142D52">v2</text><path d="M260 310L260 345" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="75" y="407" font-size="27" font-weight="700" fill="#142D52">partition=1</text><rect x="390" y="350" width="300" height="95" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="410" y="388" font-size="24" font-weight="700" fill="#142D52">ledger-0  ·  序号 0</text><text x="410" y="426" font-size="25" font-weight="700" fill="#142D52">v1</text><rect x="735" y="350" width="300" height="95" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="755" y="388" font-size="24" font-weight="700" fill="#142D52">ledger-1  ·  序号 1</text><text x="755" y="426" font-size="25" font-weight="700" fill="#142D52">v2</text><rect x="1080" y="350" width="300" height="95" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="1100" y="388" font-size="24" font-weight="700" fill="#142D52">ledger-2  ·  序号 2</text><text x="1100" y="426" font-size="25" font-weight="700" fill="#142D52">v2</text><path d="M260 430L260 465" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="75" y="527" font-size="27" font-weight="700" fill="#142D52">partition=0</text><rect x="390" y="470" width="300" height="95" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="410" y="508" font-size="24" font-weight="700" fill="#142D52">ledger-0  ·  序号 0</text><text x="410" y="546" font-size="25" font-weight="700" fill="#142D52">v2</text><rect x="735" y="470" width="300" height="95" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="755" y="508" font-size="24" font-weight="700" fill="#142D52">ledger-1  ·  序号 1</text><text x="755" y="546" font-size="25" font-weight="700" fill="#142D52">v2</text><rect x="1080" y="470" width="300" height="95" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="1100" y="508" font-size="24" font-weight="700" fill="#142D52">ledger-2  ·  序号 2</text><text x="1100" y="546" font-size="25" font-weight="700" fill="#142D52">v2</text><rect x="65" y="620" width="1370" height="90" rx="16" fill="#FFF5E7" stroke="#D8E4F2"/><text x="90" y="658" font-size="23" font-weight="700" fill="#142D52">失败分支：高序号 ledger-2 不 Ready → 更新可能卡住，恢复旧模板也未必立即恢复实例。</text><text x="90" y="695" font-size="22" font-weight="400" fill="#142D52">先核对成员、旧进程退出、存储挂载与数据兼容性，再考虑受控处理；不强删全部成员。</text><text x="65" y="755" font-size="23" font-weight="400" fill="#142D52">每行是该阶段完成后的目标版本；序号 ≥ partition 进入更新范围，不代表同时替换。</text><text x="65" y="795" font-size="23" font-weight="400" fill="#142D52">partition 是序号阈值，不是流量百分比；Parallel 不保证滚动更新全部并发。</text></g></svg>
