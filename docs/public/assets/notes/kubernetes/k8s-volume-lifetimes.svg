<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#12946B" height="8" rx="4" stroke="none" stroke-width="2" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="40" font-weight="bold" x="69" y="98">Volume 生命周期：先问数据属于谁</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">四种数据所属层级是并列比较；不是从一层向下一层的自动迁移路径</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="88">38 / 38</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="166" y2="166" /><rect fill="#EBF4FF" height="120" rx="18" stroke="#BDD8FF" stroke-width="2" width="1410" x="94" y="198" /><rect fill="#FFFFFF" height="69" rx="17" stroke="none" stroke-width="2" width="69" x="114" y="222" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="148" y="267">1</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" x="215" y="243">容器可写层</text><rect fill="#EBF4FF" height="37" rx="18.5" stroke="none" stroke-width="2" width="225" x="585" y="221" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="697.5" y="247.27">容器实例相关</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="833" y="248">容器替换不承诺保留原可写层。</text><rect fill="#F2EFFF" height="120" rx="18" stroke="#DCD5F8" stroke-width="2" width="1410" x="94" y="344" /><rect fill="#FFFFFF" height="69" rx="17" stroke="none" stroke-width="2" width="69" x="114" y="368" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="148" y="413">2</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" x="215" y="389">emptyDir</text><rect fill="#F2EFFF" height="37" rx="18.5" stroke="none" stroke-width="2" width="225" x="585" y="367" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="697.5" y="393.27">Pod 生命周期</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="833" y="394">普通容器重启可保留；Pod 结束后数据不保留。</text><rect fill="#FFF5E7" height="120" rx="18" stroke="#F5DEB9" stroke-width="2" width="1410" x="94" y="490" /><rect fill="#FFFFFF" height="69" rx="17" stroke="none" stroke-width="2" width="69" x="114" y="514" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="148" y="559">3</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" x="215" y="535">hostPath</text><rect fill="#FFF5E7" height="37" rx="18.5" stroke="none" stroke-width="2" width="225" x="585" y="513" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="697.5" y="539.27">指定 Node 路径</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="833" y="540">路径在本机；换节点不自动迁移相同数据。</text><rect fill="#E8F9F2" height="120" rx="18" stroke="#BCE7D2" stroke-width="2" width="1410" x="94" y="636" /><rect fill="#FFFFFF" height="69" rx="17" stroke="none" stroke-width="2" width="69" x="114" y="660" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="148" y="705">4</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" x="215" y="681">NFS / 持久后端</text><rect fill="#E8F9F2" height="37" rx="18.5" stroke="none" stroke-width="2" width="225" x="585" y="659" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="697.5" y="685.27">后端独立管理</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="833" y="686">数据独立于单个 Pod；仍需校验权限、备份和恢复。</text><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#E8F9F2" r="20" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">同一个 Volume 可被不同容器挂载到不同路径；数据是否可读写仍取决于权限和访问方式。</text></svg>