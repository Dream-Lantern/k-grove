<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">HPA 异构 CPU Request：先聚合总量，再计算利用率</title><desc id="desc">Kubernetes v1.28.0 · 独立纸面算例，不与 catalog 等 Request 清单混用</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">HPA 异构 CPU Request：先聚合总量，再计算利用率</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Kubernetes v1.28.0 · 独立纸面算例，不与 catalog 等 Request 清单混用</text><text x="65" y="190" font-size="24" font-weight="700" fill="#142D52">前提：完整有效 CPU 指标、两个 Pod 满足纳入条件；目标利用率 50%</text><rect x="65" y="230" width="650" height="170" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="90" y="270" font-size="28" font-weight="700" fill="#142D52">Pod A</text><text x="90" y="315" font-size="25" font-weight="400" fill="#142D52">CPU Request = 100m</text><text x="90" y="360" font-size="23" font-weight="400" fill="#142D52">CPU Usage = 100m；单 Pod 利用率 100%</text><rect x="785" y="230" width="650" height="170" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="810" y="270" font-size="28" font-weight="700" fill="#142D52">Pod B</text><text x="810" y="315" font-size="25" font-weight="400" fill="#142D52">CPU Request = 900m</text><text x="810" y="360" font-size="23" font-weight="400" fill="#142D52">CPU Usage = 300m；单 Pod 利用率 约 33.3%</text><rect x="65" y="445" width="1370" height="100" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="90" y="485" font-size="28" font-weight="700" fill="#142D52">正确聚合：(100m + 300m) / (100m + 900m) × 100% = 40%</text><text x="90" y="525" font-size="25" font-weight="700" fill="#142D52">基础副本建议：ceil(2 × 40 / 50) = 2</text><rect x="65" y="580" width="1370" height="85" rx="16" fill="#FFF0F1" stroke="#D8E4F2"/><text x="90" y="617" font-size="25" font-weight="700" fill="#142D52">不能等权平均：(100% + 33.3%) / 2 ≈ 66.7%</text><text x="90" y="651" font-size="23" font-weight="400" fill="#142D52">错误地用 66.7% 代入，会得到 3；两 Pod 的 Request 并不相等。</text><text x="65" y="735" font-size="23" font-weight="400" fill="#142D52">v1.28.0 先按总量计算整数百分比，再求目标比值；不是每 Pod 百分比直接平均。</text><text x="65" y="780" font-size="22" font-weight="400" fill="#142D52">缺失/未就绪、容忍区间、min/max 和行为策略还会影响最终输出；不是所有指标的通式。</text></g></svg>
