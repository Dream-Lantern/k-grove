<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#D98419" height="8" rx="4" stroke="none" stroke-width="2" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="42" font-weight="bold" x="69" y="98">Job / CronJob：执行重试与业务幂等</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">Kubernetes 追踪 Pod 尝试和完成条件，但不会自动保证外部业务效果 exactly-once</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="87">22 / 38</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="165" y2="165" /><rect fill="#FFFFFF" height="243" rx="20" stroke="#D8E4F2" stroke-width="2" width="349" x="62" y="254" /><rect fill="#2563EB" height="243" rx="4" stroke="none" stroke-width="2" width="7" x="62" y="254" /><rect fill="#EBF4FF" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="84" y="277" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="109" y="311">1</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="152" y="304">创建任务</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="152" y="344">手工 Job 或 CronJob 按</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="152" y="374">计划创建 Job。</text><line stroke="#2563EB" stroke-width="4" x1="411" x2="438" y1="374" y2="374" /><polygon fill="#2563EB" points="438,374 428.3465918192059,379.2736809246462 428.3465918192059,368.7263190753538" /><rect fill="#FFFFFF" height="243" rx="20" stroke="#D8E4F2" stroke-width="2" width="349" x="442" y="254" /><rect fill="#7654E8" height="243" rx="4" stroke="none" stroke-width="2" width="7" x="442" y="254" /><rect fill="#F2EFFF" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="464" y="277" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="489" y="311">2</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="532" y="304">Pod 执行尝试</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="532" y="344">容器运行可能失败；Job </text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="532" y="374">可依策略重试。</text><line stroke="#2563EB" stroke-width="4" x1="791" x2="818" y1="374" y2="374" /><polygon fill="#2563EB" points="818,374 808.3465918192059,379.2736809246462 808.3465918192059,368.7263190753538" /><rect fill="#FFFFFF" height="243" rx="20" stroke="#D8E4F2" stroke-width="2" width="349" x="822" y="254" /><rect fill="#D98419" height="243" rx="4" stroke="none" stroke-width="2" width="7" x="822" y="254" /><rect fill="#FFF5E7" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="844" y="277" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="869" y="311">3</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="912" y="304">外部业务副作用</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="912" y="344">写数据库、扣款、通知等</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="912" y="374">需业务去重或幂等。</text><line stroke="#2563EB" stroke-width="4" x1="1171" x2="1198" y1="374" y2="374" /><polygon fill="#2563EB" points="1198,374 1188.346591819206,379.2736809246462 1188.346591819206,368.7263190753538" /><rect fill="#FFFFFF" height="243" rx="20" stroke="#D8E4F2" stroke-width="2" width="349" x="1202" y="254" /><rect fill="#12946B" height="243" rx="4" stroke="none" stroke-width="2" width="7" x="1202" y="254" /><rect fill="#E8F9F2" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="1224" y="277" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="1249" y="311">4</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="1292" y="304">完成与清理</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="1292" y="344">记录完成状态；历史清理</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="1292" y="374">不替代业务审计。</text><rect fill="#FFF0F1" height="125" rx="17" stroke="#F7D6D8" stroke-width="2" width="650" x="116" y="563" /><text fill="#D94D5C" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="137" y="597">故障与重试</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="137" y="632">同一业务事件可能由不同 Pod 尝试重复执行。</text><rect fill="#E8F9F2" height="125" rx="17" stroke="#C1EADA" stroke-width="2" width="650" x="832" y="563" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="853" y="597">业务幂等边界</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="853" y="632">用稳定业务键、唯一约束或幂等协议限制重复效果。</text><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#FFF5E7" r="20" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">CronJob 的计划触发与 Job 完成计数不等于外部世界“只产生一次结果”；不要将失败重试简单关闭。</text></svg>