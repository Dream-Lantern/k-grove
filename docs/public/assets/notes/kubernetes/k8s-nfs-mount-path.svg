<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">NFS 挂载：远端服务器、节点客户端与容器路径</title><desc id="desc">Linux Kubernetes 1.28 · 示意关系，不执行挂载、服务端改配或数据操作</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">NFS 挂载：远端服务器、节点客户端与容器路径</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Linux Kubernetes 1.28 · 示意关系，不执行挂载、服务端改配或数据操作</text><text x="65" y="195" font-size="25" font-weight="700" fill="#142D52">独立依赖：导出目录、节点挂载支持、网络、身份映射和文件权限</text><rect x="65" y="250" width="390" height="270" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="85" y="295" font-size="28" font-weight="700" fill="#142D52">NFS Server</text><text x="85" y="350" font-size="22" font-weight="400" fill="#142D52">远端导出目录 /exports/study</text><text x="85" y="405" font-size="22" font-weight="400" fill="#142D52">示例地址 192.0.2.10</text><text x="85" y="460" font-size="22" font-weight="400" fill="#142D52">由服务端独立管理数据</text><rect x="555" y="250" width="400" height="270" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="575" y="295" font-size="28" font-weight="700" fill="#142D52">Node</text><text x="575" y="350" font-size="22" font-weight="400" fill="#142D52">NFS 客户端工具与内核支持</text><text x="575" y="405" font-size="22" font-weight="400" fill="#142D52">kubelet 协调节点挂载</text><text x="575" y="460" font-size="22" font-weight="400" fill="#142D52">网络和适用协议须可用</text><rect x="1055" y="250" width="380" height="270" rx="16" fill="#F2EFFF" stroke="#D8E4F2"/><text x="1075" y="295" font-size="28" font-weight="700" fill="#142D52">Pod / Container</text><text x="1075" y="350" font-size="22" font-weight="400" fill="#142D52">卷声明指向远端导出</text><text x="1075" y="405" font-size="22" font-weight="400" fill="#142D52">挂载到容器 /input</text><text x="1075" y="460" font-size="22" font-weight="400" fill="#142D52">本例只读，不修改远端数据</text><path d="M460 350L545 350" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M545 390L460 390" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="460" y="325" font-size="19" font-weight="400" fill="#142D52">网络 I/O</text><path d="M960 365L1045 365" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="965" y="335" font-size="19" font-weight="400" fill="#142D52">卷挂载</text><rect x="65" y="580" width="1370" height="100" rx="16" fill="#FFF5E7" stroke="#D8E4F2"/><text x="90" y="620" font-size="25" font-weight="700" fill="#142D52">失败分层：服务端与导出 → 节点与网络 → 身份/权限与挂载选项 → 应用 I/O</text><text x="90" y="660" font-size="22" font-weight="400" fill="#142D52">挂载超时、Permission denied、部分节点失败不应都靠重启服务或关闭 root squash 处理。</text><text x="65" y="740" font-size="23" font-weight="400" fill="#142D52">图示为已有 NFS 服务的访问依赖，不表示 Pod 自动创建 NFS Server。</text><text x="65" y="785" font-size="23" font-weight="400" fill="#142D52">192.0.2.10 是文档地址；共享不等于并发写一致性或备份，本轮不执行 NFS 运维。</text></g></svg>
