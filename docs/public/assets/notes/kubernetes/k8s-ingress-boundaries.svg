<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#2563EB" height="8" rx="4" stroke="none" stroke-width="2" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="42" font-weight="bold" x="69" y="98">Ingress：规则、控制器和流量路径</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">Ingress 对象声明入口路由；实际流量由控制器所部署的数据平面处理</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="87">21 / 38</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="165" y2="165" /><rect fill="#F2EFFF" height="39" rx="19.5" stroke="none" stroke-width="2" width="195" x="82" y="196" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="179.5" y="223.69">① 控制关系</text><rect fill="#FFFFFF" height="150" rx="20" stroke="#D8E4F2" stroke-width="2" width="648" x="83" y="248" /><rect fill="#7654E8" height="150" rx="4" stroke="none" stroke-width="2" width="7" x="83" y="248" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="113" y="298">Ingress 对象（声明规则）</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" x="113" y="338">按 Host / Path 引用 Service；仅创建规则对象不会安装代理</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" x="113" y="370">。</text><rect fill="#FFFFFF" height="150" rx="20" stroke="#D8E4F2" stroke-width="2" width="648" x="867" y="248" /><rect fill="#12946B" height="150" rx="4" stroke="none" stroke-width="2" width="7" x="867" y="248" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="897" y="298">Ingress Controller</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="22" font-weight="normal" x="897" y="338">Watch 规则，配置代理及相应 TLS、转发行为。</text><line stroke="#7654E8" stroke-width="4" x1="732" x2="862" y1="322" y2="322" /><polygon fill="#7654E8" points="862,322 852.3465918192059,327.2736809246462 852.3465918192059,316.7263190753538" /><rect fill="#EBF4FF" height="39" rx="19.5" stroke="none" stroke-width="2" width="220" x="82" y="436" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="192.0" y="463.69">② 业务数据路径</text><rect fill="#FFFFFF" height="156" rx="20" stroke="#D8E4F2" stroke-width="2" width="405" x="83" y="494" /><rect fill="#2563EB" height="156" rx="4" stroke="none" stroke-width="2" width="7" x="83" y="494" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="113" y="544">外部客户端 / 入口</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="113" y="584">DNS、外部 LB 或节点入口需另行配置</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="113" y="614">。</text><rect fill="#FFFFFF" height="156" rx="20" stroke="#D8E4F2" stroke-width="2" width="409" x="592" y="494" /><rect fill="#12946B" height="156" rx="4" stroke="none" stroke-width="2" width="7" x="592" y="494" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="622" y="544">实际代理数据平面</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="622" y="584">匹配 Host / Path，路由到应用后端。</text><rect fill="#FFFFFF" height="156" rx="20" stroke="#D8E4F2" stroke-width="2" width="411" x="1105" y="494" /><rect fill="#D98419" height="156" rx="4" stroke="none" stroke-width="2" width="7" x="1105" y="494" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="1135" y="544">可用端点 / Pod</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="1135" y="584">Service 是配置中的后端引用。</text><line stroke="#2563EB" stroke-width="4" x1="491" x2="585" y1="568" y2="568" /><polygon fill="#2563EB" points="585,568 575.3465918192059,573.2736809246462 575.3465918192059,562.7263190753538" /><line stroke="#12946B" stroke-width="4" x1="1005" x2="1098" y1="568" y2="568" /><polygon fill="#12946B" points="1098,568 1088.346591819206,573.2736809246462 1088.346591819206,562.7263190753538" /><path d="M 1191,401 V 462 H 797 V 488" fill="none" stroke="#7654E8" stroke-dasharray="9 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" /><rect fill="#F2EFFF" height="37" rx="18.5" stroke="none" stroke-width="2" width="320" x="887" y="411" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="1047.0" y="437.27">规则同步（不是数据包）</text><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#EBF4FF" r="20" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">某些 Ingress Controller 直接向 Endpoint/Pod 转发，不要求每个请求先经过 Service ClusterIP；实现依控制器而定。</text></svg>