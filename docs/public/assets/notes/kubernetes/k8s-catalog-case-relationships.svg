<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">catalog：对象关系与控制职责</title><desc id="desc">Kubernetes 1.28 · 合成应用契约 · 不代表镜像可运行或已完成集群实验</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">catalog：对象关系与控制职责</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Kubernetes 1.28 · 合成应用契约 · 不代表镜像可运行或已完成集群实验</text><rect x="65" y="170" width="1370" height="555" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="90" y="210" font-size="25" font-weight="700" fill="#142D52">Namespace：study</text><rect x="90" y="250" width="350" height="85" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="105" y="283" font-size="24" font-weight="700" fill="#142D52">Deployment / catalog</text><text x="105" y="316" font-size="20" font-weight="400" fill="#142D52">期望副本数：初始 2</text><rect x="570" y="250" width="350" height="85" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="585" y="283" font-size="24" font-weight="700" fill="#142D52">ReplicaSet</text><text x="585" y="316" font-size="20" font-weight="400" fill="#142D52">跟踪并补齐 Pod 副本</text><rect x="1050" y="250" width="350" height="85" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="1065" y="283" font-size="24" font-weight="700" fill="#142D52">Pod · app=catalog</text><text x="1065" y="316" font-size="20" font-weight="400" fill="#142D52">app 监听 0.0.0.0:8080</text><rect x="90" y="475" width="350" height="85" rx="16" fill="#F2EFFF" stroke="#D8E4F2"/><text x="105" y="508" font-size="24" font-weight="700" fill="#142D52">HPA（可选）</text><text x="105" y="541" font-size="20" font-weight="400" fill="#142D52">通过 Scale 调整期望副本</text><rect x="570" y="475" width="350" height="85" rx="16" fill="#FFF5E7" stroke="#D8E4F2"/><text x="585" y="508" font-size="24" font-weight="700" fill="#142D52">ConfigMap</text><text x="585" y="541" font-size="20" font-weight="400" fill="#142D52">catalog-config → 卷文件</text><rect x="1050" y="475" width="350" height="85" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="1065" y="508" font-size="24" font-weight="700" fill="#142D52">Service / catalog</text><text x="1065" y="541" font-size="20" font-weight="400" fill="#142D52">port 80 → targetPort http</text><rect x="570" y="625" width="350" height="85" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="585" y="658" font-size="24" font-weight="700" fill="#142D52">EndpointSlice</text><text x="585" y="691" font-size="20" font-weight="400" fill="#142D52">后端地址与 ready 等条件</text><path d="M440 292L560 292" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="460" y="275" font-size="18" font-weight="400" fill="#142D52">所有权</text><path d="M920 292L1040 292" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="940" y="275" font-size="18" font-weight="400" fill="#142D52">所有权</text><path d="M265 475 V345" stroke="#7654CE" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/><text x="285" y="410" font-size="21" font-weight="400" fill="#142D52">Scale 控制</text><path d="M745 475 V425 H1215 V345" stroke="#C88323" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/><text x="765" y="410" font-size="20" font-weight="400" fill="#142D52">Volume：配置引用</text><path d="M1365 475 V345" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow)"/><text x="1065" y="380" font-size="20" font-weight="400" fill="#142D52">标签选择</text><text x="1065" y="405" font-size="19" font-weight="400" fill="#142D52">app=catalog</text><path d="M1225 560L1225 667" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1225 667L930 667" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="960" y="645" font-size="20" font-weight="400" fill="#142D52">Service 所有权</text><text x="90" y="600" font-size="21" font-weight="700" fill="#142D52">EndpointSlice Controller：</text><text x="90" y="635" font-size="21" font-weight="400" fill="#142D52">观察 Service 与 Pod，</text><text x="90" y="670" font-size="21" font-weight="400" fill="#142D52">维护后端地址和条件。</text><text x="65" y="770" font-size="22" font-weight="400" fill="#142D52">实线：所有权 / 生命周期关联；虚线：按标签标明 Scale 控制、配置引用或标签选择。</text><text x="65" y="810" font-size="22" font-weight="400" fill="#142D52">Service 不管理 Deployment；HPA 不直接创建 Pod；ConfigMap 不直接调用应用。</text></g></svg>
