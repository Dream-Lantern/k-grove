<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">云集成：负载均衡与存储是不同职责</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">云集成：负载均衡与存储是不同职责</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">箭头表示协调关系，不是用户业务数据的固定转发时序。</tspan></text><rect x="60" y="140" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="270.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="270.0" dy="0">Service 等对象</tspan></text><text x="270.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="270.0" dy="0">表达入口等适用期望</tspan></text><rect x="640" y="140" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="850.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="850.0" dy="0">PVC / PV / StorageClass</tspan></text><text x="850.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="850.0" dy="0">表达存储需求及关联</tspan></text><rect x="60" y="380" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="270.0" y="417" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="270.0" dy="0">CCM 与提供者集成</tspan></text><text x="270.0" y="454" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="270.0" dy="0">协调适用的节点、路由与服务</tspan></text><rect x="640" y="380" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="850.0" y="417" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="850.0" dy="0">CSI 等存储机制</tspan></text><text x="850.0" y="454" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="850.0" dy="0">供应、附加、挂载各有分工</tspan></text><rect x="60" y="620" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="270.0" y="657" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="270.0" dy="0">云网络 / 负载均衡</tspan></text><text x="270.0" y="694" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="270.0" dy="0">相应数据平面，能力依实现</tspan></text><rect x="640" y="620" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="850.0" y="657" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="850.0" dy="0">云存储后端</tspan></text><text x="850.0" y="694" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="850.0" dy="0">权限、回收与备份独立核对</tspan></text><path d="M270 250 L270 380" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M850 250 L850 380" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M270 490 L270 620" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M850 490 L850 620" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560.0" y="812" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">云 DNS 等集成未画出；裸机无需虚构云集成，CCM 不承包全部存储职责。</tspan></text></g></svg>