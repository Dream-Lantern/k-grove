<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">Pod 网络：两节点布局与跨节点路径</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">Pod 网络：两节点布局与跨节点路径</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">延续原图的节点分组；不把 Overlay 当成所有 CNI 方案的必要条件。</tspan></text><rect x="35" y="125" width="490" height="580" rx="10" fill="#F8FBFF" stroke="#0369A1" stroke-dasharray="7 5"/><text x="280" y="165" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="280" dy="0">Node A</tspan></text><rect x="595" y="125" width="490" height="580" rx="10" fill="#F8FBFF" stroke="#0369A1" stroke-dasharray="7 5"/><text x="840" y="165" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="840" dy="0">Node B</tspan></text><rect x="80" y="220" width="400" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="280.0" y="257" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="280.0" dy="0">Pod A</tspan></text><text x="280.0" y="294" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="280.0" dy="0">普通 Pod：独立网络命名空间</tspan></text><rect x="640" y="220" width="400" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="840.0" y="257" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="840.0" dy="0">Pod B</tspan></text><text x="840.0" y="294" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="840.0" dy="0">普通 Pod：独立网络命名空间</tspan></text><rect x="80" y="460" width="400" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="280.0" y="497" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="280.0" dy="0">节点网络 / 数据平面</tspan></text><text x="280.0" y="534" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="280.0" dy="0">接口、路由与策略等机制</tspan></text><rect x="640" y="460" width="400" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="840.0" y="497" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="840.0" dy="0">节点网络 / 数据平面</tspan></text><text x="840.0" y="534" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="840.0" dy="0">接口、路由与策略等机制</tspan></text><path d="M280 330 L280 460" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 515 L640 515" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M840 460 L840 330" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="430" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560" dy="0">跨节点可采用隧道、原生路由或云网络等</tspan></text><text x="560" y="650" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560" dy="0">运行时通过 CNI 建立网络连接；CNI 调用不是每个数据包的中转站。</tspan></text><text x="560.0" y="812" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">省略网桥、veth、封装与回程细节；NetworkPolicy 是否生效取决于实现。</tspan></text></g></svg>