18192059,391.2736809246462 965.3465918192059,380.7263190753538" /><rect fill="#FFFFFF" height="237" rx="20" stroke="#D8E4F2" stroke-width="2" width="280" x="978" y="275" /><rect fill="#12946B" height="237" rx="4" stroke="none" stroke-width="2" width="7" x="978" y="275" /><rect fill="#E8F9F2" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="1000" y="298" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="1025" y="332">4</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="1068" y="325">应用就绪</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="1068" y="365">容器退出 / 探针 / </text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="1068" y="394">配置 / 资源</text><line stroke="#2563EB" stroke-width="2.6" x1="1260" x2="1280" y1="386" y2="386" /><polygon fill="#2563EB" points="1280,386 1270.346591819206,391.2736809246462 1270.346591819206,380.7263190753538" /><rect fill="#FFFFFF" height="237" rx="20" stroke="#D8E4F2" stroke-width="2" width="280" x="1283" y="275" /><rect fill="#D94D5C" height="237" rx="4" stroke="none" stroke-width="2" width="7" x="1283" y="275" /><rect fill="#FFF0F1" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="1305" y="298" /><text fill="#D94D5C" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="1330" y="332">5</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="1373" y="325">连接与数据</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="1373" y="365">DNS / Service / 网</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="1373" y="394">络 / 存储 / 应用</text><rect fill="#EBF4FF" height="131" rx="17" stroke="#CBDFF8" stroke-width="2" width="697" x="86" y="583" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="108" y="618">分层取证</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="108" y="659">事件、对象状态、容器日志和指标要与故障时间窗口关联。</text><rect fill="#FFF0F1" height="131" rx="17" stroke="#F6CBD0" stroke-width="2" width="697" x="816" y="583" /><text fill="#D94D5C" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="838" y="618">避免无证据修复</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="838" y="659">不要先全量重启、删 Pod、关闭策略或清空规则。</text><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#FFF5E7" r="20" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">不同故障可同时发生；分层是缩小排查范围，不是声称根因只有一处。</text></svg>