<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#7654E8" height="8" rx="4" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="45" font-weight="bold" x="70" y="96">DRA：先确认 Kubernetes 版本，再讨论资源模型</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">Dynamic Resource Allocation 的对象与驱动机制随版本演进；旧模型不可当作新版替代</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="88">16 / 20</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="166" y2="166" /><rect fill="#EBF4FF" height="339" rx="20" stroke="#D8E4F2" stroke-width="2" width="684" x="85" y="240" /><rect fill="#2563EB" height="339" rx="4" stroke="none" stroke-width="2" width="7" x="85" y="240" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" x="115" y="290">Kubernetes v1.28 · Alpha</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="23" font-weight="normal" x="115" y="330">历史模型：ResourceClass / ResourceClaim</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="23" font-weight="normal" x="115" y="363">ResourceClaimTemplate / PodSchedulingContext</text><rect fill="#F2EFFF" height="339" rx="20" stroke="#D8E4F2" stroke-width="2" width="684" x="831" y="240" /><rect fill="#7654E8" height="339" rx="4" stroke="none" stroke-width="2" width="7" x="831" y="240" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" x="861" y="290">后续版本 · 新资源模型</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="23" font-weight="normal" x="861" y="330">例如 DeviceClass / ResourceSlice：必须使用对应版本的 API</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="23" font-weight="normal" x="861" y="363">、驱动与配置说明。</text><rect fill="#EBF4FF" height="42" rx="21.0" stroke="none" stroke-width="2" width="360" x="141" y="493" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="321.0" y="522.82">需要显式启用与驱动条件</text><rect fill="#F2EFFF" height="42" rx="21.0" stroke="none" stroke-width="2" width="360" x="885" y="493" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="1065.0" y="522.82">不能机械套用 1.28 文档</text><rect fill="#E8F9F2" height="105" rx="18" stroke="#B8EAD5" stroke-width="2" width="1430" x="85" y="621" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="126" y="670">无论版本，硬件分区、共享、准备与回收，都取决于实际驱动和设备能力</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="126" y="701">本图表示阅读与设计的边界，不代表对象会自动迁移或已在真实集群运行验证。</text><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#F2EFFF" r="20" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">明确版本、Feature Gate、资源驱动与硬件能力后，再选择模型；本文不声称进行过 DRA 实验。</text></svg>