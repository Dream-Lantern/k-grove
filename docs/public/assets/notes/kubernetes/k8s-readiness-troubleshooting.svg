<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">Readiness 失败：每次用证据验证一个假设</title><desc id="desc">study / catalog · v1 → v2 · 合成教学案例，不是真实运行记录</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">Readiness 失败：每次用证据验证一个假设</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">study / catalog · v1 → v2 · 合成教学案例，不是真实运行记录</text><rect x="65" y="180" width="1370" height="70" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="90" y="225" font-size="26" font-weight="700" fill="#142D52">现象：catalog v2 Running，但 readiness 失败；旧 v1 仍健康</text><path d="M370 250L370 280" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="65" y="285" width="610" height="150" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="90" y="325" font-size="26" font-weight="700" fill="#142D52">初始假设：CPU 不足</text><text x="90" y="370" font-size="22" font-weight="400" fill="#142D52">证据：CPU / 限流监控正常</text><text x="90" y="408" font-size="23" font-weight="700" fill="#142D52">当前证据不支持 → 记录并换假设</text><path d="M675 360L815 360" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="695" y="335" font-size="20" font-weight="400" fill="#142D52">下一假设</text><rect x="825" y="285" width="610" height="150" rx="16" fill="#F2EFFF" stroke="#D8E4F2"/><text x="850" y="325" font-size="25" font-weight="700" fill="#142D52">假设：探针与监听端口不一致</text><text x="850" y="370" font-size="22" font-weight="400" fill="#142D52">证据：探针 9090；启动配置 / 日志 8080</text><text x="850" y="408" font-size="23" font-weight="700" fill="#142D52">支持解释 → 继续核对路径和实际监听</text><path d="M1130 435L1130 485" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="825" y="490" width="610" height="125" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="850" y="530" font-size="25" font-weight="700" fill="#142D52">受控验证：只修改探针端口</text><text x="850" y="575" font-size="22" font-weight="400" fill="#142D52">另行授权环境实施；本章未执行</text><path d="M825 550L685 550" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="705" y="530" font-size="20" font-weight="400" fill="#142D52">观察结果</text><rect x="65" y="490" width="610" height="125" rx="16" fill="#FFF5E7" stroke="#D8E4F2"/><text x="90" y="530" font-size="25" font-weight="700" fill="#142D52">不成功：保留结果，提出下一假设</text><text x="90" y="575" font-size="22" font-weight="400" fill="#142D52">成功：仍需新版本业务与端点验收</text><path d="M370 615L370 660" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="395" y="645" font-size="20" font-weight="400" fill="#142D52">验证成功后</text><rect x="65" y="665" width="1370" height="85" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="90" y="700" font-size="23" font-weight="700" fill="#142D52">修复后验收：新 Pod Ready + 发布完成 + EndpointSlice + 确实命中新版的业务请求</text><text x="90" y="735" font-size="22" font-weight="400" fill="#142D52">覆盖原故障触发条件的观察窗口；旧副本的成功响应不能替代新版本验收。</text><text x="65" y="795" font-size="22" font-weight="400" fill="#142D52">教学推演：证据支持假设，不等于已经完成修复验证；不要把端口错误画成所有 Readiness 故障的根因。</text></g></svg>
