<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">CronJob 并发策略：重叠、跳过与替换</title><desc id="desc">Kubernetes 1.28 · 纸面时间线 · 注意 Forbid 的截止窗口前提</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">CronJob 并发策略：重叠、跳过与替换</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Kubernetes 1.28 · 纸面时间线 · 注意 Forbid 的截止窗口前提</text><text x="305" y="190" font-size="23" font-weight="700" fill="#142D52">10:00</text><path d="M330 205V685" stroke="#D8E4F2" stroke-dasharray="5 6"/><text x="545" y="190" font-size="23" font-weight="700" fill="#142D52">10:02</text><path d="M570 205V685" stroke="#D8E4F2" stroke-dasharray="5 6"/><text x="785" y="190" font-size="23" font-weight="700" fill="#142D52">10:04</text><path d="M810 205V685" stroke="#D8E4F2" stroke-dasharray="5 6"/><text x="1025" y="190" font-size="23" font-weight="700" fill="#142D52">10:06</text><path d="M1050 205V685" stroke="#D8E4F2" stroke-dasharray="5 6"/><text x="65" y="270" font-size="28" font-weight="700" fill="#142D52">Allow</text><text x="65" y="310" font-size="23" font-weight="400" fill="#142D52">允许重叠</text><rect x="330" y="230" width="360" height="38" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="342" y="257" font-size="21" font-weight="700" fill="#142D52">A  10:00–10:03</text><rect x="570" y="280" width="360" height="38" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="582" y="307" font-size="21" font-weight="700" fill="#142D52">B  10:02–10:05</text><rect x="810" y="330" width="360" height="38" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="822" y="357" font-size="21" font-weight="700" fill="#142D52">C  10:04–10:07</text><text x="65" y="450" font-size="28" font-weight="700" fill="#142D52">Forbid</text><text x="65" y="490" font-size="23" font-weight="400" fill="#142D52">活跃时跳过</text><rect x="330" y="415" width="360" height="40" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="342" y="443" font-size="21" font-weight="700" fill="#142D52">A  10:00–10:03</text><rect x="810" y="415" width="360" height="40" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="822" y="443" font-size="21" font-weight="700" fill="#142D52">C  10:04–10:07</text><text x="520" y="500" font-size="22" font-weight="700" fill="#D94D5C">× 10:02 跳过，本例窗口在 A 结束前关闭</text><text x="65" y="610" font-size="28" font-weight="700" fill="#142D52">Replace</text><text x="65" y="650" font-size="23" font-weight="400" fill="#142D52">请求替换</text><rect x="330" y="575" width="230" height="45" rx="16" fill="#FFF5E7" stroke="#D8E4F2"/><text x="338" y="605" font-size="21" font-weight="700" fill="#142D52">A → 请求终止</text><rect x="570" y="575" width="230" height="45" rx="16" fill="#FFF5E7" stroke="#D8E4F2"/><text x="578" y="605" font-size="21" font-weight="700" fill="#142D52">B → 请求终止</text><rect x="810" y="575" width="230" height="45" rx="16" fill="#FFF5E7" stroke="#D8E4F2"/><text x="818" y="605" font-size="21" font-weight="700" fill="#142D52">C → 后续仍可替换</text><text x="330" y="665" font-size="21" font-weight="400" fill="#142D52">10:02 请求删除 A 并创建 B；10:04 同样处理 B；旧进程退出未必同步完成。</text><text x="65" y="730" font-size="22" font-weight="400" fill="#142D52">假设每 2 分钟计划一次，任务若不被终止正常运行 3 分钟；不是严格执行时刻保证。</text><text x="65" y="770" font-size="22" font-weight="400" fill="#142D52">本图另设 startingDeadlineSeconds=30，排除 Forbid 的迟到补调度；不是默认窗口。</text><text x="65" y="805" font-size="22" font-weight="400" fill="#142D52">Replace 不回滚外部副作用；并发策略只约束同一 CronJob，不提供全局业务互斥。</text></g></svg>
