<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#2563EB" height="8" rx="4" stroke="none" stroke-width="2" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="42" font-weight="bold" x="69" y="98">kubelet：本节点 Pod 的运行协调者</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">Scheduler 负责选择节点；kubelet 负责已分配 Pod 在本节点的运行、检查和状态</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="87">23 / 38</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="165" y2="165" /><rect fill="#FFFFFF" height="121" rx="20" stroke="#D8E4F2" stroke-width="2" width="590" x="505" y="193" /><rect fill="#2563EB" height="121" rx="4" stroke="none" stroke-width="2" width="7" x="505" y="193" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" x="535" y="243">API Server</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="535" y="283">kubelet 观察本节点 Pod 的期望，持续写回相关状态。</text><line stroke="#2563EB" stroke-width="4" x1="800" x2="800" y1="315" y2="364" /><polygon fill="#2563EB" points="800,364 794.7263190753538,354.3465918192059 805.2736809246462,354.3465918192059" /><rect fill="#F2EFFF" height="145" rx="20" stroke="#D8E4F2" stroke-width="2" width="704" x="449" y="370" /><rect fill="#7654E8" height="145" rx="4" stroke="none" stroke-width="2" width="7" x="449" y="370" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" x="479" y="420">kubelet</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="479" y="460">观察 Pod 变化，协调实际运行，并执行容器健康检查。</text><line stroke="#2563EB" stroke-width="3" x1="800" x2="281" y1="516" y2="577" /><polygon fill="#2563EB" points="281,577 289.9718162778434,570.6355273056895 291.2030121286085,581.1107838064617" /><rect fill="#FFFFFF" height="122" rx="20" stroke="#D8E4F2" stroke-width="2" width="414" x="76" y="586" /><rect fill="#2563EB" height="122" rx="4" stroke="none" stroke-width="2" width="7" x="76" y="586" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="106" y="636">CRI / 容器运行时</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="106" y="676">创建 Pod Sandbox、容器与进程。</text><line stroke="#12946B" stroke-width="3" x1="800" x2="801" y1="516" y2="577" /><polygon fill="#12946B" points="801,577 795.5687962375215,567.434330881196 806.1147410972396,567.2614465392335" /><rect fill="#FFFFFF" height="122" rx="20" stroke="#D8E4F2" stroke-width="2" width="414" x="596" y="586" /><rect fill="#12946B" height="122" rx="4" stroke="none" stroke-width="2" width="7" x="596" y="586" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="626" y="636">卷与存储机制</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="626" y="676">准备、挂载和维护相关卷状态。</text><line stroke="#D98419" stroke-width="3" x1="800" x2="1321" y1="516" y2="577" /><polygon fill="#D98419" points="1321,577 1310.7988184294431,581.1153243571475 1312.0253520352358,570.6395209371815" /><rect fill="#FFFFFF" height="122" rx="20" stroke="#D8E4F2" stroke-width="2" width="414" x="1116" y="586" /><rect fill="#D98419" height="122" rx="4" stroke="none" stroke-width="2" width="7" x="1116" y="586" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="1146" y="636">探针 / Pod 状态</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="1146" y="676">Startup、Liveness、Readiness 与状态上</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="1146" y="704">报。</text><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#EBF4FF" r="20" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">kubelet 不负责全局副本数量或给所有 Pod 选 Node；Pod Ready 也不是业务全链路可用的保证。</text></svg>