<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">kubelet：把本节点的期望转成运行状态</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">kubelet：把本节点的期望转成运行状态</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">箭头表示主要请求或调用方向；状态响应和其他组件路径省略。</tspan></text><rect x="350" y="130" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">API Server</tspan></text><text x="560.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">读取本节点 Pod；写回相关状态</tspan></text><rect x="350" y="340" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="377" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">kubelet</tspan></text><text x="560.0" y="414" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">持续观察、协调和健康检查</tspan></text><path d="M560 340 L560 240" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="620" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="190.0" y="657" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="190.0" dy="0">CRI 运行时</tspan></text><text x="190.0" y="694" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="190.0" dy="0">容器与 Pod sandbox</tspan></text><rect x="410" y="620" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="657" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">卷相关机制</tspan></text><text x="560.0" y="694" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">准备挂载、处理卷状态</tspan></text><rect x="780" y="620" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="930.0" y="657" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="930.0" dy="0">探针与状态</tspan></text><text x="930.0" y="694" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="930.0" dy="0">检查应用，记录观察结果</tspan></text><path d="M430 450 L430 540 L190 540 L190 620" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 450 L560 620" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 450 L690 540 L930 540 L930 620" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560.0" y="812" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">kubelet 不负责全局选节点；Ready 也不是全链路可用的承诺。</tspan></text></g></svg>