<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">一次 API 请求：身份、权限与对象策略</title><desc id="desc">Kubernetes 1.28 · 按职责逐层理解，控制器协调属于后续异步流程</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">一次 API 请求：身份、权限与对象策略</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Kubernetes 1.28 · 按职责逐层理解，控制器协调属于后续异步流程</text><rect x="65" y="190" width="360" height="135" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="90" y="230" font-size="25" font-weight="700" fill="#142D52">客户端 → Authentication</text><text x="90" y="275" font-size="22" font-weight="400" fill="#142D52">身份认证：请求者是谁？</text><path d="M425 255L520 255" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="530" y="190" width="370" height="135" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="555" y="230" font-size="25" font-weight="700" fill="#142D52">Authorization：授权</text><text x="555" y="275" font-size="22" font-weight="400" fill="#142D52">能否对目标执行该操作？</text><path d="M900 255L995 255" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1005" y="190" width="430" height="135" rx="16" fill="#F2EFFF" stroke="#D8E4F2"/><text x="1030" y="230" font-size="25" font-weight="700" fill="#142D52">适用的对象写请求</text><text x="1030" y="275" font-size="22" font-weight="400" fill="#142D52">CREATE / UPDATE 等</text><path d="M1210 325L1210 385" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="825" y="390" width="610" height="130" rx="16" fill="#F2EFFF" stroke="#D8E4F2"/><text x="850" y="430" font-size="26" font-weight="700" fill="#142D52">Admission Control：准入控制</text><text x="850" y="475" font-size="22" font-weight="400" fill="#142D52">检查或修改对象；策略仍可能拒绝</text><path d="M825 455L685 455" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="65" y="390" width="610" height="130" rx="16" fill="#FFF5E7" stroke="#D8E4F2"/><text x="90" y="430" font-size="25" font-weight="700" fill="#142D52">后续 API 校验与持久化等处理</text><text x="90" y="475" font-size="22" font-weight="400" fill="#142D52">仍可能失败；普通写请求成功才保存</text><path d="M370 520L370 575" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="65" y="580" width="610" height="100" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="90" y="620" font-size="25" font-weight="700" fill="#142D52">控制器异步协调目标状态</text><text x="90" y="660" font-size="22" font-weight="400" fill="#142D52">保存对象不代表 Pod 已调度或运行</text><rect x="825" y="580" width="610" height="100" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="850" y="620" font-size="25" font-weight="700" fill="#142D52">GET 等读取：走适用的读取处理</text><text x="850" y="660" font-size="22" font-weight="400" fill="#142D52">不走图中的对象写入准入分支</text><text x="65" y="740" font-size="23" font-weight="400" fill="#142D52">主要职责示意：不是 API Server 内部所有校验函数唯一且严格的执行顺序。</text><text x="65" y="785" font-size="23" font-weight="400" fill="#142D52">示例：获准创建 Pod，仍可被“禁止 privileged 容器”的准入策略拒绝。</text></g></svg>
