<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#D98419" height="8" rx="4" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="45" font-weight="bold" x="70" y="96">DNS 故障排查：先区分症状，再定位层级</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">同一个“访问失败”可能是解析失败，也可能是业务连接失败</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="88">14 / 20</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="166" y2="166" /><rect fill="#EBF4FF" height="110" rx="20" stroke="#BDD7FA" stroke-width="2" width="740" x="430" y="192" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="800" y="238">从故障源 Pod 开始</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" text-anchor="middle" x="800" y="276">记录 FQDN、Namespace、resolv.conf、查询类型</text><line stroke="#2563EB" stroke-width="3.5" x1="800" x2="800" y1="302" y2="344" /><polygon fill="#2563EB" points="800,344 794.7263190753538,334.3465918192059 805.2736809246462,334.3465918192059" /><rect fill="#FFFFFF" height="202" rx="20" stroke="#D8E4F2" stroke-width="2" width="343" x="65" y="404" /><rect fill="#2563EB" height="202" rx="4" stroke="none" stroke-width="2" width="7" x="65" y="404" /><rect fill="#EBF4FF" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="87" y="427" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="112" y="461">1</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="155" y="454">NXDOMAIN</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="155" y="494">名称、搜索域、命名空间</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="155" y="524">与对象是否存在</text><rect fill="#EBF4FF" height="43" rx="21.5" stroke="none" stroke-width="2" width="313" x="83" y="635" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="239.5" y="665.53">名称错误≠网络不通</text><line stroke="#2563EB" stroke-width="2.4" x1="800" x2="236" y1="344" y2="401" /><polygon fill="#2563EB" points="236,401 245.07420601490642,394.7823810667558 246.13476036069366,405.2762872250718" /><rect fill="#FFFFFF" height="202" rx="20" stroke="#D8E4F2" stroke-width="2" width="343" x="448" y="404" /><rect fill="#7654E8" height="202" rx="4" stroke="none" stroke-width="2" width="7" x="448" y="404" /><rect fill="#F2EFFF" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="470" y="427" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="495" y="461">2</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="538" y="454">SERVFAIL</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="538" y="494">CoreDNS 处理、同步与</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="538" y="524">上游等错误</text><rect fill="#F2EFFF" height="43" rx="21.5" stroke="none" stroke-width="2" width="313" x="466" y="635" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="622.5" y="665.53">不必然需要重启 DNS</text><line stroke="#7654E8" stroke-width="2.4" x1="800" x2="619" y1="344" y2="401" /><polygon fill="#7654E8" points="619,401 626.6235461658254,393.07021161331977 629.7917064153457,403.13050994951584" /><rect fill="#FFFFFF" height="202" rx="20" stroke="#D8E4F2" stroke-width="2" width="343" x="831" y="404" /><rect fill="#D98419" height="202" rx="4" stroke="none" stroke-width="2" width="7" x="831" y="404" /><rect fill="#FFF5E7" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="853" y="427" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="878" y="461">3</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="921" y="454">DNS 超时</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="921" y="494">DNS 服务端点、网络策</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="921" y="524">略与处理链路</text><rect fill="#FFF5E7" height="43" rx="21.5" stroke="none" stroke-width="2" width="313" x="849" y="635" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="1005.5" y="665.53">不一定是拼错名称</text><line stroke="#D98419" stroke-width="2.4" x1="800" x2="1002" y1="344" y2="401" /><polygon fill="#D98419" points="1002,401 991.2771975344641,403.45387597182463 994.1415796718948,393.30290769531626" /><rect fill="#FFFFFF" height="202" rx="20" stroke="#D8E4F2" stroke-width="2" width="343" x="1214" y="404" /><rect fill="#D94D5C" height="202" rx="4" stroke="none" stroke-width="2" width="7" x="1214" y="404" /><rect fill="#FFF0F1" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="1236" y="427" /><text fill="#D94D5C" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="1261" y="461">4</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="1304" y="454">解析成功但连接失败</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="1304" y="494">Service、就绪端点、目</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="1304" y="524">标端口和 Pod 网络</text><rect fill="#FFF0F1" height="43" rx="21.5" stroke="none" stroke-width="2" width="313" x="1232" y="635" /><text fill="#D94D5C" font-family="Noto Sans CJK SC" font-size="18" font-weight="bold" text-anchor="middle" x="1388.5" y="665.53">应转向业务路径</text><line stroke="#D94D5C" stroke-width="2.4" x1="800" x2="1385" y1="344" y2="401" /><polygon fill="#D94D5C" points="1385,401 1374.880667740969,405.3126690843766 1375.9035155450188,394.8150205691299" /><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#FFF5E7" r="20" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">顺序用于收集证据；单一异常不能证明只有一个故障。不要用统一重启或关闭策略替代定位。</text></svg>