<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#2563EB" height="8" rx="4" stroke="none" stroke-width="2" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="40" font-weight="bold" x="69" y="98">调度约束：容忍污点，不等于指定节点</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">硬约束影响可行节点，软偏好参与选择；NoExecute 还可能影响已运行的 Pod</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="88">32 / 38</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="166" y2="166" /><rect fill="#FFFFFF" height="203" rx="20" stroke="#D8E4F2" stroke-width="2" width="348" x="62" y="235" /><rect fill="#2563EB" height="203" rx="4" stroke="none" stroke-width="2" width="7" x="62" y="235" /><rect fill="#EBF4FF" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="84" y="258" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="109" y="292">1</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" x="152" y="285">资源与基本约束</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="152" y="325">资源 requests、节点状态和</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="152" y="353">其他硬条件。</text><line stroke="#2563EB" stroke-width="3" x1="411" x2="440" y1="337" y2="337" /><polygon fill="#2563EB" points="440,337 430.3465918192059,342.2736809246462 430.3465918192059,331.7263190753538" /><rect fill="#FFFFFF" height="203" rx="20" stroke="#D8E4F2" stroke-width="2" width="348" x="443" y="235" /><rect fill="#7654E8" height="203" rx="4" stroke="none" stroke-width="2" width="7" x="443" y="235" /><rect fill="#F2EFFF" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="465" y="258" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="490" y="292">2</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" x="533" y="285">节点 / Pod 亲和</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="533" y="325">required 为硬约束，preferr</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="533" y="353">ed 为偏好。</text><line stroke="#2563EB" stroke-width="3" x1="792" x2="821" y1="337" y2="337" /><polygon fill="#2563EB" points="821,337 811.3465918192059,342.2736809246462 811.3465918192059,331.7263190753538" /><rect fill="#FFFFFF" height="203" rx="20" stroke="#D8E4F2" stroke-width="2" width="348" x="824" y="235" /><rect fill="#D98419" height="203" rx="4" stroke="none" stroke-width="2" width="7" x="824" y="235" /><rect fill="#FFF5E7" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="846" y="258" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="871" y="292">3</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" x="914" y="285">污点与容忍</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="914" y="325">未容忍 NoSchedule 阻止新</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="914" y="353">调度；其他 effect 语义有别</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="914" y="381">。</text><line stroke="#2563EB" stroke-width="3" x1="1173" x2="1202" y1="337" y2="337" /><polygon fill="#2563EB" points="1202,337 1192.346591819206,342.2736809246462 1192.346591819206,331.7263190753538" /><rect fill="#FFFFFF" height="203" rx="20" stroke="#D8E4F2" stroke-width="2" width="348" x="1205" y="235" /><rect fill="#12946B" height="203" rx="4" stroke="none" stroke-width="2" width="7" x="1205" y="235" /><rect fill="#E8F9F2" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="1227" y="258" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="1252" y="292">4</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" x="1295" y="285">可行节点评分</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="1295" y="325">选择合适的 Node、尝试绑</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="1295" y="353">定。</text><line stroke="#8B9AAD" stroke-width="3" x1="797" x2="797" y1="442" y2="505" /><polygon fill="#8B9AAD" points="797,505 791.7263190753538,495.3465918192059 802.2736809246462,495.3465918192059" /><rect fill="#FFF0F1" height="150" rx="17" stroke="#F6CBD0" stroke-width="2" width="694" x="82" y="540" /><text fill="#D94D5C" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="104" y="575">约束不满足</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="104" y="616">没有可行节点时保持 Pending，并等待后续重评估。</text><rect fill="#E8F9F2" height="150" rx="17" stroke="#BCE7D2" stroke-width="2" width="694" x="823" y="540" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="845" y="575">额外需要理解的两类语义</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="845" y="616">PreferNoSchedule 是软偏好；NoExecute 涉及驱逐与容忍时间。</text><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#FFF5E7" r="20" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">Toleration 只允许容忍特定污点，不保证选中该 Node；替代 Pod 具有新 UID，不是迁移旧 Pod。</text></svg>