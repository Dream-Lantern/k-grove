<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F9FBFE" height="900" width="1600" x="0" y="0" /><rect fill="#FFFFFF" height="852" rx="27" stroke="#E5EDF6" stroke-width="1.6" width="1540" x="30" y="24" /><rect fill="#7654E8" height="8" rx="4" stroke="none" stroke-width="2" width="1540" x="30" y="24" /><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="42" font-weight="bold" x="69" y="98">Pod 生命周期：对象身份与容器重启</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="72" y="142">容器可在同一 Pod UID 内重新启动；原 Pod 删除后，新 Pod 是另一个对象</text><rect fill="#EBF4FF" height="46" rx="21" stroke="#BDD8FF" stroke-width="2" width="145" x="1391" y="56" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="21" font-weight="bold" text-anchor="middle" x="1463" y="87">25 / 38</text><line stroke="#E3EBF4" stroke-width="2" x1="70" x2="1530" y1="165" y2="165" /><rect fill="#FFFFFF" height="190" rx="20" stroke="#D8E4F2" stroke-width="2" width="347" x="65" y="244" /><rect fill="#2563EB" height="190" rx="4" stroke="none" stroke-width="2" width="7" x="65" y="244" /><rect fill="#EBF4FF" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="87" y="267" /><text fill="#2563EB" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="112" y="301">1</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" x="155" y="294">创建 Pod 对象</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="155" y="334">生成 UID，形成一次 Pod </text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="155" y="363">身份</text><line stroke="#2563EB" stroke-width="3" x1="412" x2="438" y1="337" y2="337" /><polygon fill="#2563EB" points="438,337 428.3465918192059,342.2736809246462 428.3465918192059,331.7263190753538" /><rect fill="#FFFFFF" height="190" rx="20" stroke="#D8E4F2" stroke-width="2" width="347" x="443" y="244" /><rect fill="#7654E8" height="190" rx="4" stroke="none" stroke-width="2" width="7" x="443" y="244" /><rect fill="#F2EFFF" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="465" y="267" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="490" y="301">2</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" x="533" y="294">调度与节点准备</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="533" y="334">节点绑定、网络与卷准备</text><line stroke="#2563EB" stroke-width="3" x1="790" x2="816" y1="337" y2="337" /><polygon fill="#2563EB" points="816,337 806.3465918192059,342.2736809246462 806.3465918192059,331.7263190753538" /><rect fill="#FFFFFF" height="190" rx="20" stroke="#D8E4F2" stroke-width="2" width="347" x="821" y="244" /><rect fill="#12946B" height="190" rx="4" stroke="none" stroke-width="2" width="7" x="821" y="244" /><rect fill="#E8F9F2" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="843" y="267" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="868" y="301">3</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" x="911" y="294">容器运行</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="911" y="334">检查状态，可能重启容器</text><line stroke="#2563EB" stroke-width="3" x1="1168" x2="1194" y1="337" y2="337" /><polygon fill="#2563EB" points="1194,337 1184.346591819206,342.2736809246462 1184.346591819206,331.7263190753538" /><rect fill="#FFFFFF" height="190" rx="20" stroke="#D8E4F2" stroke-width="2" width="347" x="1199" y="244" /><rect fill="#D98419" height="190" rx="4" stroke="none" stroke-width="2" width="7" x="1199" y="244" /><rect fill="#FFF5E7" height="49" rx="13" stroke="none" stroke-width="2" width="50" x="1221" y="267" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" text-anchor="middle" x="1246" y="301">4</text><text fill="#142D52" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" x="1289" y="294">终止 / 对象消失</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="1289" y="334">终止状态和资源清理可能</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="1289" y="363">延迟</text><rect fill="#E8F9F2" height="105" rx="17" stroke="#C1EADA" stroke-width="2" width="838" x="384" y="493" /><text fill="#12946B" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="405" y="527">仍是同一个 Pod UID</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="405" y="562">容器重启仍属于原 Pod 的运行过程；不是把 Pod 迁移到新节点。</text><path d="M 1015,436 V 480" fill="none" stroke="#12946B" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><line stroke="#12946B" stroke-width="3" x1="1015" x2="1015" y1="476" y2="491" /><polygon fill="#12946B" points="1015,491 1009.7263190753538,481.3465918192059 1020.2736809246462,481.3465918192059" /><rect fill="#FFF5E7" height="105" rx="17" stroke="#F6DFBD" stroke-width="2" width="838" x="384" y="623" /><text fill="#D98419" font-family="Noto Sans CJK SC" font-size="23" font-weight="bold" x="405" y="657">需要替代实例时：新 Pod / 新 UID</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="405" y="692">上层控制器可创建替代对象；同名不代表同一个 UID。</text><path d="M 1403,437 V 598 H 1218 V 623" fill="none" stroke="#D98419" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><rect fill="#F3F7FC" height="66" rx="14" stroke="none" stroke-width="2" width="1460" x="70" y="795" /><circle cx="111" cy="829" fill="#F2EFFF" r="20" /><text fill="#7654E8" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" text-anchor="middle" x="111" y="839">!</text><text fill="#637993" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="148" y="836">容器重启、Pod 替代和持久卷保留是不同维度；卷生命周期取决于类型与回收配置。</text></svg>