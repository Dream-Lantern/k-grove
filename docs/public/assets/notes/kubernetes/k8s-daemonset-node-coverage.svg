<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">DaemonSet：节点覆盖与 Scheduler 协作</title><desc id="desc">Kubernetes 1.28 · 控制器计算覆盖需求，调度器绑定，节点侧 kubelet 运行</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">DaemonSet：节点覆盖与 Scheduler 协作</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Kubernetes 1.28 · 控制器计算覆盖需求，调度器绑定，节点侧 kubelet 运行</text><rect x="65" y="190" width="440" height="115" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="85" y="232" font-size="27" font-weight="700" fill="#142D52">DaemonSet Controller</text><text x="85" y="276" font-size="22" font-weight="400" fill="#142D52">判断节点覆盖，创建目标 Pod</text><rect x="560" y="190" width="380" height="115" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="580" y="232" font-size="27" font-weight="700" fill="#142D52">Scheduler</text><text x="580" y="276" font-size="22" font-weight="400" fill="#142D52">按目标节点亲和性调度绑定</text><rect x="995" y="190" width="440" height="115" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="1015" y="232" font-size="27" font-weight="700" fill="#142D52">kubelet</text><text x="1015" y="276" font-size="22" font-weight="400" fill="#142D52">在已绑定节点运行容器</text><path d="M510 248L555 248" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M945 248L990 248" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="65" y="350" font-size="24" font-weight="700" fill="#142D52">初始条件：nodeSelector 为 agent=enabled，且无其他不被容忍的污点</text><rect x="65" y="385" width="320" height="205" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="85" y="430" font-size="28" font-weight="700" fill="#142D52">node-a</text><text x="85" y="474" font-size="23" font-weight="400" fill="#142D52">agent=enabled</text><text x="85" y="520" font-size="22" font-weight="700" fill="#142D52">目标：一个代理 Pod</text><text x="85" y="559" font-size="22" font-weight="400" fill="#142D52">节点 kubelet 运行</text><rect x="415" y="385" width="320" height="205" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="435" y="430" font-size="28" font-weight="700" fill="#142D52">node-b</text><text x="435" y="474" font-size="23" font-weight="400" fill="#142D52">agent=enabled</text><text x="435" y="520" font-size="22" font-weight="700" fill="#142D52">目标：一个代理 Pod</text><text x="435" y="559" font-size="22" font-weight="400" fill="#142D52">节点 kubelet 运行</text><rect x="765" y="385" width="320" height="205" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="785" y="430" font-size="28" font-weight="700" fill="#142D52">node-c</text><text x="785" y="474" font-size="23" font-weight="400" fill="#142D52">agent=disabled</text><text x="785" y="520" font-size="22" font-weight="700" fill="#142D52">不在目标覆盖范围</text><text x="785" y="559" font-size="22" font-weight="400" fill="#142D52">不创建本组代理</text><rect x="1115" y="385" width="320" height="205" rx="16" fill="#F3F7FC" stroke="#D8E4F2"/><text x="1135" y="430" font-size="28" font-weight="700" fill="#142D52">node-d</text><text x="1135" y="474" font-size="23" font-weight="400" fill="#142D52">无 agent 标签</text><text x="1135" y="520" font-size="22" font-weight="700" fill="#142D52">不在目标覆盖范围</text><text x="1135" y="559" font-size="22" font-weight="400" fill="#142D52">不创建本组代理</text><rect x="65" y="635" width="1370" height="70" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="85" y="680" font-size="24" font-weight="700" fill="#142D52">覆盖推演：A 初始 2 个 → B node-c 改为 enabled 后 3 个 → C node-b 不符合后 2 个</text><text x="65" y="750" font-size="22" font-weight="400" fill="#142D52">这是纸面标签变化，不操作真实节点。符合节点条件也可能因资源、污点或镜像失败而不可用。</text><text x="65" y="790" font-size="22" font-weight="400" fill="#142D52">Desired、Current、Ready、Available、Updated 含义不同；DaemonSet 不自动获得主机权限。</text></g></svg>
