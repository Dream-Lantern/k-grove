<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">1.28 经典 DRA：WaitForFirstConsumer 协调流程</title><desc id="desc">资源 API：resource.k8s.io/v1alpha2 · 合成 Node A / B 案例 · 尚未执行集群实验</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">1.28 经典 DRA：WaitForFirstConsumer 协调流程</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">资源 API：resource.k8s.io/v1alpha2 · 合成 Node A / B 案例 · 尚未执行集群实验</text><rect x="65" y="175" width="1370" height="65" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="90" y="216" font-size="25" font-weight="700" fill="#142D52">起点：创建 ResourceClaim → Pod 引用；A、B 通过初步常规资源检查</text><rect x="65" y="275" width="380" height="65" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="85" y="317" font-size="26" font-weight="700" fill="#142D52">Scheduler</text><rect x="500" y="275" width="500" height="65" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="520" y="317" font-size="26" font-weight="700" fill="#142D52">PodSchedulingContext</text><rect x="1055" y="275" width="380" height="65" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="1075" y="317" font-size="26" font-weight="700" fill="#142D52">资源驱动</text><rect x="65" y="370" width="380" height="105" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="85" y="410" font-size="25" font-weight="700" fill="#142D52">形成候选 A、B</text><text x="85" y="450" font-size="22" font-weight="400" fill="#142D52">写入 potentialNodes</text><path d="M445 420L490 420" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="500" y="370" width="500" height="105" rx="16" fill="#F2EFFF" stroke="#D8E4F2"/><text x="520" y="410" font-size="24" font-weight="700" fill="#142D52">spec.potentialNodes = A、B</text><text x="520" y="450" font-size="22" font-weight="400" fill="#142D52">驱动观察候选并评估资源条件</text><path d="M1000 420L1045 420" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1055" y="370" width="380" height="105" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="1075" y="410" font-size="23" font-weight="700" fill="#142D52">评估：A 不符合，B 符合</text><text x="1075" y="450" font-size="21" font-weight="400" fill="#142D52">反馈 unsuitableNodes = A</text><path d="M1245 475 V530 H1010" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="500" y="490" width="500" height="80" rx="16" fill="#F2EFFF" stroke="#D8E4F2"/><text x="520" y="525" font-size="23" font-weight="700" fill="#142D52">status 反馈不适合节点 A</text><text x="520" y="555" font-size="21" font-weight="400" fill="#142D52">Scheduler 观察后综合选择 B</text><path d="M500 530L455 530" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="65" y="490" width="380" height="80" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="85" y="525" font-size="23" font-weight="700" fill="#142D52">选 B → 写 selectedNode</text><text x="85" y="555" font-size="20" font-weight="400" fill="#142D52">选定候选还不等于 Pod 绑定</text><path d="M250 570L250 600" stroke="#637993" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="65" y="605" width="1370" height="80" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="90" y="640" font-size="25" font-weight="700" fill="#142D52">驱动观察 selectedNode=B → 完成 Claim 分配 → 为 Pod 保留使用资格</text><text x="90" y="675" font-size="22" font-weight="400" fill="#142D52">全部所需 Claim 满足条件后，正常调度继续完成 Pod 绑定；随后 kubelet 准备设备。</text><text x="65" y="735" font-size="23" font-weight="400" fill="#142D52">这是 1.28 经典 DRA 的成功分支示意；实际为异步、多轮协调，可失败、重试或换候选节点。</text><text x="65" y="780" font-size="22" font-weight="400" fill="#142D52">资源分配完成不保证节点准备和应用访问成功；本图不包含 1.32 ResourceSlice 的分配模型。</text></g></svg>
