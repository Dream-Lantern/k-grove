<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">TopologySpread：2 / 2 / 1 时，新 Pod 放在哪个 Zone？</title><desc id="desc">Kubernetes v1.28.0 · 独立三域算例，不叠加前文其他拓扑场景</desc><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637993"/></marker></defs><rect width="1500" height="850" fill="#F9FBFE"/><rect x="25" y="25" width="1450" height="800" rx="24" fill="white" stroke="#D8E4F2"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142D52"><text x="65" y="90" font-size="34" font-weight="700" fill="#142D52">TopologySpread：2 / 2 / 1 时，新 Pod 放在哪个 Zone？</text><text x="65" y="135" font-size="21" font-weight="400" fill="#142D52">Kubernetes v1.28.0 · 独立三域算例，不叠加前文其他拓扑场景</text><text x="65" y="190" font-size="24" font-weight="700" fill="#142D52">前提：study 内 app=catalog，三个 Zone 均合格，其他约束不影响本例</text><rect x="65" y="230" width="430" height="150" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="90" y="270" font-size="28" font-weight="700" fill="#142D52">zone-a</text><circle cx="155" cy="330" r="25" fill="#2563EB"/><circle cx="245" cy="330" r="25" fill="#2563EB"/><text x="350" y="340" font-size="24" font-weight="700" fill="#142D52">2 个 Pod</text><rect x="535" y="230" width="430" height="150" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="560" y="270" font-size="28" font-weight="700" fill="#142D52">zone-b</text><circle cx="625" cy="330" r="25" fill="#2563EB"/><circle cx="715" cy="330" r="25" fill="#2563EB"/><text x="820" y="340" font-size="24" font-weight="700" fill="#142D52">2 个 Pod</text><rect x="1005" y="230" width="430" height="150" rx="16" fill="#EBF4FF" stroke="#D8E4F2"/><text x="1030" y="270" font-size="28" font-weight="700" fill="#142D52">zone-c</text><circle cx="1095" cy="330" r="25" fill="#2563EB"/><text x="1290" y="340" font-size="24" font-weight="700" fill="#142D52">1 个 Pod</text><text x="65" y="425" font-size="24" font-weight="700" fill="#142D52">已有合格域全局最小数 = 1 · 新 Pod 匹配选择器 · maxSkew=1 · DoNotSchedule</text><rect x="65" y="465" width="1370" height="55" rx="16" fill="#E8F9F2" stroke="#D8E4F2"/><text x="90" y="501" font-size="24" font-weight="700" fill="#142D52">放入 zone-c</text><text x="440" y="501" font-size="24" font-weight="400" fill="#142D52">2 / 2 / 2</text><text x="760" y="501" font-size="24" font-weight="400" fill="#142D52">1 + 1 − 1 = 1</text><text x="1210" y="501" font-size="23" font-weight="700" fill="#142D52">满足 ≤ 1</text><rect x="65" y="540" width="1370" height="55" rx="16" fill="#FFF0F1" stroke="#D8E4F2"/><text x="90" y="576" font-size="24" font-weight="700" fill="#142D52">放入 zone-a</text><text x="440" y="576" font-size="24" font-weight="400" fill="#142D52">3 / 2 / 1</text><text x="760" y="576" font-size="24" font-weight="400" fill="#142D52">2 + 1 − 1 = 2</text><text x="1210" y="576" font-size="23" font-weight="700" fill="#142D52">不满足</text><rect x="65" y="615" width="1370" height="55" rx="16" fill="#FFF0F1" stroke="#D8E4F2"/><text x="90" y="651" font-size="24" font-weight="700" fill="#142D52">放入 zone-b</text><text x="440" y="651" font-size="24" font-weight="400" fill="#142D52">2 / 3 / 1</text><text x="760" y="651" font-size="24" font-weight="400" fill="#142D52">2 + 1 − 1 = 2</text><text x="1210" y="651" font-size="23" font-weight="700" fill="#142D52">不满足</text><text x="65" y="745" font-size="23" font-weight="400" fill="#142D52">过滤值 = 候选域已有匹配数 + 新 Pod 匹配贡献 − 已有合格域全局最小数。</text><text x="65" y="790" font-size="23" font-weight="400" fill="#142D52">这是硬约束的一项检查；污点、节点亲和、资源与存储仍可能让最终候选集为空。</text></g></svg>
