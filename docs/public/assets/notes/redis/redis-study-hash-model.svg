<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
  <title id="title">Hash：键级 TTL 与字段 TTL 的作用范围</title>
  <desc id="desc">Hash Key 内分别展示键级 TTL 和字段映射；字段可以有独立 TTL。键过期删除整个 Hash，字段过期仅删除对应字段，最后一个字段消失时键也消失。不是执行先后流程。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern>
    <style>
      text { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; fill: #0F172A; text-anchor: middle; }
      .title { fill: #0369A1; font-size: 30px; font-weight: 600; }
      .heading { fill: #0369A1; font-size: 23px; font-weight: 600; }
      .body { font-size: 19px; }
      .note { font-size: 18px; }
      .box { fill: #E0F2FE; stroke: #0369A1; stroke-width: 2; rx: 7; }
      .branch { fill: none; stroke: #0369A1; stroke-width: 2; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="560" y="48" class="title">Hash：键级 TTL 与字段 TTL 分开管理</text>
  <text x="560" y="84" class="note">嵌套关系示意，不是先后执行阶段；时间为教学设定，不是实测剩余值。</text>
  <rect x="60" y="130" width="1000" height="510" rx="7" fill="#FFFFFF" stroke="#0369A1" stroke-width="2"/>
  <text x="560" y="174" class="heading">Hash Key：demo:user:42</text>
  <path d="M560 190 V213 M240 240 V213 H730 V240" class="branch"/>
  <rect x="90" y="240" width="300" height="355" class="box"/>
  <text x="240" y="281" class="heading">Key TTL = 3600s</text>
  <text x="240" y="337" class="body">约束整个 Hash</text>
  <text x="240" y="383" class="body">到期：删除整个键</text>
  <text x="240" y="440" class="body">字段 TTL 不会延长它</text>
  <text x="240" y="491" class="note">普通 HSET 保留键级期限</text>
  <text x="240" y="537" class="note">不代表保留字段级期限</text>
  <rect x="430" y="240" width="600" height="355" class="box"/>
  <text x="730" y="281" class="heading">Field Mapping（字段映射）</text>
  <rect x="455" y="305" width="550" height="67" rx="7" fill="#FFFFFF" stroke="#0369A1"/>
  <text x="730" y="333" class="body">name = Lin</text>
  <text x="730" y="357" class="note">无独立字段 TTL</text>
  <rect x="455" y="385" width="550" height="67" rx="7" fill="#FFFFFF" stroke="#0369A1"/>
  <text x="730" y="413" class="body">score = 100</text>
  <text x="730" y="437" class="note">无独立字段 TTL</text>
  <rect x="455" y="465" width="550" height="105" rx="7" fill="#FFFFFF" stroke="#0369A1"/>
  <text x="730" y="496" class="body">session = token-001</text>
  <text x="730" y="526" class="heading">Field TTL = 300s</text>
  <text x="730" y="554" class="note">到期仅删除 session 字段</text>
  <text x="560" y="681" class="body">HPERSIST 清除字段 TTL、保留字段；HSET 覆盖该字段也会清除原字段 TTL。</text>
  <text x="560" y="718" class="note">最后一个字段被删除或过期后，Hash Key 也消失。</text>
  <text x="560" y="750" class="note">字段 TTL 自 Redis Open Source 7.4.0 起支持；具体条件以正文为准。</text>
</svg>
