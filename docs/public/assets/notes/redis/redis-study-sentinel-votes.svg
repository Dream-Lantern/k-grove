<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">Sentinel：quorum 与故障转移授权是两道条件</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">Sentinel：quorum 与故障转移授权是两道条件</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">Redis Open Source 7.2.0 教学示意：下线意见、同轮授权、候选选择分别检查。</tspan></text><rect x="40" y="200" width="300" height="140" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="190.0" y="237" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="190.0" dy="0">ODOWN：quorum 门槛</tspan></text><text x="190.0" y="274" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="190.0" dy="0">多少 Sentinel 同意主节点失效</tspan></text><rect x="410" y="200" width="300" height="140" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="237" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">选举与多数授权</tspan></text><text x="560.0" y="274" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">同轮票数 ≥ max(多数, quorum)</tspan></text><rect x="780" y="200" width="300" height="140" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="930.0" y="237" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="930.0" dy="0">副本资格与优先级</tspan></text><text x="930.0" y="274" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="930.0" dy="0">先过滤不合格副本</tspan><tspan x="930.0" dy="30">再比较优先级、偏移量、Run ID</tspan></text><path d="M340 260 L410 260" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 260 L780 260" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560.0" y="732" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">quorum 不会自动被改成多数；3 个 Sentinel / quorum=2 是例子，不是唯一合法配置。</tspan></text></g></svg>