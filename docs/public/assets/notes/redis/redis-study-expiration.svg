<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="805" viewBox="0 0 1120 805" role="img" aria-labelledby="title desc">
<title id="title">过期：逻辑不可见与内存释放不是同一时刻</title>
<desc id="desc">设置期限后，客户端访问检查与主事件循环中的主动抽样分别发现过期键；过期删除影响复制、持久化和内存回收。分支表示职责关系，不要求传播及回收完成后才更新过期计数。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif" text-anchor="middle" fill="#0F172A">
<text x="560" y="48" fill="#0369A1" font-size="30" font-weight="600">过期：逻辑不可见与内存释放不是同一时刻</text>
<text x="560" y="84" font-size="18">普通主节点示意：分支表示职责关系，不是全部完成后才进行下一步。</text>
<g fill="#E0F2FE" stroke="#0369A1" stroke-width="2">
<rect x="90" y="120" width="940" height="80" rx="7"/>
<rect x="90" y="245" width="440" height="95" rx="7"/><rect x="590" y="245" width="440" height="95" rx="7"/>
<rect x="90" y="405" width="940" height="85" rx="7"/>
<rect x="90" y="540" width="440" height="90" rx="7"/><rect x="590" y="540" width="440" height="90" rx="7"/>
<rect x="90" y="675" width="940" height="60" rx="7"/>
</g>
<g fill="#0369A1" font-size="23" font-weight="600">
<text x="560" y="151">设置 TTL，记录绝对截止时刻</text>
<text x="310" y="280">被动过期：客户端访问检查</text>
<text x="810" y="280">主动过期：周期性抽样检查</text>
<text x="560" y="438">发现已过期 → 从键空间删除</text>
<text x="310" y="575">复制 / 持久化传播</text><text x="810" y="575">对象内存回收</text>
</g>
<g font-size="19">
<text x="560" y="183">逻辑期限到达，不代表已经完成删除或内存归还</text>
<text x="310" y="317">未过期正常返回；过期按不存在处理</text>
<text x="810" y="317">主事件循环工作；受时间和工作量预算限制</text>
<text x="560" y="473">两条检查路径汇合；expired 通知发生于删除时，而非准确到期时</text>
<text x="310" y="610">主节点协调；完成时刻受配置和网络影响</text>
<text x="810" y="610">同步或适用的后台释放；仍消耗资源</text>
<text x="560" y="712">观察：expired_keys 在过期删除时计数；RSS 不保证立即下降</text>
</g>
<g fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)">
<path d="M560 200V220H310V245"/><path d="M560 220H810V245"/>
<path d="M310 340V365H560V405"/><path d="M810 340V365H560"/>
<path d="M560 490V515H310V540"/><path d="M560 515H810V540"/>
<path d="M310 630V650H560V675"/><path d="M810 630V650H560"/>
</g>
<text x="560" y="777" font-size="18">期限通知会延迟或丢失，不能单独承担关键业务调度；过期与内存淘汰是不同原因。</text>
</g></svg>
