<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="805" viewBox="0 0 1120 805" role="img" aria-labelledby="title desc">
<title id="title">数据切换：复制完成还不等于业务可切换</title>
<desc id="desc">固定范围后，初始扫描复制与持续写入的增量同步并行。合并校验后建立最终写入边界，追平增量并复核，随后切换客户端并观察；回退需处理新端写入。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif" text-anchor="middle" fill="#0F172A">
<text x="560" y="48" fill="#0369A1" font-size="30" font-weight="600">数据切换：复制完成还不等于业务可切换</text>
<text x="560" y="84" font-size="18">初始复制与增量同步并行；先有完整写入边界，再切换客户端。</text>
<g fill="#E0F2FE" stroke="#0369A1" stroke-width="2">
<rect x="90" y="120" width="940" height="80" rx="7"/>
<rect x="90" y="245" width="440" height="90" rx="7"/><rect x="590" y="245" width="440" height="90" rx="7"/>
<rect x="90" y="380" width="940" height="70" rx="7"/>
<rect x="90" y="490" width="940" height="70" rx="7"/>
<rect x="90" y="600" width="940" height="60" rx="7"/>
<rect x="90" y="700" width="940" height="55" rx="7"/>
</g>
<g fill="#0369A1" font-size="23" font-weight="600">
<text x="560" y="153">固定迁移范围与恢复方案</text>
<text x="310" y="280">初始复制：SCAN 发现并搬运</text><text x="810" y="280">持续写入：完整捕获并增量同步</text>
<text x="560" y="410">校验数据、期限与业务版本</text><text x="560" y="520">建立最终写入边界</text>
<text x="560" y="637">切换客户端连接与路由</text><text x="560" y="735">观察与回退：先处理新端已产生的写入</text>
</g>
<g font-size="19">
<text x="560" y="184">明确版本、类型、TTL、全部写入方与目标冲突策略</text>
<text x="310" y="315">不是快照；允许重复并处理竞态</text><text x="810" y="315">覆盖新建、更新、删除及顺序</text>
<text x="560" y="437">处理初始数据与增量覆盖顺序，不能只比较键数量</text>
<text x="560" y="547">控制旧端全部写入方 → 增量追平 → 最终复核</text>
</g>
<g fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)">
<path d="M560 200V220H310V245"/><path d="M560 220H810V245"/>
<path d="M310 335V355H560V380"/><path d="M810 335V355H560"/>
<path d="M560 450V490"/><path d="M560 560V600"/><path d="M560 660V700"/>
</g>
<text x="560" y="789" font-size="18">教学流程，不是可执行脚本；保留旧环境不等于具备无损回退能力。</text>
</g></svg>
