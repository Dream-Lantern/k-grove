<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
<title id="title">Redis 7.0+：Manifest 组织多部分 AOF</title>
<desc id="desc">Manifest 引用有效 BASE 和 INCR，不是数据日志。下方补充已启用 AOF 的 Redis 7.2.0 重写高层过程：先打开新 INCR 再 fork，父进程继续写增量、子进程生成 BASE；成功后切换清单并清理旧文件，失败保留完整有效集合。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif" text-anchor="middle" fill="#0F172A">
<text x="560" y="48" fill="#0369A1" font-size="30" font-weight="600">Redis 7.0+：Manifest 组织多部分 AOF</text>
<text x="560" y="84" font-size="18">箭头表示清单引用；Manifest 记录有效文件集合与顺序，不是数据命令日志。</text>
<g fill="#E0F2FE" stroke="#0369A1" stroke-width="2">
<rect x="350" y="140" width="420" height="120" rx="7"/>
<rect x="60" y="420" width="440" height="120" rx="7"/><rect x="620" y="420" width="440" height="120" rx="7"/>
<rect x="60" y="590" width="1000" height="155" rx="7"/>
</g>
<g fill="#0369A1" font-size="23" font-weight="600">
<text x="560" y="177">Manifest 清单</text><text x="280" y="457">BASE 基础文件</text><text x="840" y="457">INCR 增量文件</text>
</g>
<g font-size="19">
<text x="560" y="214">记录当前有效文件及其顺序</text>
<text x="280" y="494">重写生成的基础状态</text><text x="280" y="524">可能采用 RDB 格式</text>
<text x="840" y="494">基础状态之后的适用变化</text><text x="840" y="524">可能有多个有效增量文件</text>
</g>
<g fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)">
<path d="M430 260V335H280V420"/><path d="M690 260V335H840V420"/>
</g>
<g font-size="18">
<text x="560" y="621" fill="#0369A1" font-weight="600">已启用 AOF 的 7.2.0 重写：先打开新 INCR 并更新清单，再 fork</text>
<text x="560" y="654">父进程：继续向新 INCR 追加　｜　子进程：生成临时 BASE</text>
<text x="560" y="687">成功：确认新文件集合 → 持久化并原子替换 Manifest → 清理不再使用的旧文件</text>
<text x="560" y="720">失败：保留仍有效的旧 BASE / INCR 和新增 INCR，不手工删除旧文件</text>
<text x="560" y="782">备份需取得一致完整集合；不能只复制一个旧 AOF，也不能拼接不同时间的文件。</text>
</g></g></svg>
