<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
<title id="title">Redis 7.0+：Manifest 组织多部分 AOF</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">Redis 7.0+：Manifest 组织多部分 AOF</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">箭头表示清单引用；恢复材料不是 BASE → INCR → Manifest 的数据流水线。</tspan></text><rect x="350" y="140" width="420" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">Manifest 清单</tspan></text><text x="560.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">记录当前有效文件及其顺序</tspan></text><rect x="60" y="420" width="440" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="280.0" y="457" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="280.0" dy="0">BASE 基础文件</tspan></text><text x="280.0" y="494" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="280.0" dy="0">重写生成的基础状态</tspan><tspan x="280.0" dy="30">可能采用 RDB 格式</tspan></text><rect x="620" y="420" width="440" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="840.0" y="457" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="840.0" dy="0">INCR 增量文件</tspan></text><text x="840.0" y="494" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="840.0" dy="0">后续适用变化</tspan><tspan x="840.0" dy="30">可能有多个有效增量文件</tspan></text><path d="M430 260 L430 335 L280 335 L280 420" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 260 L690 335 L840 335 L840 420" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="650" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560" dy="0">恢复依清单加载基础状态与适用增量；备份需取得一致的完整集合。</tspan></text><text x="560.0" y="782" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">不能只复制一个旧 appendonly.aof，也不能在重写中随意拼接不同时间的文件。</tspan></text></g></svg>