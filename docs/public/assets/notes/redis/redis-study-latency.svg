<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="805" viewBox="0 0 1120 805" role="img" aria-labelledby="title desc">
<title id="title">延迟拆分：请求主链路与资源竞争</title>
<desc id="desc">请求主链路包括客户端等待、网络发送、Redis排队、命令执行、响应传输及解码。Slowlog主要记录命令执行。辅助资源包括CPU、内存、fork、AOF、fsync、磁盘和OS调度，以虚线影响主链路，非固定后续阶段。教学示例30加10加0.5加5等于45.5毫秒，非实测。</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1">
<stop stop-color="#07182c"/>
<stop offset="1" stop-color="#102f50"/>
</linearGradient>
<marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0 L8 4 L0 8" fill="#57caff"/>
</marker>
<marker id="redtip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0 L8 4 L0 8" fill="#ffbc87"/>
</marker>
</defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}.title{font-size:29px;font-weight:700;fill:#f0f8ff}.sub{font-size:16px;fill:#9dc5e8}.head{font-size:20px;font-weight:700;fill:#79dcff}.body{font-size:17px;fill:#deedfa}.small{font-size:15px;fill:#b5d4ed}.warn{font-size:17px;fill:#ffd0a5}.num{font-size:24px;font-weight:700;fill:#72e6d0}.panel{fill:#123653;stroke:#377599;stroke-width:1.4}.highlight{fill:#174967;stroke:#61d6ff;stroke-width:1.6}.caution{fill:#3b3440;stroke:#d6a175;stroke-width:1.5}.arrow{fill:none;stroke:#57caff;stroke-width:2;marker-end:url(#tip)}.old{fill:none;stroke:#ffbc87;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#redtip)}.assoc{fill:none;stroke:#62a9cb;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#tip)}.lane{stroke:#345b78;stroke-width:1.3;stroke-dasharray:4 6}</style>
<rect width="1120" height="805" rx="20" fill="url(#bg)"/>
<text x="40" y="53" class="title" text-anchor="start">延迟拆分：请求主链路与资源竞争</text>
<text x="40" y="85" class="sub" text-anchor="start">主链路表示请求阶段；虚线表示可能的资源影响，不代表每条请求必经的串行阶段</text>
<rect x="40" y="180" width="192" height="132" rx="14" class="panel"/>
<text x="136" y="217" class="head" text-anchor="middle">客户端等待</text>
<text x="136" y="254" class="small" text-anchor="middle">连接池 / 应用线程</text>
<text x="136" y="283" class="small" text-anchor="middle">发起请求后取得连接</text>
<path d="M232 246 L251 246" class="arrow"/>
<rect x="252" y="180" width="192" height="132" rx="14" class="panel"/>
<text x="348" y="217" class="head" text-anchor="middle">请求网络</text>
<text x="348" y="254" class="small" text-anchor="middle">发送 / 链路延迟</text>
<text x="348" y="283" class="small" text-anchor="middle">请求进入服务端</text>
<path d="M444 246 L463 246" class="arrow"/>
<rect x="464" y="180" width="192" height="132" rx="14" class="panel"/>
<text x="560" y="217" class="head" text-anchor="middle">Redis 排队</text>
<text x="560" y="254" class="small" text-anchor="middle">前序命令 / 调度</text>
<text x="560" y="283" class="small" text-anchor="middle">尚未开始执行</text>
<path d="M656 246 L675 246" class="arrow"/>
<rect x="676" y="180" width="192" height="132" rx="14" class="highlight"/>
<text x="772" y="217" class="head" text-anchor="middle">命令执行</text>
<text x="772" y="254" class="small" text-anchor="middle">数据访问 / 计算</text>
<text x="772" y="283" class="small" text-anchor="middle">Slowlog 观察此段</text>
<path d="M868 246 L887 246" class="arrow"/>
<rect x="888" y="180" width="192" height="132" rx="14" class="panel"/>
<text x="984" y="217" class="head" text-anchor="middle">响应返回</text>
<text x="984" y="254" class="small" text-anchor="middle">传输 / 客户端解码</text>
<text x="984" y="283" class="small" text-anchor="middle">业务取得可用结果</text>
<path d="M40 143 V128 H1080 V143" fill="none" stroke="#79dcff" stroke-width="2"/>
<text x="560" y="119" class="body" text-anchor="middle">端到端：应用发起 → 获得可用结果</text>
<text x="772" y="344" class="warn" text-anchor="middle">Slowlog ≠ 端到端延迟</text>
<text x="40" y="382" class="body" text-anchor="start">大响应可同时放大输出缓冲、网络传输与客户端解码成本。</text>
<rect x="40" y="443" width="1040" height="157" rx="14" class="panel"/>
<text x="64" y="475" class="head" text-anchor="start">辅助资源链路：与请求处理存在重叠与资源竞争</text>
<text x="67" y="514" class="body" text-anchor="start">CPU / OS 调度</text>
<text x="331" y="514" class="body" text-anchor="start">内存 / 分配 / 回收</text>
<text x="618" y="514" class="body" text-anchor="start">fork：创建子进程</text>
<text x="67" y="557" class="body" text-anchor="start">AOF：追加写日志</text>
<text x="331" y="557" class="body" text-anchor="start">fsync：同步落盘</text>
<text x="618" y="557" class="body" text-anchor="start">磁盘 / 后台任务</text>
<path d="M560 443 L560 320" class="assoc"/>
<path d="M772 443 L772 356" class="assoc"/>
<text x="64" y="584" class="small" text-anchor="start">fork 本身可暂停主进程；后台写盘可并发竞争资源，AOF / fsync 的阻塞与重叠取决于策略。</text>
<text x="40" y="640" class="body" text-anchor="start">教学拆分（非实测）：假定应用线程等待、Redis 排队等未列耗时为 0</text>
<rect x="40" y="663" width="192" height="88" rx="14" class="panel"/>
<text x="136" y="696" class="num" text-anchor="middle">30 ms</text>
<text x="136" y="731" class="small" text-anchor="middle">连接池等待</text>
<rect x="252" y="663" width="192" height="88" rx="14" class="panel"/>
<text x="348" y="696" class="num" text-anchor="middle">10 ms</text>
<text x="348" y="731" class="small" text-anchor="middle">仅请求发送</text>
<rect x="464" y="663" width="192" height="88" rx="14" class="panel"/>
<text x="560" y="696" class="num" text-anchor="middle">0.5 ms</text>
<text x="560" y="731" class="small" text-anchor="middle">命令执行</text>
<rect x="676" y="663" width="192" height="88" rx="14" class="panel"/>
<text x="772" y="696" class="num" text-anchor="middle">5 ms</text>
<text x="772" y="731" class="small" text-anchor="middle">响应传输 + 解码</text>
<rect x="888" y="663" width="192" height="88" rx="14" class="highlight"/>
<text x="984" y="696" class="num" text-anchor="middle">45.5 ms</text>
<text x="984" y="731" class="small" text-anchor="middle">端到端合计</text>
<text x="40" y="782" class="small" text-anchor="start">按同一请求分段计时，避免重复计算；不同阶段的 P99 不能直接相加。</text>
</svg>
