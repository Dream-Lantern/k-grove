<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Redis maxmemory 与 OS / cgroup OOM 分别诊断</title>
<desc id="desc">Redis Open Source 7.2.0：淘汰错误与进程被系统终止，不是固定的先后步骤。 教学示意，版本与边界见正文。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="800" y="48" text-anchor="middle" fill="#0369A1" font-size="34" font-weight="600" data-max-width="1520">Redis maxmemory 与 OS / cgroup OOM 分别诊断</text>
<text x="800" y="84" text-anchor="middle" fill="#0F172A" font-size="21" data-max-width="1520">Redis Open Source 7.2.0：淘汰错误与进程被系统终止，不是固定的先后步骤。</text>
<rect x="350" y="135" width="900" height="110" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="800" y="170" text-anchor="middle" fill="#0369A1" font-size="26" font-weight="600" data-max-width="876">发现内存压力</text>
<text x="800" y="204" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="876">先核对节点角色、maxmemory 策略、主机和容器限制</text>
<path d="M800 245 V295 H410 V340" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M800 295 H1190 V340" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="340" width="700" height="270" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="410" y="375" text-anchor="middle" fill="#0369A1" font-size="25" font-weight="600" data-max-width="676">Redis maxmemory 判定</text>
<text x="410" y="409" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="676">按适用口径核算，部分复制 / AOF 缓冲不计入</text>
<text x="410" y="438" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="676">allkeys：全部适用键；volatile：仅带 TTL 的候选键</text>
<text x="410" y="467" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="676">无足够候选或 noeviction：适用命令可能 OOM</text>
<text x="410" y="496" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="676">noeviction 不等于所有读写命令都失败</text>
<rect x="840" y="340" width="700" height="270" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="1190" y="375" text-anchor="middle" fill="#0369A1" font-size="25" font-weight="600" data-max-width="676">OS / cgroup 内存压力</text>
<text x="1190" y="409" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="676">检查实际驻留、子进程、容器限制和系统事件</text>
<text x="1190" y="438" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="676">可能触发系统 OOM 处理并终止进程</text>
<text x="1190" y="467" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="676">不要求先触发 Redis 淘汰，也不受 maxmemory 硬约束</text>
<text x="1190" y="496" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="676">调整淘汰策略不能替代整机资源预算</text>
<rect x="150" y="690" width="1300" height="120" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="800" y="725" text-anchor="middle" fill="#0369A1" font-size="25" font-weight="600" data-max-width="1276">两条路径可以同时存在</text>
<text x="800" y="759" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="1276">TTL 到期删除与内存淘汰是不同机制；LRU / LFU 为近似选择，不保证业务状态安全。</text>
</g></svg>
