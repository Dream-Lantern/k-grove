<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="805" viewBox="0 0 1120 805" role="img" aria-labelledby="title desc">
<title id="title">复制重连：先判断能否续传</title>
<desc id="desc">副本连接握手后，主节点按复制历史和 Backlog 覆盖判断是否能部分重同步。可续传则补齐缺失字节；否则全量生成并传输快照、副本加载并追赶期间变化。两条路径汇合进入持续复制，写入回复、复制确认和持久化确认不同。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif" text-anchor="middle" fill="#0F172A">
<text x="560" y="48" fill="#0369A1" font-size="30" font-weight="600">复制重连：先判断能否续传</text>
<text x="560" y="84" font-size="18">以 Redis Open Source 7.2.0 为参照；偏移表示复制流字节位置，不是命令数量。</text>
<g fill="#E0F2FE" stroke="#0369A1" stroke-width="2">
<rect x="90" y="125" width="940" height="80" rx="7"/><rect x="90" y="245" width="940" height="85" rx="7"/>
<rect x="60" y="390" width="460" height="145" rx="7"/><rect x="600" y="390" width="460" height="145" rx="7"/>
<rect x="90" y="600" width="940" height="100" rx="7"/>
</g>
<g fill="#0369A1" font-size="23" font-weight="600">
<text x="560" y="158">副本建立连接，完成握手与能力协商</text>
<text x="560" y="279">PSYNC：历史匹配且缺失区间仍在 Backlog？</text>
<text x="290" y="427">部分重同步</text><text x="830" y="427">全量同步</text><text x="560" y="637">进入持续复制，观察链路与偏移</text>
</g>
<g font-size="18">
<text x="560" y="189">提交适用的复制 ID 与下一待接收字节位置</text>
<text x="560" y="312">第二复制 ID 还受其有效偏移边界限制</text>
<text x="290" y="463">补齐缺失复制流，再接续新写入</text>
<text x="290" y="494">假设保留 8001～12000，副本已到 10000</text>
<text x="290" y="523">需补齐 10001～12000</text>
<text x="830" y="463">主节点生成并传输快照 → 副本加载</text>
<text x="830" y="494">再追赶快照期间积累的新写入</text>
<text x="830" y="523">磁盘 / 无盘路径仍有资源和加载成本</text>
<text x="560" y="675">链路 up 不等于业务读到最新数据；偏移差不能直接当作时间延迟。</text>
</g>
<g fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)">
<path d="M560 205V245"/><path d="M560 330V355H290V390"/><path d="M560 355H830V390"/>
<path d="M290 535V565H560V600"/><path d="M830 535V565H560"/>
</g>
<text x="255" y="380" font-size="18">是</text><text x="865" y="380" font-size="18">否</text>
<text x="560" y="767" font-size="18">写入回复、WAIT 复制确认与 WAITAOF 持久化确认是不同保证，不能替代共识提交。</text>
</g></svg>
