<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Redis Open Source 7.2.0：普通写命令、复制与持久化分工</title>
  <desc id="desc">主线程执行普通写命令、更新内存并准备回复，按配置传播到副本和追加 AOF。AOF everysec 使用后台线程同步，always 在主线程同步。RDB 后台快照和 AOF 重写由独立条件触发，再由 fork 创建的子进程生成文件。分支表示工作关系，不表示完整请求时序。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#526987"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #162b50; }
      .heading { font-size: 27px; font-weight: 700; }
      .label { font-size: 23px; font-weight: 700; }
      .body { font-size: 21px; }
      .note { font-size: 20px; fill: #526987; }
      .box { fill: #fff; stroke: #c4d3e7; stroke-width: 2; rx: 14; }
      .flow { fill: none; stroke: #526987; stroke-width: 2.5; marker-end: url(#arrow); }
      .branch { stroke-dasharray: 8 5; }
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#f9fbfe"/>
  <rect x="25" y="22" width="1550" height="1036" rx="24" fill="#fff" stroke="#cfdeef"/>
  <text x="60" y="82" font-size="36" font-weight="700">Redis：普通写命令、复制与持久化分工</text>
  <text x="62" y="124" class="note">Redis Open Source 7.2.0 · 功能分工示意，非完整请求时序；虚线为按配置参与的写传播分支</text>
  <rect x="60" y="166" width="950" height="704" rx="20" fill="#eef5ff"/>
  <text x="86" y="212" class="heading">普通写路径（主事件循环执行命令）</text>
  <rect x="86" y="252" width="220" height="120" class="box"/>
  <text x="106" y="291" class="label">已解析的写命令</text>
  <text x="106" y="329" class="note">网络处理见正文</text>
  <rect x="354" y="252" width="268" height="120" class="box"/>
  <text x="376" y="291" class="label">执行命令、更新内存</text>
  <text x="376" y="329" class="note">普通命令串行执行</text>
  <rect x="670" y="252" width="312" height="120" class="box"/>
  <text x="692" y="291" class="label">准备回复 / 网络写出</text>
  <text x="692" y="329" class="note">不自动等待副本确认</text>
  <path d="M306 312 H354" class="flow"/>
  <path d="M622 312 H670" class="flow"/>
  <path d="M424 372 V408 H266 V448" class="flow branch"/>
  <path d="M552 372 V408 H750 V448" class="flow branch"/>
  <rect x="86" y="448" width="362" height="133" class="box"/>
  <text x="108" y="487" class="label">复制传播（配置副本时）</text>
  <text x="108" y="526" class="body">复制缓冲 → 网络 → 副本</text>
  <text x="108" y="558" class="note">异步传播，不等于同步提交</text>
  <rect x="520" y="448" width="462" height="133" class="box"/>
  <text x="542" y="487" class="label">AOF 追加（启用 AOF 时）</text>
  <text x="542" y="526" class="body">主线程：AOF 缓冲 → 写入文件</text>
  <text x="542" y="558" class="note">写入文件不等于已同步到持久存储</text>
  <path d="M750 581 V623" class="flow"/>
  <rect x="520" y="623" width="462" height="217" rx="14" fill="#f3efff" stroke="#c4d3e7" stroke-width="2"/>
  <text x="542" y="663" class="label">fsync：按 appendfsync 策略</text>
  <text x="542" y="706" class="body">always：主线程同步</text>
  <text x="542" y="748" class="body">everysec：后台线程通常约每秒同步</text>
  <text x="542" y="790" class="body">no：由操作系统安排刷盘</text>
  <text x="108" y="674" class="label">后台线程</text>
  <text x="108" y="714" class="body">与主线程在同一进程</text>
  <text x="108" y="753" class="note">例如 everysec 的文件同步</text>
  <text x="108" y="792" class="note">不同于右侧的后台子进程</text>
  <rect x="1040" y="166" width="500" height="704" rx="20" fill="#fff5e7"/>
  <text x="1066" y="212" class="heading">独立触发的后台任务</text>
  <rect x="1066" y="252" width="448" height="170" class="box"/>
  <text x="1088" y="291" class="label">触发条件（不是每条写命令）</text>
  <text x="1088" y="334" class="body">RDB：BGSAVE / save 条件等</text>
  <text x="1088" y="375" class="body">AOF：BGREWRITEAOF / 自动阈值等</text>
  <path d="M1290 422 V494" class="flow"/>
  <text x="1310" y="467" class="note">fork</text>
  <rect x="1066" y="494" width="448" height="227" class="box"/>
  <text x="1088" y="537" class="label">后台子进程（独立进程）</text>
  <text x="1088" y="581" class="body">RDB 子进程 → 快照文件</text>
  <text x="1088" y="625" class="body">AOF 重写子进程 → 新基础文件</text>
  <text x="1088" y="674" class="note">起初通过 COW 共享父进程内存页</text>
  <text x="1068" y="768" class="note">快照与重写各有触发、调度条件</text>
  <text x="1068" y="807" class="note">不是写命令执行后依次必经的步骤</text>
  <rect x="60" y="900" width="1480" height="125" rx="16" fill="#f3f6fa"/>
  <text x="84" y="939" class="label">边界：后台工作仍会影响前台延迟</text>
  <text x="84" y="976" class="body">fork 可能停顿；COW 增加内存；追加、同步和后台文件生成会竞争磁盘资源。</text>
  <text x="84" y="1008" class="note">图示为支持 fork 的系统；同步 SAVE 会阻塞主线程，未画入后台路径。术语与源码依据见正文。</text>
</svg>
