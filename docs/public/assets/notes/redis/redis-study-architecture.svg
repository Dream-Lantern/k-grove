<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1050" viewBox="0 0 1120 1050" role="img" aria-labelledby="title desc">
<title id="title">Redis 实例：请求执行与后台职责</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">Redis 实例：请求执行与后台职责</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">职责示意，不表示每个框独占线程；版本、构建和配置影响具体路径。</tspan></text><rect x="350" y="125" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="162" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">应用客户端</tspan></text><text x="560.0" y="199" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">请求编码、超时、重试与回复处理</tspan></text><rect x="60" y="390" width="300" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="210.0" y="427" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="210.0" dy="0">网络读入与解析</tspan></text><text x="210.0" y="464" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="210.0" dy="0">接收请求、解析命令</tspan><tspan x="210.0" dy="30">适用 I/O 线程依版本配置</tspan></text><rect x="410" y="390" width="300" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="427" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">普通命令主要执行路径</tspan></text><text x="560.0" y="464" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">命令分派、权限与类型检查</tspan><tspan x="560.0" dy="30">数据操作主要串行推进</tspan></text><rect x="760" y="390" width="300" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="910.0" y="427" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="910.0" dy="0">回复与输出缓冲</tspan></text><text x="910.0" y="464" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="910.0" dy="0">生成回复、网络发送</tspan><tspan x="910.0" dy="30">慢读客户端会产生积压</tspan></text><rect x="410" y="610" width="300" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="647" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">键空间与生命周期</tspan></text><text x="560.0" y="684" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">类型及内部编码</tspan><tspan x="560.0" dy="30">过期、淘汰与内存管理</tspan></text><rect x="60" y="805" width="300" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="210.0" y="842" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="210.0" dy="0">持久化相关工作</tspan></text><text x="210.0" y="879" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="210.0" dy="0">RDB / AOF 与后台任务</tspan><tspan x="210.0" dy="30">fork、刷盘和重写另有成本</tspan></text><rect x="760" y="805" width="300" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="910.0" y="842" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="910.0" dy="0">复制相关工作</tspan></text><text x="910.0" y="879" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="910.0" dy="0">异步传播、历史与追赶</tspan><tspan x="910.0" dy="30">不自动构成强一致提交</tspan></text><path d="M430 235 L430 300 L210 300 L210 390" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M360 450 L410 450" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 450 L760 450" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M910 390 L910 300 L690 300 L690 235" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 510 L560 610" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M470 730 L470 765 L210 765 L210 805" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M650 730 L650 765 L910 765 L910 805" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560.0" y="1012" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">单线程执行模型不等于进程只有一个线程；复制和持久化确认需另外讨论。</tspan></text></g></svg>