<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">数据类型、对象编码与节点结构分层理解</title>
<desc id="desc">固定 Redis Open Source 7.2.0；历史变化和新版本能力不混用。 教学示意，版本与边界见正文。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="800" y="48" text-anchor="middle" fill="#0369A1" font-size="34" font-weight="600" data-max-width="1520">数据类型、对象编码与节点结构分层理解</text>
<text x="800" y="84" text-anchor="middle" fill="#0F172A" font-size="21" data-max-width="1520">固定 Redis Open Source 7.2.0；历史变化和新版本能力不混用。</text>
<rect x="50" y="140" width="820" height="500" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="460" y="175" text-anchor="middle" fill="#0369A1" font-size="26" font-weight="600" data-max-width="796">7.2.0 类型 → 内部编码</text>
<text x="460" y="209" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="796">String → int / embstr / raw</text>
<text x="460" y="238" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="796">List → 直接 listpack，或 quicklist 容器</text>
<text x="460" y="267" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="796">Hash → listpack / hashtable</text>
<text x="460" y="296" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="796">Set → intset / listpack / hashtable</text>
<text x="460" y="325" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="796">Sorted Set → listpack / skiplist（跳表 + 字典）</text>
<text x="460" y="354" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="796">Stream → stream（内部基数树 + listpack）</text>
<rect x="930" y="140" width="620" height="215" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="1240" y="175" text-anchor="middle" fill="#0369A1" font-size="25" font-weight="600" data-max-width="596">quicklist 内部：普通紧凑节点</text>
<text x="1240" y="209" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="596">Node 1 ↔ Node 2 ↔ Node 3</text>
<text x="1240" y="238" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="596">每个 PACKED 节点 → 一段 listpack</text>
<text x="1240" y="267" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="596">特殊大元素路径也可使用 PLAIN 单元素节点</text>
<rect x="930" y="410" width="620" height="230" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="1240" y="445" text-anchor="middle" fill="#0369A1" font-size="25" font-weight="600" data-max-width="596">观察实际对象</text>
<text x="1240" y="479" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="596">OBJECT ENCODING key</text>
<text x="1240" y="508" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="596">MEMORY USAGE key</text>
<text x="1240" y="537" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="596">结合版本、创建路径、阈值与内容判断</text>
<text x="1240" y="566" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="596">不能把内部编码当成稳定的业务协议</text>
<text x="800" y="710" text-anchor="middle" fill="#0F172A" font-size="23" data-max-width="1520">Hash / Sorted Set 的 listpack：7.0.0 起；Set 的 listpack：7.2.0 起，intset 仍保留。</text>
<text x="800" y="760" text-anchor="middle" fill="#0F172A" font-size="22" data-max-width="1520">小 List 可直接使用 listpack；quicklist 的节点又可包含 listpack，两者不是同一层级。</text>
<text x="800" y="825" text-anchor="middle" fill="#0F172A" font-size="21" data-max-width="1520">OBJECT ENCODING 对 Stream 返回 stream，而不是字符串“radix tree + listpack”。</text>
<path d="M870 390 H900 V520 H930" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/>
</g></svg>
