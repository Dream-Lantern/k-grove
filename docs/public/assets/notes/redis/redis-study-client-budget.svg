<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Redis 客户端超时：端到端预算模型</title>
<desc id="desc">业务截止时间包围连接池等待、域名解析与连接建立、命令通信和结果判断四个阶段。所有阶段和重试共用剩余预算；分项超时不是各自获得完整的总预算，超时不证明请求未执行。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2F6FDB"/></marker></defs>
<rect fill="#F9FBFE" width="1600" height="900"/>
<rect fill="#FFFFFF" stroke="#CFDEEF" stroke-width="1.5" width="1540" height="856" x="30" y="22" rx="24"/>
<rect fill="#2F6FDB" width="1540" height="7" x="30" y="22" rx="2"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,Segoe UI,sans-serif">
<text fill="#162B50" font-size="40" font-weight="bold" x="72" y="93">Redis 客户端超时：端到端预算模型</text>
<text fill="#61758F" font-size="20" x="76" y="137">分项超时范围与计时起点随客户端及版本不同；连接复用时可跳过建连阶段</text>
<path d="M72 165H1528" fill="none" stroke="#CFDEEF" stroke-width="2"/>
<rect fill="#F9FBFE" stroke="#2F6FDB" stroke-width="2" width="1452" height="510" x="74" y="190" rx="19"/>
<text fill="#2F6FDB" font-size="26" font-weight="bold" x="105" y="235">Business Deadline：200 ms 总预算（教学示例）</text>
<g fill="#FFFFFF" stroke="#CFDEEF" stroke-width="1.5">
<rect x="105" y="270" width="670" height="150" rx="19"/><rect x="825" y="270" width="670" height="150" rx="19"/>
<rect x="825" y="480" width="670" height="150" rx="19"/><rect x="105" y="480" width="670" height="150" rx="19"/>
</g>
<rect x="105" y="270" width="8" height="150" rx="4" fill="#2F6FDB"/>
<rect x="825" y="270" width="8" height="150" rx="4" fill="#7554CE"/>
<rect x="825" y="480" width="8" height="150" rx="4" fill="#C88323"/>
<rect x="105" y="480" width="8" height="150" rx="4" fill="#118E6B"/>
<rect x="127" y="290" width="52" height="45" rx="12" fill="#EEF5FF"/>
<rect x="847" y="290" width="52" height="45" rx="12" fill="#F3EFFF"/>
<rect x="847" y="500" width="52" height="45" rx="12" fill="#FFF5E7"/>
<rect x="127" y="500" width="52" height="45" rx="12" fill="#E9F8F0"/>
<g font-size="24" font-weight="bold" text-anchor="middle">
<text x="153" y="321" fill="#2F6FDB">1</text><text x="873" y="321" fill="#7554CE">2</text>
<text x="873" y="531" fill="#C88323">3</text><text x="153" y="531" fill="#118E6B">4</text>
</g>
<g fill="#162B50" font-size="26" font-weight="bold">
<text x="193" y="314">连接池等待</text><text x="913" y="314">DNS / TCP / TLS / AUTH</text>
<text x="913" y="524">命令发送与响应读取</text><text x="193" y="524">结果判断与剩余时间管理</text>
</g>
<g fill="#61758F" font-size="19">
<text x="193" y="354">等待可用连接，由连接池实现管理</text><text x="193" y="386">借连接已耗 40 ms，后续约剩 160 ms</text>
<text x="913" y="354">解析、建连、握手和认证分别核对计时范围</text><text x="913" y="386">不能假定一个 connect timeout 覆盖全部</text>
<text x="913" y="564">command timeout 控制适用读写等待</text><text x="913" y="596">不等于服务端命令已取消或未执行</text>
<text x="193" y="564">检查正常回复、服务端错误或通信失败</text><text x="193" y="596">未知副作用先核实，重试继续扣减剩余预算</text>
</g>
<g fill="none" stroke="#2F6FDB" stroke-width="3" marker-end="url(#arrow)">
<path d="M775 345H825"/><path d="M1160 420V480"/><path d="M825 555H775"/>
</g>
<text fill="#2F6FDB" font-size="20" x="105" y="674">外层是截止时间，不是执行阶段；各段与重试共用预算，不能每段都重新等待 200 ms。</text>
<rect fill="#FFF5E7" width="1452" height="121" x="74" y="730" rx="18"/>
<text fill="#C88323" font-size="24" font-weight="bold" x="99" y="765">关键边界</text>
<text fill="#162B50" font-size="19" x="99" y="801">超时不代表业务结果已确定；写入可能已成功执行，只是回复没有到达。</text>
<text fill="#162B50" font-size="19" x="99" y="831">总截止时间由应用协调；连接、池排队、握手和命令的计时范围需按客户端版本核对。</text>
</g></svg>
