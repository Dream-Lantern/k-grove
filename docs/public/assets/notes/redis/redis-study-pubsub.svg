<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">PubSub：发布时在线的订阅者分别接收</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">PubSub：发布时在线的订阅者分别接收</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">频道是分发通道，不是带历史保留与消费确认的队列。</tspan></text><rect x="60" y="280" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="210.0" y="317" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="210.0" dy="0">发布者</tspan></text><text x="210.0" y="354" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="210.0" dy="0">PUBLISH 一条消息</tspan></text><rect x="460" y="280" width="250" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="585.0" y="317" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="585.0" dy="0">频道</tspan></text><text x="585.0" y="354" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="585.0" dy="0">分发当前消息</tspan></text><rect x="800" y="150" width="280" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="940.0" y="187" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="940.0" dy="0">订阅者 A</tspan></text><text x="940.0" y="224" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="940.0" dy="0">在线可接收</tspan></text><rect x="800" y="430" width="280" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="940.0" y="467" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="940.0" dy="0">订阅者 B</tspan></text><text x="940.0" y="504" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="940.0" dy="0">在线可接收</tspan></text><path d="M360 335 L460 335" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 335 L755 335 L755 205 L800 205" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 335 L755 335 L755 485 L800 485" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560.0" y="732" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">断线期间没有自动重放；发布返回订阅计数不等于消费者业务处理完成。</tspan></text></g></svg>