<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">PubSub：在线广播与两种订阅匹配</title>
<desc id="desc">发布者向频道发布，在线订阅者分别接收。A 同时直接订阅和模式订阅，会收到 message 和 pmessage；每条匹配路径最多投递一次，断线不自动重放，发布计数不是业务确认。</desc>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif" text-anchor="middle" fill="#0F172A">
<text x="560" y="48" fill="#0369A1" font-size="30" font-weight="600">PubSub：发布时在线的订阅者分别接收</text>
<text x="560" y="84" font-size="18">频道分发当前消息，不保存可恢复的历史队列，也没有业务确认。</text>
<g fill="#E0F2FE" stroke="#0369A1" stroke-width="2">
<rect x="60" y="280" width="300" height="110" rx="7"/>
<rect x="460" y="280" width="250" height="110" rx="7"/>
<rect x="800" y="150" width="280" height="110" rx="7"/>
<rect x="800" y="430" width="280" height="110" rx="7"/>
<rect x="60" y="585" width="1020" height="105" rx="7"/>
</g>
<g fill="#0369A1" font-size="23" font-weight="600">
<text x="210" y="317">发布者</text><text x="585" y="317">频道</text>
<text x="940" y="184">订阅者 A</text><text x="940" y="467">订阅者 B</text>
</g>
<g font-size="19">
<text x="210" y="354">PUBLISH 一条消息</text><text x="585" y="354">demo:event:created</text>
<text x="940" y="216">直接订阅 + 模式订阅</text><text x="940" y="244">message + pmessage</text>
<text x="940" y="504">在线直接订阅 → message</text>
<text x="570" y="620">A：SUBSCRIBE demo:event:created 与 PSUBSCRIBE demo:event:*</text>
<text x="570" y="655">同一事件沿两条匹配路径到达 A；每条路径最多投递一次，业务仍需去重。</text>
</g>
<g fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)">
<path d="M360 335H460"/><path d="M710 335H755V205H800"/><path d="M710 335H755V485H800"/>
</g>
<text x="560" y="732" font-size="18">断线期间没有自动重放；发布返回的匹配计数不等于消费者业务处理完成。</text>
</g></svg>
