<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="805" viewBox="0 0 1120 805" role="img" aria-labelledby="title desc">
<title id="title">租约交接：旧进程仍可能继续写入</title>
<desc id="desc">四条并发泳道，时间向下。A取得租约和令牌41，暂停超过租期；Redis锁到期，B取得新租约和令牌42，向下游写入且记录42；A恢复后携41写入被下游拒绝。唯一锁标识与有序令牌不同，令牌来自另行保证单调性的协议。</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1">
<stop stop-color="#07182c"/>
<stop offset="1" stop-color="#102f50"/>
</linearGradient>
<marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0 L8 4 L0 8" fill="#57caff"/>
</marker>
<marker id="redtip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0 L8 4 L0 8" fill="#ffbc87"/>
</marker>
</defs>
<style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}.title{font-size:29px;font-weight:700;fill:#f0f8ff}.sub{font-size:16px;fill:#9dc5e8}.head{font-size:20px;font-weight:700;fill:#79dcff}.body{font-size:17px;fill:#deedfa}.small{font-size:15px;fill:#b5d4ed}.warn{font-size:17px;fill:#ffd0a5}.num{font-size:24px;font-weight:700;fill:#72e6d0}.panel{fill:#123653;stroke:#377599;stroke-width:1.4}.highlight{fill:#174967;stroke:#61d6ff;stroke-width:1.6}.caution{fill:#3b3440;stroke:#d6a175;stroke-width:1.5}.arrow{fill:none;stroke:#57caff;stroke-width:2;marker-end:url(#tip)}.old{fill:none;stroke:#ffbc87;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#redtip)}.assoc{fill:none;stroke:#62a9cb;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#tip)}.lane{stroke:#345b78;stroke-width:1.3;stroke-dasharray:4 6}</style>
<rect width="1120" height="805" rx="20" fill="url(#bg)"/>
<text x="40" y="53" class="title" text-anchor="start">租约交接：旧进程仍可能继续写入</text>
<text x="40" y="85" class="sub" text-anchor="start">时间向下；41 / 42 是协议另行取得的有序令牌，不是 SET 返回值</text>
<rect x="35" y="112" width="230" height="48" rx="14" class="panel"/>
<text x="150" y="143" class="head" text-anchor="middle">Worker A</text>
<path d="M150 165 V700" class="lane"/>
<rect x="305" y="112" width="230" height="48" rx="14" class="panel"/>
<text x="420" y="143" class="head" text-anchor="middle">Worker B</text>
<path d="M420 165 V700" class="lane"/>
<rect x="575" y="112" width="230" height="48" rx="14" class="panel"/>
<text x="690" y="143" class="head" text-anchor="middle">Redis 锁服务</text>
<path d="M690 165 V700" class="lane"/>
<rect x="845" y="112" width="230" height="48" rx="14" class="panel"/>
<text x="960" y="143" class="head" text-anchor="middle">下游数据库 / 资源</text>
<path d="M960 165 V700" class="lane"/>
<path d="M150 193 L690 193" class="arrow"/>
<text x="420" y="181" class="body" text-anchor="middle">① A 获取租约：SET NX PX</text>
<path d="M690 230 L150 230" class="arrow"/>
<text x="420" y="220" class="small" text-anchor="middle">成功；A 另取得令牌 41</text>
<rect x="43" y="263" width="214" height="58" rx="14" class="highlight"/>
<text x="150" y="288" class="body" text-anchor="middle">A 持有租约</text>
<text x="150" y="311" class="small" text-anchor="middle">有序令牌 = 41</text>
<rect x="43" y="347" width="214" height="155" rx="14" class="caution"/>
<text x="150" y="377" class="warn" text-anchor="middle">② A 暂停</text>
<text x="150" y="407" class="small" text-anchor="middle">暂停时间超过租期</text>
<text x="150" y="438" class="small" text-anchor="middle">旧进程没有被终止</text>
<text x="150" y="478" class="small" text-anchor="middle">B 此时仍可继续执行</text>
<rect x="578" y="331" width="224" height="49" rx="14" class="caution"/>
<text x="690" y="362" class="warn" text-anchor="middle">③ Redis 锁到期</text>
<path d="M420 406 L690 406" class="arrow"/>
<text x="553" y="395" class="small" text-anchor="middle">④ B 获取新租约</text>
<path d="M690 446 L420 446" class="arrow"/>
<text x="553" y="435" class="small" text-anchor="middle">成功；另取得令牌 42</text>
<rect x="306" y="465" width="228" height="49" rx="14" class="highlight"/>
<text x="420" y="496" class="body" text-anchor="middle">B：有序令牌 = 42</text>
<path d="M420 542 L960 542" class="arrow"/>
<text x="680" y="530" class="body" text-anchor="middle">⑤ B 携令牌 42 提交业务操作</text>
<rect x="844" y="557" width="232" height="61" rx="14" class="highlight"/>
<text x="960" y="582" class="body" text-anchor="middle">⑥ 校验并写入</text>
<text x="960" y="605" class="small" text-anchor="middle">记录最大令牌 = 42</text>
<path d="M150 644 L960 644" class="old"/>
<text x="523" y="632" class="warn" text-anchor="middle">⑦ A 恢复，携旧令牌 41 提交</text>
<rect x="844" y="659" width="232" height="44" rx="14" class="caution"/>
<text x="960" y="687" class="warn" text-anchor="middle">⑧ 41 &lt; 42：拒绝</text>
<text x="40" y="742" class="body" text-anchor="start">唯一锁标识：识别持有者，用于安全续租 / 解锁；Fencing Token（栅栏令牌）：比较资格顺序。</text>
<text x="40" y="775" class="small" text-anchor="start">只有下游原子校验令牌并执行写入，才能拒绝迟到操作；生成器还须在目标故障模型下保持单调。</text>
</svg>
