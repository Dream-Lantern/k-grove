<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Bitmap：全局位偏移与字节内位权映射</title>
  <desc id="desc">每字节按最高有效位在先编号：offset 0 位于字节 0 的最高位，offset 7 是最低位，offset 8 是字节 1 最高位。字节内移位数从 7 降到 0。仅设置 offset 0 时，第一个字节为 0x80。本图展示位置规则，不代表字符串一定已分配两字节。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern>
    <style>
      text { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; fill: #0F172A; text-anchor: middle; }
      .title { fill: #0369A1; font-size: 30px; font-weight: 600; }
      .heading { fill: #0369A1; font-size: 23px; font-weight: 600; }
      .body { font-size: 19px; }
      .note { font-size: 18px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="560" y="48" class="title">Bitmap：offset 从每字节的最高有效位开始</text>
  <text x="560" y="84" class="note">MSB-first（最高有效位在先）；全局 offset 与字节内 bitIndex 是不同编号。</text>
  <rect x="60" y="125" width="1000" height="310" rx="7" fill="#FFFFFF" stroke="#0369A1" stroke-width="2"/>
  <text x="175" y="195" class="heading">Byte 0</text>
  <text x="175" y="228" class="note">字节索引 0</text>
  <text x="175" y="335" class="heading">Byte 1</text>
  <text x="175" y="368" class="note">字节索引 1</text>
  <text x="675" y="154" class="note">上行：全局 offset；下行：字节内 bitIndex（移位数）</text>
<rect x="300" y="175" width="82" height="80" rx="7" fill="#BAE6FD" stroke="#0369A1"/>
<text x="341" y="205" class="heading">0</text>
<text x="341" y="237" class="body">7</text>
<rect x="392" y="175" width="82" height="80" rx="7" fill="#E0F2FE" stroke="#0369A1"/>
<text x="433" y="205" class="heading">1</text>
<text x="433" y="237" class="body">6</text>
<rect x="484" y="175" width="82" height="80" rx="7" fill="#E0F2FE" stroke="#0369A1"/>
<text x="525" y="205" class="heading">2</text>
<text x="525" y="237" class="body">5</text>
<rect x="576" y="175" width="82" height="80" rx="7" fill="#E0F2FE" stroke="#0369A1"/>
<text x="617" y="205" class="heading">3</text>
<text x="617" y="237" class="body">4</text>
<rect x="668" y="175" width="82" height="80" rx="7" fill="#E0F2FE" stroke="#0369A1"/>
<text x="709" y="205" class="heading">4</text>
<text x="709" y="237" class="body">3</text>
<rect x="760" y="175" width="82" height="80" rx="7" fill="#E0F2FE" stroke="#0369A1"/>
<text x="801" y="205" class="heading">5</text>
<text x="801" y="237" class="body">2</text>
<rect x="852" y="175" width="82" height="80" rx="7" fill="#E0F2FE" stroke="#0369A1"/>
<text x="893" y="205" class="heading">6</text>
<text x="893" y="237" class="body">1</text>
<rect x="944" y="175" width="82" height="80" rx="7" fill="#E0F2FE" stroke="#0369A1"/>
<text x="985" y="205" class="heading">7</text>
<text x="985" y="237" class="body">0</text>
<rect x="300" y="315" width="82" height="80" rx="7" fill="#BAE6FD" stroke="#0369A1"/>
<text x="341" y="345" class="heading">8</text>
<text x="341" y="377" class="body">7</text>
<rect x="392" y="315" width="82" height="80" rx="7" fill="#E0F2FE" stroke="#0369A1"/>
<text x="433" y="345" class="heading">9</text>
<text x="433" y="377" class="body">6</text>
<rect x="484" y="315" width="82" height="80" rx="7" fill="#E0F2FE" stroke="#0369A1"/>
<text x="525" y="345" class="heading">10</text>
<text x="525" y="377" class="body">5</text>
<rect x="576" y="315" width="82" height="80" rx="7" fill="#E0F2FE" stroke="#0369A1"/>
<text x="617" y="345" class="heading">11</text>
<text x="617" y="377" class="body">4</text>
<rect x="668" y="315" width="82" height="80" rx="7" fill="#E0F2FE" stroke="#0369A1"/>
<text x="709" y="345" class="heading">12</text>
<text x="709" y="377" class="body">3</text>
<rect x="760" y="315" width="82" height="80" rx="7" fill="#E0F2FE" stroke="#0369A1"/>
<text x="801" y="345" class="heading">13</text>
<text x="801" y="377" class="body">2</text>
<rect x="852" y="315" width="82" height="80" rx="7" fill="#E0F2FE" stroke="#0369A1"/>
<text x="893" y="345" class="heading">14</text>
<text x="893" y="377" class="body">1</text>
<rect x="944" y="315" width="82" height="80" rx="7" fill="#E0F2FE" stroke="#0369A1"/>
<text x="985" y="345" class="heading">15</text>
<text x="985" y="377" class="body">0</text>
  <text x="675" y="420" class="note">每行从左到右：MSB（最高有效位）→ LSB（最低有效位）</text>
  <text x="560" y="480" class="body">byteIndex = floor(offset / 8)；bitIndex = 7 - (offset % 8)</text>
  <text x="560" y="524" class="heading">仅设置 offset 0：10000000（二进制）= 0x80（十六进制）</text>
  <text x="560" y="566" class="note">单独执行 SETBIT demo:bitmap 0 1 只需首字节；上图第二字节用于说明后续位置规则。</text>
  <text x="560" y="601" class="note">Bitmap 基于 String，空间取决于最大 offset，不取决于置位人数。</text>
</svg>
