<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc">
<title id="title">Pipeline：减少逐命令等待，不提供事务隔离</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">Pipeline：减少逐命令等待，不提供事务隔离</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">示意单连接提交多个命令；不保证恰好一个网络包或一轮所有等待。</tspan></text><rect x="80" y="140" width="360" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="260.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="260.0" dy="0">客户端</tspan></text><text x="260.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="260.0" dy="0">批量准备 / 逐条检查回复</tspan></text><rect x="680" y="140" width="360" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="860.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="860.0" dy="0">Redis</tspan></text><text x="860.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="860.0" dy="0">按适用执行机制处理命令</tspan></text><path d="M260 250V730 M860 250V730" stroke="#0369A1" stroke-width="2" fill="none"/><text x="560" y="305" text-anchor="middle" fill="#0F172A" font-size="20" font-weight="400"><tspan x="560" dy="0">命令 1、2、3 …  连续提交</tspan></text><path d="M260 330 L860 330" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="475" text-anchor="middle" fill="#0F172A" font-size="20" font-weight="400"><tspan x="560" dy="0">回复 1、2、3 …  持续读取</tspan></text><path d="M860 500 L260 500" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="650" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560" dy="0">批次大小、返回字节、在途数量和慢消费者共同决定背压。</tspan></text><text x="560.0" y="862" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">异步客户端可边发边收；批量不等于所有命令同时完成或其他客户端不能插入。</tspan></text></g></svg>