<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">Cache Aside：读路径与写路径分别考虑</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">Cache Aside：读路径与写路径分别考虑</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">新增教学模型；数据库与 Redis 更新不构成一个跨系统原子事务。</tspan></text><rect x="60" y="140" width="430" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="275.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="275.0" dy="0">读：先查缓存</tspan></text><text x="275.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="275.0" dy="0">命中返回；未命中再向数据库查询</tspan></text><rect x="630" y="140" width="430" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="845.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="845.0" dy="0">数据库读结果</tspan></text><text x="845.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="845.0" dy="0">按策略回填，包括适用的短期空值</tspan></text><path d="M490 195 L630 195" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="440" width="430" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="275.0" y="477" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="275.0" dy="0">写：先提交数据库</tspan></text><text x="275.0" y="514" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="275.0" dy="0">数据库是该示例的权威数据源</tspan></text><rect x="630" y="440" width="430" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="845.0" y="477" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="845.0" dy="0">使缓存失效</tspan></text><text x="845.0" y="514" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="845.0" dy="0">失败重试 / 并发旧回填另有窗口</tspan></text><path d="M490 495 L630 495" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="680" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560" dy="0">过期、淘汰、回填和写入竞态分别建模，不能宣称延迟双删永远一致。</tspan></text><text x="560.0" y="812" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">权威数据源和可接受陈旧时间由业务决定；强一致要求需要额外协议。</tspan></text></g></svg>