<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Cache-Aside：读分流、写失效与迟到回填</title>
<desc id="desc">应用协议教学示意；数据库与 Redis 各自提交，不自动组成原子事务。 教学示意，版本与边界见正文。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="800" y="48" text-anchor="middle" fill="#0369A1" font-size="34" font-weight="600" data-max-width="1520">Cache-Aside：读分流、写失效与迟到回填</text>
<text x="800" y="84" text-anchor="middle" fill="#0F172A" font-size="21" data-max-width="1520">应用协议教学示意；数据库与 Redis 各自提交，不自动组成原子事务。</text>
<rect x="420" y="125" width="760" height="100" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="800" y="160" text-anchor="middle" fill="#0369A1" font-size="25" font-weight="600" data-max-width="736">读取请求 → 查询 Redis</text>
<text x="800" y="194" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="736">应用负责访问缓存与权威数据库</text>
<path d="M800 225 V265 H410 V305" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M800 265 H1190 V305" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="305" width="680" height="120" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="410" y="340" text-anchor="middle" fill="#0369A1" font-size="25" font-weight="600" data-max-width="656">HIT：命中</text>
<text x="410" y="374" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="656">直接返回缓存，不继续查询数据库</text>
<rect x="850" y="305" width="680" height="120" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="1190" y="340" text-anchor="middle" fill="#0369A1" font-size="25" font-weight="600" data-max-width="656">MISS：未命中</text>
<text x="1190" y="374" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="656">查询数据库 → 按发布规则回填 Redis → 返回结果</text>
<rect x="180" y="515" width="1240" height="120" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="800" y="550" text-anchor="middle" fill="#0369A1" font-size="26" font-weight="600" data-max-width="1216">写入：更新数据库 → 提交成功 → 删除缓存</text>
<text x="800" y="584" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="1216">下一次 MISS 重新加载；删除失败要可靠重试，投递和回填仍可能并发</text>
<rect x="100" y="700" width="1400" height="135" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="800" y="735" text-anchor="middle" fill="#0369A1" font-size="25" font-weight="600" data-max-width="1376">旧值回填竞态</text>
<text x="800" y="769" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="1376">A 读到 v1 后暂停 → B 提交 v2 并删除缓存 → A 恢复后回填 v1</text>
<text x="800" y="798" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="1376">需要版本或重建协议；TTL、可靠删除事件、延迟双删都不自动消除这个竞态。</text>
</g></svg>
