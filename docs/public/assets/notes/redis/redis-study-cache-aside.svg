<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600">
  <defs/>
  <rect fill="#F9FBFE" height="900" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1600" x="0" y="0"/>
  <rect fill="#FFFFFF" height="856" rx="24" ry="24" stroke="#CFDEEF" stroke-width="1.5" width="1540" x="30" y="22"/>
  <rect fill="#2F6FDB" height="7" rx="2" ry="2" stroke="none" stroke-width="1.5" width="1540" x="30" y="22"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="40" font-weight="bold" x="72" y="93">Cache Aside：命中与未命中必须分流</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="76" y="137">命中立即结束；未命中才查询数据库和回填缓存</text>
  <polyline fill="none" points="72,165 1528,165" stroke="#CFDEEF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
  <rect fill="#FFFFFF" height="122" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="1120" x="240" y="211"/>
  <rect fill="#2F6FDB" height="122" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="240" y="211"/>
  <rect fill="#EEF5FF" height="45" rx="12" ry="12" stroke="none" stroke-width="1.5" width="52" x="262" y="231"/>
  <text fill="#2F6FDB" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" text-anchor="middle" x="288" y="262">1</text>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="28" font-weight="bold" x="328" y="255">查询 Redis 缓存</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="328" y="292">根据 hit / miss 产生独立的下游路径</text>
  <polyline fill="none" points="800,333 800,390" stroke="#2F6FDB" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polyline fill="none" points="440.0,390 1154.0,390" stroke="#8996A8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/>
  <polyline fill="none" points="440.0,390 440.0,412" stroke="#118E6B" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polygon fill="#118E6B" points="440.0,412 445.0,401.0 435.0,401.0"/>
  <rect fill="#FFFFFF" height="252" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="700" x="90" y="418"/>
  <rect fill="#118E6B" height="252" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="90" y="418"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="114" y="462">命中 HIT</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="114" y="499">直接返回缓存值</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="114" y="530">成功终止，不继续查询数据库</text>
  <polyline fill="none" points="1154.0,390 1154.0,412" stroke="#2F6FDB" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polygon fill="#2F6FDB" points="1154.0,412 1159.0,401.0 1149.0,401.0"/>
  <rect fill="#FFFFFF" height="252" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="700" x="804" y="418"/>
  <rect fill="#2F6FDB" height="252" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="804" y="418"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="25" font-weight="bold" x="828" y="462">未命中 MISS</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="828" y="499">查询数据库 → 按策略回填</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="828" y="530">返回结果；并发旧值回填须防护</text>
  <rect fill="#FFF5E7" height="121" rx="18" ry="18" stroke="none" stroke-width="1.5" width="1452" x="74" y="730"/>
  <text fill="#C88323" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" x="99" y="765">关键边界</text>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="99" y="801">Cache Aside 中数据库与缓存更新通常不是一笔原子事务。</text>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="99" y="831">并发、过期与写入顺序可能造成旧值短暂回填，应在工程方案中明确约束。</text>
</svg>
