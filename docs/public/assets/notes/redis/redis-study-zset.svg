<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
  <title id="title">Sorted Set：唯一成员、分数与排序视图</title>
  <desc id="desc">user-a 分数为 10，user-b 和 user-c 分数为 15。升序结果为 a、b、c，同分按成员字节字典序排列；REV 反转为 c、b、a。Rank 按索引、Score 按分数范围查询。箭头表达数据关系，不是线程执行顺序。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; fill: #0F172A; text-anchor: middle; }
      .title { fill: #0369A1; font-size: 30px; font-weight: 600; }
      .heading { fill: #0369A1; font-size: 23px; font-weight: 600; }
      .body { font-size: 19px; }
      .note { font-size: 18px; }
      .box { fill: #E0F2FE; stroke: #0369A1; stroke-width: 2; rx: 7; }
      .relation { fill: none; stroke: #0369A1; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="560" y="48" class="title">Sorted Set：成员唯一，按分数形成顺序</text>
  <text x="560" y="84" class="note">箭头表示数据与查询视图的关系，不是线程或源码执行流程。</text>
  <rect x="40" y="200" width="300" height="245" class="box"/>
  <text x="190" y="239" class="heading">成员 → score（分数）</text>
  <text x="190" y="295" class="body">user-a : 10</text>
  <text x="190" y="345" class="body">user-b : 15</text>
  <text x="190" y="395" class="body">user-c : 15</text>
  <rect x="410" y="200" width="300" height="245" class="box"/>
  <text x="560" y="239" class="heading">升序排列视图</text>
  <text x="560" y="295" class="body">rank 0 → user-a : 10</text>
  <text x="560" y="345" class="body">rank 1 → user-b : 15</text>
  <text x="560" y="395" class="body">rank 2 → user-c : 15</text>
  <rect x="780" y="200" width="300" height="245" class="box"/>
  <text x="930" y="239" class="heading">查询维度</text>
  <text x="930" y="291" class="body">Rank：按索引范围</text>
  <text x="930" y="329" class="note">0～1 → user-a、user-b</text>
  <text x="930" y="378" class="body">Score：按分数范围</text>
  <text x="930" y="416" class="note">15～15 → user-b、user-c</text>
  <path d="M340 320 H410" class="relation"/>
  <path d="M710 320 H780" class="relation"/>
  <rect x="90" y="510" width="940" height="133" class="box"/>
  <text x="560" y="551" class="heading">同分按成员字节字典序，不按插入时间</text>
  <text x="560" y="590" class="body">正向：user-a → user-b → user-c</text>
  <text x="560" y="625" class="body">REV：user-c → user-b → user-a（同分顺序也反转）</text>
  <text x="560" y="695" class="note">BYLEX 的预期字典序查询要求所有成员同分，本图的混合分数不满足该条件。</text>
  <text x="560" y="732" class="note">同分不表示相同成员；业务先到先排、score 精度与返回量仍需单独设计。</text>
</svg>
