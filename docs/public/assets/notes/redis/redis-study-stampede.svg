<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="805" viewBox="0 0 1120 805" role="img" aria-labelledby="title desc">
<title id="title">热点重建：负责人、跟随请求与异常路径</title>
<desc id="desc">教学假设：同一进程、同一协调组中 1000 个请求同时 MISS。 教学示意，版本与边界见正文。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="white"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="560" y="48" text-anchor="middle" fill="#0369A1" font-size="29" font-weight="600" data-max-width="1040">热点重建：负责人、跟随请求与异常路径</text>
<text x="560" y="84" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="1040">教学假设：同一进程、同一协调组中 1000 个请求同时 MISS。</text>
<rect x="300" y="120" width="520" height="95" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="560" y="155" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600" data-max-width="496">请求合并 / 适用的跨进程协调</text>
<text x="560" y="189" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="496">Singleflight 本身不跨应用进程</text>
<path d="M560 215 V255 H285 V300" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M560 255 H835 V300" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="300" width="470" height="160" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="285" y="335" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600" data-max-width="446">Leader：本次重建负责人</text>
<text x="285" y="369" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="446">再查缓存，仍 MISS 才查数据库</text>
<text x="285" y="398" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="446">校验发布资格，再写入新值</text>
<text x="285" y="427" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="446">成功后释放自己的协调状态</text>
<rect x="600" y="300" width="470" height="160" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="835" y="335" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600" data-max-width="446">Followers：其他请求</text>
<text x="835" y="369" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="446">等待共享结果 / 返回允许的旧值</text>
<text x="835" y="398" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="446">等待有时限，超时按预算降级</text>
<text x="835" y="427" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="446">不能无界排队或同时无保护回源</text>
<rect x="90" y="530" width="940" height="110" rx="9" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/>
<text x="560" y="565" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600" data-max-width="916">重建失败：共享受控错误，释放状态并限制后续重试</text>
<text x="560" y="599" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="916">锁过期不代表旧 Worker 停止；仅解锁验 Token，不能阻止旧任务回填</text>
<text x="560" y="705" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="1040">发布保护：原子条件写入 / 数据版本 / 由写入端验证的 Fencing Token</text>
<text x="560" y="765" text-anchor="middle" fill="#0F172A" font-size="18" data-max-width="1040">Leader 不是 Redis 选举角色；逻辑过期仍可能遇到键淘汰或缓存故障。</text>
<path d="M520 390 H600" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M285 460 V495 H400 V530" fill="none" stroke="#0369A1" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="285" y="520" text-anchor="middle" fill="#0F172A" font-size="16" data-max-width="200">失败 / 有限重试</text>
</g></svg>
