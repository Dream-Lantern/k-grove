<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">渐进 rehash：两张表共同过渡</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">渐进 rehash：两张表共同过渡</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">结构示意而非内存地址；条目分批迁移，查找与更新要处理过渡状态。</tspan></text><rect x="60" y="160" width="440" height="140" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="280.0" y="197" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="280.0" dy="0">旧哈希表 ht[0]</tspan></text><text x="280.0" y="234" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="280.0" dy="0">尚未迁移的桶与条目</tspan><tspan x="280.0" dy="30">迁移游标按实现推进</tspan></text><rect x="620" y="160" width="440" height="140" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="840.0" y="197" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="840.0" dy="0">目标哈希表 ht[1]</tspan></text><text x="840.0" y="234" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="840.0" dy="0">已迁移条目与适用新写入</tspan><tspan x="840.0" dy="30">按新容量计算桶位置</tspan></text><path d="M500 230 L620 230" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="465" width="420" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="502" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">迁移期间的访问</tspan></text><text x="560.0" y="539" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">查找按实现检查适用表，操作可推进迁移</tspan></text><path d="M430 465 L430 385 L280 385 L280 300" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 465 L690 385 L840 385 L840 300" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="700" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560" dy="0">迁移结束：释放旧表，目标表成为稳定表；渐进不等于没有资源开销。</tspan></text><text x="560.0" y="812" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">具体步数、暂停条件和分配策略按版本源码核对，不作为业务协议。</tspan></text></g></svg>