<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="title desc">
<title id="title">持久化：内存状态的两类恢复材料</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="560.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="560.0" dy="0">持久化：内存状态的两类恢复材料</tspan></text><text x="560.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">比较数据来源与恢复材料，不承诺某种故障下绝对零丢失。</tspan></text><rect x="350" y="130" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="560.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="560.0" dy="0">内存数据</tspan></text><text x="560.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560.0" dy="0">业务写入和当前状态</tspan></text><rect x="70" y="410" width="440" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="290.0" y="447" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="290.0" dy="0">RDB 快照</tspan></text><text x="290.0" y="484" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="290.0" dy="0">某个时点的数据集表示</tspan></text><rect x="610" y="410" width="440" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="830.0" y="447" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="830.0" dy="0">AOF 路线</tspan></text><text x="830.0" y="484" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="830.0" dy="0">适用日志 / base / incr / manifest</tspan></text><path d="M430 240 L430 320 L290 320 L290 410" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 240 L690 320 L830 320 L830 410" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="650" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="560" dy="0">恢复要核对文件完整性、版本与业务数据；复制不能代替备份。</tspan></text><text x="560.0" y="762" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="560.0" dy="0">备份和隔离恢复属于独立维护流程；本轮没有运行 SAVE、BGSAVE 或修复工具。</tspan></text></g></svg>