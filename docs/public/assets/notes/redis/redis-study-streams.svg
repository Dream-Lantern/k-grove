<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="805" viewBox="0 0 1120 805" role="img" aria-labelledby="title desc">
<title id="title">Streams：消息本体、组内 PEL 与接管</title>
<desc id="desc">XADD 保存消息本体。消费组读取新条目时默认进入该组 PEL，NOACK 不进入。XACK 只清理该组待确认引用，不删除消息本体；XAUTOCLAIM 将满足空闲阈值的待确认条目归属改为新消费者，不能证明旧消费者已停止。</desc>
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/><rect width="100%" height="100%" fill="url(#grid)"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif" text-anchor="middle" fill="#0F172A">
<text x="560" y="48" fill="#0369A1" font-size="30" font-weight="600">Streams：日志内容与消费状态分别管理</text>
<text x="560" y="84" font-size="18">教学示意：以下分支表示 XREADGROUP 用 &gt; 领取新条目的行为。</text>
<g fill="#E0F2FE" stroke="#0369A1" stroke-width="2">
<rect x="90" y="125" width="940" height="95" rx="7"/>
<rect x="90" y="255" width="940" height="95" rx="7"/>
<rect x="90" y="405" width="560" height="105" rx="7"/>
<rect x="710" y="405" width="320" height="105" rx="7"/>
<rect x="60" y="580" width="455" height="130" rx="7"/>
<rect x="565" y="580" width="495" height="130" rx="7"/>
</g>
<g fill="#0369A1" font-size="23" font-weight="600">
<text x="560" y="161">Stream 本体：XADD 写入 ID 与字段</text>
<text x="560" y="291">消费组：维护自己的投递进度</text>
<text x="370" y="441">该组 PEL：已投递、未确认</text>
<text x="870" y="441">NOACK：不进入 PEL</text>
<text x="287" y="616">业务成功后 XACK</text>
<text x="812" y="616">空闲达阈值后 XAUTOCLAIM</text>
</g>
<g font-size="18">
<text x="560" y="197">条目内容与消费组状态分开；持久性受 Redis 配置约束</text>
<text x="560" y="327">组内分工领取；其他组独立读取与确认</text>
<text x="370" y="478">记录消费者归属，不复制消息内容</text>
<text x="870" y="478">不能通过该次投递的 PEL 接管</text>
<text x="287" y="651">清除该组及其消费者的 PEL 引用</text>
<text x="287" y="684">不删除 Stream 本体，不确认其他组</text>
<text x="812" y="651">改为新消费者归属，重置空闲计时</text>
<text x="812" y="684">旧消费者可能继续处理，仍须业务幂等</text>
</g>
<g fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)">
<path d="M560 220V255"/>
<path d="M370 350V405"/><path d="M870 350V405"/>
<path d="M370 510V545H287V580"/><path d="M370 545H812V580"/>
</g>
<text x="325" y="384" font-size="17">默认模式</text>
<text x="560" y="767" font-size="18">业务提交与消息确认不是跨系统原子事务，仍需处理重复执行。</text>
</g></svg>
