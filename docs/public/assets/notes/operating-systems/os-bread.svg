<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc">
<title id="title">Linux 0.11 bread：命中直接返回，失效才读设备</title><desc id="desc">0.11历史缓冲模型，不直接等同现代统一页缓存；命中路径不经过READ。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">Linux 0.11 bread：命中直接返回，失效才读设备</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">按fs/buffer.c复盘；成功/失败取决于完成后的b_uptodate。</tspan></text><rect x="390" y="130" width="420" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">getblk取得缓冲</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">设备、块号及缓冲引用</tspan></text><polygon points="550.0,310 710,360.0 550.0,410 390,360.0" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="550.0" y="367.0" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600"><tspan x="550.0" dy="0">b_uptodate？</tspan></text><rect x="60" y="810" width="440" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="280.0" y="847" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="280.0" dy="0">返回缓冲引用</tspan></text><text x="280.0" y="884" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="280.0" dy="0">调用方管理后续生命周期</tspan></text><rect x="790" y="310" width="350" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="965.0" y="347" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="965.0" dy="0">提交READ并等待解锁</tspan></text><text x="965.0" y="384" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="965.0" dy="0">当前任务可显式调度出去</tspan></text><polygon points="940.0,540 1120,595.0 940.0,650 760,595.0" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="940.0" y="602.0" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600"><tspan x="940.0" dy="0">完成后数据有效？</tspan></text><rect x="730" y="810" width="410" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="935.0" y="847" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="935.0" dy="0">释放引用，返回NULL</tspan></text><text x="935.0" y="884" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="935.0" dy="0">唤醒不是读取成功的证明</tspan></text><path d="M550 230 L550 310" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M390 360 L280 360 L280 810" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="224.0" y="511" width="112.0" height="25" fill="white"/><text x="280" y="530" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="280" dy="0">是：缓存命中</tspan></text><path d="M710 360 L790 360" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="736.5" y="321" width="27.0" height="25" fill="white"/><text x="750" y="340" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="750" dy="0">否</tspan></text><path d="M940 420 L940 540" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M760 595 L570 595 L570 865 L500 865" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="596.5" y="561" width="27.0" height="25" fill="white"/><text x="610" y="580" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="610" dy="0">是</tspan></text><path d="M940 650 L940 810" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="966.5" y="721" width="27.0" height="25" fill="white"/><text x="980" y="740" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="980" dy="0">否</tspan></text><text x="600.0" y="1000" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">0.11历史缓冲模型，不直接等同现代统一页缓存；命中路径不经过READ。</tspan></text></g></svg>