<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">TLB：命中、遍历与保护失败分开</title><desc id="desc">有效TLB miss可直接补翻译；只有对应条件不满足才走异常路径。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">TLB：命中、遍历与保护失败分开</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">普通分页访问的教学分支；保护检查不只发生在未命中时。</tspan></text><rect x="400" y="130" width="400" height="95" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">查询当前地址空间的TLB</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">翻译与权限属性</tspan></text><polygon points="600.0,300 770,355.0 600.0,410 430,355.0" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="362.0" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600"><tspan x="600.0" dy="0">命中？</tspan></text><polygon points="245.0,475 435,525.0 245.0,575 55,525.0" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="245.0" y="532.0" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600"><tspan x="245.0" dy="0">命中翻译的权限允许？</tspan></text><rect x="760" y="460" width="380" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="950.0" y="497" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="950.0" dy="0">页表遍历 / 软件查找</tspan></text><text x="950.0" y="534" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="950.0" dy="0">未命中不等于读盘</tspan></text><polygon points="950.0,660 1140,715.0 950.0,770 760,715.0" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="950.0" y="722.0" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600"><tspan x="950.0" dy="0">映射有效且权限允许？</tspan></text><rect x="60" y="840" width="420" height="105" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="270.0" y="877" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="270.0" dy="0">访问对应物理地址</tspan></text><text x="270.0" y="914" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="270.0" dy="0">适用时填入TLB后继续</tspan></text><rect x="710" y="840" width="430" height="105" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="925.0" y="877" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="925.0" dy="0">异常处理</tspan></text><text x="925.0" y="914" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="925.0" dy="0">非法地址 / 缺页 / 保护等分类</tspan></text><path d="M600 225 L600 300" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M430 355 L245 355 L245 475" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="316.5" y="321" width="27.0" height="25" fill="white"/><text x="330" y="340" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="330" dy="0">是</tspan></text><path d="M770 355 L950 355 L950 460" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="836.5" y="321" width="27.0" height="25" fill="white"/><text x="850" y="340" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="850" dy="0">否</tspan></text><path d="M245 575 L245 840" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="223.0" y="691" width="44.0" height="25" fill="white"/><text x="245" y="710" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="245" dy="0">允许</tspan></text><path d="M435 525 L600 525 L600 800 L925 800 L925 840" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="493.0" y="591" width="214.0" height="25" fill="white"/><text x="600" y="610" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">拒绝：命中也可能保护失败</tspan></text><path d="M950 570 L950 660" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M950 770 L950 840" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="986.5" y="791" width="27.0" height="25" fill="white"/><text x="1000" y="810" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="1000" dy="0">否</tspan></text><path d="M760 715 L500 715 L500 890 L480 890" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="554.0" y="681" width="112.0" height="25" fill="white"/><text x="610" y="700" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="610" dy="0">是：建立翻译</tspan></text><text x="600.0" y="1010" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">有效TLB miss可直接补翻译；只有对应条件不满足才走异常路径。</tspan></text></g></svg>