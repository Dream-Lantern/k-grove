<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc">
<title id="title">TLB：命中、未命中与页故障不是同一件事</title><desc id="desc">4 KiB 页；虚拟地址 0x2240，页号 2，偏移 0x240；映射有效时页框号为 7。 教学抽象，不是运行日志。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356da8"/></marker></defs>
<rect width="1200" height="1030" fill="#fbfcfe"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="40" y="51" font-size="29" fill="#24364b" font-weight="600" text-anchor="start">TLB：命中、未命中与页故障不是同一件事</text>
<text x="40" y="88" font-size="17" fill="#526579" font-weight="400" text-anchor="start">4 KiB 页；虚拟地址 0x2240，页号 2，偏移 0x240；映射有效时页框号为 7。</text>
<rect x="50" y="140" width="1100" height="105" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="68" y="172" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">查询当前地址空间的适用 TLB 翻译</text>
<text x="68" y="203" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">缓存页框和权限等属性，不是数据内容</text>
<path d="M600 245 L600 285 L300 285 L300 340" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 285 L900 285 L900 340" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="340" width="500" height="145" rx="10" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="68" y="372" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">命中：检查缓存翻译的权限</text>
<text x="68" y="403" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">允许：使用 PFN7 + 偏移</text>
<text x="68" y="431" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">不允许：命中也可以触发保护异常</text>
<rect x="650" y="340" width="500" height="145" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="668" y="372" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">未命中：本 x86 模型遍历页表</text>
<text x="668" y="403" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">PDE[0] → PTE[2]；检查存在性 / 权限</text>
<text x="668" y="431" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">有效时在适用条件下填入翻译</text>
<path d="M300 485 L300 550 L165 550 L165 660" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M300 485 L300 550 L455 550 L455 660" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M900 485 L900 550 L745 550 L745 660" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M900 485 L900 550 L1035 550 L1035 660" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="660" width="250" height="170" rx="10" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="58" y="692" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">命中且允许</text>
<text x="58" y="723" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">访问 0x7240</text>
<text x="58" y="751" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">0x7000 + 0x240</text>
<text x="58" y="779" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">无需完整遍历</text>
<rect x="330" y="660" width="250" height="170" rx="10" fill="#fff8ed" stroke="#956526" stroke-width="1.4"/>
<text x="348" y="692" font-size="22" fill="#956526" font-weight="600" text-anchor="start">命中但不允许</text>
<text x="348" y="723" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">保护异常</text>
<text x="348" y="751" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">内核判定恢复或拒绝</text>
<text x="348" y="779" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">不是必然合法 COW</text>
<rect x="620" y="660" width="250" height="170" rx="10" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="638" y="692" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">遍历有效且允许</text>
<text x="638" y="723" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">适用时填入翻译</text>
<text x="638" y="751" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">访问 0x7240</text>
<text x="638" y="779" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">TLB Miss 无需读盘</text>
<rect x="910" y="660" width="250" height="170" rx="10" fill="#fff8ed" stroke="#956526" stroke-width="1.4"/>
<text x="928" y="692" font-size="22" fill="#956526" font-weight="600" text-anchor="start">遍历条件失败</text>
<text x="928" y="723" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">不存在 / 保护失败等</text>
<text x="928" y="751" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">进入适用异常处理</text>
<text x="928" y="779" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">内核判定恢复或拒绝</text>
<text x="50" y="910" font-size="21" fill="#24364b" font-weight="400" text-anchor="start">图是教学控制路径；真实 CPU 可有多级 TLB、遍历缓存和重叠执行。</text>
<text x="50" y="965" font-size="19" fill="#24364b" font-weight="400" text-anchor="start">第二次访问若条目仍有效，可命中；不会无条件保证缓存永久保留。</text>
</g></svg>
