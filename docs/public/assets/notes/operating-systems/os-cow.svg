<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">Linux 0.11：不同线性范围，共享数据页与写后分离</title><desc id="desc">nr是任务槽不是任意PID；64MiB是线性间隔不是物理分配量。任务0首次fork特例另见正文。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">Linux 0.11：不同线性范围，共享数据页与写后分离</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">共同页目录之下，任务槽1和2分别使用其范围内的二级表。</tspan></text><rect x="30" y="140" width="530" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="295.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="295.0" dy="0">槽1：偏移0x2240 + 基址0x04000000</tspan></text><text x="295.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="295.0" dy="0">线性0x04002240；目录16、表项2</tspan></text><rect x="640" y="140" width="530" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="905.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="905.0" dy="0">槽2：偏移0x2240 + 基址0x08000000</tspan></text><text x="905.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="905.0" dy="0">线性0x08002240；目录32、表项2</tspan></text><rect x="320" y="350" width="560" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="387" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">同一个页目录</tspan></text><text x="600.0" y="424" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">PDE[16]与PDE[32]指向不同二级表</tspan></text><rect x="40" y="570" width="450" height="105" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="265.0" y="607" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="265.0" dy="0">二级表1 / PTE[2]</tspan></text><text x="265.0" y="644" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="265.0" dy="0">暂时只读映射</tspan></text><rect x="710" y="570" width="450" height="105" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="935.0" y="607" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="935.0" dy="0">二级表2 / PTE[2]</tspan></text><text x="935.0" y="644" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="935.0" dy="0">暂时只读映射</tspan></text><rect x="380" y="790" width="440" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="827" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">写前：共享物理数据页A</tspan></text><text x="600.0" y="864" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">引用计数2；两条映射</tspan></text><rect x="40" y="950" width="450" height="90" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="265.0" y="987" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="265.0" dy="0">写后：父映射仍指向A</tspan></text><text x="265.0" y="1024" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="265.0" dy="0">原页仍保留父视图</tspan></text><rect x="710" y="950" width="450" height="90" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="935.0" y="987" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="935.0" dy="0">写后：子映射指向新页B</tspan></text><text x="935.0" y="1024" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="935.0" dy="0">保护异常→确认COW→复制并改映射</tspan></text><path d="M295 250 L295 300 L470 300 L470 350" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M905 250 L905 300 L730 300 L730 350" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 450 L450 500 L265 500 L265 570" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="263.0" y="466" width="74.0" height="25" fill="white"/><text x="300" y="485" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="300" dy="0">PDE[16]</tspan></text><path d="M750 450 L750 500 L935 500 L935 570" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="913.0" y="466" width="74.0" height="25" fill="white"/><text x="950" y="485" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="950" dy="0">PDE[32]</tspan></text><path d="M265 675 L265 735 L480 735 L480 790" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="278.0" y="701" width="44.0" height="25" fill="white"/><text x="300" y="720" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="300" dy="0">写前</tspan></text><path d="M935 675 L935 735 L720 735 L720 790" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="898.0" y="701" width="44.0" height="25" fill="white"/><text x="920" y="720" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="920" dy="0">写前</tspan></text><path d="M380 845 L265 845 L265 950" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="243.0" y="881" width="44.0" height="25" fill="white"/><text x="265" y="900" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="265" dy="0">保留</tspan></text><path d="M820 845 L935 845 L935 950" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="887.5" y="881" width="95.0" height="25" fill="white"/><text x="935" y="900" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="935" dy="0">子写后分离</tspan></text><text x="600.0" y="1090" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">nr是任务槽不是任意PID；64MiB是线性间隔不是物理分配量。任务0首次fork特例另见正文。</tspan></text></g></svg>