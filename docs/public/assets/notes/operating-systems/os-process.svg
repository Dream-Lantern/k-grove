<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">进程状态：等待完成后先回到就绪</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">进程状态：等待完成后先回到就绪</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">最小教学状态图，省略创建、退出、停止等分支。</tspan></text><rect x="50" y="180" width="460" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="280.0" y="217" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="280.0" dy="0">Ready：可被调度</tspan></text><text x="280.0" y="254" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="280.0" dy="0">等待 CPU，不是在等待磁盘完成</tspan></text><rect x="690" y="180" width="460" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="920.0" y="217" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="920.0" dy="0">Running：正在执行</tspan></text><text x="920.0" y="254" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="920.0" dy="0">可被抢占，也可能主动等待事件</tspan></text><rect x="370" y="490" width="460" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="527" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">Waiting：事件未满足</tspan></text><text x="600.0" y="564" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">磁盘、条件或其他不可继续的依赖</tspan></text><path d="M510 215 L690 215" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 270 L510 270" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M920 300 L920 410 L690 410 L690 490" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M470 490 L470 410 L230 410 L230 300" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600.0" y="702" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">上方双向箭头为调度 / 抢占，下方为等待 / 唤醒；唤醒不是直接获得 CPU。</tspan></text></g></svg>