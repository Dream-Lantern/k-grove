<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc">
<title id="title">内核入口不等于必然切换任务</title><desc id="desc">0.11时钟在内核CPL耗尽counter时不直接schedule；显式阻塞路径另行调度。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">内核入口不等于必然切换任务</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">保存入口状态之后，只有需要且允许调度时才转到其他执行实体。</tspan></text><rect x="360" y="130" width="480" height="105" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">系统调用 / 异常 / 中断入口</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">保存架构要求的返回状态</tspan></text><polygon points="510.0,350 680,410.0 510.0,470 340,410.0" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="510.0" y="417.0" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600"><tspan x="510.0" dy="0">需要且允许调度？</tspan></text><rect x="50" y="690" width="440" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="270.0" y="727" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="270.0" dy="0">原任务继续内核处理</tspan></text><text x="270.0" y="764" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="270.0" dy="0">无需换任务；随后按入口规则返回</tspan></text><rect x="740" y="350" width="410" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="945.0" y="387" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="945.0" dy="0">调度选择并切换上下文</tspan></text><text x="945.0" y="424" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="945.0" dy="0">保存A续接点，恢复B续接点</tspan></text><rect x="740" y="670" width="410" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="945.0" y="707" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="945.0" dy="0">B沿自己的调用链继续</tspan></text><text x="945.0" y="744" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="945.0" dy="0">A被唤醒后也先变为可运行</tspan></text><path d="M510 235 L510 350" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 410 L270 410 L270 690" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="256.5" y="526" width="27.0" height="25" fill="white"/><text x="270" y="545" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="270" dy="0">否</tspan></text><path d="M680 410 L740 410" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="696.5" y="371" width="27.0" height="25" fill="white"/><text x="710" y="390" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="710" dy="0">是</tspan></text><path d="M945 465 L945 670" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600.0" y="960" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">0.11时钟在内核CPL耗尽counter时不直接schedule；显式阻塞路径另行调度。</tspan></text></g></svg>