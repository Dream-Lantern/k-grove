<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc">
<title id="title">普通受管理页：fork 共享、子复制、父独占恢复</title><desc id="desc">假设 PFN1066 / PFN1123 已合法分配；绝对 PFN42 / PFN99 位于低 1 MiB，不能套此计数例。 教学抽象，不是运行日志。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356da8"/></marker></defs>
<rect width="1200" height="910" fill="#fbfcfe"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="40" y="51" font-size="29" fill="#24364b" font-weight="600" text-anchor="start">普通受管理页：fork 共享、子复制、父独占恢复</text>
<text x="40" y="88" font-size="17" fill="#526579" font-weight="400" text-anchor="start">假设 PFN1066 / PFN1123 已合法分配；绝对 PFN42 / PFN99 位于低 1 MiB，不能套此计数例。</text>
<text x="50" y="150" font-size="21" fill="#356da8" font-weight="600" text-anchor="start">阶段</text>
<text x="260" y="150" font-size="21" fill="#356da8" font-weight="600" text-anchor="start">父 PTE（均 Present=1）</text>
<text x="650" y="150" font-size="21" fill="#356da8" font-weight="600" text-anchor="start">子 PTE（存在时 P=1）</text>
<rect x="40" y="195" width="1120" height="115" rx="10" fill="#fff" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="55" y="231" font-size="21" fill="#356da8" font-weight="600" text-anchor="start">fork 前</text>
<text x="260" y="231" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">PFN1066，RW=1，内容 A</text>
<text x="650" y="231" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">无子映射</text>
<text x="260" y="278" font-size="19" fill="#297b66" font-weight="400" text-anchor="start">引用状态：PFN1066：1</text>
<rect x="40" y="335" width="1120" height="115" rx="10" fill="#fff" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="55" y="371" font-size="21" fill="#356da8" font-weight="600" text-anchor="start">fork 后</text>
<text x="260" y="371" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">PFN1066，RW=0，内容 A</text>
<text x="650" y="371" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">PFN1066，RW=0，内容 A</text>
<text x="260" y="418" font-size="19" fill="#297b66" font-weight="400" text-anchor="start">引用状态：PFN1066：2</text>
<rect x="40" y="475" width="1120" height="115" rx="10" fill="#fff" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="55" y="511" font-size="21" fill="#356da8" font-weight="600" text-anchor="start">子写 B 后</text>
<text x="260" y="511" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">PFN1066，RW=0，内容 A</text>
<text x="650" y="511" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">PFN1123，RW=1，内容 B</text>
<text x="260" y="558" font-size="19" fill="#297b66" font-weight="400" text-anchor="start">引用状态：原页 1，新页 1</text>
<rect x="40" y="615" width="1120" height="115" rx="10" fill="#f0f8f5" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="55" y="651" font-size="21" fill="#356da8" font-weight="600" text-anchor="start">父再写 C</text>
<text x="260" y="651" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">PFN1066，RW=1，内容 C</text>
<text x="650" y="651" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">PFN1123，RW=1，内容 B</text>
<text x="260" y="698" font-size="19" fill="#297b66" font-weight="400" text-anchor="start">引用状态：两页仍各 1；父不复制</text>
<text x="50" y="795" font-size="21" fill="#24364b" font-weight="400" text-anchor="start">子写时旧页计数 2 → 新页分离；父写时旧页只剩 1 → 只恢复 RW。</text>
<text x="50" y="843" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">源码复制分支顺序：分新页 → 减适用旧计数 → 改 PTE → invalidate → copy_page。</text>
<text x="50" y="882" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">返回后原写指令重试；这里不虚构 do_wp_page 已执行现代 VMA 或禁用的代码区检查。</text>
</g></svg>
