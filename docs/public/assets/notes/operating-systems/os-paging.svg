<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">32位非PAE分页：10 / 10 / 12 位与两级查表</title><desc id="desc">表不存在或权限失败另走异常；此处只展开映射有效的地址结构，不代表现代所有分页模式。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">32位非PAE分页：10 / 10 / 12 位与两级查表</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">4KiB页、4字节表项；虚拟地址0x2240映射页框7的纸面算例。</tspan></text><rect x="40" y="145" width="340" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="210.0" y="182" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="210.0" dy="0">[31:22] 目录10位</tspan></text><text x="210.0" y="219" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="210.0" dy="0">目录索引=0</tspan></text><rect x="430" y="145" width="340" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="182" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">[21:12] 页表10位</tspan></text><text x="600.0" y="219" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">页表索引=2</tspan></text><rect x="820" y="145" width="340" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="990.0" y="182" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="990.0" dy="0">[11:0] 偏移12位</tspan></text><text x="990.0" y="219" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="990.0" dy="0">页内偏移=0x240</tspan></text><rect x="40" y="440" width="340" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="210.0" y="477" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="210.0" dy="0">页目录 PDE[0]</tspan></text><text x="210.0" y="514" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="210.0" dy="0">指向对应二级表</tspan></text><rect x="430" y="440" width="340" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="477" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">二级页表 PTE[2]</tspan></text><text x="600.0" y="514" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">页框=7，另检查权限</tspan></text><rect x="700" y="690" width="460" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="930.0" y="727" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="930.0" dy="0">物理地址=0x7240</tspan></text><text x="930.0" y="764" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="930.0" dy="0">0x7000 + 0x240</tspan></text><path d="M210 255 L210 440" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="162.5" y="331" width="95.0" height="25" fill="white"/><text x="210" y="350" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="210" dy="0">选择目录项</tspan></text><path d="M380 495 L430 495" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="374.5" y="401" width="61.0" height="25" fill="white"/><text x="405" y="420" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="405" dy="0">表基址</tspan></text><path d="M600 255 L600 440" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="561.0" y="331" width="78.0" height="25" fill="white"/><text x="600" y="350" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">选择表项</tspan></text><path d="M600 550 L600 745 L700 745" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="561.0" y="631" width="78.0" height="25" fill="white"/><text x="600" y="650" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">页框基址</tspan></text><path d="M990 255 L1120 255 L1120 690" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="1061.0" y="591" width="78.0" height="25" fill="white"/><text x="1100" y="610" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="1100" dy="0">保留偏移</tspan></text><text x="600.0" y="870" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">表不存在或权限失败另走异常；此处只展开映射有效的地址结构，不代表现代所有分页模式。</tspan></text></g></svg>