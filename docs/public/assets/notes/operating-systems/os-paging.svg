<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">32 位非 PAE：0x2240 如何通过两级页表翻译</title><desc id="desc">4 KiB 页、4 字节表项、无大页；表地址和页框均为教学假设，只展开有效且权限允许的路径。 教学抽象，不是运行日志。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356da8"/></marker></defs>
<rect width="1200" height="1080" fill="#fbfcfe"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="40" y="51" font-size="29" fill="#24364b" font-weight="600" text-anchor="start">32 位非 PAE：0x2240 如何通过两级页表翻译</text>
<text x="40" y="88" font-size="17" fill="#526579" font-weight="400" text-anchor="start">4 KiB 页、4 字节表项、无大页；表地址和页框均为教学假设，只展开有效且权限允许的路径。</text>
<rect x="40" y="150" width="340" height="115" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="58" y="182" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">[31:22] 目录索引 0</text>
<text x="58" y="213" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">10 位：0000000000</text>
<rect x="430" y="150" width="340" height="115" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="448" y="182" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">[21:12] 页表索引 2</text>
<text x="448" y="213" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">10 位：0000000010</text>
<rect x="820" y="150" width="340" height="115" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="838" y="182" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">[11:0] 偏移 0x240</text>
<text x="838" y="213" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">12 位：001001000000</text>
<rect x="50" y="335" width="1100" height="105" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="68" y="367" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">x86 CR3 的相关地址位：页目录物理基址 0x1000</text>
<text x="68" y="398" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">硬件需要遍历时，从这里定位根；控制位不当作地址位</text>
<path d="M600 440 L600 495" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="495" width="1100" height="115" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="68" y="527" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">PDE[0]：物理位置 0x1000 + 0×4 = 0x1000</text>
<text x="68" y="558" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">存在、保留位合法、普通二级表；提取的下级表物理基址为 0x2000</text>
<path d="M600 610 L600 665" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="665" width="1100" height="115" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="68" y="697" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">PTE[2]：物理位置 0x2000 + 2×4 = 0x2008</text>
<text x="68" y="728" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">存在且上下级权限允许本次访问；数据页框号 PFN=7</text>
<path d="M600 780 L600 835" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="835" width="1100" height="115" rx="10" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="68" y="867" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">最终物理地址：7×0x1000 + 0x240 = 0x7240</text>
<text x="68" y="898" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">页框基址 0x7000；页内偏移保持不变</text>
<text x="50" y="1010" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">属性位不能混入地址计算；缺失映射或权限不足另走异常，不在此成功路径中。</text>
<text x="50" y="1046" font-size="19" fill="#24364b" font-weight="400" text-anchor="start">TLB 可缓存翻译，因此每次访问不必重新完整读取这两级表。</text>
</g></svg>
