<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600">
  <defs/>
  <rect fill="#F9FBFE" height="900" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1600" x="0" y="0"/>
  <rect fill="#FFFFFF" height="856" rx="24" ry="24" stroke="#CFDEEF" stroke-width="1.5" width="1540" x="30" y="22"/>
  <rect fill="#2F6FDB" height="7" rx="2" ry="2" stroke="none" stroke-width="1.5" width="1540" x="30" y="22"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="40" font-weight="bold" x="72" y="93">死锁：资源分配图与循环等待</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="76" y="137">请求边为任务 → 资源；持有边为资源 → 任务。示例假设两把锁各只有一个实例。</text>
  <polyline fill="none" points="72,165 1528,165" stroke="#CFDEEF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
  <rect fill="#FFFFFF" height="115" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="350" x="235" y="255"/>
  <rect fill="#2F6FDB" height="115" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="235" y="255"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" x="259" y="299">Task A</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="259" y="336">任务 / 请求者</text>
  <rect fill="#FFFFFF" height="115" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="350" x="1010" y="255"/>
  <rect fill="#C88323" height="115" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="1010" y="255"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" x="1034" y="299">Lock L2</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="1034" y="336">独占资源 / 持有对象</text>
  <rect fill="#FFFFFF" height="115" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="350" x="1010" y="490"/>
  <rect fill="#7554CE" height="115" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="1010" y="490"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" x="1034" y="534">Task B</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="1034" y="571">任务 / 请求者</text>
  <rect fill="#FFFFFF" height="115" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="350" x="235" y="490"/>
  <rect fill="#118E6B" height="115" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="235" y="490"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" x="259" y="534">Lock L1</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="21" font-weight="normal" x="259" y="571">独占资源 / 持有对象</text>
  <polyline fill="none" points="585,314 1004,314" stroke="#C88323" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <polygon fill="#C88323" points="1004,314 993.0,309.0 993.0,319.0"/>
  <rect fill="#FFF5E7" height="37" rx="18" ry="18" stroke="none" stroke-width="1.5" width="160" x="650" y="263"/>
  <text fill="#C88323" font-family="Noto Sans CJK SC" font-size="17" font-weight="bold" text-anchor="middle" x="730.0" y="288">请求 L2</text>
  <polyline fill="none" points="1185,370 1185,485" stroke="#118E6B" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <polygon fill="#118E6B" points="1185,485 1190.0,474.0 1180.0,474.0"/>
  <rect fill="#E9F8F0" height="37" rx="18" ry="18" stroke="none" stroke-width="1.5" width="235" x="1206" y="410"/>
  <text fill="#118E6B" font-family="Noto Sans CJK SC" font-size="17" font-weight="bold" text-anchor="middle" x="1323.5" y="435">L2 由 B 持有</text>
  <polyline fill="none" points="1010,549 590,549" stroke="#C88323" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <polygon fill="#C88323" points="590,549 601.0,554.0 601.0,544.0"/>
  <rect fill="#FFF5E7" height="37" rx="18" ry="18" stroke="none" stroke-width="1.5" width="160" x="674" y="500"/>
  <text fill="#C88323" font-family="Noto Sans CJK SC" font-size="17" font-weight="bold" text-anchor="middle" x="754.0" y="525">请求 L1</text>
  <polyline fill="none" points="410,490 410,376" stroke="#118E6B" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <polygon fill="#118E6B" points="410,376 405.0,387.0 415.0,387.0"/>
  <rect fill="#E9F8F0" height="37" rx="18" ry="18" stroke="none" stroke-width="1.5" width="232" x="435" y="419"/>
  <text fill="#118E6B" font-family="Noto Sans CJK SC" font-size="17" font-weight="bold" text-anchor="middle" x="551.0" y="444">L1 由 A 持有</text>
  <rect fill="#FFF5E7" height="121" rx="18" ry="18" stroke="none" stroke-width="1.5" width="1452" x="74" y="730"/>
  <text fill="#C88323" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" x="99" y="765">关键边界</text>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="99" y="801">形成 A → L2 → B → L1 → A 的循环等待；箭头端点分别落在任务与锁节点上。</text>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="99" y="831">单实例资源模型下的死锁环示例；一般资源分配情况需要结合实例与等待条件。</text>
</svg>
