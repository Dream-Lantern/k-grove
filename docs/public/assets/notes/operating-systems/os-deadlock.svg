<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">实际等待环：任务A、L1、任务B、L2</title><desc id="desc">这里每类锁一个实例；有环不必然判定所有多实例资源系统都已死锁。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">实际等待环：任务A、L1、任务B、L2</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">资源分配图：资源→任务表示已持有，任务→资源表示正在请求。</tspan></text><rect x="60" y="150" width="400" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="260.0" y="187" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="260.0" dy="0">任务A</tspan></text><text x="260.0" y="224" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="260.0" dy="0">持L1，请求L2</tspan></text><rect x="740" y="150" width="400" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="940.0" y="187" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="940.0" dy="0">任务B</tspan></text><text x="940.0" y="224" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="940.0" dy="0">持L2，请求L1</tspan></text><rect x="60" y="560" width="400" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="260.0" y="597" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="260.0" dy="0">锁L1</tspan></text><text x="260.0" y="634" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="260.0" dy="0">互斥资源</tspan></text><rect x="740" y="560" width="400" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="940.0" y="597" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="940.0" dy="0">锁L2</tspan></text><text x="940.0" y="634" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="940.0" dy="0">互斥资源</tspan></text><path d="M180 560 L180 260" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="153.0" y="401" width="44.0" height="25" fill="white"/><text x="175" y="420" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="175" dy="0">持有</tspan></text><path d="M460 205 L600 205 L600 615 L740 615" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="568.5" y="361" width="63.0" height="25" fill="white"/><text x="600" y="380" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">等待L2</tspan></text><path d="M1020 560 L1020 260" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="998.0" y="401" width="44.0" height="25" fill="white"/><text x="1020" y="420" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="1020" dy="0">持有</tspan></text><path d="M800 260 L800 335 L500 335 L500 725 L260 725 L260 670" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="568.5" y="301" width="63.0" height="25" fill="white"/><text x="600" y="320" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">等待L1</tspan></text><text x="600.0" y="820" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">这里每类锁一个实例；有环不必然判定所有多实例资源系统都已死锁。</tspan></text></g></svg>