<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
<title id="title">丢失唤醒：错误空隙与正确等待协议</title><desc id="desc">左侧是可能停滞的错误时序；右侧是一条正确时序。均为教学推演，不是线程运行日志。 教学抽象，不是运行日志。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356da8"/></marker></defs>
<rect width="1200" height="1100" fill="#fbfcfe"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="40" y="51" font-size="29" fill="#24364b" font-weight="600" text-anchor="start">丢失唤醒：错误空隙与正确等待协议</text>
<text x="40" y="88" font-size="17" fill="#526579" font-weight="400" text-anchor="start">左侧是可能停滞的错误时序；右侧是一条正确时序。均为教学推演，不是线程运行日志。</text>
<text x="45" y="150" font-size="24" fill="#956526" font-weight="600" text-anchor="start">错误：检查与等待分离</text>
<text x="655" y="150" font-size="24" fill="#297b66" font-weight="600" text-anchor="start">正确：同锁谓词 + 原子等待</text>
<rect x="45" y="195" width="500" height="135" rx="10" fill="#fff8ed" stroke="#956526" stroke-width="1.4"/>
<text x="63" y="227" font-size="22" fill="#956526" font-weight="600" text-anchor="start">C：持锁检查到空</text>
<text x="63" y="258" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">单独解锁，仍打算按旧判断等待</text>
<path d="M295 330 L295 400" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="400" width="500" height="135" rx="10" fill="#fff8ed" stroke="#956526" stroke-width="1.4"/>
<text x="63" y="432" font-size="22" fill="#956526" font-weight="600" text-anchor="start">P：取锁、入队、signal</text>
<text x="63" y="463" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">C 尚未登记等待；通知无等待者可唤醒</text>
<text x="63" y="491" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">P 解锁，此后可能再无通知</text>
<path d="M295 535 L295 605" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="605" width="500" height="135" rx="10" fill="#fff8ed" stroke="#956526" stroke-width="1.4"/>
<text x="63" y="637" font-size="22" fill="#956526" font-weight="600" text-anchor="start">C：后来重新取锁</text>
<text x="63" y="668" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">不重检旧判断，直接 cond_wait</text>
<text x="63" y="696" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">等待时放锁，但已经错过前次通知</text>
<path d="M295 740 L295 810" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="810" width="500" height="135" rx="10" fill="#fff8ed" stroke="#956526" stroke-width="1.4"/>
<text x="63" y="842" font-size="22" fill="#956526" font-weight="600" text-anchor="start">结果：数据已在队列中</text>
<text x="63" y="873" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">C 仍可能一直等待后续通知</text>
<rect x="655" y="195" width="500" height="135" rx="10" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="673" y="227" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">C：持锁检查到空</text>
<text x="673" y="258" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">直接调用 cond_wait，不分离旧判断</text>
<path d="M905 330 L905 400" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="655" y="400" width="500" height="135" rx="10" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="673" y="432" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">C：原子地放锁并等待</text>
<text x="673" y="463" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">相对于 P 取同锁后发通知的行为</text>
<text x="673" y="491" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">检查到等待之间没有左侧空隙</text>
<path d="M905 535 L905 605" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="655" y="605" width="500" height="135" rx="10" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="673" y="637" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">P：取同一锁、入队、通知</text>
<text x="673" y="668" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">更新真实谓词，再解锁</text>
<text x="673" y="696" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">等待者可以重新竞争锁</text>
<path d="M905 740 L905 810" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="655" y="810" width="500" height="135" rx="10" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="673" y="842" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">C：返回时重新持锁</text>
<text x="673" y="873" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">while 重检；有数据才取</text>
<text x="673" y="901" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">若为空则继续等待或按关闭条件退出</text>
<text x="45" y="369" font-size="16" fill="#956526" font-weight="600" text-anchor="start">竞态窗口：尚未登记等待</text>
<text x="45" y="1000" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">普通 sleep 也不能替代条件等待；合法调用 cond_wait 前必须持锁。</text>
<text x="45" y="1040" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">POSIX 不强制每次 signal 都在锁内；关键是共享谓词与等待协议，本章选择锁内通知。</text>
</g></svg>
