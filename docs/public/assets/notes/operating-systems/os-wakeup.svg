<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">条件变量：持锁检查、原子等待、重查谓词</title><desc id="desc">生产者持同一锁修改谓词并按协议通知；不能改成“解锁后普通sleep”。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">条件变量：持锁检查、原子等待、重查谓词</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">通知不是资源预留；返回wait时重新持锁，再沿循环重查。</tspan></text><rect x="380" y="130" width="440" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">持有互斥锁</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">共享谓词也由同一锁保护</tspan></text><polygon points="510.0,340 680,400.0 510.0,460 340,400.0" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="510.0" y="407.0" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600"><tspan x="510.0" dy="0">队列非空？</tspan></text><rect x="50" y="700" width="440" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="270.0" y="737" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="270.0" dy="0">取出一项，随后解锁</tspan></text><text x="270.0" y="774" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="270.0" dy="0">谓词已满足，跳过等待</tspan></text><rect x="740" y="340" width="410" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="945.0" y="377" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="945.0" dy="0">condition_wait</tspan></text><text x="945.0" y="414" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="945.0" dy="0">原子释放锁并进入等待</tspan></text><rect x="740" y="690" width="410" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="945.0" y="727" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="945.0" dy="0">被唤醒后重新取得锁</tspan></text><text x="945.0" y="764" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="945.0" dy="0">可能虚假唤醒或资源已被取走</tspan></text><path d="M510 230 L510 340" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 400 L270 400 L270 700" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="256.5" y="531" width="27.0" height="25" fill="white"/><text x="270" y="550" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="270" dy="0">是</tspan></text><path d="M680 400 L740 400" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="696.5" y="361" width="27.0" height="25" fill="white"/><text x="710" y="380" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="710" dy="0">否</tspan></text><path d="M945 460 L945 690" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="877.0" y="551" width="136.0" height="25" fill="white"/><text x="945" y="570" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="945" dy="0">通知/虚假唤醒等</tspan></text><path d="M945 800 L945 865 L510 865 L510 460" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="586.5" y="836" width="87.0" height="25" fill="white"/><text x="630" y="855" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="630" dy="0">while重查</tspan></text><text x="600.0" y="950" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">生产者持同一锁修改谓词并按协议通知；不能改成“解锁后普通sleep”。</tspan></text></g></svg>