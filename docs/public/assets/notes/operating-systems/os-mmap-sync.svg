<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">共享映射：数据可见、写回和业务一致性要分开</title><desc id="desc">普通文件 MAP_SHARED 的同步教学流程；后台写回也可能先发生，不是每次必须等待此调用才开始。 教学抽象，不是运行日志。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356da8"/></marker></defs>
<rect width="1200" height="1040" fill="#fbfcfe"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="40" y="51" font-size="29" fill="#24364b" font-weight="600" text-anchor="start">共享映射：数据可见、写回和业务一致性要分开</text>
<text x="40" y="88" font-size="17" fill="#526579" font-weight="400" text-anchor="start">普通文件 MAP_SHARED 的同步教学流程；后台写回也可能先发生，不是每次必须等待此调用才开始。</text>
<rect x="50" y="145" width="1100" height="120" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="68" y="177" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">1. 修改映射内存，相关文件缓存可能变脏</text>
<text x="68" y="208" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">其他适用共享视图 / 普通读取可能已可见；这不是断电持久化证明</text>
<path d="M600 265 L600 330" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="330" width="1100" height="120" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="68" y="362" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">2. 调用 msync(addr,len,MS_SYNC)</text>
<text x="68" y="393" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">请求同步指定范围；地址、长度和标志须符合接口条件</text>
<path d="M600 450 L600 515" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="515" width="1100" height="120" rx="10" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="68" y="547" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">3. 等待适用同步完成并检查返回值</text>
<text x="68" y="578" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">成功才报告同步完成；错误不能继续伪装为成功</text>
<path d="M600 635 L600 700" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="700" width="1100" height="120" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="68" y="732" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">4. 按需要 munmap，再关闭原 FD</text>
<text x="68" y="763" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">解除映射与关闭引用不替代完整持久化协议</text>
<text x="50" y="910" font-size="21" fill="#24364b" font-weight="400" text-anchor="start">Linux 2.6.19 起 MS_ASYNC 为 no-op，不提供 MS_SYNC 的等待保证。</text>
<text x="50" y="962" font-size="19" fill="#24364b" font-weight="400" text-anchor="start">文件名字的目录同步、崩溃恢复和多字段 / 多文件事务均需另行分析。</text>
</g></svg>
