<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">操作系统：应用、内核与硬件的职责</title><desc id="desc">结构关系图；箭头表示接口或交互，不表示每次请求必经所有组件。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356da8"/></marker></defs>
<rect width="1200" height="840" fill="#fbfcfe"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="44" y="54" font-size="29" fill="#24364b" font-weight="600" text-anchor="start">操作系统：应用、内核与硬件的职责</text>
<text x="44" y="88" font-size="17" fill="#526579" font-weight="400" text-anchor="start">结构关系图；箭头表示接口或交互，不表示每次请求必经所有组件。</text>
<rect x="80" y="130" width="1040" height="108" rx="12" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="100" y="163" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">应用与运行库 · 用户态</text>
<text x="100" y="194" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">浏览器 / 播放器 / 编辑器：执行计算、管理自身数据，通过接口请求服务</text>
<path d="M440 238 L440 318" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="306" y="280" font-size="17" fill="#24364b" font-weight="400" text-anchor="start">系统调用请求</text>
<path d="M760 318 L760 238" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="782" y="280" font-size="17" fill="#24364b" font-weight="400" text-anchor="start">结果 / 错误返回</text>
<path d="M60 300 L1140 300" fill="none" stroke="#9aaabc" stroke-dasharray="6 5"/>
<rect x="80" y="320" width="1040" height="112" rx="12" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="100" y="353" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">内核 · 资源管理、抽象接口、隔离与保护</text>
<text x="100" y="384" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">调度分配运行机会；内存管理组织地址空间；文件系统与驱动管理数据访问</text>
<rect x="110" y="460" width="460" height="94" rx="12" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="130" y="493" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">CPU 与内存管理</text>
<text x="130" y="524" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">同步共享状态，维护映射与权限</text>
<rect x="630" y="460" width="460" height="94" rx="12" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="650" y="493" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">文件系统与设备管理</text>
<text x="650" y="524" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">定位文件数据，按需提交 I/O</text>
<path d="M340 432 L340 460" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M860 432 L860 460" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M340 554 L340 650" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="125" y="603" font-size="17" fill="#24364b" font-weight="400" text-anchor="start">配置 / 指令执行</text>
<path d="M790 554 L790 650" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="660" y="603" font-size="17" fill="#24364b" font-weight="400" text-anchor="start">按需设备请求</text>
<path d="M1000 650 L1000 554" fill="none" stroke="#356da8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="1014" y="594" font-size="17" fill="#24364b" font-weight="400" text-anchor="start">事件</text>
<text x="1014" y="619" font-size="17" fill="#24364b" font-weight="400" text-anchor="start">反馈</text>
<path d="M60 634 L1140 634" fill="none" stroke="#9aaabc" stroke-dasharray="6 5"/>
<rect x="80" y="650" width="1040" height="100" rx="12" fill="#fff8ed" stroke="#a27430" stroke-width="1.4"/>
<text x="100" y="683" font-size="22" fill="#a27430" font-weight="600" text-anchor="start">硬件 · 执行与检查</text>
<text x="100" y="714" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">CPU 执行指令；地址转换硬件执行映射与权限检查；内存与外设存取数据</text>
<text x="80" y="795" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">设备事件可以异步发生；缓存命中的读取可能无需提交新的设备 I/O。</text>
</g></svg>
