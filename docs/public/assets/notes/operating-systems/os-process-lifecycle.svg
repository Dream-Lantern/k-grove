<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
<title id="title">进程生命周期：从创建到退出状态回收</title><desc id="desc">通常的父进程等待路径；省略停止等状态，显式忽略 SIGCHLD 等情形另按接口规则。 教学抽象，不代表实际运行日志。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356da8"/></marker></defs>
<rect width="1200" height="950" fill="#fbfcfe"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="40" y="51" font-size="29" fill="#24364b" font-weight="600" text-anchor="start">进程生命周期：从创建到退出状态回收</text>
<text x="40" y="88" font-size="17" fill="#526579" font-weight="400" text-anchor="start">通常的父进程等待路径；省略停止等状态，显式忽略 SIGCHLD 等情形另按接口规则。</text>
<rect x="65" y="150" width="330" height="100" rx="12" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="83" y="182" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">创建</text>
<text x="83" y="213" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">建立资源与执行现场</text>
<path d="M230 250 L230 330" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="250" y="296" font-size="17" fill="#24364b" font-weight="400" text-anchor="start">创建成功并可运行</text>
<rect x="65" y="330" width="330" height="100" rx="12" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="83" y="362" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">就绪 Ready</text>
<text x="83" y="393" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">具备运行条件，等待 CPU</text>
<rect x="805" y="330" width="330" height="100" rx="12" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="823" y="362" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">运行 Running</text>
<text x="823" y="393" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">正在某个 CPU 上执行</text>
<path d="M395 365 L805 365" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="518" y="350" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">调度选中并恢复</text>
<path d="M805 405 L395 405" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="510" y="452" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">抢占 / 让出运行机会</text>
<rect x="435" y="555" width="330" height="100" rx="12" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="453" y="587" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">等待 Waiting</text>
<text x="453" y="618" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">等待数据或其他事件</text>
<path d="M970 430 L970 500 L600 500 L600 555" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="790" y="485" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">需要等待</text>
<path d="M435 605 L230 605 L230 430" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="65" y="520" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">事件满足并唤醒</text>
<path d="M1135 380 L1163 380 L1163 680 L995 680 L995 740" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1040" y="640" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">退出</text>
<rect x="845" y="740" width="290" height="100" rx="12" fill="#fff8ed" stroke="#956526" stroke-width="1.4"/>
<text x="863" y="772" font-size="22" fill="#956526" font-weight="600" text-anchor="start">退出处理</text>
<text x="863" y="803" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">停止执行，释放主要资源</text>
<rect x="455" y="740" width="290" height="100" rx="12" fill="#fff8ed" stroke="#956526" stroke-width="1.4"/>
<text x="473" y="772" font-size="22" fill="#956526" font-weight="600" text-anchor="start">僵尸 Zombie</text>
<text x="473" y="803" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">保留待领取的退出记录</text>
<rect x="65" y="740" width="290" height="100" rx="12" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="83" y="772" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">回收 Reaped</text>
<text x="83" y="803" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">剩余状态被释放</text>
<path d="M845 790 L745 790" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="759" y="724" font-size="17" fill="#24364b" font-weight="400" text-anchor="start">通常保留</text>
<path d="M455 790 L355 790" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="355" y="710" font-size="17" fill="#24364b" font-weight="400" text-anchor="start">wait 领取</text>
<text x="65" y="902" font-size="19" fill="#24364b" font-weight="400" text-anchor="start">唤醒只使任务可运行；僵尸已经结束执行，不是仍占用 CPU 的循环。</text>
</g></svg>
