<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">容量 K=2：空位许可、数据许可与队列不是同一计数</title><desc id="desc">指定的无并发插入路径；等待许可在加队列锁之前，入队/出队结构更新由 mutex 保护。 教学抽象，不是运行日志。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356da8"/></marker></defs>
<rect width="1200" height="1020" fill="#fbfcfe"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="40" y="51" font-size="29" fill="#24364b" font-weight="600" text-anchor="start">容量 K=2：空位许可、数据许可与队列不是同一计数</text>
<text x="40" y="88" font-size="17" fill="#526579" font-weight="400" text-anchor="start">指定的无并发插入路径；等待许可在加队列锁之前，入队/出队结构更新由 mutex 保护。</text>
<text x="45" y="155" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">步骤 / 执行角色</text>
<text x="600" y="155" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">empty</text>
<text x="755" y="155" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">full</text>
<text x="930" y="155" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">队列（2 槽）</text>
<rect x="35" y="180" width="1125" height="67" rx="10" fill="#fff" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="52" y="222" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">初始</text>
<text x="640" y="222" font-size="23" fill="#356da8" font-weight="600" text-anchor="middle">2</text>
<text x="795" y="222" font-size="23" fill="#297b66" font-weight="600" text-anchor="middle">0</text>
<rect x="970" y="190" width="62" height="46" rx="10" fill="#f3f5f8" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1001" y="222" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">空</text>
<rect x="1045" y="190" width="62" height="46" rx="10" fill="#f3f5f8" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1076" y="222" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">空</text>
<rect x="35" y="266" width="1125" height="67" rx="10" fill="#fff8ed" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="52" y="308" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">P：wait(empty) 成功</text>
<text x="640" y="308" font-size="23" fill="#356da8" font-weight="600" text-anchor="middle">1</text>
<text x="795" y="308" font-size="23" fill="#297b66" font-weight="600" text-anchor="middle">0</text>
<rect x="970" y="276" width="62" height="46" rx="10" fill="#f3f5f8" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1001" y="308" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">空</text>
<rect x="1045" y="276" width="62" height="46" rx="10" fill="#f3f5f8" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1076" y="308" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">空</text>
<rect x="35" y="352" width="1125" height="67" rx="10" fill="#fff8ed" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="52" y="394" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">P：持 mutex 入队 A，然后解锁</text>
<text x="640" y="394" font-size="23" fill="#356da8" font-weight="600" text-anchor="middle">1</text>
<text x="795" y="394" font-size="23" fill="#297b66" font-weight="600" text-anchor="middle">0</text>
<rect x="970" y="362" width="62" height="46" rx="10" fill="#e7f5ef" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1001" y="394" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">A</text>
<rect x="1045" y="362" width="62" height="46" rx="10" fill="#f3f5f8" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1076" y="394" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">空</text>
<rect x="35" y="438" width="1125" height="67" rx="10" fill="#fff" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="52" y="480" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">P：post(full) 发布 A</text>
<text x="640" y="480" font-size="23" fill="#356da8" font-weight="600" text-anchor="middle">1</text>
<text x="795" y="480" font-size="23" fill="#297b66" font-weight="600" text-anchor="middle">1</text>
<rect x="970" y="448" width="62" height="46" rx="10" fill="#e7f5ef" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1001" y="480" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">A</text>
<rect x="1045" y="448" width="62" height="46" rx="10" fill="#f3f5f8" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1076" y="480" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">空</text>
<rect x="35" y="524" width="1125" height="67" rx="10" fill="#fff" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="52" y="566" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">P：完整执行第二次生产 B</text>
<text x="640" y="566" font-size="23" fill="#356da8" font-weight="600" text-anchor="middle">0</text>
<text x="795" y="566" font-size="23" fill="#297b66" font-weight="600" text-anchor="middle">2</text>
<rect x="970" y="534" width="62" height="46" rx="10" fill="#e7f5ef" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1001" y="566" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">A</text>
<rect x="1045" y="534" width="62" height="46" rx="10" fill="#e7f5ef" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1076" y="566" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">B</text>
<rect x="35" y="610" width="1125" height="67" rx="10" fill="#fff8ed" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="52" y="652" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">C：wait(full) 成功</text>
<text x="640" y="652" font-size="23" fill="#356da8" font-weight="600" text-anchor="middle">0</text>
<text x="795" y="652" font-size="23" fill="#297b66" font-weight="600" text-anchor="middle">1</text>
<rect x="970" y="620" width="62" height="46" rx="10" fill="#e7f5ef" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1001" y="652" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">A</text>
<rect x="1045" y="620" width="62" height="46" rx="10" fill="#e7f5ef" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1076" y="652" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">B</text>
<rect x="35" y="696" width="1125" height="67" rx="10" fill="#fff8ed" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="52" y="738" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">C：持 mutex 出队 A，然后解锁</text>
<text x="640" y="738" font-size="23" fill="#356da8" font-weight="600" text-anchor="middle">0</text>
<text x="795" y="738" font-size="23" fill="#297b66" font-weight="600" text-anchor="middle">1</text>
<rect x="970" y="706" width="62" height="46" rx="10" fill="#e7f5ef" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1001" y="738" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">B</text>
<rect x="1045" y="706" width="62" height="46" rx="10" fill="#f3f5f8" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1076" y="738" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">空</text>
<rect x="35" y="782" width="1125" height="67" rx="10" fill="#fff" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="52" y="824" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">C：post(empty) 归还空位</text>
<text x="640" y="824" font-size="23" fill="#356da8" font-weight="600" text-anchor="middle">1</text>
<text x="795" y="824" font-size="23" fill="#297b66" font-weight="600" text-anchor="middle">1</text>
<rect x="970" y="792" width="62" height="46" rx="10" fill="#e7f5ef" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1001" y="824" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">B</text>
<rect x="1045" y="792" width="62" height="46" rx="10" fill="#f3f5f8" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="1076" y="824" font-size="19" fill="#24364b" font-weight="400" text-anchor="middle">空</text>
<text x="40" y="935" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">浅橙行：许可已保留但尚未转交，empty + full &lt; K；不能据此认定队列容量丢失。</text>
<text x="40" y="978" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">mutex 保护队列结构；empty/full 管许可。不要持队列锁等待另一个执行流才能创造的许可。</text>
</g></svg>
