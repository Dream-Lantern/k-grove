<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">线程：共享地址空间，各自保留调用进度</title><desc id="desc">资源关系与调用层级示意，不按实际地址比例绘制；局部变量不一定都在栈中。 教学抽象，不代表实际运行日志。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356da8"/></marker></defs>
<rect width="1200" height="940" fill="#fbfcfe"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="40" y="51" font-size="29" fill="#24364b" font-weight="600" text-anchor="start">线程：共享地址空间，各自保留调用进度</text>
<text x="40" y="88" font-size="17" fill="#526579" font-weight="400" text-anchor="start">资源关系与调用层级示意，不按实际地址比例绘制；局部变量不一定都在栈中。</text>
<rect x="50" y="130" width="1100" height="600" rx="12" fill="#f6f9fd" stroke="#b6c7d9" stroke-width="1.4"/>
<text x="75" y="165" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">同一进程的虚拟地址空间 · 栈之间没有自动形成硬件隔离</text>
<rect x="95" y="195" width="1010" height="95" rx="12" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="113" y="227" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">共享数据区域</text>
<text x="113" y="258" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">代码、只读数据、全局数据和堆；可变共享对象需要同步</text>
<path d="M300 365 L300 290" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="335" font-size="17" fill="#24364b" font-weight="400" text-anchor="start">访问共享数据</text>
<path d="M900 365 L900 290" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="920" y="335" font-size="17" fill="#24364b" font-weight="400" text-anchor="start">访问共享数据</text>
<rect x="95" y="365" width="455" height="282" rx="12" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="113" y="397" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">A 的用户调用栈</text>
<text x="113" y="428" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">main 的适用栈帧</text>
<text x="113" y="456" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">process_request 的适用栈帧</text>
<text x="113" y="484" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">read_data 的适用栈帧 ← 当前层级</text>
<text x="113" y="512" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">保存调用关系、返回位置与临时状态</text>
<text x="113" y="540" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">SP A 标记栈使用位置</text>
<rect x="650" y="365" width="455" height="282" rx="12" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="668" y="397" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">B 的用户调用栈</text>
<text x="668" y="428" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">worker 的适用栈帧</text>
<text x="668" y="456" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">calculate 的适用栈帧</text>
<text x="668" y="484" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">sum 的适用栈帧 ← 当前层级</text>
<text x="668" y="512" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">保存调用关系、返回位置与临时状态</text>
<text x="668" y="540" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">SP B 标记栈使用位置</text>
<text x="95" y="694" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">可传递有效指针访问另一线程的栈对象，但必须保证生命周期与并发访问正确。</text>
<rect x="50" y="765" width="515" height="105" rx="12" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="68" y="797" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">A 的独立执行状态</text>
<text x="68" y="828" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">PC / SP / 寄存器与 TLS 等</text>
<text x="68" y="856" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">运行时在 CPU 上使用，暂停时按实现保存</text>
<rect x="635" y="765" width="515" height="105" rx="12" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="653" y="797" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">B 的独立执行状态</text>
<text x="653" y="828" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">PC / SP / 寄存器与 TLS 等</text>
<text x="653" y="856" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">各自续接位置与自己的栈匹配</text>
<text x="50" y="919" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">另有共享的内核资源，例如文件描述符表；图中的上下文卡片不表示两个额外地址空间。</text>
</g></svg>
