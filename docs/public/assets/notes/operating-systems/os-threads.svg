<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">线程：共享资源与独立上下文</title><desc id="desc">用户执行流、内核调度实体、纯内核线程不机械一一等同。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">线程：共享资源与独立上下文</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">对象关系图，不表示创建线程的时间顺序；调度模型另按M:1、1:1或M:N说明。</tspan></text><rect x="300" y="135" width="600" height="115" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="172" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">同一进程的共享资源</tspan></text><text x="600.0" y="209" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">地址空间：堆、全局数据；文件描述符等</tspan></text><rect x="50" y="440" width="500" height="150" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="300.0" y="477" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="300.0" dy="0">线程A独立状态</tspan></text><text x="300.0" y="514" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="300.0" dy="0">栈、寄存器、TLS等</tspan><tspan x="300.0" dy="30">适用内核承载者另有内核上下文</tspan></text><rect x="650" y="440" width="500" height="150" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="900.0" y="477" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="900.0" dy="0">线程B独立状态</tspan></text><text x="900.0" y="514" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="900.0" dy="0">栈、寄存器、TLS等</tspan><tspan x="900.0" dy="30">共享堆不表示共用同一可变栈</tspan></text><path d="M300 440 L300 340 L470 340 L470 250" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="244.0" y="306" width="112.0" height="25" fill="white"/><text x="300" y="325" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="300" dy="0">访问共享资源</tspan></text><path d="M900 440 L900 340 L730 340 L730 250" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="844.0" y="306" width="112.0" height="25" fill="white"/><text x="900" y="325" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="900" dy="0">访问共享资源</tspan></text><text x="600.0" y="770" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">用户执行流、内核调度实体、纯内核线程不机械一一等同。</tspan></text></g></svg>