<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">单次发布：原子标志怎样关联普通数据</title><desc id="desc">payload 初始 0，原子 ready 初始 false；仅一次写入，不重置标志、不复用这份数据。 教学抽象，不是运行日志。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356da8"/></marker></defs>
<rect width="1200" height="850" fill="#fbfcfe"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="40" y="51" font-size="29" fill="#24364b" font-weight="600" text-anchor="start">单次发布：原子标志怎样关联普通数据</text>
<text x="40" y="88" font-size="17" fill="#526579" font-weight="400" text-anchor="start">payload 初始 0，原子 ready 初始 false；仅一次写入，不重置标志、不复用这份数据。</text>
<text x="60" y="150" font-size="24" fill="#297b66" font-weight="600" text-anchor="start">生产者 P</text>
<text x="680" y="150" font-size="24" fill="#356da8" font-weight="600" text-anchor="start">消费者 C</text>
<rect x="60" y="185" width="460" height="110" rx="10" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="78" y="217" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">写普通数据 payload = 42</text>
<text x="78" y="248" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">此时消费者尚不能随意读 payload</text>
<rect x="680" y="185" width="460" height="110" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="698" y="217" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">等待发布条件</text>
<text x="698" y="248" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">用原子读取检查 ready；未见 true 就不读</text>
<path d="M290 295 L290 435" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="70" y="365" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">程序顺序</text>
<path d="M910 295 L910 435" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="700" y="365" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">程序顺序</text>
<rect x="60" y="435" width="460" height="110" rx="10" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="78" y="467" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">store ready = true · release</text>
<text x="78" y="498" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">发布先前写入</text>
<rect x="680" y="435" width="460" height="110" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="698" y="467" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">load ready · acquire 读到 true</text>
<text x="698" y="498" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">必须读到适用发布的值，才建立同步</text>
<path d="M520 490 L680 490" fill="none" stroke="#356da8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="548" y="472" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">同步关系</text>
<path d="M910 545 L910 635" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="700" y="600" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">程序顺序</text>
<rect x="680" y="635" width="460" height="100" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="698" y="667" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">随后读 payload，可见 42</text>
<text x="698" y="698" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">依赖正确协议，而非自动刷新所有变量</text>
<text x="60" y="790" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">实线：各线程内程序顺序；虚线：满足读取来源条件的 release/acquire 同步关系。</text>
</g></svg>
