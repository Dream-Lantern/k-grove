<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc">
<title id="title">权限收紧：双 CPU 的失效必须达到协议完成条件</title><desc id="desc">内核页表协调是逻辑角色；仅表示相关 CPU，不要求每次通知所有处理器。 教学抽象，不是运行日志。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356da8"/></marker></defs>
<rect width="1200" height="1070" fill="#fbfcfe"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="40" y="51" font-size="29" fill="#24364b" font-weight="600" text-anchor="start">权限收紧：双 CPU 的失效必须达到协议完成条件</text>
<text x="40" y="88" font-size="17" fill="#526579" font-weight="400" text-anchor="start">内核页表协调是逻辑角色；仅表示相关 CPU，不要求每次通知所有处理器。</text>
<text x="180" y="150" font-size="22" fill="#356da8" font-weight="600" text-anchor="middle">CPU0 / 本地 TLB</text>
<path d="M180 175 V960" stroke="#c3cfdd" stroke-dasharray="5 6"/>
<text x="600" y="150" font-size="22" fill="#356da8" font-weight="600" text-anchor="middle">内核页表与协调</text>
<path d="M600 175 V960" stroke="#c3cfdd" stroke-dasharray="5 6"/>
<text x="1020" y="150" font-size="22" fill="#356da8" font-weight="600" text-anchor="middle">CPU1 / 远端 TLB</text>
<path d="M1020 175 V960" stroke="#c3cfdd" stroke-dasharray="5 6"/>
<rect x="40" y="205" width="280" height="95" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="58" y="237" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">旧缓存：V→PFN7</text>
<text x="58" y="268" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">可写 RW=1</text>
<rect x="880" y="205" width="280" height="95" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="898" y="237" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">旧缓存：V→PFN7</text>
<text x="898" y="268" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">可写 RW=1</text>
<rect x="390" y="310" width="420" height="105" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="408" y="342" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">内核将 PTE 改为只读</text>
<text x="408" y="373" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">旧 TLB 不会因此自动全部同步</text>
<path d="M600 415 L600 440 L180 440 L180 500" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 440 L1020 440 L1020 500" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="220" y="420" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">适用本地失效</text>
<text x="820" y="420" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">适用远端请求</text>
<rect x="40" y="500" width="280" height="105" rx="10" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="58" y="532" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">CPU0 完成失效</text>
<text x="58" y="563" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">覆盖本次所需 V / 上下文</text>
<rect x="880" y="500" width="280" height="105" rx="10" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="898" y="532" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">CPU1 完成失效</text>
<text x="898" y="563" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">覆盖本次所需 V / 上下文</text>
<path d="M180 605 L180 650 L450 650 L450 710" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1020 605 L1020 650 L750 650 L750 710" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="710" width="600" height="110" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="318" y="742" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">所需参与者达到协调完成条件</text>
<text x="318" y="773" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">操作完成后，才依赖新只读权限；不是更新 PTE 就算完成</text>
<path d="M600 820 L600 875" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="875" width="1100" height="100" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="68" y="907" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">后续访问重新取得适用翻译，写入将受新权限约束</text>
<text x="68" y="938" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">解除 / 重定向映射时，旧页复用还必须满足引用和生命周期条件</text>
<text x="50" y="1032" font-size="19" fill="#24364b" font-weight="400" text-anchor="start">锁、可见性、失效范围及完成机制按架构 / 内核实现；此图不是固定消息协议。</text>
</g></svg>
