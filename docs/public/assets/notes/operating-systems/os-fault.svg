<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc">
<title id="title">TLB Miss 可正常翻译，页故障再由内核分类</title><desc id="desc">现代 x86 / Linux 的教学层次；非法访问不都以同一种硬件异常或用户信号结束。 教学抽象，不是运行日志。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#356da8"/></marker></defs>
<rect width="1200" height="1070" fill="#fbfcfe"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="40" y="51" font-size="29" fill="#24364b" font-weight="600" text-anchor="start">TLB Miss 可正常翻译，页故障再由内核分类</text>
<text x="40" y="88" font-size="17" fill="#526579" font-weight="400" text-anchor="start">现代 x86 / Linux 的教学层次；非法访问不都以同一种硬件异常或用户信号结束。</text>
<rect x="50" y="140" width="1100" height="105" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="68" y="172" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">访问虚拟地址：查询适用翻译与权限</text>
<text x="68" y="203" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">可以命中 TLB，也可以因 Miss 进行页表遍历</text>
<path d="M600 245 L600 290 L300 290 L300 350" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 290 L900 290 L900 350" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="350" width="500" height="140" rx="10" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="68" y="382" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">翻译有效且权限允许</text>
<text x="68" y="413" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">TLB 命中，或 Miss 后有效遍历</text>
<text x="68" y="441" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">正常完成；不因此记一次页故障</text>
<rect x="650" y="350" width="500" height="140" rx="10" fill="#fff8ed" stroke="#956526" stroke-width="1.4"/>
<text x="668" y="382" font-size="22" fill="#956526" font-weight="600" text-anchor="start">适用映射不存在 / 保护失败等</text>
<text x="668" y="413" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">触发同步异常 #PF</text>
<text x="668" y="441" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">硬件错误码不直接证明能否恢复</text>
<path d="M900 490 L900 555" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="650" y="555" width="500" height="135" rx="10" fill="#eef5fc" stroke="#356da8" stroke-width="1.4"/>
<text x="668" y="587" font-size="22" fill="#356da8" font-weight="600" text-anchor="start">内核检查范围、权限、后备及访问意图</text>
<text x="668" y="618" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">现代 VMA 等管理信息参与判断</text>
<text x="668" y="646" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">不能对未知地址一概分配物理页</text>
<path d="M650 620 L600 620 L600 735 L300 735 L300 800" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M900 690 L900 800" fill="none" stroke="#356da8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="800" width="500" height="135" rx="10" fill="#f0f8f5" stroke="#297b66" stroke-width="1.4"/>
<text x="68" y="832" font-size="22" fill="#297b66" font-weight="600" text-anchor="start">合法且可完成的延迟工作</text>
<text x="68" y="863" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">分配 / 复用 / 加载 / COW 等</text>
<text x="68" y="891" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">成功建映射，返回并重试指令</text>
<rect x="650" y="800" width="500" height="135" rx="10" fill="#fff8ed" stroke="#956526" stroke-width="1.4"/>
<text x="668" y="832" font-size="22" fill="#956526" font-weight="600" text-anchor="start">不可恢复或不允许的访问</text>
<text x="668" y="863" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">适用 SIGSEGV / SIGBUS 等错误路径</text>
<text x="668" y="891" font-size="18" fill="#24364b" font-weight="400" text-anchor="start">不是所有越界都必然同样立即报错</text>
<text x="50" y="1015" font-size="20" fill="#24364b" font-weight="400" text-anchor="start">Linux 0.11 历史 do_no_page 不包含本图这套现代 VMA 检查，另看专图。</text>
</g></svg>
