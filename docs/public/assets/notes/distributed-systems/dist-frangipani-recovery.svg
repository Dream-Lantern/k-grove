<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1270" viewBox="0 0 1500 1270" role="img" aria-labelledby="title desc">
<title id="title">Frangipani 1997：恢复完成后才能交出故障者的锁</title><desc id="desc">故障租约到期，选恢复者获得独占日志锁，按512字节日志块序号找有效范围，版本小才重放，完成Petal更新后释放锁和回收日志。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="40" y="52" font-size="30" fill="#0F172A" text-anchor="start" font-weight="700">Frangipani 1997：恢复完成后才能交出故障者的锁</text>
<text x="40" y="100" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">元数据恢复 · 用户文件内容不受同一日志协议的完整保护。</text>
<rect x="180" y="145" width="1140" height="110" rx="12" fill="#F8FAFC" stroke="#D97706" stroke-width="2"/>
<text x="200" y="180" font-size="23" fill="#D97706" text-anchor="start" font-weight="700">① A 崩溃，租约过期，锁服务安排恢复者</text>
<text x="200" y="214" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">受影响的业务锁暂不授权给新使用者。</text>
<path d="M750 260 L750 295" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="180" y="300" width="1140" height="110" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="200" y="335" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">② 恢复者取得日志独占锁</text>
<text x="200" y="369" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">恢复锁受租约保护；恢复者失败时可重新安排接管。</text>
<path d="M750 415 L750 450" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="180" y="455" width="1140" height="110" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="200" y="490" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">③ 找到循环日志的有效起止范围</text>
<text x="200" y="524" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">每个 512 字节日志块带递增序号；按有效记录顺序扫描。</text>
<path d="M750 570 L750 605" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="360" y="620" width="780" height="90" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="380" y="655" font-size="24" fill="#7C3AED" text-anchor="start" font-weight="700">④ 元数据块版本 &lt; 日志记录的新版本？</text>
<path d="M360 665 L200 665" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M200 665 L200 770" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="220" y="745" font-size="22" fill="#7C3AED" text-anchor="start" font-weight="400">是 · 尚未完成</text>
<rect x="40" y="785" width="620" height="110" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="60" y="820" font-size="22" fill="#2563EB" text-anchor="start" font-weight="700">应用该块更新，并推进块版本</text>
<text x="60" y="854" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">教学例：块版本 7，记录版本 8 → 应用</text>
<path d="M1140 665 L1300 665" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1300 665 L1300 770" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1030" y="745" font-size="22" fill="#059669" text-anchor="start" font-weight="400">否 · 已完成或已有更新版本</text>
<rect x="800" y="785" width="660" height="110" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="820" y="820" font-size="22" fill="#059669" text-anchor="start" font-weight="700">跳过该块的旧更新</text>
<text x="820" y="854" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">教学例：块版本 ≥ 8，记录版本 8 → 跳过</text>
<path d="M350 900 L350 955" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1130 900 L1130 955" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M350 955 L1130 955" fill="none" stroke="#64748B" stroke-width="2.5"/>
<path d="M750 955 L750 995" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="180" y="1005" width="1140" height="110" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="200" y="1040" font-size="23" fill="#059669" text-anchor="start" font-weight="700">⑤ 遍历并处理完日志，必要更新写入 Petal</text>
<text x="200" y="1074" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">然后释放故障者的锁并回收日志，其他服务器继续。</text>
<text x="40" y="1190" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">每条记录、每个元数据块重复版本判断；日志块序号与元数据块版本用途不同。</text>
<text x="40" y="1235" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">依据：SOSP 1997 §4、§6；独占恢复与块版本判断共同支持再次接管。</text>
</g></svg>
