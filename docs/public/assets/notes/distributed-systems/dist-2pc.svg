<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc">
<title id="title">2PC：协调者/参与者时序与未知决定分支</title><desc id="desc">图中合并多个参与者为一条泳道；Prepared是正常状态，“未知”描述当前可得信息。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">2PC：协调者/参与者时序与未知决定分支</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">YES之前准备持久化；最终决定先持久化再发通知。</tspan></text><rect x="60" y="130" width="480" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="300.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="300.0" dy="0">协调者</tspan></text><text x="300.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="300.0" dy="0">同一事务ID</tspan></text><rect x="660" y="130" width="480" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="900.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="900.0" dy="0">参与者（代表每个资源）</tspan></text><text x="900.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="900.0" dy="0">全体YES才能COMMIT</tspan></text><rect x="660" y="340" width="480" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="900.0" y="377" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="900.0" dy="0">保存Prepared并保留资源</tspan></text><text x="900.0" y="414" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="900.0" dy="0">已承诺可提交，不等于已获知最终决定</tspan></text><rect x="60" y="530" width="480" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="300.0" y="567" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="300.0" dy="0">全YES→持久COMMIT</tspan></text><text x="300.0" y="604" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="300.0" dy="0">若未满足且未决定提交，可ABORT</tspan></text><polygon points="900.0,690 1100,745.0 900.0,800 700,745.0" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="900.0" y="752.0" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600"><tspan x="900.0" dy="0">已收到最终决定？</tspan></text><rect x="40" y="880" width="500" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="290.0" y="917" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="290.0" dy="0">持久化并完成决定，返回ACK</tspan></text><text x="290.0" y="954" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="290.0" dy="0">重复决定幂等；不重复业务效果</tspan></text><rect x="660" y="880" width="480" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="900.0" y="917" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="900.0" dy="0">Prepared且决定未知</tspan></text><text x="900.0" y="954" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="900.0" dy="0">查权威/等待恢复，不可超时自行ABORT</tspan></text><path d="M300 230 L300 290 L900 290 L900 340" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="559.0078125" y="256" width="81.984375" height="25" fill="white"/><text x="600" y="275" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">PREPARE</tspan></text><path d="M660 395 L560 395 L560 490 L300 490 L300 530" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="342.5" y="456" width="175.0" height="25" fill="white"/><text x="430" y="475" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="430" dy="0">YES：准备已安全保存</tspan></text><path d="M540 585 L900 585 L900 690" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="690.0" y="551" width="220.0" height="25" fill="white"/><text x="800" y="570" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="800" dy="0">COMMIT（通知可能丢失）</tspan></text><path d="M700 745 L290 745 L290 880" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="386.5" y="711" width="27.0" height="25" fill="white"/><text x="400" y="730" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="400" dy="0">是</tspan></text><path d="M900 800 L900 880" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="936.5" y="821" width="27.0" height="25" fill="white"/><text x="950" y="840" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="950" dy="0">否</tspan></text><text x="600.0" y="1080" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">图中合并多个参与者为一条泳道；Prepared是正常状态，“未知”描述当前可得信息。</tspan></text></g></svg>