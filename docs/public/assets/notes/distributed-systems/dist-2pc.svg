<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600">
  <defs/>
  <rect fill="#F9FBFE" height="900" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1600" x="0" y="0"/>
  <rect fill="#FFFFFF" height="856" rx="24" ry="24" stroke="#CFDEEF" stroke-width="1.5" width="1540" x="30" y="22"/>
  <rect fill="#2F6FDB" height="7" rx="2" ry="2" stroke="none" stroke-width="1.5" width="1540" x="30" y="22"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="40" font-weight="bold" x="72" y="93">2PC：准备请求、参与者投票与全局决议</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="76" y="137">Prepare 是协调器的出边；YES / NO 是参与者返回协调器的入边。</text>
  <polyline fill="none" points="72,165 1528,165" stroke="#CFDEEF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
  <rect fill="#FFFFFF" height="126" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="410" x="85" y="215"/>
  <rect fill="#2F6FDB" height="126" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="85" y="215"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="109" y="259">Coordinator</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="109" y="296">协调器：发送 PREPARE</text>
  <rect fill="#FFFFFF" height="126" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="410" x="1105" y="215"/>
  <rect fill="#7554CE" height="126" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="1105" y="215"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="1129" y="259">Participants</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="1129" y="296">参与者：记录 Prepared 或返回 NO</text>
  <polyline fill="none" points="495,270 1100,270" stroke="#2F6FDB" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <polygon fill="#2F6FDB" points="1100,270 1089.0,265.0 1089.0,275.0"/>
  <rect fill="#EEF5FF" height="37" rx="18" ry="18" stroke="none" stroke-width="1.5" width="175" x="700" y="220"/>
  <text fill="#2F6FDB" font-family="Noto Sans CJK SC" font-size="17" font-weight="bold" text-anchor="middle" x="787.5" y="245">PREPARE →</text>
  <polyline fill="none" points="1105,323 505,323" stroke="#118E6B" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <polygon fill="#118E6B" points="505,323 516.0,328.0 516.0,318.0"/>
  <rect fill="#E9F8F0" height="37" rx="18" ry="18" stroke="none" stroke-width="1.5" width="190" x="685" y="338"/>
  <text fill="#118E6B" font-family="Noto Sans CJK SC" font-size="17" font-weight="bold" text-anchor="middle" x="780.0" y="363">← YES / NO</text>
  <rect fill="#FFFFFF" height="108" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="630" x="480" y="410"/>
  <rect fill="#2F6FDB" height="108" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="480" y="410"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="504" y="454">Coordinator 收齐投票</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="504" y="491">按协议处理超时、失败与日志状态</text>
  <polyline fill="none" points="775,355 775,403" stroke="#8996A8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polygon fill="#8996A8" points="775,403 780.0,392.0 770.0,392.0"/>
  <polyline fill="none" points="795,518 795,561" stroke="#8996A8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polyline fill="none" points="480,561 1110,561" stroke="#8996A8" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polyline fill="none" points="480,561 480,592" stroke="#118E6B" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polygon fill="#118E6B" points="480,592 485.0,581.0 475.0,581.0"/>
  <polyline fill="none" points="1110,561 1110,592" stroke="#CB4656" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polygon fill="#CB4656" points="1110,592 1115.0,581.0 1105.0,581.0"/>
  <rect fill="#FFFFFF" height="102" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="610" x="170" y="597"/>
  <rect fill="#118E6B" height="102" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="170" y="597"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="194" y="641">所有 YES：COMMIT</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="194" y="678">由 Coordinator 广播最终决定</text>
  <rect fill="#FFFFFF" height="102" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="610" x="815" y="597"/>
  <rect fill="#CB4656" height="102" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="815" y="597"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="839" y="641">NO / 适用失败：ABORT</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="839" y="678">由 Coordinator 广播最终决定</text>
  <rect fill="#FFF5E7" height="121" rx="18" ry="18" stroke="none" stroke-width="1.5" width="1452" x="74" y="730"/>
  <text fill="#C88323" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" x="99" y="765">关键边界</text>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="99" y="801">处于 Prepared 的参与者发生超时，不能自行猜测 COMMIT 或 ABORT。</text>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="99" y="831">这是核心投票方向示意；持久日志、故障协调与阻塞条件见原文章。</text>
</svg>
