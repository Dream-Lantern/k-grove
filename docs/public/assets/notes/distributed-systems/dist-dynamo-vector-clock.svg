<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1070" viewBox="0 0 1320 1070" role="img" aria-labelledby="title desc">
<title id="title">Dynamo Vector Clock：并发分支要由应用合并</title><desc id="desc">D1 到 D2 有因果顺序；D3 与 D4 分别基于 D2 更新，二者并发；应用合并内容后，由协调节点 A 生成支配两者的 D5。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="40" y="53" font-size="30" fill="#0F172A" text-anchor="start" font-weight="700">Dynamo Vector Clock：并发分支要由应用合并</text>
<text x="40" y="100" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">向量缺失分量按 0 比较；逐分量支配表示因果先后，不能用物理时间替代。</text>
<rect x="410" y="135" width="500" height="90" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="430" y="170" font-size="25" fill="#2563EB" text-anchor="start" font-weight="700">D1   [(A,1)]</text>
<path d="M660 230 L660 280" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="410" y="295" width="500" height="105" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="430" y="330" font-size="22" fill="#2563EB" text-anchor="start" font-weight="700">D2   [(A,2)]</text>
<text x="430" y="364" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">两个客户端都基于 D2 的上下文写入。</text>
<path d="M570 407 L310 475" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M750 407 L1010 475" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="490" width="560" height="150" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="60" y="525" font-size="22" fill="#7C3AED" text-anchor="start" font-weight="700">D3   [(A,2), (B,1)]</text>
<text x="60" y="559" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">客户端甲：购物车加入“书”</text>
<text x="60" y="593" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">由 B 协调；继承 D2 并增加 B 分量。</text>
<rect x="720" y="490" width="560" height="150" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="740" y="525" font-size="22" fill="#7C3AED" text-anchor="start" font-weight="700">D4   [(A,2), (C,1)]</text>
<text x="740" y="559" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">客户端乙：购物车加入“笔”</text>
<text x="740" y="593" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">由 C 协调；继承 D2 并增加 C 分量。</text>
<text x="660" y="695" font-size="23" fill="#7C3AED" text-anchor="middle" font-weight="700">D3 ∥ D4：互不支配，读出两个 sibling 及其上下文</text>
<path d="M310 650 L510 765" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1010 650 L810 765" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="240" y="785" width="840" height="145" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="260" y="820" font-size="23" fill="#059669" text-anchor="start" font-weight="700">D5   [(A,3), (B,1), (C,1)]</text>
<text x="260" y="854" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">应用决定合并为“书 + 笔”，携带两分支上下文写回 A。</text>
<text x="260" y="888" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">向量先逐分量取最大值，再递增协调节点 A 的分量。</text>
<text x="660" y="995" font-size="22" fill="#0F172A" text-anchor="middle" font-weight="400">Vector Clock 检测因果与并发；购物车合并、删除和覆盖规则仍由业务决定。</text>
</g></svg>
