<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1140" viewBox="0 0 1400 1140" role="img" aria-labelledby="title desc">
<title id="title">Raft 快照：保存状态与边界，再安全截断前缀</title><desc id="desc">快照覆盖到 index 5、term 3，保留日志 6 至 8。另以落后 Follower 的 InstallSnapshot 为例，区分边界匹配与不匹配时的日志保留。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="40" y="53" font-size="30" fill="#0F172A" text-anchor="start" font-weight="700">Raft 快照：保存状态与边界，再安全截断前缀</text>
<text x="40" y="100" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">本地示例：状态机已应用到 index 5；快照不是整份日志的简单复制。</text>
<rect x="40" y="145" width="145" height="85" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="112" y="177" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">index 1</text>
<text x="112" y="211" font-size="22" fill="#0F172A" text-anchor="middle" font-weight="400">term 1</text>
<rect x="205" y="145" width="145" height="85" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="277" y="177" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">index 2</text>
<text x="277" y="211" font-size="22" fill="#0F172A" text-anchor="middle" font-weight="400">term 1</text>
<rect x="370" y="145" width="145" height="85" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="442" y="177" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">index 3</text>
<text x="442" y="211" font-size="22" fill="#0F172A" text-anchor="middle" font-weight="400">term 2</text>
<rect x="535" y="145" width="145" height="85" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="607" y="177" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">index 4</text>
<text x="607" y="211" font-size="22" fill="#0F172A" text-anchor="middle" font-weight="400">term 2</text>
<rect x="700" y="145" width="145" height="85" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="772" y="177" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">index 5</text>
<text x="772" y="211" font-size="22" fill="#0F172A" text-anchor="middle" font-weight="400">term 3</text>
<rect x="865" y="145" width="145" height="85" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="937" y="177" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">index 6</text>
<text x="937" y="211" font-size="22" fill="#0F172A" text-anchor="middle" font-weight="400">term 3</text>
<rect x="1030" y="145" width="145" height="85" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="1102" y="177" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">index 7</text>
<text x="1102" y="211" font-size="22" fill="#0F172A" text-anchor="middle" font-weight="400">term 4</text>
<rect x="1195" y="145" width="145" height="85" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="1267" y="177" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">index 8</text>
<text x="1267" y="211" font-size="22" fill="#0F172A" text-anchor="middle" font-weight="400">term 4</text>
<path d="M450 245 L450 290" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1110 245 L1110 290" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="305" width="770" height="185" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="60" y="340" font-size="22" fill="#059669" text-anchor="start" font-weight="700">快照：lastIncludedIndex = 5 / lastIncludedTerm = 3</text>
<text x="60" y="374" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">保存：应用到 5 的状态、边界配置、必要的去重状态。</text>
<text x="60" y="408" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">先持久化快照及恢复元数据，再安全截断日志 1～5。</text>
<text x="60" y="442" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">快照与剩余日志必须能组成一致的恢复起点。</text>
<rect x="850" y="305" width="510" height="185" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="870" y="340" font-size="22" fill="#2563EB" text-anchor="start" font-weight="700">保留后缀：6 / 7 / 8</text>
<text x="870" y="374" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">对应 term：3 / 4 / 4</text>
<text x="870" y="408" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">保留不等于已提交或已应用。</text>
<text x="870" y="442" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">重放必须依据恢复后的安全进度。</text>
<text x="40" y="555" font-size="26" fill="#0F172A" text-anchor="start" font-weight="700">独立的 InstallSnapshot 示例</text>
<rect x="40" y="585" width="1320" height="120" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="60" y="620" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">Leader：快照覆盖到 100，日志仅保留 101～120；Follower 的日志只到 40。</text>
<text x="60" y="654" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">Leader 已没有 41～100 可发送，需要用快照补齐这个历史缺口。</text>
<path d="M700 710 L380 755" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M700 710 L1030 755" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="770" width="640" height="150" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="60" y="805" font-size="22" fill="#059669" text-anchor="start" font-weight="700">本地存在 index 100 且任期也匹配</text>
<text x="60" y="839" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">保留边界之后可衔接的日志后缀。</text>
<text x="60" y="873" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">是否重装状态还要看本地应用进度。</text>
<rect x="720" y="770" width="640" height="150" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<text x="740" y="805" font-size="22" fill="#D97706" text-anchor="start" font-weight="700">本地没有该边界，或边界任期不同</text>
<text x="740" y="839" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">丢弃不相容的旧日志，采用快照边界。</text>
<text x="740" y="873" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">按协议安装状态并继续复制后续日志。</text>
<rect x="40" y="965" width="1320" height="125" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="60" y="1000" font-size="22" fill="#7C3AED" text-anchor="start" font-weight="700">分块接收完成 ≠ 快照已生效 ≠ 节点已可服务当前读取。</text>
<text x="60" y="1034" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">旧快照不得把更先进的已应用状态回滚；此处两条分支讨论的是日志保留。</text>
<text x="60" y="1068" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">快照用于压缩与恢复，并不替代异地备份。</text>
</g></svg>
