<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">线性一致性：调用与响应使用共同时间轴</title><desc id="desc">R1与W1重叠可排在写前或写后；R2开始晚于W1完成，且无其他写。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">线性一致性：调用与响应使用共同时间轴</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">初值x=0；W1=[1,4]，R1=[2,3]，R2=[5,6]，与正文同一个并发示例。</tspan></text><rect x="275" y="210" width="435" height="90" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="492.5" y="247" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="492.5" dy="0">W1 写1</tspan></text><text x="492.5" y="284" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="492.5" dy="0"></tspan></text><text x="275" y="190" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="275" dy="0">调用</tspan></text><text x="710" y="330" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="710" dy="0">响应</tspan></text><rect x="420" y="370" width="145" height="90" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="492.5" y="407" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="492.5" dy="0">R1 读0或1</tspan></text><text x="492.5" y="444" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="492.5" dy="0"></tspan></text><text x="420" y="350" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="420" dy="0">调用</tspan></text><text x="565" y="490" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="565" dy="0">响应</tspan></text><rect x="855" y="530" width="145" height="90" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="927.5" y="567" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="927.5" dy="0">R2 必须读1</tspan></text><text x="927.5" y="604" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="927.5" dy="0"></tspan></text><text x="855" y="510" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="855" dy="0">调用</tspan></text><text x="1000" y="650" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="1000" dy="0">响应</tspan></text><path d="M130 690 L1140 690" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="130" y="725" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="130" dy="0">0</tspan></text><text x="275" y="725" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="275" dy="0">1</tspan></text><text x="420" y="725" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="420" dy="0">2</tspan></text><text x="565" y="725" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="565" dy="0">3</tspan></text><text x="710" y="725" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="710" dy="0">4</tspan></text><text x="855" y="725" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="855" dy="0">5</tspan></text><text x="1000" y="725" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="1000" dy="0">6</tspan></text><text x="600.0" y="770" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">R1与W1重叠可排在写前或写后；R2开始晚于W1完成，且无其他写。</tspan></text></g></svg>