<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1110" viewBox="0 0 1500 1110" role="img" aria-labelledby="title desc">
<title id="title">并行请求：关键路径决定汇合时间</title><desc id="desc">订单查询同时发起库存100毫秒、支付状态800毫秒和用户200毫秒，等待全部完成。并行区间800毫秒，加前后串行处理才是总时间。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="40" y="52" font-size="30" fill="#0F172A" text-anchor="start" font-weight="700">并行请求：关键路径决定汇合时间</text>
<text x="40" y="100" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">教学假设 · 三分支同时开始，等待全部成功；不含额外网络、重试和汇合开销。</text>
<rect x="40" y="150" width="420" height="110" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="60" y="185" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">API Gateway · 入口</text>
<text x="60" y="219" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">调用 Order Service</text>
<rect x="580" y="150" width="880" height="110" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="600" y="185" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">Order Service · 订单服务</text>
<text x="600" y="219" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">并行查询库存、支付状态、用户信息</text>
<path d="M465 205 L575 205" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="520.0" y="192" font-size="20" fill="#2563EB" text-anchor="middle" font-weight="400">请求</text>
<text x="40" y="325" font-size="24" fill="#2563EB" text-anchor="start" font-weight="700">并行区间：同一时间轴，长度按耗时比例表示</text>
<path d="M410 365 L1330 365" fill="none" stroke="#64748B" stroke-width="2.5"/>
<path d="M410 355 L410 375" fill="none" stroke="#64748B" stroke-width="2.5"/>
<text x="410" y="345" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">0</text>
<path d="M525 355 L525 375" fill="none" stroke="#64748B" stroke-width="2.5"/>
<text x="525" y="345" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">100</text>
<path d="M640 355 L640 375" fill="none" stroke="#64748B" stroke-width="2.5"/>
<text x="640" y="345" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">200</text>
<path d="M755 355 L755 375" fill="none" stroke="#64748B" stroke-width="2.5"/>
<text x="755" y="345" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">300</text>
<path d="M870 355 L870 375" fill="none" stroke="#64748B" stroke-width="2.5"/>
<text x="870" y="345" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">400</text>
<path d="M985 355 L985 375" fill="none" stroke="#64748B" stroke-width="2.5"/>
<text x="985" y="345" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">500</text>
<path d="M1100 355 L1100 375" fill="none" stroke="#64748B" stroke-width="2.5"/>
<text x="1100" y="345" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">600</text>
<path d="M1215 355 L1215 375" fill="none" stroke="#64748B" stroke-width="2.5"/>
<text x="1215" y="345" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">700</text>
<path d="M1330 355 L1330 375" fill="none" stroke="#64748B" stroke-width="2.5"/>
<text x="1330" y="345" font-size="19" fill="#0F172A" text-anchor="middle" font-weight="400">800</text>
<text x="1380" y="345" font-size="20" fill="#0F172A" text-anchor="start" font-weight="400">ms</text>
<text x="40" y="480" font-size="23" fill="#2563EB" text-anchor="start" font-weight="400">Inventory · 库存</text>
<rect x="410" y="440" width="114.99999999999999" height="70" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="540.0" y="483" font-size="22" fill="#2563EB" text-anchor="start" font-weight="400">100 ms</text>
<path d="M525.0 475 L1330 475" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="7 6"/>
<text x="40" y="615" font-size="23" fill="#DC2626" text-anchor="start" font-weight="400">Payment · 支付状态</text>
<rect x="410" y="575" width="919.9999999999999" height="70" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
<text x="1345.0" y="618" font-size="22" fill="#DC2626" text-anchor="start" font-weight="400">800 ms</text>
<text x="40" y="750" font-size="23" fill="#2563EB" text-anchor="start" font-weight="400">User · 用户信息</text>
<rect x="410" y="710" width="229.99999999999997" height="70" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="655.0" y="753" font-size="22" fill="#2563EB" text-anchor="start" font-weight="400">200 ms</text>
<path d="M640.0 745 L1330 745" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="7 6"/>
<path d="M1330 395 L1330 805" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="7 6"/>
<rect x="890" y="825" width="570" height="85" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="910" y="860" font-size="23" fill="#059669" text-anchor="start" font-weight="700">全部完成，汇合后才可回复</text>
<path d="M1330 785 L1330 820" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="950" width="1420" height="110" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="60" y="985" font-size="23" fill="#7C3AED" text-anchor="start" font-weight="700">关键路径：本例是支付状态分支，并行区间约 800 ms，不是 1100 ms。</text>
<text x="60" y="1019" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">完整响应 = 之前的串行工作 + 并行区间 + 汇合与之后的处理；父子 Span 也不能重复相加。</text>
</g></svg>
