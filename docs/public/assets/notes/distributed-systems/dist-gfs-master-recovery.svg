<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1510" viewBox="0 0 1480 1510" role="img" aria-labelledby="title desc">
<title id="title">GFS Master：持久日志、检查点与故障恢复</title><desc id="desc">Primary Master 复制日志，须本地和所有 Master 日志副本刷盘后确认元数据变更。完整 checkpoint 配合后续日志恢复，新 Master 由外部监控启动。Shadow 跟读日志只提供只读元数据访问。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="40" y="52" font-size="30" fill="#0F172A" text-anchor="start" font-weight="700">GFS Master：持久日志、检查点与故障恢复</text>
<text x="40" y="100" font-size="20" fill="#0F172A" text-anchor="start" font-weight="400">图例：蓝 = 元数据 / 恢复控制；绿 = 持久恢复材料；紫 = Shadow 只读分支；红 = 故障。</text>
<rect x="40" y="150" width="420" height="100" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="60" y="185" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">Primary Master</text>
<text x="60" y="219" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">负责元数据修改与后台决策</text>
<rect x="40" y="320" width="420" height="105" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="60" y="355" font-size="23" fill="#059669" text-anchor="start" font-weight="700">Operation Log</text>
<text x="60" y="389" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">按逻辑顺序记录元数据变更</text>
<path d="M250 255 L250 310" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="250.0" y="268.5" font-size="21" fill="#2563EB" text-anchor="middle" font-weight="400">元数据操作</text>
<rect x="550" y="150" width="390" height="100" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="570" y="185" font-size="23" fill="#059669" text-anchor="start" font-weight="700">本地日志持久化</text>
<text x="570" y="219" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">flush 到磁盘</text>
<rect x="550" y="320" width="390" height="105" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="570" y="355" font-size="23" fill="#059669" text-anchor="start" font-weight="700">远程 Master 日志副本</text>
<text x="570" y="389" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">所有适用副本完成刷盘</text>
<path d="M460 355 L550 235" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="505.0" y="281.0" font-size="21" fill="#059669" text-anchor="middle" font-weight="400">复制</text>
<path d="M460 390 L550 390" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="505.0" y="376.0" font-size="21" fill="#059669" text-anchor="middle" font-weight="400">复制</text>
<rect x="1030" y="150" width="410" height="135" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="1050" y="185" font-size="22" fill="#7C3AED" text-anchor="start" font-weight="700">Shadow Master</text>
<text x="1050" y="219" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">读取复制日志、顺序应用</text>
<text x="1050" y="253" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">只读访问；视图可能落后</text>
<path d="M940 350 L1235 300" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1087.5" y="311.0" font-size="21" fill="#7C3AED" text-anchor="middle" font-weight="400">跟读日志</text>
<text x="550" y="477" font-size="22" fill="#059669" text-anchor="start" font-weight="400">本地 + 所有日志副本刷盘后，才确认元数据操作。</text>
<rect x="40" y="520" width="900" height="150" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="60" y="555" font-size="23" fill="#059669" text-anchor="start" font-weight="700">Checkpoint：切日志，独立线程生成切换前状态</text>
<text x="60" y="589" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">新操作继续写新日志；完整检查点写本地与远程。</text>
<text x="60" y="623" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">恢复跳过不完整检查点，不先丢掉唯一可用恢复材料。</text>
<path d="M250 435 L250 505" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="250.0" y="456.0" font-size="21" fill="#059669" text-anchor="middle" font-weight="400">累积状态 → 检查点</text>
<rect x="1030" y="520" width="410" height="150" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
<text x="1050" y="555" font-size="22" fill="#DC2626" text-anchor="start" font-weight="700">外部监控基础设施</text>
<text x="1050" y="589" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">Primary 机器 / 磁盘失效时</text>
<text x="1050" y="623" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">在其他机器启动新 Master</text>
<path d="M1235 685 L1235 735" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="250" y="755" width="1000" height="100" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="270" y="790" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">1 · 新 Master 启动</text>
<text x="270" y="824" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">不是 Raft 自动选举</text>
<path d="M750 859 L750 883" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="250" y="890" width="1000" height="100" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="270" y="925" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">2 · 加载完整 Checkpoint</text>
<text x="270" y="959" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">目录：/data/a、/data/b</text>
<path d="M750 994 L750 1018" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="250" y="1025" width="1000" height="100" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="270" y="1060" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">3 · 重放后续日志</text>
<text x="270" y="1094" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">创建 c → 删除 a → 创建 d</text>
<path d="M750 1129 L750 1153" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="250" y="1160" width="1000" height="100" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="270" y="1195" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">4 · 询问 Chunkserver</text>
<text x="270" y="1229" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">收集 handle、版本与位置</text>
<path d="M750 1264 L750 1288" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="250" y="1295" width="1000" height="100" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="270" y="1330" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">5 · 恢复元数据视图</text>
<text x="270" y="1364" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">目录 b、c、d + 有效副本位置</text>
<path d="M1235 735 L750 735" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M750 735 L750 750" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="1480" font-size="21" fill="#0F172A" text-anchor="start" font-weight="400">Chunkserver 仍保存文件内容；Shadow 不自动接管写入；元数据恢复不等于丢失文件数据的恢复。</text>
</g></svg>
