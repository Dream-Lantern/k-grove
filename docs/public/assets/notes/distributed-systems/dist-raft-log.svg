<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
<title id="title">Raft：持久化、提交与应用是不同进度</title><desc id="desc">A 是任期 4 的 Leader。index 5 已在 A、B 持久化，A 确认提交但尚未应用；B 尚未获知新提交位置，C 尚未收到条目。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="40" y="53" font-size="30" fill="#0F172A" text-anchor="start" font-weight="700">Raft：持久化、提交与应用是不同进度</text>
<text x="40" y="100" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">观察时刻：B 已成功回复，A 已推进 commitIndex；应用和通知尚未完成。</text>
<text x="40" y="197" font-size="23" fill="#0F172A" text-anchor="start" font-weight="700">A · Leader</text>
<rect x="260" y="160" width="150" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="335" y="191" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="400">index 1</text>
<text x="335" y="221" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">term 1</text>
<rect x="435" y="160" width="150" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="510" y="191" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="400">index 2</text>
<text x="510" y="221" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">term 1</text>
<rect x="610" y="160" width="150" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="685" y="191" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="400">index 3</text>
<text x="685" y="221" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">term 2</text>
<rect x="785" y="160" width="150" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="860" y="191" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="400">index 4</text>
<text x="860" y="221" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">term 3</text>
<rect x="960" y="160" width="150" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="1035" y="191" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="400">index 5</text>
<text x="1035" y="221" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">term 4</text>
<text x="260" y="272" font-size="21" fill="#0F172A" text-anchor="start" font-weight="400">commitIndex = 5    lastApplied = 4</text>
<text x="40" y="377" font-size="23" fill="#0F172A" text-anchor="start" font-weight="700">B · Follower</text>
<rect x="260" y="340" width="150" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="335" y="371" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="400">index 1</text>
<text x="335" y="401" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">term 1</text>
<rect x="435" y="340" width="150" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="510" y="371" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="400">index 2</text>
<text x="510" y="401" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">term 1</text>
<rect x="610" y="340" width="150" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="685" y="371" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="400">index 3</text>
<text x="685" y="401" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">term 2</text>
<rect x="785" y="340" width="150" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="860" y="371" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="400">index 4</text>
<text x="860" y="401" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">term 3</text>
<rect x="960" y="340" width="150" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="1035" y="371" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="400">index 5</text>
<text x="1035" y="401" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">term 4</text>
<text x="260" y="452" font-size="21" fill="#0F172A" text-anchor="start" font-weight="400">commitIndex = 4    lastApplied = 4</text>
<text x="40" y="557" font-size="23" fill="#0F172A" text-anchor="start" font-weight="700">C · Follower</text>
<rect x="260" y="520" width="150" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="335" y="551" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="400">index 1</text>
<text x="335" y="581" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">term 1</text>
<rect x="435" y="520" width="150" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="510" y="551" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="400">index 2</text>
<text x="510" y="581" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">term 1</text>
<rect x="610" y="520" width="150" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="685" y="551" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="400">index 3</text>
<text x="685" y="581" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">term 2</text>
<rect x="785" y="520" width="150" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="860" y="551" font-size="18" fill="#0F172A" text-anchor="middle" font-weight="400">index 4</text>
<text x="860" y="581" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="700">term 3</text>
<text x="260" y="632" font-size="21" fill="#0F172A" text-anchor="start" font-weight="400">commitIndex = 4    lastApplied = 4</text>
<rect x="960" y="520" width="150" height="78" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1035" y="567" font-size="20" fill="#64748B" text-anchor="middle" font-weight="400">尚未收到</text>
<path d="M1120 150 L1120 240" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="1115" y="137" font-size="18" fill="#059669" text-anchor="end" font-weight="400">A 已知提交至 5</text>
<path d="M945 330 L945 420" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="940" y="317" font-size="18" fill="#059669" text-anchor="end" font-weight="400">B 已知提交至 4</text>
<path d="M945 510 L945 600" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="940" y="497" font-size="18" fill="#059669" text-anchor="end" font-weight="400">C 已知提交至 4</text>
<path d="M936 155 L936 248" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="936" y="310" font-size="19" fill="#D97706" text-anchor="end" font-weight="400">lastApplied 边界：已应用至 4</text>
<path d="M936 335 L936 428" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="936" y="490" font-size="19" fill="#D97706" text-anchor="end" font-weight="400">lastApplied 边界：已应用至 4</text>
<path d="M936 515 L936 608" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="936" y="670" font-size="19" fill="#D97706" text-anchor="end" font-weight="400">lastApplied 边界：已应用至 4</text>
<rect x="40" y="710" width="1200" height="170" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="60" y="745" font-size="22" fill="#059669" text-anchor="start" font-weight="700">index 5 / term 4：SET x = 100</text>
<text x="60" y="779" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">A、B 的当前任期条目满足多数 → A 可提交；A 应用到 5 后再返回业务结果。</text>
<text x="60" y="813" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">后续 AppendEntries 携带 leaderCommit = 5，B、C 才各自获知并推进应用。</text>
<text x="60" y="847" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">持久化成功 ≠ 已提交；已提交 ≠ 当前节点已经应用。</text>
</g></svg>
