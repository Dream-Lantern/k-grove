<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">GFS 2003：元数据查询与直接文件数据访问</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">实线表示请求/控制，虚线表示响应；数据不绕经Master。</tspan></text><rect x="60" y="160" width="430" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="275.0" y="197" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="275.0" dy="0">GFS客户端</tspan></text><text x="275.0" y="234" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="275.0" dy="0">文件名、偏移与chunk标识</tspan></text><rect x="710" y="160" width="430" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="925.0" y="197" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="925.0" dy="0">Master</tspan></text><text x="925.0" y="234" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="925.0" dy="0">命名空间、位置、租约</tspan></text><rect x="60" y="590" width="430" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="275.0" y="627" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="275.0" dy="0">Chunkserver A</tspan></text><text x="275.0" y="664" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="275.0" dy="0">文件数据副本</tspan></text><rect x="710" y="590" width="430" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="925.0" y="627" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="925.0" dy="0">Chunkserver B等</tspan></text><text x="925.0" y="664" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="925.0" dy="0">副本及管理对象</tspan></text><path d="M490 195 L710 195" fill="none" stroke="#0369A1" stroke-width="2" marker-end="u