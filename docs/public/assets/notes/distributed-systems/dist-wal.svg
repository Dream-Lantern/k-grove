<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1280" viewBox="0 0 1480 1280" role="img" aria-labelledby="title desc">
<title id="title">WAL：提交与数据页写回分别遵守持久化屏障</title><desc id="desc">左侧同步提交须把提交记录也持久化；右侧数据页写回须先持久覆盖 pageLSN 的 WAL。两者共享 WAL 持久进度，但页面写回无需等事务提交。异步提交只放宽回复等待。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="40" y="52" font-size="30" fill="#0F172A" text-anchor="start" font-weight="700">WAL：提交与数据页写回分别遵守持久化屏障</text>
<text x="40" y="100" font-size="21" fill="#0F172A" text-anchor="start" font-weight="400">图例：蓝 = 事务提交；紫 = 页面写回判断；绿 = 已达到持久边界；橙 = 异步提交的不同等待契约。</text>
<text x="40" y="155" font-size="25" fill="#2563EB" text-anchor="start" font-weight="700">路径 A · 同步提交（本地持久条件示例）</text>
<text x="810" y="155" font-size="25" fill="#7C3AED" text-anchor="start" font-weight="700">路径 B · 数据页写回</text>
<rect x="40" y="185" width="630" height="115" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="60" y="220" font-size="22" fill="#2563EB" text-anchor="start" font-weight="700">生成修改 WAL</text>
<text x="60" y="254" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">教学位置：修改记录覆盖到 LSN 500</text>
<path d="M355 305 L355 343" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="355" width="630" height="115" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="60" y="390" font-size="22" fill="#2563EB" text-anchor="start" font-weight="700">生成 Commit Record</text>
<text x="60" y="424" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">提交记录结束边界：LSN 540</text>
<path d="M355 475 L355 523" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="535" width="630" height="115" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="60" y="570" font-size="22" fill="#059669" text-anchor="start" font-weight="700">WAL Flush ≥ 540</text>
<text x="60" y="604" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">提交记录也已跨过持久化屏障</text>
<path d="M355 655 L355 728" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="740" width="630" height="115" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="60" y="775" font-size="22" fill="#2563EB" text-anchor="start" font-weight="700">回复客户端成功</text>
<text x="60" y="809" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">不要求所有数据页已经写回</text>
<rect x="810" y="185" width="630" height="115" rx="12" fill="#F8FAFC" stroke="#7C3AED" stroke-width="2"/>
<text x="830" y="220" font-size="22" fill="#7C3AED" text-anchor="start" font-weight="700">数据页在缓冲中修改</text>
<text x="830" y="254" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">该页的 pageLSN = 500</text>
<path d="M1125 305 L1125 343" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="810" y="355" width="630" height="115" rx="12" fill="#F8FAFC" stroke="#7C3AED" stroke-width="2"/>
<text x="830" y="390" font-size="22" fill="#7C3AED" text-anchor="start" font-weight="700">检查 pageLSN</text>
<text x="830" y="424" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">不能把内存进度当作持久 WAL 进度</text>
<path d="M1125 475 L1125 523" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="810" y="535" width="630" height="115" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="830" y="570" font-size="22" fill="#059669" text-anchor="start" font-weight="700">先等待 WAL Flush ≥ 500</text>
<text x="830" y="604" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">覆盖该页修改的完整日志记录</text>
<path d="M1125 655 L1125 728" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="810" y="740" width="630" height="115" rx="12" fill="#F8FAFC" stroke="#7C3AED" stroke-width="2"/>
<text x="830" y="775" font-size="22" fill="#7C3AED" text-anchor="start" font-weight="700">Data Page Flush</text>
<text x="830" y="809" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">此后才允许数据页持久写回</text>
<path d="M670 590 L740 590" fill="none" stroke="#059669" stroke-width="2.5"/>
<path d="M810 590 L740 590" fill="none" stroke="#059669" stroke-width="2.5"/>
<path d="M740 590 L740 905" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="920" width="1400" height="135" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="60" y="955" font-size="23" fill="#059669" text-anchor="start" font-weight="700">共享的是同一条 WAL 的持久进度，不是同一个提交条件。</text>
<text x="60" y="989" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">例如 WAL 已持久到 540，也覆盖了 500；但页面可以在提交前或提交后写回。</text>
<text x="60" y="1023" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">LSN 数字是简化的日志结束边界；实际 PostgreSQL 17 页头字段为 pd_lsn。</text>
<rect x="40" y="1100" width="1400" height="130" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<text x="60" y="1135" font-size="23" fill="#D97706" text-anchor="start" font-weight="700">异步提交：生成提交记录 → 可先回复 → 后台再 Flush，崩溃可能丢失最近成功事务。</text>
<text x="60" y="1169" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">synchronous_commit=off 不解除路径 B；也不等于 fsync=off。</text>
<text x="60" y="1203" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">远端复制确认按具体配置另行等待，不能由本地 Flush 推出多数派共识提交。</text>
</g></svg>
