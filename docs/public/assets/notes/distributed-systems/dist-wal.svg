<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">同步持久提交：提交记录也必须跨过WAL屏障</title><desc id="desc">示例不覆盖所有引擎；异步提交可能先回成功后刷WAL，故障时最近成功事务仍可能丢失。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">同步持久提交：提交记录也必须跨过WAL屏障</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">以满足存储假设的同步提交为例；数据页写回不是成功回复的固定前置条件。</tspan></text><rect x="380" y="130" width="440" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">生成恢复日志并修改缓冲页</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">页面尚未持久也可能继续处理</tspan></text><rect x="380" y="330" width="440" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="367" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">写入提交所需记录</tspan></text><text x="600.0" y="404" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">不把它留在成功回复之后</tspan></text><rect x="350" y="530" width="500" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="567" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">WAL刷到包含提交记录的位置</tspan></text><text x="600.0" y="604" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">确认达到声明的持久化边界</tspan></text><rect x="60" y="800" width="440" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="280.0" y="837" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="280.0" dy="0">回复同步持久成功</tspan></text><text x="280.0" y="874" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="280.0" dy="0">回复丢失仍可能已提交</tspan></text><rect x="700" y="800" width="440" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="920.0" y="837" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="920.0" dy="0">数据页另行写回</tspan></text><text x="920.0" y="874" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="920.0" dy="0">对应页面的WAL必须先持久</tspan></text><path d="M600 230 L600 330" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 430 L600 530" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M470 640 L470 710 L280 710 L280 800" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="244.0" y="676" width="112.0" height="25" fill="white"/><text x="300" y="695" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="300" dy="0">提交屏障完成</tspan></text><path d="M730 640 L730 710 L920 710 L920 800" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="857.0" y="676" width="146.0" height="25" fill="white"/><text x="930" y="695" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="930" dy="0">独立异步写回路线</tspan></text><text x="600.0" y="990" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">示例不覆盖所有引擎；异步提交可能先回成功后刷WAL，故障时最近成功事务仍可能丢失。</tspan></text></g></svg>