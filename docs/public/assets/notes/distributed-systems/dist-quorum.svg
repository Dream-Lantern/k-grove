<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Quorum 交集：数量条件不是完整协议</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">Quorum 交集：数量条件不是完整协议</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">固定副本集合 {A,B,C,D,E}，W=3，R=3。</tspan></text><rect x="60" y="175" width="490" height="130" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="305.0" y="212" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="305.0" dy="0">写集合 {A,B,C}</tspan></text><text x="305.0" y="249" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="305.0" dy="0">某次写入成功到达的副本</tspan></text><rect x="650" y="175" width="490" height="130" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="895.0" y="212" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="895.0" dy="0">读集合 {C,D,E}</tspan></text><text x="895.0" y="249" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="895.0" dy="0">读取观察到的副本</tspan></text><rect x="365" y="420" width="470" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="457" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">交集 {C}</tspan></text><text x="600.0" y="494" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">还需版本、并发和未完成写处理</tspan></text><path d="M305 305 L305 370 L475 370 L475 420" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M895 305 L895 370 L725 370 L725 420" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600.0" y="612" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">sloppy quorum 的实际集合变化时，不能不经核对就直接套 R+W&gt;N。</tspan></text></g></svg>