<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1350" viewBox="0 0 1540 1350" role="img" aria-labelledby="title desc">
<title id="title">Aurora 2017：完整边界、MTR 与崩溃恢复</title><desc id="desc">VCL1007但CPL为90010001100时VDL1000。独立MTR示例说明原子分组。恢复先重建PG边界并持久截断，再恢复事务运行时和Undo。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="40" y="52" font-size="30" fill="#0F172A" text-anchor="start" font-weight="700">Aurora 2017：完整边界、MTR 与崩溃恢复</text>
<text x="40" y="100" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">A · 论文边界例子：CPL = 900、1000、1100；日志完整到 1007。</text>
<path d="M100 220 L1430 220" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<path d="M160 205 L160 235" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<text x="160" y="185" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="400">900 · CPL</text>
<path d="M650 205 L650 235" fill="none" stroke="#059669" stroke-width="2.5"/>
<text x="650" y="185" font-size="22" fill="#059669" text-anchor="middle" font-weight="400">1000 · CPL = VDL</text>
<path d="M920 205 L920 235" fill="none" stroke="#D97706" stroke-width="2.5"/>
<text x="920" y="185" font-size="22" fill="#D97706" text-anchor="middle" font-weight="400">1007 · VCL</text>
<path d="M1380 205 L1380 235" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<text x="1380" y="185" font-size="22" fill="#2563EB" text-anchor="middle" font-weight="400">1100 · CPL</text>
<rect x="40" y="285" width="1460" height="110" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="60" y="320" font-size="23" fill="#7C3AED" text-anchor="start" font-weight="700">VDL = max { CPL | CPL ≤ VCL } = 1000</text>
<text x="60" y="354" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">1001～1007 已完整，但尚未到下一个 CPL；恢复时不能保留为完整 MTR 状态。</text>
<rect x="40" y="440" width="1460" height="135" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="60" y="475" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">B · 独立教学场景：一个 SQL 事务包含多个 MTR</text>
<text x="60" y="509" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">MTR-1：[1001、1002、1003(CPL)]    MTR-2：[1004、1005、1006(CPL)]</text>
<text x="60" y="543" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">最后一条是 CPL；MTR 内部原子应用，不等于 SQL 事务提交。</text>
<text x="40" y="630" font-size="24" fill="#2563EB" text-anchor="start" font-weight="700">C · 崩溃恢复：存储边界恢复与 SQL 事务恢复分开。</text>
<rect x="180" y="675" width="1180" height="115" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="200" y="710" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">① 每个 PG 联系读 quorum 3 / 6</text>
<text x="200" y="744" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">发现可能已到达写 quorum 的日志，重建完整边界 VCL。</text>
<path d="M770 795 L770 825" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="180" y="830" width="1180" height="115" rx="12" fill="#F8FAFC" stroke="#7C3AED" stroke-width="2"/>
<text x="200" y="865" font-size="23" fill="#7C3AED" text-anchor="start" font-weight="700">② 按 CPL 计算新 VDL</text>
<text x="200" y="899" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">使 VDL 之后至安全上界的日志失效；上界覆盖潜在在途日志。</text>
<path d="M770 950 L770 980" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="180" y="985" width="1180" height="115" rx="12" fill="#F8FAFC" stroke="#D97706" stroke-width="2"/>
<text x="200" y="1020" font-size="23" fill="#D97706" text-anchor="start" font-weight="700">③ 持久化带 epoch 的截断范围</text>
<text x="200" y="1054" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">恢复中再次崩溃：重新接管，按持久化的代际与范围识别尾部。</text>
<path d="M770 1105 L770 1135" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="180" y="1140" width="1180" height="115" rx="12" fill="#F8FAFC" stroke="#059669" stroke-width="2"/>
<text x="200" y="1175" font-size="23" fill="#059669" text-anchor="start" font-weight="700">④ 重建引擎运行时与未完成事务列表</text>
<text x="200" y="1209" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">从 Undo 段识别未完成事务，执行必要 Undo；论文允许在线 Undo。</text>
<text x="40" y="1320" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">VDL 之前也可能存在未提交事务的修改；Redo 下沉不消除 Undo。依据：论文 §4.1—4.3。</text>
</g></svg>
