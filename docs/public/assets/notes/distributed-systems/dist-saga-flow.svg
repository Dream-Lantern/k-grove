<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020" role="img" aria-labelledby="title desc">
<title id="title">Saga：记录进度，再选择继续或补偿</title><desc id="desc">订单教学流程。确认暂时失败可继续；决定取消时先标记取消中，再退款、释放库存并记录结果。支付结果未知先查询。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="40" y="52" font-size="30" fill="#0F172A" text-anchor="start" font-weight="700">Saga：记录进度，再选择继续或补偿</text>
<text x="40" y="100" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">教学示例 · 各步骤分别提交本地事务，中间状态可能对外可见。</text>
<rect x="40" y="160" width="245" height="90" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="60" y="195" font-size="25" fill="#2563EB" text-anchor="start" font-weight="700">创建订单</text>
<path d="M287 205 L332 205" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="335" y="160" width="245" height="90" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="355" y="195" font-size="25" fill="#2563EB" text-anchor="start" font-weight="700">预留库存</text>
<path d="M582 205 L627 205" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="630" y="160" width="245" height="90" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="650" y="195" font-size="25" fill="#2563EB" text-anchor="start" font-weight="700">支付成功</text>
<path d="M877 205 L922 205" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="925" y="160" width="245" height="90" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="945" y="195" font-size="25" fill="#2563EB" text-anchor="start" font-weight="700">确认订单</text>
<path d="M1172 205 L1217 205" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1220" y="160" width="245" height="90" rx="12" fill="#EFF6FF" stroke="#059669" stroke-width="2"/>
<text x="1240" y="195" font-size="25" fill="#059669" text-anchor="start" font-weight="700">完成</text>
<path d="M1047 255 L1047 320" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="775" y="330" width="545" height="110" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="795" y="365" font-size="23" fill="#7C3AED" text-anchor="start" font-weight="700">确认失败：先判定结果与业务策略</text>
<text x="795" y="399" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">结果未知 → 查询 / 对账 / 幂等核验</text>
<path d="M775 385 L545 385" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="330" width="500" height="145" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="60" y="365" font-size="23" fill="#059669" text-anchor="start" font-weight="700">正向恢复 · Forward Recovery</text>
<text x="60" y="399" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">保存进度，恢复后继续确认订单。</text>
<text x="60" y="433" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">继续成功后进入完成状态。</text>
<path d="M1047 445 L1047 480" fill="none" stroke="#64748B" stroke-width="2.5"/>
<path d="M1047 480 L200 480" fill="none" stroke="#64748B" stroke-width="2.5"/>
<path d="M200 480 L200 515" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1070" y="480" font-size="21" fill="#D97706" text-anchor="start" font-weight="400">业务决定取消</text>
<rect x="40" y="520" width="325" height="125" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<text x="60" y="555" font-size="22" fill="#D97706" text-anchor="start" font-weight="700">标记取消中</text>
<text x="60" y="589" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">阻止后续确认</text>
<path d="M368 582 L400 582" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="405" y="520" width="325" height="125" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<text x="425" y="555" font-size="22" fill="#D97706" text-anchor="start" font-weight="700">退款</text>
<text x="425" y="589" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">按支付结果执行</text>
<path d="M733 582 L765 582" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="770" y="520" width="325" height="125" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<text x="790" y="555" font-size="22" fill="#D97706" text-anchor="start" font-weight="700">释放库存</text>
<text x="790" y="589" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">返还本次预留</text>
<path d="M1098 582 L1130 582" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1135" y="520" width="325" height="125" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<text x="1155" y="555" font-size="22" fill="#D97706" text-anchor="start" font-weight="700">记录补偿结果</text>
<text x="1155" y="589" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">完成后进入取消终态</text>
<rect x="40" y="705" width="1420" height="120" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<text x="60" y="740" font-size="23" fill="#D97706" text-anchor="start" font-weight="700">反向恢复 · Backward Recovery</text>
<text x="60" y="774" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">按已完成步骤的业务依赖安排补偿；补偿是新事务，失败要持久化进度并重试或转人工。</text>
<rect x="40" y="865" width="1420" height="105" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="60" y="900" font-size="22" fill="#7C3AED" text-anchor="start" font-weight="700">隔离边界：资源预留、状态检查和版本校验可减少干扰；仍不提供全局 ACID 隔离。</text>
<text x="60" y="934" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">依据：Saga 1987 §4—6；订单与取消状态为教学设计。</text>
</g></svg>
