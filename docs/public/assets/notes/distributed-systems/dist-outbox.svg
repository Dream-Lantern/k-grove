<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
<title id="title">Outbox：本地原子边界、发布顺序与消费效果</title><desc id="desc">E2先发、E1后发时，相同Key只是保存错误发布顺序；event_id去重不修复旧版本覆盖。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">Outbox：本地原子边界、发布顺序与消费效果</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">同ID重复、不同ID逆序、业务版本缺口分别验收。</tspan></text><rect x="300" y="130" width="600" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">源数据库同一本地事务</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">订单变更 + event_id/聚合版本/outbox</tspan></text><rect x="300" y="360" width="600" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="397" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">按聚合顺序发布的relay / CDC</tspan></text><text x="600.0" y="434" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">发送成功但进度未记可重发；Key不修复逆序</tspan></text><rect x="300" y="610" width="600" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="647" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">消费数据库同一本地事务</tspan></text><text x="600.0" y="684" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">唯一去重记录 + 业务更新，必须共同提交</tspan></text><rect x="300" y="820" width="600" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="857" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">完成后推进安全位点</tspan></text><text x="600.0" y="894" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">外部HTTP须另有对端幂等或合作协议</tspan></text><path d="M600 250 L600 360" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="527.0" y="296" width="146.0" height="25" fill="white"/><text x="600" y="315" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">只发布已提交意图</tspan></text><path d="M600 480 L600 610" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="476.0" y="541" width="248.0" height="25" fill="white"/><text x="600" y="560" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">可能重复，明确顺序与缺口策略</tspan></text><path d="M600 730 L600 820" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="544.0" y="761" width="112.0" height="25" fill="white"/><text x="600" y="780" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">业务效果完成</tspan></text><text x="600.0" y="980" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">E2先发、E1后发时，相同Key只是保存错误发布顺序；event_id去重不修复旧版本覆盖。</tspan></text></g></svg>