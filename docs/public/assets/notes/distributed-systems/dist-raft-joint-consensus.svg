<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
<title id="title">Raft 2014：配置追加生效与变更完成分属不同时点</title><desc id="desc">遵循论文第 6 节，节点以本地日志中最新配置决策，配置条目尚未提交也一样。联合配置提交须新旧双多数，新配置提交后变更完成。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="40" y="53" font-size="30" fill="#0F172A" text-anchor="start" font-weight="700">Raft 2014：配置追加生效与变更完成分属不同时点</text>
<text x="40" y="100" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">规则来源：2014 论文 §6；不据此推导所有实现 API 的生效时点。</text>
<rect x="40" y="145" width="360" height="130" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="60" y="180" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">C_old = {A, B, C}</text>
<text x="60" y="214" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">旧多数：至少 2 / 3</text>
<rect x="470" y="145" width="460" height="130" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="490" y="180" font-size="23" fill="#7C3AED" text-anchor="start" font-weight="700">C_old,new</text>
<text x="490" y="214" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">旧侧 ≥ 2 / 3 且新侧 ≥ 2 / 3</text>
<rect x="1000" y="145" width="360" height="130" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="1020" y="180" font-size="23" fill="#059669" text-anchor="start" font-weight="700">C_new = {C, D, E}</text>
<text x="1020" y="214" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">新多数：至少 2 / 3</text>
<path d="M408 210 L455 210" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M938 210 L985 210" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="330" width="1320" height="95" rx="12" fill="#F8FAFC" stroke="#7C3AED" stroke-width="2"/>
<text x="65" y="366" font-size="24" fill="#7C3AED" text-anchor="start" font-weight="700">1 · 追加联合配置</text>
<text x="65" y="403" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">收到条目的节点立即按联合配置决策；未收到者可能仍用旧配置。</text>
<rect x="40" y="448" width="1320" height="95" rx="12" fill="#F8FAFC" stroke="#7C3AED" stroke-width="2"/>
<text x="65" y="484" font-size="24" fill="#7C3AED" text-anchor="start" font-weight="700">2 · 提交联合配置</text>
<text x="65" y="521" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">确认旧、新各自多数后，才可提出 C_new 条目。</text>
<rect x="40" y="566" width="1320" height="95" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/>
<text x="65" y="602" font-size="24" fill="#2563EB" text-anchor="start" font-weight="700">3 · 追加新配置</text>
<text x="65" y="639" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">收到 C_new 的节点立即用新配置；此条目按新多数提交。</text>
<rect x="40" y="684" width="1320" height="95" rx="12" fill="#F8FAFC" stroke="#059669" stroke-width="2"/>
<text x="65" y="720" font-size="24" fill="#059669" text-anchor="start" font-weight="700">4 · 提交新配置</text>
<text x="65" y="757" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">变更完成；旧配置独有成员可退出，被移除的 Leader 此时退下。</text>
<rect x="40" y="835" width="640" height="115" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="60" y="870" font-size="23" fill="#059669" text-anchor="start" font-weight="700">Q = {A, C, D}：满足双多数</text>
<text x="60" y="904" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">旧侧 A、C；新侧 C、D。</text>
<rect x="720" y="835" width="640" height="115" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
<text x="740" y="870" font-size="23" fill="#DC2626" text-anchor="start" font-weight="700">Q = {A, B, D}：不满足双多数</text>
<text x="740" y="904" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">虽有 3 / 5，新侧却只有 D。</text>
<text x="40" y="1007" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">Learner 可先追赶，但晋升前不计入投票多数；追加、提交、完成不能混为一谈。</text>
</g></svg>
