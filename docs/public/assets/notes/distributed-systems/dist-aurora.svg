<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">Aurora 2017：计算与存储故障域分开</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">三个 AZ、每个保护组六份存储副本；不是六个数据库写实例。</tspan></text><rect x="410" y="145" width="380" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="182" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">数据库计算实例</tspan></text><text x="600.0" y="219" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">事务 / 缓冲 / 生成 redo</tspan></text><rect x="40" y="440" width="340" height="160" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="210.0" y="477" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="210.0" dy="0">AZ A</tspan></text><text x="210.0" y="514" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="210.0" dy="0">存储副本 A1 / A2</tspan></text><rect x="430" y="440" width="340" height="160" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="477" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">AZ B</tspan></text><text x="600.0" y="514" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">存储副本 B1 / B2</tspan></text><rect x="820" y="440" width="340" height="160" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="990.0" y="477" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="990.0" dy="0">AZ C</tspan></text><text x="990.0" y="514" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="990.0" dy="0">存储副本 C1 / C2</tspan></text><path d="M500 255 L500 340 L210 340 L210 440" fill="none" stroke="#0369A1" stroke-width="2"