<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">最高已见令牌：资源观察新代际后才拒旧</title><desc id="desc">同令牌重试仍需幂等；客户端先检查锁再写不能消除检查到使用的窗口。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">最高已见令牌：资源观察新代际后才拒旧</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">令牌发放发生在协调端；资源端的原子校验、记录与写入另有时间点。</tspan></text><rect x="50" y="160" width="500" height="140" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="300.0" y="197" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="300.0" dy="0">情景A：资源已建立token=42</tspan></text><text x="300.0" y="234" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="300.0" dy="0">B已用42写入/建立屏障</tspan><tspan x="300.0" dy="30">maxSeen=42；A携41必被拒绝</tspan></text><rect x="650" y="160" width="500" height="140" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="900.0" y="197" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="900.0" dy="0">情景B：42仅在协调端发放</tspan></text><text x="900.0" y="234" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="900.0" dy="0">B尚未把42送到资源</tspan><tspan x="900.0" dy="30">maxSeen=41；A携41仍可能被接受</tspan></text><rect x="290" y="520" width="620" height="160" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="557" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">若要求“交接完成即拒绝旧写”</tspan></text><text x="600.0" y="594" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">在资源端建立并确认代际屏障再宣布交接完成</tspan><tspan x="600.0" dy="30">校验token、记录代际和业务写入在共同原子边界</tspan></text><path d="M300 300 L300 410 L470 410 L470 520" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="264.0" y="376" width="112.0" height="25" fill="white"/><text x="320" y="395" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="320" dy="0">比较保证范围</tspan></text><path d="M900 300 L900 410 L730 410 L730 520" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="827.0" y="376" width="146.0" height="25" fill="white"/><text x="900" y="395" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="900" dy="0">反例要求额外协议</tspan></text><text x="600.0" y="870" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">同令牌重试仍需幂等；客户端先检查锁再写不能消除检查到使用的窗口。</tspan></text></g></svg>