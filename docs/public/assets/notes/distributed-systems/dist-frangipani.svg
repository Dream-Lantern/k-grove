<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
<title id="title">Frangipani 1997：锁协议与Petal I-O分开</title><desc id="desc">I-O响应省略；租约检查到存储收到写之间的窗口，不靠通知天然消失。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">Frangipani 1997：锁协议与Petal I-O分开</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">文字和线型共同说明方向；同色不代表同一种操作。</tspan></text><rect x="30" y="140" width="510" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="285.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="285.0" dy="0">文件服务器A</tspan></text><text x="285.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="285.0" dy="0">本地缓存 / 锁状态</tspan></text><rect x="660" y="140" width="510" height="120" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="915.0" y="177" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="915.0" dy="0">文件服务器B</tspan></text><text x="915.0" y="214" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="915.0" dy="0">本地缓存 / 锁状态</tspan></text><rect x="30" y="620" width="510" height="150" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="285.0" y="657" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="285.0" dy="0">分布式锁服务</tspan></text><text x="285.0" y="694" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="285.0" dy="0">授予、撤回与恢复协调</tspan></text><rect x="660" y="620" width="510" height="150" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="915.0" y="657" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="915.0" dy="0">Petal共享虚拟磁盘</tspan></text><text x="915.0" y="694" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="915.0" dy="0">数据与各服务器的私有元数据日志</tspan></text><path d="M170 260 L170 620" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="139.5" y="396" width="61.0" height="25" fill="white"/><text x="170" y="415" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="170" dy="0">锁请求</tspan></text><path d="M380 620 L380 260" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="320.5" y="496" width="119.0" height="25" fill="white"/><text x="380" y="515" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="380" dy="0">授予/撤回通知</tspan></text><path d="M760 260 L760 375 L500 375 L500 620" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="579.5" y="336" width="61.0" height="25" fill="white"/><text x="610" y="355" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="610" dy="0">锁协议</tspan></text><path d="M500 260 L500 490 L790 490 L790 620" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="594.5" y="451" width="111.0" height="25" fill="white"/><text x="650" y="470" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="650" dy="0">数据/日志I-O</tspan></text><path d="M1040 260 L1040 620" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="984.5" y="421" width="111.0" height="25" fill="white"/><text x="1040" y="440" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="1040" dy="0">数据/日志I-O</tspan></text><text x="600.0" y="920" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">I-O响应省略；租约检查到存储收到写之间的窗口，不靠通知天然消失。</tspan></text></g></svg>