<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">ZooKeeper：客户端、读服务与有序写入</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">ZooKeeper：客户端、读服务与有序写入</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">写入通过 Zab 路线协调；并不是底层运行 Raft。</tspan></text><rect x="430" y="135" width="340" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="172" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">客户端会话</tspan></text><text x="600.0" y="209" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">重连 / 版本 / Watch</tspan></text><rect x="100" y="360" width="400" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="300.0" y="397" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="300.0" dy="0">连接到的服务节点</tspan></text><text x="300.0" y="434" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="300.0" dy="0">本地服务适用读请求</tspan></text><rect x="700" y="360" width="400" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="900.0" y="397" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="900.0" dy="0">Leader 与 Zab</tspan></text><text x="900.0" y="434" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="900.0" dy="0">有序协调写入</tspan></text><rect x="430" y="615" width="340" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="652" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">投票副本集合</tspan></text><text x="600.0" y="689" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">按有效配置形成 quorum</tspan></text><path d="M520 245 L520 295 L300 295 L300 360" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 415 L700 415" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M900 470 L900 550 L600 550 L600 615" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600.0" y="812" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">单客户端顺序、写入顺序与跨客户端实时读取，不能混为一项保证。</tspan></text></g></svg>