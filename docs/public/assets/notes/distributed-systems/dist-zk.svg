<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1500" viewBox="0 0 1400 1500" role="img" aria-labelledby="title desc">
<title id="title">ZooKeeper 3.9.3：普通读与 Zab 写入路径</title><desc id="desc">三个投票成员 A B C，Observer O 不投票。写经 Leader 的 Proposal ACK COMMIT 路径，普通读在连接节点服务；领导者切换先完成历史同步与激活。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="40" y="52" font-size="30" fill="#0F172A" text-anchor="start" font-weight="700">ZooKeeper 3.9.3：普通读与 Zab 写入路径</text>
<text x="40" y="100" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">教学部署：投票成员 A、B、C，Quorum = 2 / 3；另有 Observer O，不计入多数。</text>
<rect x="20" y="145" width="280" height="100" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="40" y="180" font-size="22" fill="#2563EB" text-anchor="start" font-weight="700">Client</text>
<text x="40" y="214" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">连接 B</text>
<path d="M160 250 L160 1030" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-dasharray="7 6"/>
<rect x="370" y="145" width="280" height="100" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="390" y="180" font-size="22" fill="#2563EB" text-anchor="start" font-weight="700">B · Follower</text>
<text x="390" y="214" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">服务本地读</text>
<path d="M510 250 L510 1030" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-dasharray="7 6"/>
<rect x="720" y="145" width="280" height="100" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="740" y="180" font-size="22" fill="#2563EB" text-anchor="start" font-weight="700">A · Leader</text>
<text x="740" y="214" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">已完成激活</text>
<path d="M860 250 L860 1030" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-dasharray="7 6"/>
<rect x="1070" y="145" width="280" height="100" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="1090" y="180" font-size="22" fill="#2563EB" text-anchor="start" font-weight="700">C · Follower</text>
<text x="1090" y="214" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">参与复制</text>
<path d="M1210 250 L1210 1030" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-dasharray="7 6"/>
<path d="M160 310 L510 310" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="335.0" y="297" font-size="21" fill="#2563EB" text-anchor="middle" font-weight="400">普通读请求</text>
<path d="M510 375 L160 375" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="335.0" y="362" font-size="21" fill="#2563EB" text-anchor="middle" font-weight="400">B 的本地视图（可落后）</text>
<path d="M160 470 L510 470" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="335.0" y="457" font-size="21" fill="#2563EB" text-anchor="middle" font-weight="400">1 · 写请求</text>
<path d="M510 535 L860 535" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="685.0" y="522" font-size="21" fill="#2563EB" text-anchor="middle" font-weight="400">2 · 转交 Leader</text>
<path d="M860 610 L510 610" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="685.0" y="597" font-size="21" fill="#2563EB" text-anchor="middle" font-weight="400">3 · Proposal / zxid (3,10)</text>
<path d="M860 675 L1210 675" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1035.0" y="662" font-size="21" fill="#2563EB" text-anchor="middle" font-weight="400">同序发送 Proposal</text>
<path d="M510 750 L860 750" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="685.0" y="737" font-size="21" fill="#7C3AED" text-anchor="middle" font-weight="400">4 · B 持久记录后 ACK</text>
<text x="875" y="795" font-size="19" fill="#059669" text-anchor="start" font-weight="400">A + B 满足多数；C 可稍后追赶</text>
<path d="M860 850 L510 850" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="685.0" y="837" font-size="21" fill="#059669" text-anchor="middle" font-weight="400">5 · COMMIT，按序提交 / 应用</text>
<path d="M860 915 L1210 915" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1035.0" y="902" font-size="21" fill="#059669" text-anchor="middle" font-weight="400">COMMIT，按序应用</text>
<path d="M510 995 L160 995" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="335.0" y="982" font-size="21" fill="#059669" text-anchor="middle" font-weight="400">6 · 返回操作结果</text>
<rect x="40" y="1070" width="1320" height="100" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="60" y="1105" font-size="22" fill="#7C3AED" text-anchor="start" font-weight="700">Observer O：可连接客户端、服务普通读并转交写请求。</text>
<text x="60" y="1139" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">O 学习提交结果，不参与普通投票 Quorum；图中复制时序只画投票成员。</text>
<rect x="40" y="1210" width="1320" height="220" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<text x="60" y="1245" font-size="22" fill="#D97706" text-anchor="start" font-weight="700">Leader 故障后的激活：先建立正确历史，再接受新写入</text>
<text x="60" y="1279" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">A 故障 → B 经合法选举当选 → 同步包含已提交 (3,10) 的历史</text>
<text x="60" y="1313" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">缺失历史：补提案或快照；迟到成员的未提交冲突后缀：按恢复协议丢弃</text>
<text x="60" y="1347" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">完成历史同步后确认 NEW_LEADER → 适用 Quorum 提交它 → 进入正常广播</text>
<text x="60" y="1381" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">本例新 epoch = 4，正常事务可从 (4,1) 继续；当选不等于已激活。</text>
<text x="40" y="1470" font-size="20" fill="#0F172A" text-anchor="start" font-weight="400">依据：3.9.3 Internals；这是协议教学时序，不是完整网络报文字段或实测抓包。</text>
</g></svg>
