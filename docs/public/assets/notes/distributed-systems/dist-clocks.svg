<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<!-- 原生可编辑 SVG 即图源；直接编辑本文件，无独立生成产物。 -->
<title id="title">Lamport 时钟：因果链与独立事件</title><desc id="desc">三个进程 A、B、C，时钟初值为零。a1 创建订单为 1，a2 发送消息为 2，b1 接收消息为 3，b2 预留库存为 4；c1 独立查询为 1，与上述链并发。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7C3AED"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#D97706"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#DC2626"/></marker>
</defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="32" y="45" font-size="27" fill="#2563EB" text-anchor="start" font-weight="600">Lamport 时钟：因果链与独立事件</text>
<text x="32" y="80" font-size="18" fill="#0F172A" text-anchor="start">教学示例；横向展示进程内顺序，不表示统一物理时间。初始时钟均为 0。</text>
<rect x="35" y="155" width="110" height="60" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="90" y="193" font-size="23" fill="#2563EB" text-anchor="middle" font-weight="600">进程 A</text>
<path d="M160 185H1140" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#blue)"/>
<rect x="35" y="305" width="110" height="60" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="90" y="343" font-size="23" fill="#2563EB" text-anchor="middle" font-weight="600">进程 B</text>
<path d="M160 335H1140" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#blue)"/>
<rect x="35" y="435" width="110" height="60" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="90" y="473" font-size="23" fill="#2563EB" text-anchor="middle" font-weight="600">进程 C</text>
<path d="M160 465H1140" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#blue)"/>
<path d="M520 185L730 335" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#purple)"/>
<text x="690" y="238" font-size="19" fill="#7C3AED" text-anchor="middle">消息携带 t=2</text>
<circle cx="270" cy="185" r="7" fill="#2563EB"/>
<text x="270" y="160" font-size="19" fill="#2563EB" text-anchor="middle" font-weight="600">a1 创建订单</text>
<text x="270" y="225" font-size="19" fill="#2563EB" text-anchor="middle">L=1</text>
<circle cx="520" cy="185" r="7" fill="#2563EB"/>
<text x="520" y="160" font-size="19" fill="#2563EB" text-anchor="middle" font-weight="600">a2 发送消息</text>
<text x="520" y="225" font-size="19" fill="#2563EB" text-anchor="middle">L=2</text>
<circle cx="730" cy="335" r="7" fill="#7C3AED"/>
<text x="805" y="310" font-size="19" fill="#7C3AED" text-anchor="middle" font-weight="600">b1 接收消息</text>
<text x="730" y="375" font-size="19" fill="#7C3AED" text-anchor="middle">max(0,2)+1=3</text>
<circle cx="1020" cy="335" r="7" fill="#2563EB"/>
<text x="1020" y="310" font-size="19" fill="#2563EB" text-anchor="middle" font-weight="600">b2 预留库存</text>
<text x="1020" y="375" font-size="19" fill="#2563EB" text-anchor="middle">L=4</text>
<circle cx="430" cy="465" r="7" fill="#059669"/>
<text x="430" y="440" font-size="19" fill="#059669" text-anchor="middle" font-weight="600">c1 独立查询</text>
<text x="430" y="505" font-size="19" fill="#059669" text-anchor="middle">L=1</text>
<text x="680" y="510" font-size="19" fill="#059669" text-anchor="start">C 与 A、B 无消息或其他因果路径</text>
<text x="40" y="560" font-size="20" fill="#0F172A" text-anchor="start">因果：a1 → a2 → b1 → b2；c1 与这条链上的事件并发。</text>
<text x="40" y="595" font-size="19" fill="#0F172A" text-anchor="start">L(c1) &lt; L(b1)，仍不能推出 c1 → b1；并发也不要求物理时间完全同时。</text>
</g></svg>
