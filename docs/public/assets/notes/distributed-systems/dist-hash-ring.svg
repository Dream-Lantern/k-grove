<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<!-- 原生可编辑 SVG 即维护图源；图中的数字为教学推演。 -->
<title id="title">一致性哈希：三台物理机器扩为四台，只改变部分键的归属</title><desc id="desc">0 到 99 顺时针递增，99 后回到 0。A 在 10、70；B 在 30、85；C 在 50、95。新增 D 在 40、80；接管 (30,40] 与 (70,80]。八个示例键中只有 k35、k75 迁移。虚拟位置不是副本。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C3AED"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#D97706"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#DC2626"/></marker>
</defs><rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="32" y="47" font-size="28" fill="#2563EB" text-anchor="start" font-weight="600">一致性哈希：三台物理机器扩为四台，只改变部分键的归属</text>
<text x="32" y="85" font-size="21" fill="#0F172A" text-anchor="start">教学环：位置 0～99，键归属顺时针第一个令牌。每台物理机器有两个虚拟位置；不展示数据副本。</text>
<rect x="40" y="130" width="740" height="700" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="410" y="171" font-size="24" fill="#2563EB" text-anchor="middle" font-weight="600">扩容前：A、B、C，六个虚拟位置</text>
<circle cx="410" cy="490" r="195" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
<path d="M595.46 550.26A195 195 0 0 1 524.62 647.76" fill="none" stroke="#D97706" stroke-width="16"/>
<path d="M224.54 550.26A195 195 0 0 1 224.54 429.74" fill="none" stroke="#D97706" stroke-width="16"/>
<path d="M430.09 428.18A65 65 0 0 1 473.85 502.18" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#blue)"/>
<text x="410" y="498" font-size="21" fill="#2563EB" text-anchor="middle" font-weight="600">顺时针</text>
<text x="410" y="527" font-size="17" fill="#0F172A" text-anchor="middle">0 → 99 → 0</text>
<text x="410" y="270" font-size="18" fill="#0F172A" text-anchor="middle">0</text>
<circle cx="524.62" cy="332.24" r="9" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
<text x="562.82" y="286.66" font-size="20" fill="#2563EB" text-anchor="start" font-weight="600">A1=10</text>
<circle cx="595.46" cy="550.26" r="9" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
<text x="657.27" y="577.34" font-size="20" fill="#7C3AED" text-anchor="start" font-weight="600">B1=30</text>
<circle cx="410.00" cy="685.00" r="9" fill="#059669" stroke="#FFFFFF" stroke-width="2"/>
<text x="410.0" y="757.0" font-size="20" fill="#059669" text-anchor="middle" font-weight="600">C1=50</text>
<circle cx="224.54" cy="550.26" r="9" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
<text x="162.73" y="577.34" font-size="20" fill="#2563EB" text-anchor="end" font-weight="600">A2=70</text>
<circle cx="252.24" cy="375.38" r="9" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
<text x="199.66" y="344.18" font-size="20" fill="#7C3AED" text-anchor="end" font-weight="600">B2=85</text>
<circle cx="349.74" cy="304.54" r="9" fill="#059669" stroke="#FFFFFF" stroke-width="2"/>
<text x="329.66" y="249.73" font-size="20" fill="#059669" text-anchor="end" font-weight="600">C2=95</text>
<circle cx="457.90" cy="342.59" r="5" fill="#0F172A" stroke="#FFFFFF" stroke-width="2"/>
<text x="447" y="382" font-size="18" fill="#0F172A" text-anchor="middle">k05</text>
