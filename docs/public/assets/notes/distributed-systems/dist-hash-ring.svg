<path d="M457.90 637.41L466.55 664.04" fill="none" stroke="#0F172A" stroke-width="1" stroke-dasharray="3 4"/>
<circle cx="318.89" cy="615.40" r="5" fill="#0F172A" stroke="#FFFFFF" stroke-width="2"/>
