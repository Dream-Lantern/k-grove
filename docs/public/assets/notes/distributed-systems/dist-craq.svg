<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<title id="title">CRAQ：写传播与读选择是两条不同路径</title><desc id="desc">写v6在途时dirty读可返回Tail确认的v5；clean读后不会继续执行dirty查询。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">CRAQ：写传播与读选择是两条不同路径</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">上半部写入及反向确认；下半部读取时只选择clean或dirty中的一条。</tspan></text><rect x="40" y="135" width="320" height="105" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="200.0" y="172" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="200.0" dy="0">Head</tspan></text><text x="200.0" y="209" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="200.0" dy="0">接收新版本v6，标dirty</tspan></text><rect x="440" y="135" width="320" height="105" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="172" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">中间节点</tspan></text><text x="600.0" y="209" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">转发v6，标dirty</tspan></text><rect x="840" y="135" width="320" height="105" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="1000.0" y="172" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="1000.0" dy="0">Tail</tspan></text><text x="1000.0" y="209" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="1000.0" dy="0">提交v6</tspan></text><polygon points="600.0,465 800,525.0 600.0,585 400,525.0" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="532.0" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="600"><tspan x="600.0" dy="0">本地对象clean？</tspan></text><rect x="50" y="760" width="430" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="265.0" y="797" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="265.0" dy="0">本地返回clean版本</tspan></text><text x="265.0" y="834" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="265.0" dy="0">有效配置下直接读</tspan></text><rect x="720" y="700" width="430" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="935.0" y="737" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="935.0" dy="0">向Tail询问已提交版本号</tspan></text><text x="935.0" y="774" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="935.0" dy="0">例如Tail仍确认v5</tspan></text><rect x="720" y="880" width="430" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="935.0" y="917" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="935.0" dy="0">本地返回该版本</tspan></text><text x="935.0" y="954" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="935.0" dy="0">保留必要旧版本，不返回未确认v6</tspan></text><path d="M360 170 L440 170" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="377.0" y="126" width="46.0" height="25" fill="white"/><text x="400" y="145" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="400" dy="0">写v6</tspan></text><path d="M760 170 L840 170" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="777.0" y="126" width="46.0" height="25" fill="white"/><text x="800" y="145" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="800" dy="0">写v6</tspan></text><path d="M1000 240 L1000 325 L200 325 L200 240" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="454.5" y="291" width="291.0" height="25" fill="white"/><text x="600" y="310" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">提交确认逐跳返回：对应版本变clean</tspan></text><path d="M400 525 L265 525 L265 760" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="251.5" y="631" width="27.0" height="25" fill="white"/><text x="265" y="650" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="265" dy="0">是</tspan></text><path d="M800 525 L935 525 L935 700" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="869.0" y="606" width="132.0" height="25" fill="white"/><text x="935" y="625" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="935" dy="0">否：有dirty版本</tspan></text><path d="M935 810 L935 880" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="975.5" y="836" width="129.0" height="25" fill="white"/><text x="1040" y="855" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="1040" dy="0">获知已提交版本</tspan></text><text x="600.0" y="1030" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">写v6在途时dirty读可返回Tail确认的v5；clean读后不会继续执行dirty查询。</tspan></text></g></svg>