<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<!-- 原生可编辑 SVG 即维护图源；图中的数字为教学推演。 -->
<title id="title">CAP：2+1 分区下，先声明操作契约</title><desc id="desc">三节点 A、B 与 C 发生网络分区。对强一致库存，多数侧在协议条件满足时继续，少数侧不能独立提交；对允许合并的购物车添加，两侧记录更新，恢复后合并。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C3AED"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#D97706"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#DC2626"/></marker>
</defs><rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="32" y="47" font-size="28" fill="#2563EB" text-anchor="start" font-weight="600">CAP：2+1 分区下，先声明操作契约</text>
<text x="32" y="84" font-size="18" fill="#0F172A" text-anchor="start">教学示例；不是所有请求只能在等待与返回旧值之间二选一。</text>
<rect x="55" y="120" width="570" height="240" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
<rect x="800" y="120" width="345" height="240" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
<text x="80" y="155" font-size="22" fill="#2563EB" text-anchor="start" font-weight="600">多数侧：2 / 3</text>
<text x="825" y="155" font-size="22" fill="#D97706" text-anchor="start" font-weight="600">少数侧：1 / 3</text>
<rect x="150" y="195" width="120" height="85" rx="10" fill="#FFFFFF" stroke="#2563EB"/>
<text x="210" y="248" font-size="29" fill="#2563EB" text-anchor="middle" font-weight="600">A</text>
<rect x="405" y="195" width="120" height="85" rx="10" fill="#FFFFFF" stroke="#2563EB"/>
<text x="465" y="248" font-size="29" fill="#2563EB" text-anchor="middle" font-weight="600">B</text>
<rect x="910" y="195" width="120" height="85" rx="10" fill="#FFFFFF" stroke="#2563EB"/>
<text x="970" y="248" font-size="29" fill="#2563EB" text-anchor="middle" font-weight="600">C</text>
<path d="M270 237H405" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#blue)"/>
<path d="M405 250H270" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#blue)"/>
<path d="M625 240H800" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="8 6"/>
<text x="712" y="213" font-size="22" fill="#DC2626" text-anchor="middle" font-weight="600">× 分区</text>
<text x="712" y="281" font-size="18" fill="#DC2626" text-anchor="middle">消息不通</text>
<text x="80" y="325" font-size="19" fill="#0F172A" text-anchor="start">互通、满足协议条件时可取得多数确认</text>
<text x="825" y="325" font-size="18" fill="#0F172A" text-anchor="start">进程仍活着，但联系不到多数</text>
<rect x="35" y="400" width="1130" height="180" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="55" y="435" font-size="23" fill="#2563EB" text-anchor="start" font-weight="600">契约一：强一致库存预留（CP 取向）</text>
<text x="75" y="480" font-size="20" fill="#0F172A" text-anchor="start">A、B：领导者有效、日志规则满足时</text>
<text x="75" y="515" font-size="20" fill="#059669" text-anchor="start">可继续提交扣减；强读也需协议检查。</text>
<text x="700" y="480" font-size="20" fill="#0F172A" text-anchor="start">C：不能独立提交同等保证的写入；</text>
<text x="700" y="515" font-size="20" fill="#D97706" text-anchor="start">可拒绝、等待或重定向，非完成该读写。</text>
<text x="55" y="555" font-size="18" fill="#0F172A" text-anchor="start">牺牲的是所有非故障节点都完成这类请求的保证，不是多数侧也必须停止服务。</text>
<rect x="35" y="610" width="1130" height="180" rx="10" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="55" y="645" font-size="23" fill="#7C3AED" text-anchor="start" font-weight="600">契约二：允许并发合并的购物车添加（AP 取向）</text>
<text x="75" y="690" font-size="20" fill="#7C3AED" text-anchor="start">A、B：先记录“添加笔”</text>
<text x="700" y="690" font-size="20" fill="#7C3AED" text-anchor="start">C：先记录“添加灯”</text>
<path d="M340 704V735H735V704" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#purple)"/>
<text x="530" y="765" font-size="19" fill="#7C3AED" text-anchor="middle">连接恢复后传播版本、合并意图并修复副本</text>
<text x="35" y="835" font-size="19" fill="#0F172A" text-anchor="start">上述两行是不同操作契约；购物车允许中间差异，不能冒充实时最新的寄存器。</text>
<text x="35" y="873" font-size="18" fill="#0F172A" text-anchor="start">错误响应是否完成操作，要按接口规范判断；CAP 理论可用性也不等于业务 SLA。</text>
</g></svg>
