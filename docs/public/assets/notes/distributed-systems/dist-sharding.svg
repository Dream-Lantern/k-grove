<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<!-- 原生可编辑 SVG 即维护图源；图中的数字为教学推演。 -->
<title id="title">数据迁移：复制完成后，再切换写入资格</title><desc id="desc">教学方案：S 是代际 e 的单一写入所有者，T 接收快照及增量。排空旧写并确认 T 到 b1 后，隔离旧资格，发布 T 的 e+1 所有权，处理旧路由，观察后回收。未确认边界不得切换。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C3AED"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#D97706"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#DC2626"/></marker>
</defs><rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="32" y="47" font-size="28" fill="#2563EB" text-anchor="start" font-weight="600">数据迁移：复制完成后，再切换写入资格</text>
<text x="32" y="83" font-size="18" fill="#0F172A" text-anchor="start">单一写入所有者 + 快照 + 增量日志 + 短暂停写；不是所有系统的通用实现。</text>
<rect x="65" y="120" width="820" height="92" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
<text x="88" y="154" font-size="22" fill="#2563EB" text-anchor="start" font-weight="600">1  确定所有权与代际</text>
<text x="88" y="189" font-size="18" fill="#0F172A" text-anchor="start">源 S 持有 e；新节点 T 仅接收迁移数据</text>
<path d="M475 212V241" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#blue)"/>
<rect x="65" y="241" width="820" height="92" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
<text x="88" y="275" font-size="22" fill="#2563EB" text-anchor="start" font-weight="600">2  复制 b0 边界的存量快照</text>
<text x="88" y="310" font-size="18" fill="#0F172A" text-anchor="start">先保留 b0 后的增量，再开始复制，避免捕获缺口</text>
<path d="M475 333V362" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#blue)"/>
<rect x="65" y="362" width="820" height="92" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
<text x="88" y="396" font-size="22" fill="#2563EB" text-anchor="start" font-weight="600">3  捕获并重放增量</text>
<text x="88" y="431" font-size="18" fill="#0F172A" text-anchor="start">业务仍写 S；新增、修改、删除按序且可去重地应用到 T</text>
<path d="M475 454V483" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#blue)"/>
<rect x="65" y="483" width="820" height="92" rx="10" fill="#F5F3FF" stroke="#7C3AED"/>
<text x="88" y="517" font-size="22" fill="#7C3AED" text-anchor="start" font-weight="600">4  排空旧写，确认边界 b1</text>
<text x="88" y="552" font-size="18" fill="#0F172A" text-anchor="start">短暂停写并排空在途写；确认 T 已应用到 b1</text>
<path d="M475 575V604" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#blue)"/>
<rect x="65" y="604" width="820" height="92" rx="10" fill="#F5F3FF" stroke="#7C3AED"/>
<text x="88" y="638" font-size="22" fill="#7C3AED" text-anchor="start" font-weight="600">5  发布新所有权并切换路由</text>
<text x="88" y="673" font-size="18" fill="#0F172A" text-anchor="start">先隔离旧资格；发布 T / e+1，T 才开放业务写入</text>
<path d="M475 696V725" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#blue)"/>
<rect x="65" y="725" width="820" height="92" rx="10" fill="#EFF6FF" stroke="#2563EB"/>
<text x="88" y="759" font-size="22" fill="#2563EB" text-anchor="start" font-weight="600">6  处理旧客户端和迟到请求</text>
<text x="88" y="794" font-size="18" fill="#0F172A" text-anchor="start">S 拒绝或有限转发；写入资源检查代际，客户端刷新路由</text>
<path d="M475 817V846" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#blue)"/>
<rect x="65" y="846" width="820" height="92" rx="10" fill="#ECFDF5" stroke="#059669"/>
<text x="88" y="880" font-size="22" fill="#059669" text-anchor="start" font-weight="600">7  观察后回收旧数据</text>
<text x="88" y="915" font-size="18" fill="#0F172A" text-anchor="start">确认新数据与恢复能力；切换后新写不能被旧快照覆盖</text>
<rect x="930" y="450" width="230" height="155" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
<text x="948" y="483" font-size="21" fill="#D97706" text-anchor="start" font-weight="600">b1 未确认？</text>
<text x="948" y="520" font-size="18" fill="#0F172A" text-anchor="start">保持隔离，修复或追赶</text>
<text x="948" y="554" font-size="18" fill="#0F172A" text-anchor="start">确认前不发布新所有权</text>
<path d="M885 529H930" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#orange)"/>
<text x="65" y="1015" font-size="18" fill="#0F172A" text-anchor="start">回退也是一次有版本的迁移：先补齐切换后的更新，再切回；保留旧数据不等于可以直接覆盖。</text>
</g></svg>
