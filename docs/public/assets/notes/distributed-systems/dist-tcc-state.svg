<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
<title id="title">TCC：同一预留只能确认或取消一次</title><desc id="desc">库存教学状态机，事务ID和分支ID持久化；展示重复操作、空回滚和迟到Try的拒绝路径。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#64748B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, sans-serif" fill="#0F172A">
<text x="40" y="52" font-size="30" fill="#0F172A" text-anchor="start" font-weight="700">TCC：同一预留只能确认或取消一次</text>
<text x="40" y="100" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">教学分支键：(transaction_id, branch_id)；控制状态与库存修改在同一本地事务中提交。</text>
<rect x="40" y="170" width="350" height="145" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="60" y="205" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">初始 · 无分支记录</text>
<text x="60" y="239" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">available=10 / reserved=0</text>
<text x="60" y="273" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">sold=0</text>
<rect x="575" y="170" width="350" height="145" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="595" y="205" font-size="23" fill="#2563EB" text-anchor="start" font-weight="700">TRIED · 已预留</text>
<text x="595" y="239" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">available=8 / reserved=2</text>
<text x="595" y="273" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">sold=0</text>
<path d="M395 240 L570 240" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="482.5" y="227" font-size="21" fill="#2563EB" text-anchor="middle" font-weight="400">Try 2 件</text>
<rect x="1100" y="170" width="350" height="145" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="1120" y="205" font-size="23" fill="#059669" text-anchor="start" font-weight="700">CONFIRMED · 已确认</text>
<text x="1120" y="239" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">available=8 / reserved=0</text>
<text x="1120" y="273" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">sold=2</text>
<path d="M930 240 L1095 240" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1012.5" y="227" font-size="21" fill="#059669" text-anchor="middle" font-weight="400">Confirm</text>
<rect x="575" y="450" width="350" height="145" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<text x="595" y="485" font-size="23" fill="#D97706" text-anchor="start" font-weight="700">CANCELLED · 已取消</text>
<text x="595" y="519" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">available=10 / reserved=0</text>
<text x="595" y="553" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">sold=0</text>
<path d="M750 320 L750 445" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="770" y="395" font-size="22" fill="#D97706" text-anchor="start" font-weight="400">Cancel（与 Confirm 二选一）</text>
<rect x="40" y="450" width="350" height="145" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
<text x="60" y="485" font-size="22" fill="#D97706" text-anchor="start" font-weight="700">取消标记 · 无成功 Try</text>
<text x="60" y="519" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">库存保持初始值</text>
<text x="60" y="553" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">持久保存取消决定</text>
<path d="M215 320 L215 445" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="380" font-size="21" fill="#D97706" text-anchor="start" font-weight="400">Cancel 先到：空回滚</text>
<rect x="40" y="680" width="650" height="140" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
<text x="60" y="715" font-size="23" fill="#DC2626" text-anchor="start" font-weight="700">空回滚 ≠ 悬挂</text>
<text x="60" y="749" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">空回滚：Cancel 不释放不存在的预留。</text>
<text x="60" y="783" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">悬挂防护：取消后迟到 Try 必须拒绝。</text>
<path d="M215 600 L215 675" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="760" y="680" width="690" height="140" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="780" y="715" font-size="23" fill="#7C3AED" text-anchor="start" font-weight="700">幂等与终态冲突</text>
<text x="780" y="749" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">重复 Try / Confirm / Cancel 不再修改资源。</text>
<text x="780" y="783" font-size="23" fill="#0F172A" text-anchor="start" font-weight="400">已确认后不能再取消；已取消后不能再确认。</text>
<rect x="40" y="875" width="1410" height="170" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="60" y="910" font-size="22" fill="#2563EB" text-anchor="start" font-weight="700">实现条件</text>
<text x="60" y="944" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">唯一分支键 + 持久化状态 + 原子条件转换；协调者可靠保存统一决定。</text>
<text x="60" y="978" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">取消标记保留期覆盖迟到与重试窗口。TCC 是业务预留协议，不等于 XA Prepare。</text>
<text x="60" y="1012" font-size="22" fill="#0F172A" text-anchor="start" font-weight="400">图中状态是教学设计；Seata 1.5.1 TCC Fence 使用其自身状态与配置。</text>
</g></svg>
