<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">同一Offset轴：logStart、LSO、HW、Leader LEO</title><desc id="desc">箭头仅表示Offset递增；没有开放事务时LSO可等于HW。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">同一Offset轴：logStart、LSO、HW、Leader LEO</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">统一排他上界；示例边界为0、6、10、12，空洞不等于未完成业务条数。</tspan></text><rect x="90" y="250" width="510" height="150" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="345.0" y="287" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="345.0" dy="0">[0,6) 稳定前缀</tspan></text><text x="345.0" y="324" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="345.0" dy="0">read_committed过滤已中止事务</tspan></text><rect x="600" y="250" width="340" height="150" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="770.0" y="287" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="770.0" dy="0">[6,10) 受事务阻挡</tspan></text><text x="770.0" y="324" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="770.0" dy="0">尚不能越过开放事务</tspan></text><rect x="940" y="250" width="170" height="150" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="1025.0" y="287" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="1025.0" dy="0">[10,12)</tspan></text><text x="1025.0" y="324" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="1025.0" dy="0">未达HW</tspan></text><path d="M70 500 L1150 500" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><circle cx="345" cy="500" r="7" fill="white" stroke="#0369A1" stroke-width="2"/><text x="345" y="465" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="345" dy="0">3：示例空洞</tspan></text><text x="90" y="550" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="90" dy="0">logStart=0</tspan></text><text x="600" y="550" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600" dy="0">LSO=6</tspan></text><text x="940" y="550" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="940" dy="0">HW=10</tspan></text><text x="1110" y="550" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="1110" dy="0">LEO=12</tspan></text><text x="600" y="670" text-anchor="middle" fill="#0F172A" font-size="20" font-weight="400"><tspan x="600" dy="0">示例：Offset3可因compact或过滤而不交付；Offset6属于开放事务起点。</tspan><tspan x="600" dy="31">各区间代表可见/复制状态，不是一条记录依次经过三个步骤。</tspan></text><text x="600.0" y="820" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">箭头仅表示Offset递增；没有开放事务时LSO可等于HW。</tspan></text></g></svg>