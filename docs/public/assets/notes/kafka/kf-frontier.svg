<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">异步消费：只提交连续完成的下一位置</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">异步消费：只提交连续完成的下一位置</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">示例 100、101、102 均为存在的业务记录，提交值采用下一读取位置的口径。</tspan></text><rect x="40" y="180" width="320" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="200.0" y="217" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="200.0" dy="0">100：已完成</tspan></text><text x="200.0" y="254" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="200.0" dy="0">可以越过</tspan></text><rect x="440" y="180" width="320" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="217" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">101：处理中</tspan></text><text x="600.0" y="254" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">不能越过</tspan></text><rect x="840" y="180" width="320" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="1000.0" y="217" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="1000.0" dy="0">102：已完成</tspan></text><text x="1000.0" y="254" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="1000.0" dy="0">不能跳过 101</tspan></text><rect x="270" y="470" width="660" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="507" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">当前安全提交值为 101</tspan></text><text x="600.0" y="544" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">不能仅按已读取或已完成的最大项，直接提交其下一位置 103</tspan></text><rect x="270" y="650" width="660" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="687" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">当 101 也完成后，可推进到 103</tspan></text><text x="600.0" y="724" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">维护每个分区的连续完成前沿，而非全组单个数字</tspan></text><path d="M600 290 L600 470" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 580 L600 650" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600.0" y="822" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">适用业务处理完成的前提；compaction 等空洞应按实际返回记录序列处理。</tspan></text></g></svg>