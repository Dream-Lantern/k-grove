<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600">
  <defs/>
  <rect fill="#F9FBFE" height="900" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1600" x="0" y="0"/>
  <rect fill="#FFFFFF" height="856" rx="24" ry="24" stroke="#CFDEEF" stroke-width="1.5" width="1540" x="30" y="22"/>
  <rect fill="#2F6FDB" height="7" rx="2" ry="2" stroke="none" stroke-width="1.5" width="1540" x="30" y="22"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="40" font-weight="bold" x="72" y="93">librdkafka Producer：COPY、FREE 与借用所有权</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="76" y="137">三种消息缓冲策略不同；立即入队失败时库未接管 FREE</text>
  <polyline fill="none" points="72,165 1528,165" stroke="#CFDEEF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
  <rect fill="#EEF5FF" height="497" rx="23" ry="23" stroke="none" stroke-width="1.5" width="470.6666666666667" x="74.0" y="205"/>
  <text fill="#2F6FDB" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" x="104.0" y="253">COPY</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" x="104.0" y="294">库复制消息内容</text>
  <rect fill="#FFFFFF" height="101" rx="16" ry="16" stroke="#CFDEEF" stroke-width="1.5" width="426.6666666666667" x="96.0" y="317"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" x="117.0" y="356">生产者</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" x="117.0" y="386">发送调用可交出独立副本</text>
  <rect fill="#FFFFFF" height="101" rx="16" ry="16" stroke="#CFDEEF" stroke-width="1.5" width="426.6666666666667" x="96.0" y="436"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" x="117.0" y="475">应用缓冲区</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" x="117.0" y="505">按接口规则可由应用继续管理</text>
  <rect fill="#E9F8F0" height="497" rx="23" ry="23" stroke="none" stroke-width="1.5" width="470.6666666666667" x="564.6666666666667" y="205"/>
  <text fill="#118E6B" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" x="594.6666666666667" y="253">FREE</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" x="594.6666666666667" y="294">仅成功接受时库接管释放</text>
  <rect fill="#FFFFFF" height="101" rx="16" ry="16" stroke="#CFDEEF" stroke-width="1.5" width="426.6666666666667" x="586.6666666666667" y="317"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" x="607.6666666666667" y="356">入队成功</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" x="607.6666666666667" y="386">库负责释放；回调中不要再次 free</text>
  <rect fill="#FFFFFF" height="101" rx="16" ry="16" stroke="#CFDEEF" stroke-width="1.5" width="426.6666666666667" x="586.6666666666667" y="436"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" x="607.6666666666667" y="475">立即失败</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" x="607.6666666666667" y="505">库未接管；应用仍要管理</text>
  <rect fill="#FFF5E7" height="497" rx="23" ry="23" stroke="none" stroke-width="1.5" width="470.6666666666667" x="1055.3333333333335" y="205"/>
  <text fill="#C88323" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" x="1085.3333333333335" y="253">无 COPY / FREE</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="18" font-weight="normal" x="1085.3333333333335" y="294">库借用应用消息内容</text>
  <rect fill="#FFFFFF" height="101" rx="16" ry="16" stroke="#CFDEEF" stroke-width="1.5" width="426.6666666666667" x="1077.3333333333335" y="317"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" x="1098.3333333333335" y="356">有效期</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" x="1098.3333333333335" y="386">应用保持缓冲区直至投递完成</text>
  <rect fill="#FFFFFF" height="101" rx="16" ry="16" stroke="#CFDEEF" stroke-width="1.5" width="426.6666666666667" x="1077.3333333333335" y="436"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" x="1098.3333333333335" y="475">Delivery Report</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="17" font-weight="normal" x="1098.3333333333335" y="505">据最终结果决定应用后续动作</text>
  <rect fill="#FFF5E7" height="121" rx="18" ry="18" stroke="none" stroke-width="1.5" width="1452" x="74" y="730"/>
  <text fill="#C88323" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" x="99" y="765">关键边界</text>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="99" y="801">异步 produce 返回已入队，不代表 broker 已持久化成功。</text>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="99" y="831">flush 等待队列排空不表示全部成功，最终仍需核验投递报告。</text>
</svg>
