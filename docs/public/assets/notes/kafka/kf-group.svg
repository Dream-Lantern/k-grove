<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">同组分摊分区，不同组独立消费</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">同组分摊分区，不同组独立消费</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">正常稳定分配下，一个分区在同组中由一个成员负责；省略故障交接窗口。</tspan></text><rect x="50" y="150" width="300" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="200.0" y="187" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="200.0" dy="0">Partition 0</tspan></text><text x="200.0" y="224" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="200.0" dy="0">独立顺序</tspan></text><rect x="450" y="150" width="300" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="187" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">Partition 1</tspan></text><text x="600.0" y="224" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">独立顺序</tspan></text><rect x="850" y="150" width="300" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="1000.0" y="187" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="1000.0" dy="0">Partition 2</tspan></text><text x="1000.0" y="224" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="1000.0" dy="0">独立顺序</tspan></text><rect x="150" y="430" width="380" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="340.0" y="467" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="340.0" dy="0">组 X / 成员 A</tspan></text><text x="340.0" y="504" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="340.0" dy="0">分配 P0、P1</tspan></text><rect x="670" y="430" width="380" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="860.0" y="467" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="860.0" dy="0">组 X / 成员 B</tspan></text><text x="860.0" y="504" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="860.0" dy="0">分配 P2</tspan></text><rect x="350" y="640" width="500" height="90" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="677" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">组 Y 独立维护分配与位点</tspan></text><text x="600.0" y="714" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">不与组 X 争抢同一个消费进度</tspan></text><path d="M200 250 L200 430" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 250 L600 340 L450 340 L450 430" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M1000 250 L1000 430" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><text x="600.0" y="782" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">图中是合法分配示例，不承诺任何分配器都产生相同结果。</tspan></text></g></svg>