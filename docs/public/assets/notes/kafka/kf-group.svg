<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="900" version="1.1" viewBox="0 0 1600 900" width="1600">
  <defs/>
  <rect fill="#F9FBFE" height="900" rx="0" ry="0" stroke="none" stroke-width="1.5" width="1600" x="0" y="0"/>
  <rect fill="#FFFFFF" height="856" rx="24" ry="24" stroke="#CFDEEF" stroke-width="1.5" width="1540" x="30" y="22"/>
  <rect fill="#2F6FDB" height="7" rx="2" ry="2" stroke="none" stroke-width="1.5" width="1540" x="30" y="22"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="40" font-weight="bold" x="72" y="93">Kafka Consumer Groups：独立的消费位点</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" x="76" y="137">Group X 与 Group Y 各自直接读取 Topic 分区；不存在 X 向 Y 转发消息的链路。</text>
  <polyline fill="none" points="72,165 1528,165" stroke="#CFDEEF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
  <rect fill="#FFFFFF" height="112" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="760" x="420" y="205"/>
  <rect fill="#2F6FDB" height="112" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="420" y="205"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="444" y="249">Topic：P0 / P1 / P2</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="444" y="286">每个分区维护自身顺序</text>
  <polyline fill="none" points="800,317 800,390" stroke="#2F6FDB" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polyline fill="none" points="420,390 1190,390" stroke="#2F6FDB" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polyline fill="none" points="420,390 420,426" stroke="#2F6FDB" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polygon fill="#2F6FDB" points="420,426 425.0,415.0 415.0,415.0"/>
  <polyline fill="none" points="1190,390 1190,426" stroke="#2F6FDB" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <polygon fill="#2F6FDB" points="1190,426 1195.0,415.0 1185.0,415.0"/>
  <rect fill="#FFFFFF" height="218" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="630" x="100" y="434"/>
  <rect fill="#7554CE" height="218" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="100" y="434"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="124" y="478">Group X</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="124" y="515">成员 A 负责 P0、P1（示例）</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="124" y="546">成员 B 负责 P2</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="124" y="577">提交自己的 Group Offset</text>
  <rect fill="#FFFFFF" height="218" rx="19" ry="19" stroke="#CFDEEF" stroke-width="1.5" width="630" x="870" y="434"/>
  <rect fill="#118E6B" height="218" rx="4" ry="4" stroke="none" stroke-width="1.5" width="8" x="870" y="434"/>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="26" font-weight="bold" x="894" y="478">Group Y</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="894" y="515">独立从 Topic 获得分区数据</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="894" y="546">维护自己成员分配与 Offset</text>
  <text fill="#61758F" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="894" y="577">不依赖 Group X 的转发</text>
  <rect fill="#FFF5E7" height="121" rx="18" ry="18" stroke="none" stroke-width="1.5" width="1452" x="74" y="730"/>
  <text fill="#C88323" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" x="99" y="765">关键边界</text>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="99" y="801">同一组稳定分配时，一个分区一般由同组一个成员负责；跨组消费相互独立。</text>
  <text fill="#162B50" font-family="Noto Sans CJK SC" font-size="19" font-weight="normal" x="99" y="831">图示是合法分配示例；再平衡和故障交接可引起业务重复，需要独立处理。</text>
</svg>
