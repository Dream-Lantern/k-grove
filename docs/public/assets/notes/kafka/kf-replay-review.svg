<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1130" viewBox="0 0 1440 1130" role="img" aria-labelledby="title desc"><title id="title">恢复决策：完整事件重放，还是最终状态重建</title><desc id="desc">教学场景：库存服务停机 36h，Tombstone 配置窗口 24h；存在错过风险，不是精确删除时间保证。</desc><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C3AED"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#059669"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#D97706"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#DC2626"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker>
</defs><rect width="1440" height="1130" fill="white"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif">
<text x="40" y="48" font-size="30" fill="#0F172A" font-weight="700">恢复决策：完整事件重放，还是最终状态重建</text>
<text x="40" y="85" font-size="20" fill="#475569" font-weight="400">教学场景：库存服务停机 36h，Tombstone 配置窗口 24h；存在错过风险，不是精确删除时间保证。</text>
<rect x="40" y="130" width="1360" height="100" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-opacity=".4"/>
<text x="60" y="164" font-size="23" fill="#0F172A" font-weight="650">① 记录目标、快照与分区边界</text>
<text x="60" y="196" font-size="20" fill="#475569" font-weight="400">Log Start Offset、Committed Offset、保留策略、快照版本与每分区衔接位置；先保留旧输出。</text>
<rect x="40" y="310" width="650" height="120" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-opacity=".4"/>
<text x="60" y="344" font-size="23" fill="#0F172A" font-weight="650">② 需要完整事件历史</text>
<text x="60" y="376" font-size="20" fill="#475569" font-weight="400">确认历史是否仍完整，或是否有可靠归档。</text>
<text x="60" y="404" font-size="20" fill="#475569" font-weight="400">Compact 日志不能无条件当作完整审计档案。</text>
<rect x="750" y="310" width="650" height="120" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-opacity=".4"/>
<text x="770" y="344" font-size="23" fill="#0F172A" font-weight="650">② 需要最终状态</text>
<text x="770" y="376" font-size="20" fill="#475569" font-weight="400">确认旧快照之后的删除和更新仍完整。</text>
<text x="770" y="404" font-size="20" fill="#475569" font-weight="400">有效提交位点不能检测所有清理空洞。</text>
<path d="M360 230V310" fill="none" stroke="#7C3AED" stroke-width="2.3"  marker-end="url(#purple)"/>
<path d="M1080 230V310" fill="none" stroke="#7C3AED" stroke-width="2.3"  marker-end="url(#purple)"/>
<rect x="40" y="510" width="650" height="120" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-opacity=".4"/>
<text x="60" y="544" font-size="23" fill="#0F172A" font-weight="650">③ 历史不完整？停止 / 找归档</text>
<text x="60" y="576" font-size="20" fill="#475569" font-weight="400">earliest 只是当前可读起点，不恢复已删事件。</text>
<text x="60" y="604" font-size="20" fill="#475569" font-weight="400">历史可证明完整时，才进入隔离重放。</text>
<rect x="750" y="510" width="650" height="120" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-opacity=".4"/>
<text x="770" y="544" font-size="23" fill="#0F172A" font-weight="650">③ 增量不完整？找权威快照</text>
<text x="770" y="576" font-size="20" fill="#475569" font-weight="400">权威快照 + 一致的日志衔接协议。</text>
<text x="770" y="604" font-size="20" fill="#475569" font-weight="400">从空状态扫描也要满足删除窗口等前提。</text>
<path d="M360 430V510" fill="none" stroke="#7C3AED" stroke-width="2.3"  marker-end="url(#purple)"/>
<path d="M1080 430V510" fill="none" stroke="#7C3AED" stroke-width="2.3"  marker-end="url(#purple)"/>
<rect x="40" y="710" width="1360" height="120" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-opacity=".4"/>
<text x="60" y="744" font-size="23" fill="#0F172A" font-weight="650">④ 来源足够且边界可证明 → 独立组、隔离输出、幂等应用</text>
<text x="60" y="776" font-size="20" fill="#475569" font-weight="400">不重置在线组，不直接发起扣款或邮件等副作用。核对关键实体、删除状态、记录范围及业务不变量。</text>
<text x="60" y="804" font-size="20" fill="#475569" font-weight="400">来源不足或无法一致衔接则停止，不把快照与任意 Offset 随意拼接。</text>
<path d="M360 630V710" fill="none" stroke="#2563EB" stroke-width="2.3"  marker-end="url(#blue)"/>
<path d="M1080 630V710" fill="none" stroke="#2563EB" stroke-width="2.3"  marker-end="url(#blue)"/>
<text x="380" y="680" font-size="18" fill="#475569" font-weight="400">历史已齐备</text>
<text x="1100" y="680" font-size="18" fill="#475569" font-weight="400">衔接可证明</text>
<rect x="40" y="920" width="650" height="110" rx="12" fill="#ECFDF5" stroke="#059669" stroke-opacity=".4"/>
<text x="60" y="954" font-size="23" fill="#0F172A" font-weight="650">⑤ 核对通过：受控切换</text>
<text x="60" y="986" font-size="20" fill="#475569" font-weight="400">保留旧版本及恢复记录，设置切换边界。</text>
<rect x="750" y="920" width="650" height="110" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-opacity=".4"/>
<text x="770" y="954" font-size="23" fill="#0F172A" font-weight="650">⑤ 核对不通过：停止 / 回退</text>
<text x="770" y="986" font-size="20" fill="#475569" font-weight="400">保留证据，处理缺失、模式冲突及重复风险。</text>
<path d="M360 830V920" fill="none" stroke="#059669" stroke-width="2.3"  marker-end="url(#green)"/>
<path d="M1080 830V920" fill="none" stroke="#DC2626" stroke-width="2.3"  marker-end="url(#red)"/>
<text x="40" y="1090" font-size="20" fill="#475569" font-weight="400">Java earliest/latest/none 用于缺少有效位置等情况；C 报错策略名称为 error。它们都不恢复已回收的 Tombstone。</text>
</g></svg>
