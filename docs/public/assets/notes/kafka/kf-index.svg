<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
<title id="title">两段日志与稀疏索引：先选段，再找入口</title><desc id="desc">不是每条记录都有索引；Offset空洞和批次压缩都不允许用差值直接算字节位置。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">两段日志与稀疏索引：先选段，再找入口</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">合成表项与字节位置，不是实际日志解码；base offset不是文件字节数。</tspan></text><rect x="330" y="130" width="540" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">目标Offset=1005</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">1005-1000=5，不加1</tspan></text><rect x="40" y="360" width="450" height="150" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="265.0" y="397" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="265.0" dy="0">段A：base=0</tspan></text><text x="265.0" y="434" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="265.0" dy="0">范围早于1000</tspan><tspan x="265.0" dy="30">不是本例目标段</tspan></text><rect x="680" y="360" width="480" height="150" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="920.0" y="397" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="920.0" dy="0">段B：base=1000</tspan></text><text x="920.0" y="434" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="920.0" dy="0">.log / .index / .timeindex</tspan><tspan x="920.0" dy="30">示例索引 (0,0)、(4,800)、(8,1600)</tspan></text><rect x="680" y="620" width="480" height="130" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="920.0" y="657" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="920.0" dy="0">选入口：relative=4, position=800</tspan></text><text x="920.0" y="694" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="920.0" dy="0">4≤5，且是表中不超过目标的最大项</tspan></text><rect x="40" y="620" width="500" height="130" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="290.0" y="657" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="290.0" dy="0">从字节800开始解析批次/记录</tspan></text><text x="290.0" y="694" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="290.0" dy="0">定位1005或其后的实际可用记录</tspan></text><path d="M600 230 L600 290 L920 290 L920 360" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="708.0" y="256" width="184.0" height="25" fill="white"/><text x="800" y="275" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="800" dy="0">选base不大于目标的段</tspan></text><path d="M920 510 L920 620" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="864.0" y="556" width="112.0" height="25" fill="white"/><text x="920" y="575" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="920" dy="0">稀疏索引查找</tspan></text><path d="M680 685 L540 685" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="571.0" y="641" width="78.0" height="25" fill="white"/><text x="610" y="660" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="610" dy="0">顺序检查</tspan></text><text x="600.0" y="900" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">不是每条记录都有索引；Offset空洞和批次压缩都不允许用差值直接算字节位置。</tspan></text></g></svg>