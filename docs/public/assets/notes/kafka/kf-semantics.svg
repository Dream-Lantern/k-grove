<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">处理与提交的先后决定故障窗口</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">处理与提交的先后决定故障窗口</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">四项并列比较，不表示依次执行；技术边界见正文。</tspan></text><rect x="50" y="180" width="520" height="170" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="310.0" y="217" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="310.0" dy="0">先提交，再做业务</tspan></text><text x="310.0" y="254" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="310.0" dy="0">崩溃可跳过尚未完成的业务处理</tspan></text><rect x="630" y="180" width="520" height="170" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="890.0" y="217" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="890.0" dy="0">先做业务，再提交</tspan></text><text x="890.0" y="254" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="890.0" dy="0">崩溃可导致已经完成的业务被重放</tspan></text><rect x="50" y="440" width="520" height="170" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="310.0" y="477" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="310.0" dy="0">用幂等业务键约束重复效果</tspan></text><text x="310.0" y="514" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="310.0" dy="0">外部数据库事务或接口契约需要单独设计</tspan></text><rect x="630" y="440" width="520" height="170" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="890.0" y="477" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="890.0" dy="0">Kafka 到 Kafka 可用事务协调</tspan></text><text x="890.0" y="514" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="890.0" dy="0">输出记录与消费位点在适用 Kafka 事务中</tspan><tspan x="890.0" dy="30">共同完成</tspan></text><text x="600.0" y="812" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">至少一次不是磁盘永久不坏的承诺；语义必须声明输入、输出和故障假设。</tspan></text></g></svg>