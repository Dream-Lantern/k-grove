<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">共享事件日志，不同消费组独立读取</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">共享事件日志，不同消费组独立读取</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">箭头代表数据方向；消费者主动 Fetch，broker 不为每个消费组复制整份日志。</tspan></text><rect x="50" y="190" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="200.0" y="227" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="200.0" dy="0">Producer</tspan></text><text x="200.0" y="264" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="200.0" dy="0">发送业务事件</tspan></text><rect x="450" y="190" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="227" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">Kafka 分区日志</tspan></text><text x="600.0" y="264" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">按保留策略独立保存</tspan></text><rect x="850" y="120" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="1000.0" y="157" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="1000.0" dy="0">Group A</tspan></text><text x="1000.0" y="194" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="1000.0" dy="0">更新查询视图</tspan></text><rect x="850" y="380" width="300" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="1000.0" y="417" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="1000.0" dy="0">Group B</tspan></text><text x="1000.0" y="454" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="1000.0" dy="0">统计分析</tspan></text><path d="M350 245 L450 245" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 220 L800 220 L800 175 L850 175" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 270 L800 270 L800 435 L850 435" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="580" width="420" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="617" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">各组分别记录恢复位点</tspan></text><text x="600.0" y="654" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">读完不触发普通日志的即时删除</tspan></text><text x="600.0" y="762" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">本图描述事件流模型，不代表数据库事务已跨系统自动完成。</tspan></text></g></svg>