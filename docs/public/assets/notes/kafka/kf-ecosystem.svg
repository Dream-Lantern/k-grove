<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">生态组件按职责选择，而非都叫消费者</title><desc id="desc">蓝色教学示意；不是完整源码时序，关系和限制以正文为准。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">生态组件按职责选择，而非都叫消费者</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">四项并列比较，不表示依次执行；技术边界见正文。</tspan></text><rect x="50" y="180" width="520" height="170" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="310.0" y="217" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="310.0" dy="0">Producer / Consumer API</tspan></text><text x="310.0" y="254" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="310.0" dy="0">应用自己管理业务语义与错误恢复</tspan></text><rect x="630" y="180" width="520" height="170" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="890.0" y="217" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="890.0" dy="0">Kafka Connect</tspan></text><text x="890.0" y="254" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="890.0" dy="0">连接外部数据源与接收端</tspan><tspan x="890.0" dy="30">语义依 connector 契约</tspan></text><rect x="50" y="440" width="520" height="170" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="310.0" y="477" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="310.0" dy="0">Kafka Streams</tspan></text><text x="310.0" y="514" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="310.0" dy="0">Kafka 流处理、状态与适用事务语义</tspan></text><rect x="630" y="440" width="520" height="170" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="890.0" y="477" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="890.0" dy="0">跨集群复制与版本演进</tspan></text><text x="890.0" y="514" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="890.0" dy="0">灾备 RPO、协议兼容与升级步骤单独评估</tspan></text><text x="600.0" y="812" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">4.0 新消费协议等作为版本补充，不宣称本机已升级或验证。</tspan></text></g></svg>