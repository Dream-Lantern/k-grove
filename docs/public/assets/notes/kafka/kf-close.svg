<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">关闭时间线：应用预算与库等待不能合成一个timeout</title><desc id="desc">这是三条可选生命周期；不从别的线程强行destroy作为通用超时补救。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">关闭时间线：应用预算与库等待不能合成一个timeout</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">按v2.8.0区分Producer flush、Consumer同步close和异步close路线。</tspan></text><rect x="310" y="130" width="580" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">停止输入 → 应用有界排空/取消</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">记录未完成任务；上下文继续存活</tspan></text><rect x="35" y="400" width="350" height="160" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="210.0" y="437" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="210.0" dy="0">Producer路线</tspan></text><text x="210.0" y="474" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="210.0" dy="0">flush(timeout_ms)</tspan><tspan x="210.0" dy="30">检查返回值与Delivery Report</tspan></text><rect x="425" y="400" width="350" height="160" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="437" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">Consumer同步路线</tspan></text><text x="600.0" y="474" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">consumer_close()无timeout参数</tspan><tspan x="600.0" dy="30">大致受session timeout限制</tspan></text><rect x="815" y="400" width="350" height="160" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="990.0" y="437" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="990.0" dy="0">Consumer异步路线</tspan></text><text x="990.0" y="474" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="990.0" dy="0">consumer_close_queue()</tspan><tspan x="990.0" dy="30">服务队列直到consumer_closed</tspan></text><rect x="310" y="770" width="580" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="807" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">按契约destroy并释放应用上下文</tspan></text><text x="600.0" y="844" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">最后回调可能在关闭过程中发生</tspan></text><path d="M600 240 L600 310 L210 310 L210 400" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="145.5" y="341" width="129.0" height="25" fill="white"/><text x="210" y="360" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="210" dy="0">选择客户端路线</tspan></text><path d="M210 560 L210 690 L600 690 L600 770" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="171.0" y="636" width="78.0" height="25" fill="white"/><text x="210" y="655" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="210" dy="0">关闭完成</tspan></text><path d="M600 240 L600 310 L600 310 L600 400" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="535.5" y="341" width="129.0" height="25" fill="white"/><text x="600" y="360" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">选择客户端路线</tspan></text><path d="M600 560 L600 690 L600 690 L600 770" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="561.0" y="636" width="78.0" height="25" fill="white"/><text x="600" y="655" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">关闭完成</tspan></text><path d="M600 240 L600 310 L990 310 L990 400" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="925.5" y="341" width="129.0" height="25" fill="white"/><text x="990" y="360" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="990" dy="0">选择客户端路线</tspan></text><path d="M990 560 L990 690 L600 690 L600 770" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="951.0" y="636" width="78.0" height="25" fill="white"/><text x="990" y="655" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="990" dy="0">关闭完成</tspan></text><text x="600.0" y="970" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">这是三条可选生命周期；不从别的线程强行destroy作为通用超时补救。</tspan></text></g></svg>