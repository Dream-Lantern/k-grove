<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
<title id="title">Kafka连接时序：初始与后续连接分别握手</title><desc id="desc">Bootstrap TLS失败发生在元数据获取前；不能等取得元数据后才排查初始认证。</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#E7F1F8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369A1"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="600.0" y="48" text-anchor="middle" fill="#0369A1" font-size="30" font-weight="600"><tspan x="600.0" dy="0">Kafka连接时序：初始与后续连接分别握手</tspan></text><text x="600.0" y="84" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="400"><tspan x="600.0" dy="0">描述配置的TLS/SASL路线；不假定所有部署都启用两者。</tspan></text><rect x="300" y="130" width="600" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="167" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">连接Bootstrap入口</tspan></text><text x="600.0" y="204" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">TCP → 配置的TLS/SASL握手</tspan></text><rect x="300" y="350" width="600" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="387" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">请求并获取元数据</tspan></text><text x="600.0" y="424" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">通过已建立且已认证的相应连接</tspan></text><rect x="300" y="570" width="600" height="110" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="607" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">连接advertised Broker地址</tspan></text><text x="600.0" y="644" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">每条后续连接完成自身配置的安全握手</tspan></text><rect x="300" y="780" width="600" height="100" rx="7" fill="#E0F2FE" stroke="#0369A1" stroke-width="2"/><text x="600.0" y="817" text-anchor="middle" fill="#0369A1" font-size="23" font-weight="600"><tspan x="600.0" dy="0">发送业务请求并核对资源授权</tspan></text><text x="600.0" y="854" text-anchor="middle" fill="#0F172A" font-size="19" font-weight="400"><tspan x="600.0" dy="0">Topic / Group / TransactionalId分别检查</tspan></text><path d="M600 240 L600 350" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="527.0" y="281" width="146.0" height="25" fill="white"/><text x="600" y="300" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">入口安全连接建立</tspan></text><path d="M600 460 L600 570" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="483.0" y="501" width="234.0" height="25" fill="white"/><text x="600" y="520" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">DNS、路由与证书名都需可用</tspan></text><path d="M600 680 L600 780" fill="none" stroke="#0369A1" stroke-width="2" marker-end="url(#arrow)"/><rect x="527.0" y="721" width="146.0" height="25" fill="white"/><text x="600" y="740" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600" dy="0">后续连接安全建立</tspan></text><text x="600.0" y="920" text-anchor="middle" fill="#0F172A" font-size="17" font-weight="400"><tspan x="600.0" dy="0">Bootstrap TLS失败发生在元数据获取前；不能等取得元数据后才排查初始认证。</tspan></text></g></svg>